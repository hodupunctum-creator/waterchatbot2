기로 2024년도 국제물산업박람회(WATER KOREA)와 권역별 통합 워크숍 등을 통해 물 분야 이슈에 대한 최신 정보를 공유하고, 지속적인 교류와 소통을 통해 물산업 활성화를 위 한 노력을 지속하겠다”고 의지를 다졌다."}]}, {"id": "89-66", "no": 89, "label": "2024 신년호", "corner": "물과 가치", "title": "해변은 깨끗해지고 마음은 풍성해지는 ‘비치코밍’", "author": "", "start": 66, "end": 67, "pages": [{"p": 66, "t": "INFORMATION & CULTURE 물과 가치 해변은 깨끗해지고 마음은 풍성해지는 비치코밍 비치코밍(Beachcombing)은 해변(beach)과 빗질(combing)의 합성어로 버려지거나 해변에 떠밀려온 쓰레기를 빗질하듯 수거하는 환경보호 활동을 뜻한다. 아름답고 깨끗한 바다를 위해, 우리 모두 비치코밍에 동참해 보는 것은 어떨까. 글_이은경 B e a c h c o m b i n g 백해무익한 해양 쓰레기 문제 연간 1,200만 톤의 플라스틱이 바다로 유입된다. 쉽게 말해 1분에 트럭 한 대 분 량의 쓰레기가 바다에 우수수 쏟아지고 있는 것이다. “2050년이면 바다에 물고 기보다 플라스틱이 더 많을 것”이란 말이 점점 현실로 다가온다. 미세 플라스틱 문제도 심각하다. 미세 플라스틱이란 크기가 1μm(마이크로미터, 0.001mm) 이상 5μm 미만의 작 은 플라스틱 조각을 뜻하는데, 보통 치약이나 각질 제거제, 합성섬유 옷 등에 미 세 플라스틱 조각이 포함되어 있다. 미세한 크기이기 때문에 하수 처리시설에서 걸러지지 않고 바다로 가게 된다. 이는 모든 해양 생물에게 악영향을 미치는 것은 물론 인간의 건강에도 해를 입힌다. 미세 플라스틱을 섭취한 생물들이 우리의 식 탁까지 오기 때문이다. 미세 플라스틱 입자는 장기 손상은 물론 면역체계, 성장 호르몬 교란 물질을 발 생시킨다. 이처럼 백해무익한 해양 쓰레기를 두고만 볼 수 없다. 건강과 환경을 동시에 살릴 수 있는 비치코밍을 당장 실천해 보자."}, {"p": 67, "t": "준비는 간단하게 실천은 용감하게 많은 사람이 비치코밍에 관심을 가질수록 환경 보호에 관한 관심도 높아질 것이다. 깨끗한 바다, 그야말로 ‘바라던 바다’를 만들기 위한 준비물은 그리 많지 않다. 쓰레기봉 투와 쓰레기를 담을 가방, 그리고 집게 정도면 된다. 쓰레기를 주울 때는 날카로운 유리 조각이나 플라스틱에 손이 베이지 않도록 집게를 이용하는 것이 안전하다. 자외선 차단을 위해서 선크림을 바르는 것을 추천하며, 갈증에 대비하여 물을 챙기는 것 비치코밍이 무엇이고, 도 필수다. 혼자서 해도 충분하지만 여럿이 함께하면 더 큰 의미를 나눌 수 있으니 주변 왜 중요한지 실감했다면 사람들에게 권유하는 것도 좋다. 많은 사람이 비치코밍에 관심을 가질수록 환경 보호에 적극적으로 비치코밍을 관한 관심도 높아질 것이다. 비치코밍이 무엇이고, 왜 중요한지 실감했다면 적극적으로 알리고 동참하는 것이 어떨까. 비치코밍을 알리고 동참하는 것이 어떨까. 우리의 행동 하나가 많은 생명을 구하는 시작 점이 될 수 있다. 예술 작품을 만드는 비치코밍 플로깅과 비치코밍은 언뜻 비슷해 보이지만 쓰레기를 줍고 난 이후의 과정이 조금 다 르다. 플로깅은 조깅하며 생활 쓰레기를 줍고, 분리수거를 통해 쓰레기를 처리하는 것 으로 끝나지만 비치코밍은 해양 쓰레기와 유리 조각, 플라스틱을 이용하여 업사이클링 (Upcycling)을 통해 작품을 만들 수 있다. 2018년에 열린 해운대 비치코밍 페스티벌에 서는 플라스틱으로 큰 물고기 조형물을 만들어 3개월 이상 전시를 진행하기도 했다. 비 치코밍은 넓은 의미로 해변 예술을 뜻하기도 한다. 주운 쓰레기를 활용해서 예쁜 액세서 리도 만들 수 있으니 자원 순환의 효과는 덤이다. 환경을 보호하면서 재미까지 얻을 수 있으니 실천하지 않을 이유가 없다."}]}, {"id": "89-68", "no": 89, "label": "2024 신년호", "corner": "물 따라 길 따라", "title": "바다의 품에 안겨 피어난 아름다운 항구 도시 ‘캐나다 밴쿠버’", "author": "", "start": 68, "end": 71, "pages": [{"p": 68, "t": "INFORMATION & CULTURE 물 따라 길 따라 Canada Vancouver 바다의 품에 안겨 피어난 아름다운 항구 도시 캐나다 밴쿠버 온화한 사계절과 수려한 자연경관을 자랑하는 밴쿠버는 ‘세계에서 가장 살기 좋은 도시’ 중 한 곳으로 꼽힌다. 신선한 산악 공기와 푸른 태평양이 공존하는 곳. 어쩌면 밴쿠버에 머무는 매 순간은 여행이 아 니라 하나의 예술작품이 될지 모른다. 글_이은경"}, {"p": 69, "t": "도시와 자연의 환상적인 조화 벤쿠버는 캐나다의 브리티시컬럼비아주 남서부에 있는 도 시이자, 캐나다에서 토론토와 몬트리올을 잇는 세 번째로 큰 도시다. 박물관, 극장, 맛집 등 활기찬 도시의 면모를 갖 췄을 뿐만 아니라 산과 물로 둘러싸여 있어 어디에서나 등 산, 스키, 서핑과 같은 야외 활동을 마음껏 즐길 수 있다. 밴 쿠버의 매력을 좀 더 가까이에서 느끼고 싶다면, 산책로와 하이킹로가 자연스럽게 어우러진 ‘길버트 마운틴(Gilbert Mount)’, 특이한 암석 형태와 독특한 식물상이 유명한 ‘그로 우스 마운틴(Grouse Mountain)’을 꼭 둘러보길 추천한다. 특히 하이킹로를 따라 올라가면 다다르는, 이 두 곳의 정상 에서 바라보는 밴쿠버의 도시 전경은 가히 장관이다. 밴쿠버에서 가장 아름다운 해변으로 꼽히는 곳은 약 500m 길이의 ‘잉글리시 베이(English Bay)’이다. 해수욕을 비롯해 요트와 서핑 등 다양한 해양 액티비티를 즐길 수 있을 뿐만 아니라 일몰이 찾아오는 해변 위를 빨갛게 물들이는 환상 적인 석양까지 감상할 수 있어 오롯이 하루를 여기서 보내 도 지루할 틈이 없다. 또 잉글리시 베이를 따라 걷다 보면 캐 나다 토착 문화의 상징이자, 2010년에 열린 ‘제21회 밴쿠 버 올림픽’ 로고 모델이었던 우뚝 솟은 석상도 만날 수 있다. 123만여 평에 곧게 솟은 나무가 빽빽한 원시림 공원 ‘스탠 리 파크(Stanley Park)’도 인기 명소 중 하나다. 숲과 바다를 모두 품고 있어 한가로이 여유를 즐길 수 있을 뿐만 아니라 스케이트장, 수족관 등 즐길 거리도 가득하기 때문이다. 특 히 이곳에서 시작되는 해안 길은 자전거 타기와 산책을 즐 기기에 그만이니 놓치지 말고 꼭 경험해 보자."}, {"p": 70, "t": "예술과 문화의 아름다운 만남 밴쿠버에는 다양한 국적, 인종적 배경을 가진 사람들이 살아간 다. 덕분에 곳곳에서 여러 나라의 문화와 예술, 생활양식 등을 경험할 수 있다. 또 원주민이었던 하이다족과 처음 이곳으로 이민 온 유럽인들에 대한 자료가 가득한 밴쿠버 박물관, 100 년의 역사를 간직하고 있는 차이나타운, 세계 각국의 맛과 향 을 자랑하는 레스토랑 등이 어우러져 독특한 도시 문화를 자 아낸다. 특히 다국적 문화가 모여드는 중심가인 ‘랍슨 스트리 트(Robson Street)’는 도시의 상징적인 번화가 중 하나로 손꼽 힌다. 다양한 가격대의 브랜드 숍과 한식당, 레스토랑 등 100 여 개의 매장이 들어서 있으며, 도심 관광 중 잠시 쉬어가기 좋 은 ‘랍슨 스퀘어(Robson Square)’와 캐나다 최초의 돔 경기장 ‘BC 플레이스(BC Place)’ 등의 명소도 자리해 있다. 더불어 거 리 예술가들의 퍼포먼스와 이벤트가 상시로 열려 늘 역동적인 에너지를 느낄 수 있다. 랍스 스트리트를 지나 다운타운에서 버스를 타고 약 20분 정 도 이동하면 만날 수 있는 ‘그랜빌 아일랜드(Granville Island)’는 입구부터 화려하다. 과거 공장지대였던 곳을 개발해 공원과 시장 등으로 조성한 이곳은 먹거리는 물론 아기자기한 상점과 갤러리 등 볼거리도 많아 현지인들도 즐겨 찾는 핫플레이스로 꼽힌다. 상점과 시장을 구경한 후, 해변을 산책하는 순서가 가 장 이상적인 코스. 더불어 늦은 오후에 찾으면 황홀하면서도 여유로운 밴쿠버의 일몰도 감상할 수 있다."}, {"p": 71, "t": "캐나다의 상하수도 이야기 깨끗한 물, 친환경 국가 캐나다 BC주, 심각한 가뭄으로 인해 물 사용 제한 강화 유지 지역 사회 수질과 해양환경을 위한 대규모 하수처리장 ‘IIWWTP 프로젝트’ 진행 중 역대급 가뭄으로 인해 캐나다 브리티시컬럼비아주(이하 BC 현재 캐나다 벤쿠버에 위치한 이오나 아일랜드 하수처리장 주)가 물 사용 제한 강화를 유지하고 있다. 지난해 발표된 자 에서는 매트로 밴쿠버가 수행하는 IIWWTP(IIWWTP:Iona 료에 따르면 BC주의 34개 집수지역 중 4개가 5단계로 나뉜 Island Wastewater Treatment Plant) 프로젝트가 진행 중이 수준에서 최악의 5단계를 기록했으며, 나머지 18개도 4단계 다. 매트로 밴쿠버는 밴쿠버와 놀스밴, 웨밴, 버나비, 코퀴틀 로 나타나 전체 집수지역 중 3분의 2가 위험상태였다. 람, 뉴웨스트, 리치먼드 등 위성도시들을 모두 합쳐 부르는 이 같은 극한 가뭄의 원인으로는 캐나다 전역에 걸쳐 비와 눈 명칭이다. 이 적게 내렸기 때문인 것으로 조사됐다. 특히 지난해 4월 말, IIWWTP 프로젝트는 지역 사회의 수질과 주변 해양환경을 고온으로 쌓인 눈이 초기에 급속하게 녹아내리면서 상황이 모두 개선하기 위한 대규모 물 인프라 프로그램으로, 총 76 악화했다. 이에 BC주는 물 절약을 실천하기 위한 방법을 주 억 3천 96만 달러가 투입될 예정이다. 이번 프로젝트에는 인 민・기업과 공유하며, 물 절약 실천에 동참할 것을 촉구했다. 프라, 지역사회 및 환경 간의 연결을 개선할 새로운 3차 처 한편, 지난해 가을에는 일정 기간 동안 나무, 관목, 꽃에 물을 리 시설 건설과 다양한 생태 복원 및 오프사이트(공정 지역 주는 것 외에 잔디에 물을 주는 행위를 금지하기도 했다. 이 아닌 제품을 저장하는 시설과 출하 시설이 있는 영역) 작 업 등이 포함된다. 이를 통해 캐나다 하수로부터 지속 가능 한 에너지를 회수하는 데 초점을 맞춰 주변 생태복원 노력과 통합되며, 퍼스트 네이션(원주민) 단체들에게 경제적 기회를 제공할 계획이다. 또 지진에 견딜 수 있는 내진성을 향상시키 고, 잠재적인 해수면 상승을 방지하며, 21세기 내내 기후변 참고 화가 시설에 미칠 수 있는 기타 예상되는 완화하기 위해 지 밴쿠버 중앙일보, BC주 심각한 건조기후로 물부족 우려(’23.12) 진 복원력을 개선하는 것을 목표로 한다. 프로젝트의 완료는 빅토리아 투데이, 광역 밴쿠버 지역 물 사용 제한 위반 벌금 총 16만 달러(’23.11) 오는 2038년으로 예정되어 있으며, 2035년에 3차 처리 작 밴쿠버 조선일보, 여전히 심각한 가뭄···물 사용 제한 강화(’23.07) 업이 시작될 예정이다. 워터저널, 스탠텍, 이오나섬 하수처리장 프로젝트 관리 컨설턴트 선정(’22.07)"}]}, {"id": "89-72", "no": 89, "label": "2024 신년호", "corner": "물사랑 카툰", "title": "오늘도 맑은물 세상 <물의 기원>", "author": "", "start": 72, "end": 73, "pages": []}, {"id": "89-74", "no": 89, "label": "2024 신년호", "corner": "포켓정보", "title": "지구를 지키는 절약 실천 ‘절수등급 표시’", "author": "", "start": 74, "end": 75, "pages": [{"p": 74, "t": "INFORMATION & CULTURE 포켓정보 지구를 지키는 절약 실천 ‘절수등급 표시’ 절수설비 절수등급 표시 의무화 물을 사용하는 변기, 수도꼭지 등에 물을 얼마나 사용하는지 표시해 주는 절수등급 스티커가 붙어 있다. *절수설비 절수등급 표시 의무화 2022년 2월 18일 시행 가전제품 구매할 때는 에너지소비효율 등급표, 자동차 살 때는 연비를 따지게 된다. 이제는 물 을 사용하는 제품들도 물 사용량이 얼마나 되 는지 따져봐야 할 시대가 됐다. 그런데 물을 사 용할 때는 어떤 기준을 적용해야 하는지 모르 는 사람들이 많다. 그래서 준비했다. 돈도 절약 하고 지구도 지킬 수 있는 절수설비 설치 의무 및 절수등급 표시 의무화에 대해 알아보자. 정리_이은경"}, {"p": 75, "t": "절수설비별 절수등급 절수설비 설치 의무화란? ◎ 대변기 환경부는 「수도법」 제15조에 따라 물 절약과 효율적 변기는 1회 사용하는 물의 양에 따라 대변기는 1등급(4L 이하), 이용을 위해 신축 건물 및 물 사용이 많은 업종에 대 해 절수설비(기기) 설치를 의무화하고 있다. 이에 지 2등급(5L 이하), 3등급(6L 이하)으로 구분된다. 난 2022년 2월 18일부터 모든 절수설비에 대한 절 수등급 표시 의무화가 시행 중이다. 적용대상 - \u0007\u0007\u0007\u0007\u0007「건축법」 제2조제1항제2호에 따른 건축물이나 지 방자치단체 조례로 정하는 시설을 건축하려는 경 4L 이하 5L 이하 우에 설치되는 절수설비 6L 이하 -\u0007 「공중위생관리법」에 따른 숙박업(10실 이하 제외) 및 목욕장업, 「체육시설의 설치·이용에 관한 법률」에 따른 체육시설업 등의 업종에 설치되는 절수설비 -\u0007\u0007\u0007「공중화장실 등에 관한 법률」에 따른 공중화장실 ◎ 수도꼭지 에 설치되는 절수설비 수도꼭지는 1분 동안 사용하는 물의 양에 따라 1등급(5L 이하), 2등급(6L 이하)으로 구분된다. 5L 이하 6L 이하 물 절약과 효율적 이용을 위해 ◎ 공중화장실 소변기 물 사용량이 가장 적은 1등급 제품을 선택하는 게 공중화장실에서 사용하는 소변기는 1회 사용하는 물의 양에 따라 가장 현명하겠죠? 1등급(0.6L 이하), 2등급(1L 이하), 3등급(2L 이하)으로 구분된다. 0.6L 이하 1L 이하 2L 이하"}]}, {"id": "89-76", "no": 89, "label": "2024 신년호", "corner": "독자 마당", "title": "독자 마당", "author": "", "start": 76, "end": 77, "pages": [{"p": 76, "t": "INFORMATION & CULTURE 독자마당 2023년 가을호 이벤트 당첨자 발표 한국상하수도협회에서 발행하는 소식지 <맑은 물 세상>은 독자 여러분의 관심과 참여로 만들어집니다. 2023년 가을호에도 풍성한 사랑 보내주셔서 감사합니다. 이벤트에 참여해주신 모든 분들 축하드립니다. 독자 리뷰 이벤트 당첨자 강창규 임성희 대한민국 근대 상수도 역사 출발지 뚝도 정수장의 환경부와 한국상하수도협회의 물산업 수출기업 지 소개 그리고 지난 115년간의 발전사를 한눈에 살 원 소식에 특히 관심이 갔습니다. 기후 변화 시대 펴볼 수 있어서 좋았습니다. 지금의 상수도가 있기 물산업이야 말로 국가 경쟁력의 바로미터가 아닐 까지 많은 우여곡절이 있었기에 오늘날 세계 최고 까 싶습니다. 아울러 국민의 물복지 더 나아가 인 의 상수도 보급률과 수질 개선의 눈부신 발전의 결 류애를 실현한다는 의미에서라도 더욱더 적극적인 과물이 있지 않았나 하는 생각도 해봅니다. 관심과 지원이 필요하겠다는 생각이 듭니다. 도경훈 박현희 박주호 물사랑 카툰이 계속 쭉~ 연재됐으면 좋겠어요. 물 글로벌이슈에 소개된 기후변화 대응 자연기반해 커피를 내릴 때 물의 온도가 중요한 건 알고 있었지 과 관련된 다양한 인문학 정보를 쉽게 얻을 수 있 법이 인상적이었습니다. 물관리에 적용되는 자연 만, 미네랄 함량의 고저에 따라 맛이 달라질 수 있 어 초등 3학년인 아들과 매호 함께 보고 있거든요. 기반해법을 활용하는 다양한 정책과 기술 개발 연 다는 사실은 처음 알았습니다. <맑은 물 세상>에 다음 호에는 어떤 내용이 담겨 있을지 벌써 기대됩 구가 수행 중이라니 기대가 됩니다. 이처럼 다양한 서 배운 대로 커피를 내려서 마시는 상상을 하니 벌 니다. 물관리 소식, 앞으로도 많이 알려주세요. 써 기분이 좋아지네요. 수도 요금에 물이용 부담금 이 있다는 데 기회가 된다면 한번 자세히 다뤄주셨 으면 합니다. 2024년 신년호 빈칸 퀴즈 이벤트 아래 빈칸에 들어갈 단어는 무엇일까요. “2024년 국제물박람회(WATER KOREA)가 열리는 도시는 ○○이다” 참여방법 참여기간 ❶\u0007\u0007<맑은 물 세상> 신년호 중 힌트 페이지 (6~11p) 다시보기 ❷ \u0007QR코드 스캔 후 타입폼을 통해 정답 제출하기 2024년 2월 28일까지 이벤트 상품 스타벅스 커피 기프티콘(총 5명)"}]}, {"id": "93-6", "no": 93, "label": "2025 신년호", "corner": "KWWA와 함께", "title": "한국상하수도협회장 신년사", "author": "", "start": 6, "end": 7, "pages": [{"p": 6, "t": "Keynote | 신년사 협회는 연대와 협력으로 지속가능한 물 산업의 미래를 위해 최선을 다하겠습니다"}, {"p": 7, "t": "존경하는 한국상하수도협회 회원 여러분! 2025년 새해가 밝았습니다. 회원 여러분들의 건강과 건승을 기원하며 새해 인사드립니다. 무엇보다 지난 한 해 협회의 발전을 위해 열심히 뛰어주시고 힘을 모아주셔서 참으로 감사드립니다. 2025년 새해도 협회의 더 큰 도약을 위해 함께 지혜를 모으고 힘을 모아가는 해가 되기를 바라며 저 역시 열심히 뛰겠습니다. 올해는 제가 협회장으로서 맞는 3번째 해입니다. 지난 2022년 우리 지역에 역대급 가뭄이 지속되던 시기에 협회장에 취임했고, 그래서 기후변화에 따른 위기가 나날이 심각해지는 지금의 상황에 대해 더더욱 막중한 책임감을 느낍니다. 지금 우리 앞에 놓인 현안들이 많습니다. 안정적인 물 공급과 안정성 확보, 물 산업의 선진화, 탄소중립 견인. 어느 하나 소홀함 없이 살펴 가야 할 중요한 과업들입니다. 구성원 모두의 연대와 협력을 통해 협회의 기능과 역할을 더 넓히고 강화시켜야 할 때입니다. 상하수도 분야의 굵직한 화두들을 주도할 수 있는 힘을 키우고, 우리나라 물 산업계의 다양한 주체들을 아우를 수 있는 플랫폼으로 자리매김해야 합니다. 이에 기업들의 성장을 이끌 핵심인재 확보를 위해 전문인력 양성교육에 힘쓸 것입니다. 인증, 수출, 마케팅 등 산업계의 어려움을 면밀히 살펴 맞춤형 인력 제공에 주력할 것이며, 다양한 소통채널을 확보해 기업들의 해외시장 진출과 신시장 개척에도 힘을 보탤 것입니다. 이를 위해 회원 여러분의 역량과 지혜가 무엇보다 중요합니다. 우리 협회가 상하수도 분야의 경쟁력을 키우는 거점이자, 물 산업의 미래를 설계하는 혁신의 거점으로 자리매김하도록 함께 고민해 주시고 귀중한 제언도 모아주시길 바랍니다. 2025년 새해를 맞아 우리 협회는 그 어느 때보다 큰 걸음을 내디딜 것입니다. 그 일을 위해 회원 여러분과 굳게 손을 잡겠습니다. 행복한 새해 맞이하시길 바랍니다. 2025년 1월 2일 한국상하수도협회 협회장 강 기 정 Vol. 93 2025 신년호"}]}, {"id": "93-8", "no": 93, "label": "2025 신년호", "corner": "데이터로 보는 물", "title": "2024년도 수돗물 먹는 실태조사", "author": "", "start": 8, "end": 9, "pages": [{"p": 8, "t": "Keynote | 데이터로 보는 물 2024년도 수돗물 먹는 실태조사 수돗물에 대한 전반적 만족도 58.2% 환경부와 한국상하수도협회는 안전하고 질 좋은 수돗물을 공급하기 위해 국민들이 물을 어떻게 이용하고 인식하고 있는지 살펴보는 수돗물 먹는 만족 실태조사를 실시하고 있다. 전국 161개 지자체 내 7만여 가구의 먹는 물 현황, 수도요금 현황 등에 대해 조사했다. 어떤 결과가 있었을까? 함께 살펴보자. 36.6% 보통 5.2% 결과보고서 확인하기 불만족 실태조사 개요 조사 목적 수돗물 관련 인식 수준과 서비스 만족도 등을 객관적으로 측정하여 정책 기초자료로 활용 조사 규모 전국 161개 시·군의 72,460가구 조사 대상 가구 내 가구주(또는 배우자) 02 상황별 물을 이용하는 형태(중복응답) 순수하게 물을 먹을 때 ‘정수기를 설치해서’ 응답이 53.6%로 가장 높고, 다음으로는 ‘수돗물을 그대로 먹거나 끓여서’(37.9%), ‘먹는 샘물(생수)을 구매해서’(34.3%) 순으로 집계되었으며, 세 가지 방법 모두 ‘2021년 대비 비율이 상승한 것으로 나타났습니다. 물을 먹을 때 조사 기간 2024. 4. 22.~6. 30. 조사 방법 방문 면접 조사(필요 시 온라인 조사 병행) 조사 항목 물에 대한 인식, 가구 내 먹는 물 현황, 수돗물 공급 및 관리 등 47개 수돗물을 그대로 먹거나 끓여서 정수기를 설치해서 먹는샘물(생수)을 구매해서 간이 필터를 사용해서 37.9% 53.6% 34.3% 3.5% 1.0% 기타"}, {"p": 9, "t": "03 수돗물 공급 단계별 신뢰도 수돗물의 원수 수질, 정수처리 과정과 각 가정까지 전달되는 수돗물 수질에 대한 신뢰도를 살펴보면 신뢰한다는 응답이 가장 높은 것으로 나타나 국민 전반적으로 공급 단계에 대한 높은 신뢰도를 확인할 수 있었습니다. 원수 정수 수돗물 수질 불신 불신 불신 6.4% 3.9% 9.5% 신뢰 보통 43.9% 49.8% 보통 신뢰 37.6% 58.5% 신뢰 보통 42.6% 47.9% 04 강화되어야할 제도와 정책(1+2순위) 수돗물 만족도 향상을 위해 수돗물에 대한 전반적 만족도가 높게 나타났지만, 보다 질 좋은 수돗물을 위해 지자체가 관리하는 노후 수도관의 교체·세척과 정수장 시설의 현대화·고도화를 강화해야 한다는 의견 또한 적지 않았습니다. 42.5% 지자체 관리 노후 수도관 교체·세척 38.0% 주택 내 노후 수도관 교체·세척 지원 36.1% 35.3% 정수장 시설 현대화·고도화 원수(상수원)의 수질관리 18.7% 주택 내 수질검사 지원 강화 05 수돗물 관련 정보 습득 경로(1순위) 평소 수돗물 관련 정보를 주로 어디에서 얻고 있는지 살펴본 결과, ‘TV/라디오’ 응답이 51.9%로 가장 높고, ‘주변사람’(9.1%), ‘포털사이트’(6.4%) 등의 순으로 나타나, 향후 수돗물 관련 내용을 국민에게 알리기 위해 TV/라디오 프로그램 또는 공익광고가 가장 효과적일 것으로 보입니다. TV/라디오 주변사람 포털사이트 SNS 수도 관련 홈페이지 51.9% 9.1% 6.4% 4.7% 4.1% Vol. 93 2025 신년호"}]}, {"id": "93-10", "no": 93, "label": "2025 신년호", "corner": "오늘 물 맑음", "title": "기후위기 시대 물관리 정책 방향", "author": "", "start": 10, "end": 13, "pages": [{"p": 10, "t": "Keynote | 오늘 물 맑음 기후위기 시대 물관리 정책 방향 기후변화 영향으로 세계적으로 전례 없는 극한 가뭄이 발생하고 있으며 우리나라도 예외가 아니다. 지난해 전남지역은 극한 가뭄으로 단수와 공장 가동 중지 사태 위기를 가까스로 모면하는 등 워터리스크를 직면하고 있다. 기후위기 시대, 원활한 물 공급을 위한 관리 정책 방향에 대해 살펴본다. 글 백선재 한국환경공단 물환경본부 물환경이사 지구 온난화와 물관리 위기 원활한 물 공급을 위한 정책 방향 세계 195개 국가는 10여 년 전 파리협정(Paris Agreement)에서 기 세계적 기후변화로 인한 물관리의 중요성은 더욱 증가하고 있으며, 온상승을 1.5℃로 제한하기 위한 온실가스 감축의무 이행을 약속했 우리나라는 1980년대 이전 산업 발전의 수자원 개발 시대에서 환 으나, 많은 전문가들은 이에 대한 목표 달성에 비관하며 기온상승 경부 출범이후 수질·수생태계에 대한 국민 요구를 반영한 정책이 에 따른 막대한 피해를 우려하고 있다. 최근 발표된 우리나라 정부 본격 추진되면서 쾌적한 물환경을 국민에게 돌려주기 위하여 4대 의 국민 의식조사에서도 지구 온난화와 이상 기후는 일반 국민의 강 특별법 제정 등 다양한 정책과 사업을 추진해 왔다. 93.7%에게도 가장 심각한 문제로 인식되고 있다. 특히, 물관리 여건의 급변에 따라 수질·수생태·수량 관리의 패러다 물은 기후위기의 피해를 인간에게 나타내는 대표적인 직접 매개체 임을 극복하기 위해 2018년 통합물관리를 위한 물관리기본법 제정 로 최근 여름철 강수량의 증가와 시간당 30mm 이상의 집중호우, 등 관련 제도를 정비하고 국가물관리위원회를 출범시키는 등 효율 국지성 가뭄의 증가 추세와 수온 상승 등은 물 재해와 물 부족, 조류 적 물관리에 노력하고 있다. 2022년부터는 기후위기에 강한 물환 번성 등의 수질 악화, 물 생태계의 변화 등 다양한 문제들로 우리의 경과 자연 생태계 조성을 국정과제로 채택해 추진하고 있다. 물 기본권을 위협하고 있다. 물관리기본법에 따라 2021년 국가물관리기본계획 수립 이후, 그 계"}, {"p": 12, "t": "이상 기후를 심각한 문제로 인식하는 국민의 비율 93.7% 침수(우려)지역에 투입 예산 1.9 기후대응댐 건설 예정 조억원 재이용수 대체수자원 확보 41.2 만 톤/일 곳"}, {"p": 13, "t": "획과 하위 계획들과의 추진목표와 방향, 내용의 부합 여부를 심의해 남부지역 지자체 등 관계기관 간 업무협약을 체결하고 세계최대 규 국가-유역-지자체 간 물관리 목표의 일관성을 확보하고 있다. 국가 모의 재이용수 대체수자원 41.2만 톤/일을 확보하는 등 물 공급 여 계획과의 부합성 심의는 중앙행정기관장이 수립하는 물관리 관련 유량을 크게 개선한 바 재이용 광역화를 도모하고, 연간 1.2억 톤에 법정계획 17종 58건이 대상이며, 유역계획과의 부합여부 심의 대상 달하는 유출지하수 이용시설에 대한 국조지원 신설, 안심지하수 보 은 지자체장이 수립하는 관련 법정계획 14종 1,246건에 달한다. 급 등으로 대체수자원의 활용이 대폭 확대될 것으로 기대한다. 한국환경공단은 다양한 계획의 부합성 전문검토를 총괄 지원해 국 가-유역-지자체의 물관리 계획 간 정책의 정합성을 확보해 기후 위 모두의 물을 위한 다짐 기 시대의 국가 물 관리 비전과 목표 달성에 함께하고 있다. 기후변화로 인한 물 관련 위기는 홍수와 가뭄에만 있지 않다. 수온 상승과 일사량 증가, 폭우에 따른 오염물질의 유입 등 다양한 원인 기후위기 대응을 위한 주요 추진사업 에 의해 겨울에도 녹조가 발생하는 등 녹조의 심각성은 더욱 가중 최근 환경부는 서울특별시와 전북특별자치도 군산시 등에서 발생 되고 있다. 녹조의 근본적 해결을 위해 물의 경계 단위인 유역 단위 한 기록적인 집중 강우와 가뭄 등에 대해 경각심을 느끼며, 기후 변 의 수량·수질 유역통합물관리 등 복합적 대책 추진이 필요하다. 이 화로 인한 이상 기상 현상에 대응하기 위해 홍수 조절댐 등 14곳에 를 위하여 수질오염총량제 개선 등 다양한 대책이 시행되고 있으 기후대응댐 건설을 발표한 바 있다. 그러나 사업 추진에는 10년 이 며, 올해 한강을 시작으로 순차적으로 낙동강, 금강, 영산강에 유역 상 장기간이 소요될 것으로 예상되는바, 눈앞에 닥친 기후변화로 하수도지원센터를 출범시켜 유역 맞춤형 하수도시설 재난 예방 및 인해 예상되는 국민 불편과 피해에 대해 다양한 대책을 적극적으로 대응, 최적 운영 등을 도모할 계획이다. 여가생활의 증가로 친수공 추진하고 있다. 간으로서의 하천 안전성에 대한 국민의 요구가 증대되고 있어 녹조 하수도는 하수범람으로 인한 침수 피해를 예방(「하수도법」 제1조) 예측-감시-제거 등 체계적인 대응과 실효성있는 대응 시설의 도입 하는 국가 주요 인프라이다. 반복되는 침수 피해를 해소하기 위해 도 필요할 것이다. 2023년부터 국가 규모의 수질오염사고 실시간 2013년부터 ‘도시침수 대응 하수도 정비사업’을 추진하고 있으며, 감시와 컨트롤타워 역할을 수행할 수 있는 수질오염 통합방제센터 올해까지 침수(우려)지역에 1조 9,000억 원의 예산이 투입되어 194 가 건설되고 있어 2027년 운영을 시작으로 오염물질의 하천유입과 개소의 중점관리지역을 선정하여 침수대응력을 강화하고 있다. 한 녹조의 초기 확산을 차단해 국민이 깨끗한 물을 마시고, 안전하게 국환경공단은 수행한 지역 중 사업이 완료된 28개 지역은 현재까지 여가를 즐길 수 있는 물환경을 만드는 데 기여할 것이다. 침수가 발생하지 않는 등의 큰 성과를 거뒀다. 이는 하수도 정비, 침 뿐만 아니라 최근 인구감소와 노령화는 효율적인 물관리를 위한 AI 수위험지도 구축, 대심도 지하터널 건설 등 침수 대응 인프라의 꾸 등 ICT 기반의 디지털화를 요구한다. 현재 구축 중인 하수ON(유역 준한 확충뿐 아니라 하수도 제도 정비와 상습 침수지역 점검, 침수 통합하수도플랫폼)은 침수와 가뭄, 녹조와 에너지, 자산관리까지 예방 홍보 등 다양한 노력의 결실이라 하겠다. 국민이 체감할 수 있도록 구축되고 있어 향후 유역특성에 따른 수 기후변화로 인한 세계적으로 발생하는 전례 없는 극한 가뭄은 우 질오염 예방·감시·방제, 물산업 등과 물관리 의사결정에 연계되어 리나라도 예외가 아니다. 지난해 전남지역에서 발생한 극한 가뭄이 효용성이 극대화될 것이다. 대표적인 사례다. 향후 물 부족량이 연간 약 7.6억 톤까지 발생할 수 또한 노후되는 물관련 인프라의 현대화와 국가 성장동력인 신성장 있을 것으로 전망되는 만큼 한국환경공단은 기후변화로 인한 극한 산업분야의 적정 물관리를 도모하고 건강한 물순환이 이루어지도 가뭄 해결을 위해 하·폐수 재이용수 광역 공급망 구축을 확대 추진 록 불투수면적 감소, 빗물제로화 등 기후위기시대에 다양한 물관리 하여 국가 핵심사업에 보급하는 등 산업계 물 이용 패러다임의 전 대책의 중단없는 추진을 통해 모두의 물, 자연과 인간이 함께 누리 환을 추진 중이다. 하수처리수 재이용 활성화를 위해 정부와 경기 는 깨끗한 물을 만드는 세상을 이루어 낼 수 있을 것이다. Vol. 93 2025 신년호"}]}, {"id": "93-14", "no": 93, "label": "2025 신년호", "corner": "맑은 물 이야기", "title": "KWWA NEWS · 교육 일정", "author": "", "start": 14, "end": 19, "pages": [{"p": 14, "t": "Keynote | 맑은 물 이야기 KWWA NEWS KWWA NEWS 산업통상자원부 장관 표창 수상 한국상하수도협회(이하 협회)는 지난 10월 15일 산업통상자원부 국가기술표준원이 주최한 ‘2024 세계 표준의 날’ 기념행사에서 단체표준화 부문의 공로를 인정받아 산업통상자원부 장관 표창 을 수상했다. 협회는 수질보전, 상하수도 안정성 확보, 물산업 선 진화를 위한 상하수도 기자재 합리적 표준 기준의 제정·보급으로 품질 고도화 및 효율 향상에 이바지한 공로를 인정받았다. 산업별 직무역량체계 인정사업 우수상 수상 환경 인적자원개발위원회(이하 환경 ISC)는 지난 11월 6일 고용노 동부가 주최하고 한국산업인력공단 국가직무능력표준원이 주관 하는 ‘2024년 산업별 역량체계 사업성과 및 우수사례 발표회’에서 우수상을 수상했다. 환경 ISC는 자원순환 분야의 2022년 직무맵 개발, 2023년 역량체계 구축, 2024년 역량인정방안 개발 과정과 성과, 활용방안, 타 ISC와의 차별점 등에서 우수성을 평가받았다. 회원 상생 발전을 위한 회원 간담회 개최 지난 11월 13일과 14일 양일간 협회는 단체(학회·협회·조합)회원 과 영남지역 기업회원이 참여하는 간담회를 개최했다. 이번 간담 회에는 대한상하수도학회 오희경 교수(서울시립대학교)가 ‘협회 의 회원제도 개선과 회원 발굴 확대’, 국가물산업클러스터 물산업 진흥처 신명섭 과장이 ‘물기업 지원사업’에 대해 발표했다. 협회는 앞으로도 물산업의 더 큰 도약을 위한 지역·권역·업종별 소통의 장을 지속적으로 마련할 계획이다."}, {"p": 15, "t": "2025 신년호 Vol.93 미국물환경연합 물산업 전시회 한국관 운영 협회는 지난 10월 7일부터 9일까지 우수한 기술과 제품을 보유하 고 있으나 판로 확보에 어려움을 겪고 있는 강소 물기업을 지원하 기 위해 미국물환경연합 물산업 전시회 ‘2024 WEFTEC’에 참여 해 성황리에 한국관을 운영했다. 이번 한국관에는 총 8개 사가 참 여하였다. 약 300명의 참관객이 한국관을 방문하여 상담을 통해 계약에 대한 구체적인 사항을 논의했다. 환경 ISC-한국소음진동기술사회 업무협약 체결 환경 ISC는 지난 10월 31일 한국소음진동기술사회와 업무협약을 체결했다. 이번 협약으로 환경산업 소음진동분야의 인적자원개 발, 교육현황 조사, 교육과정 개발 등 ISC 주요 기능 강화를 위해 전 문성을 갖춘 소음진동분야의 직능단체와 협력할 수 있는 계기가 됐다. 이번 협약을 통해 소음진동분야 훈련 과정 개발 등 인적자 원개발 활성화와 지역·산업 맞춤형 인력양성, 직무능력 향상 모델 개발 등을 진행할 계획이다. 환경 ISC, 고용노동부 ISC 혁신성과 발표대회 우수상 수상 환경 ISC는 지난 11월 21일 고용노동부가 주최하고 한국산업인력 공단이 주관하는 ‘2024년 ISC 혁신성과 발표대회’에서 우수상을 수상했다. 이번 수상은 ‘녹색산업생태계의 인적자원개발 선도를 위한 지역·거버넌스 연계 사업추진 역량 확보’ 우수사례를 평가 받은 것으로, 환경산업과 거점 지역의 협업 역량 확보, ISC 참여기 관의 신자격 개발 역량 강화 등에서 유의미한 성과를 거둔 것을 인 정 받아 우수상을 수상하게 됐다. Vol. 93 2025 신년호"}, {"p": 16, "t": "한국상하수도협회 2025년 1분기 물산업인재교육원 교육일정 분야 과정명 교육시간 수강료(원) 상수도 입문자과정 3월 24-28 35시간(5일) 340,000 수도시설운영기본과정 10-14 유량계관리과정 24-28 수질분야 시료채취 및 현장측정과정 16시간(2일) 200,000 공공하수처리시설운영요원과정(기본) 법정교육 2월 17-21 상수도행정기본과정 상수도 1월 4-5 17-21 공공하수처리시설운영요원과정(설비운영) 24-28 320,000 하수도 공공하수도관리대행업기술인력과정(혼합) 4-6 35시간(5일) 공공하수처리시설운영요원과정(수질관리) 10-14 하수도관리자과정 측정기기 상수도 350,000 24-28 4-7 측정기기관리대행업기술인력과정 24시간(4일) 169,000 정수시설운영관리사 1,2급(1차대비)과정 35시간(5일) 390,000 정수장 수질사고 사례 및 대응과정 21시간(3일) 270,000 35시간(5일) 390,000 17-21 4-6 전문교육 정수시설운영관리사 1,2급(2차대비)과정 하수도 하수도설계기준과정 상수도 상수도공사 품질향상과정(감리자) 사업주위탁 24-28 8시간(1일) 하수도 건설기술인 10-14 설계시공 시민친화형 하수도공사 혁신과정 상하수도설계기준 최초교육 상하수도설계시공 승급교육(중고급) 35시간(30일) 상하수도설계시공 승급교육(특급) ▶ 교육비와 교육일정은 협회 사정에 따라 변경될 수 있으며, 자세한 사항은 홈페이지(edu.kwwa.or.kr)를 참고해주시기 바랍니다. ▶ 문의사항 02-3156-7800 100,000 160,000"}, {"p": 17, "t": "분야 과정명 교육시간 수강료(원) 1월 2월 3월 상수도 관망해석 실습 기초 과정 상수도 관망해석 실습 심화 과정 상수관망 블록시스템 과정 상수 관망유지 및 유수율 관리 과정 수도시설 기술진단 실무 과정 노후 옥내급수관 세척갱생 과정 하수도 설계기준 해설 과정 하수처리시설 운영관리 과정 하수관로 유지관리 실무 과정 하수도시설 기술진단 실무 과정 하수도시설 관리대행 성과평가의 이해 과정 상하수도 BIM의 첫걸음 과정 물기업 신규직원 역량강화 과정 상수 하수 공통 물기업 재직자 대상 국비지원 무료교육 상하수도 밸브(구동기) 및 펌프운영관리 심화 과정 상하수도 설계 AUTO CAD 기초 과정 대기악취관리 역량 강화 과정 환경산업 상하수도 관망 역량 강화 과정 그린뉴딜 물산업 상품개발 전략 과정 그린뉴딜 환경화학물질 안전운송 전략 과정 환경 중장비 운영관리 혁신 과정 친환경 발파 기술 레벨 업 과정 펌프의 첫걸음 과정 하수관로 기술진단 및 정밀진단 과정 환경 플랜트 엔지니어링 과정 수처리 시설의 개요 및 설계 과정 디지털 기술 활용 수질계측기 사업 효율성 레벨 업 과정 에코그린 환경관리자 핵심 과정 AI 활용 계측기기 산업 생산성 Quantum Jump 과정 물탱크 및 염소투입 기술 핵심 과정 기타 ㅇ중소기업: 무료 ㅇ대기업: 20%부담 교육 신청 시 일정 협의 (*최소 수강인원 8명) ▶ 상·하수·공통교육은 10인 이상, 기타교육은 8인 이상 신청 시 기업 출장 교육이 가능합니다. ▶ 문의사항 02-3145-7873, 7878 Vol. 93 2025 신년호"}, {"p": 18, "t": "waterkorea.kr 참관객 사전등록 바로가기 국제 물산업박람회 INTERNATIONAL WATER INDUSTRY EXPO 2025 WATER KOREA 안전한 물과 우리의 세상 2025. 3. 19WED~ 3. 21FRI 경기도 킨텍스 제2전시장 7~8A홀 아이폰 안드로이드 스마트폰앱 다운받기"}, {"p": 19, "t": "We Work 회원탐방 ㈜에스아이아이에스 지구를 생각하는 사람들 청년환경운동가 홍다경 트렌드 인사이트 소분 라이프 시대 회원 소식 Vol. 93 2025 신년호"}]}, {"id": "93-20", "no": 93, "label": "2025 신년호", "corner": "회원탐방", "title": "㈜에스아이아이에스", "author": "", "start": 20, "end": 23, "pages": [{"p": 21, "t": "우주산업의 성장은 우리가 살아가는 세상을 빠르게 변화시키고 있다. 지금, 이 순간에도 인공위성에서 촬영한 영상이 차곡차곡 쌓여가고 있고, 이 데이터는 우리가 살아가는 지구를 더 나은 방향으로 변화시키는 토대가 된다. 위성영상 전문기업 ㈜에스아이아이에스는 지난 10년간 전 세계 160여 개의 파트너사를 구축하며 고해상도 위성영상 상용화를 위해 힘써왔다. 위성영상을 통해 다양한 분야에서 의미 있는 변화를 만들어온 에스아이아이에스의 시선이 ‘수자원’을 향한 것은 최근의 일. ‘Recover 솔루션’ 도입을 통해 만들어 나갈 새로운 물결이 기대된다. 글 박향아 | 사진 고인순 인공위성을 기반으로 스마트 물관리의 시대를 연다 ㈜에스아이아이에스 우주에 대한 공정한 접근 세상은 더 나은 내일을 위해 도전을 망설이지 않는 선 위성영상은 해상도에 따라 시장이 나뉘는데, SIIS에서 담당하는 초고해상도 도자의 걸음을 따라 진화한다. 남다른 시선과 도전 정 (30~50cm, 차량 종류 식별 가능한 정도) 위성영상은 주로 정밀지도 제작, 안보, 시 신은 필수요, 새로운 길을 개척하는 일인 만큼 단단한 설 모니터링 및 관리, 비즈니스 인텔리전스, 농업, 임업, 수질 관리와 모니터링 등 소신과 묵묵한 노력도 동반되어야 한다. 다양한 분야에 사용된다. ㈜에스아이아이에스(이하 SIIS)는 국내에서 유일하게 위성 분야에서 가장 권위 있는 ‘Euroconsult’의 자료에 의하면, 위성 데이터를 활용 위성 시스템을 제조, 수출하는 기업인 ㈜쎄트렉아이의 한 물 산업 시장이 2021년 5억 6,000만 달러에서 2031년 10억 달러로 성장할 전 자회사다. 인공위성은 우주에서 지구를 바라보며 끊임 망이라고 한다. 우리나라에서도 관련 기술 도입에 대한 필요성은 커지고 있으나, 없이 새로운 영상을 만들어내고 있는데, 이 영상을 어 현재 도입 수준은 미흡한 상황. SIIS가 인공위성 기반의 누수탐사기술인 ASTERRA 떤 분야에 어떻게 활용할지를 고민하는 것이 SIIS의 역 의 Recover 솔루션 도입을 결정하고, 사업 영역의 확장을 결정한 이유다. ‘위성을 할. 이제 10년 차에 접어든 젊은 기업이지만 빠른 속도 활용한 새로운 기술을 다양한 산업 분야에 활용해 더 나은 내일을 만들어 나가고 로 단단한 성장을 이뤄가고 있다. 싶다’는 SIIS의 의지는 새로운 도전의 발판이 됐다. 항공우주연구원이 개발한 아리랑 위성영상의 전 세계 상용 공급을 담당하고 있는 유일한 회사가 바로 SIIS다. 스마트 수자원 관리를 위한 새로운 도전 ‘우주에 대한 공정한 접근(FAIR ACCESS TO SPACE)’이라 ‘ASTERRA’는 2013년에 설립된 이스라엘 기업으로 원격 탐사 기술로 지하의 누 는 미션 아래, 아이랑 위성영상을 전 세계에 공급하는 일 수를 탐사하는 서비스를 제공하는 기업이다. SIIS가 ASTERRA와 파트너십을 맺으 뿐만 아니라, 해외의 다양한 위성 데이터 및 솔루션을 한 면서 국내에 최초로 도입한 ‘Recover 솔루션’은 인공위성 기반의 누수탐사기술로, 국 시장에 도입하여 서비스하는 역할도 담당하고 있다. 전 세계 53개국이 해당 솔루션을 도입, 효율적인 수자원 관리를 시행 중이다. Vol. 93 2025 신년호"}, {"p": 22, "t": "‘Recover 솔루션’의 핵심 기술은 ‘L-밴드 합성 개구 레이더(SAR) 센서’와 AI 기술의 활용에 있다. 위성이 우주에서 쏜 레이더 센서를 활용하여 지표면 아래에서 발생 하는 하수의 고유한 특성을 감지하면, 인공지능과 머신러닝 알고리즘을 통해 잠 재적인 누수 지역을 식별해 낸다. 기존의 누수 탐사 방법보다 더 적은 비용으로, 더 짧은 시간에 누수를 탐사할 수 있는 효과적인 솔루션이다. “땅속에 있는 수도관은 영구적인 것이 아니기에 누수가 발생하기 마련입니다. 시 간의 흐름에 따라 부식되기도 하고, 외부의 충격으로 파손되기도 하고요. 누수가 생긴 수도관을 확인하기 위해서는 일일이 수도관을 두드려 누수를 탐지하는 수밖 에 없는데, 이 경우 상당한 시간과 인력, 비용이 필요합니다. Recover 솔루션을 활 용할 경우, 레이더를 통해 광범위한 영역의 토양 성분을 동시에 파악하고, AI 알고 리즘과 지리정보시스템을 활용해 잠재적인 누수 위치를 특정할 수 있습니다. 기 존 방식 대비 효율적이고 비용 절감효과가 큰 투수 탐지 시스템 구축이 가능한 이 유입니다.” ‘Recover 솔루션’ 사업 담당자인 임동영 매니저는 “해당 솔루션이 한국에서 스마 트 물관리의 새로운 장을 여는 출발점이 되기를 바란다”고 했다. “위성 기반 누수 탐사로 기존 방식 대비 효율적이고 비용 절감효과가 큰 시스템을 구축하려 합니다. 이를 통해 한국 수자원 관리의 효율성을 높이고, 국내 물 산업의 글로벌 경쟁력과 기술적 발전에 이바지하여 기후 변화와 물 부족 문제에 대응할 수 있는 기반을 마련하고자 합니다.”"}, {"p": 23, "t": "Recover 솔루션을 활용할 경우, 레이더를 통해 광범위한 영역의 토양 성분을 동시에 파악하고, AI 알고리즘과 지리정보시스템을 활용해 잠재적인 누수 위치를 특정할 수 있다. 기존 방식 대비 효율적이고 비용 절감효과가 큰 투수 탐지 시스템 구축이 가능한 이유다. 더 나은 내일을 위한 도전은 계속된다 Recover 솔루션은 국내에 도입된 지, 반년이 되지 않았 SIIS의 선택은 결과로 증명하는 것. 2024년 한 해 동안 한국 시장에서 Recover 솔 다. 이미 물산업 전반에 해당 솔루션을 도입한 전 세계 루션의 기술을 검증하는 것에 초점을 맞추고, 국내 지자체와 공공기관과 시범사 53개국에 비하면 늦은 출발일 수 있다. 그 물꼬를 튼 기 업을 수행하며 긍정적인 결과를 도출했다. SIIS는 위성 분야에서 활동하며 쌓아온 업이 물 관련 사업과는 무관한 위성영상 전문기업이라 지식을 바탕으로 Recover 솔루션의 기술적인 검증을 거쳤고, 해외 여러 실증사례 는 것도 의문을 가질 법하다. 와 국내에서의 직접 시범사업을 진행하며 기술에 대한 평가도 마쳤다. “사실 이번 사업은 SIIS의 주력 사업은 아닙니다. 이미 임동영 매니저는 “해당 솔루션이 기존 방식을 대체하는 것이 아니라, 기존 방식 회사의 현재와 미래를 책임질 위성영상 관련 사업이 을 보완하는 방식”이라고 강조했다. 새로운 기술이 기존의 시스템과 만나 새로운 활발히 진행 중이고요. 그럼에도 우리가 ‘새로운 도전’ 변 화를 끌어내기 위해서는 협력과 상생이 필수라는 것이다. 을 진행하는 이유는 우리 SIIS의 미션인 ‘FAIR ACCESS “Recover의 솔루션의 정확도가 100%가 될 수는 없습니다. 결국, 누군가는 해당 TO SPACE’에 담겨 있습니다. 회사의 미션과 같이 인공 솔루션이 특정한 지역에 실제로 누수가 있는지 검증을 해야 합니다. 해당 솔루션 위성을 활용한 전 세계의 우수한 기술들을 한국 시장 이 지자체는 비용을 절감하고, 현장 업체는 시간과 노력을 줄일 수 있는 새로운 방 에 소개함으로써 다양한 산업 분야의 성장에 디딤돌이 안이 되기를 바랍니다. 장기적으로는 물 손실을 줄이고, 운영 효율성을 개선하여 되고 싶습니다. 이것이 우리가 낯설지만, 꼭 필요한 분 누수 탐지의 비용을 획기적으로 낮추는 새로운 시스템으로 정착하기를 바라고요. 야에 도전장을 내밀고 고군분투 중인 이유입니다.” 이를 위해서 관련 기관, 업체와 꾸준히 소통하며 시스템의 정착과 긍정적인 변화 새로운 도전에는 항상 의문이 따르는 법. 특히 오랫동 를 모색해 나가겠습니다.” 안 유지되어 온 시스템에 새로운 기술이 도입될 때는 2025년에는 시범사업의 결과를 토대로, Recover의 솔루션을 본격적으로 확대해 ‘보수적인 판단’이 앞설 수밖에 없다. Recover 솔루션에 나갈 계획이다. 자체 개발 위성인 SpaceEye-T의 발사를 통해, 초고해상도 지구 관 관해서도 ‘인공위성 기반의 누수탐사기술이 아직 검증 측 시장에서의 경쟁력을 확보해나가야 하는 과제도 있다. 인공위성 영상과 AI 기 되지 않았다’거나 ‘지상으로부터 500km~700km 위에 술의 결합을 통한 다양한 솔루션을 개발하고, 이를 통해 다양한 분야에서 변화를 떠 있는 센서로 어떻게 땅속의 누수를 찾을 수 있는지’ 모색하는 일도 계속 이어나갈 것이다. 우주라는 무한대의 공간을 무대로, 제한 없 기술적인 한계성에 의문을 제기하는 시선도 존재했다. 는 도전을 이어나가는 것. SIIS의 출발점이자 변함없는 목표다. Vol. 93 2025 신년호"}]}, {"id": "93-24", "no": 93, "label": "2025 신년호", "corner": "지구를 생각하는 사람들", "title": "청년환경운동가 홍다경", "author": "", "start": 24, "end": 27, "pages": [{"p": 24, "t": "we work | 지구를 생각하는 사람들 이 청년이 지구를 사랑하는 법 청년환경운동가 홍다경 맑은 물 세상 기소개부터 부탁드려요. 없다. 대신 직접 제작한 뮤직비오를 통해 쓰레기 산을 보여주고, 전국의 쓰레기 산에 올라 댄스 챌린지를 펼친다. 더 많은 이들이 환경에 관심을 가지고 꾸준히 실천할 수 있는 방법에 대해 고민한 결과. 목소리를 전하는 방식은 달라도, 그 안에 담긴 지구를 향한 마음은 진심이다. 글 박향아 | 사진 고인순 적인 답장이었지만요. 이후 저는 학교를 그만두게 됐지만, 다음 해 친구한테 연락이 왔어요. 잔반을 깨 안녕하세요. 스물일곱, 청년 환경운동가 끗하게 처리한 학생에겐 개발도상국의 아이들을 도 홍다경입니다. 제 이름 앞에 청년 환경운동가, 환경 울 수 있는 잔반 쿠폰을 지급하는 제도가 도입됐다 인플루언서 등 다양한 수식어를 붙여주시는데요. 고요. 결국 변화를 만들고 갔다는 말이 큰 힘이 됐어 사실 저는 ‘지구를 사랑하는 다경이’라는 수식어를 요. 그 작은 경험이 꾸준히 환경에 관해 목소리를 내 가장 좋아합니다. 고 행동하는 힘이 되었습니다. 홍다경 맑은 물 세상 비장한 구호도, 과도한 부담도 만나서 반갑습니다. 간단한 자 지구, 환경에 관심을 갖게 된 시작점은 언제인가요? 홍다경 네 살 때 집 앞에 작은 강이 흐르는 곳에 맑은 물 세상 청년 환경운동가의 길을 본격 적으로 걷게 된 계기가 있을까요? 홍다경 홀로 서울 생활을 시작하면서, 생활비 마 살았어요. 그런데 공장이 들어서면서 더는 강에서 련을 위해 청소 아르바이트를 했는데요. 하루에 한 놀 수가 없게 됐어요. 가족, 친구와의 추억이 가득한 건물에서 배출되는 쓰레기양이 어마어마한 거예요. 곳이 없어진 거죠. 어린 나이지만 자연이 사라지면 분리배출을 잘 한다고 해도 그 이후에는 어떻게 재 내가 좋아하는 것, 소중하게 생각하는 것도 사라진 활용되고 처리되는지 궁금했죠. 그래서 자원순환연 다는 것을 어렴풋이 느꼈던 것 같아요. 요즘 얘기하 대, 녹색연합 등을 찾아다니면서, 이 문제에 대해 고 는 기후 감수성은 책으로 배우는 것이 아니라, 어려 민해 오신 분들의 얘기를 듣기 시작했어요. 오래전 서부터 몸으로 체득하는 것이라고 생각해요. 내가 부터 환경에 관심을 가지고 목소리를 내오신 분들 뛰어놀던 곳, 내가 좋아하는 꽃과 나무, 동물이 사는 이 계셔서 그나마 내가 깨끗한 환경에서 살고 있었 곳, 소중한 추억이 있는 곳은 늘 그리움의 대상이잖 다는 생각과 함께, 내가 그 뒤를 이어보고 싶다고 생 아요. 그곳을 지키고 싶은 마음은 어려서부터 자연 각하게 되었습니다. 과 친하게 지낼 때 자연스럽게 자라게 되는 것 같아 요. 맑은 물 세상 관심이 결심이 되고, 곧바로 행동으로 이어졌지요? 맑은 물 세상 환경에 관한 관심이 행동과 실 천으로 이어진 계기도 궁금합니다. 네. 지금 당장 행동해야 한다는 절박함 이 저를 움직이게 했어요. 전국의 쓰레기 수거장 고등학생 때 급식으로 스마일 감자가 나 과 매립장, 재활용장을 찾아다니기 시작했습니다. 왔는데, 상당량이 그대로 버려지는 걸 봤어요. ‘전국 쓰레기 문제에 대해 목소리를 내려면, 단순히 통계 의 학교에서는 얼마나 많은 음식물 쓰레기가 나오 나 자료가 아니라 현장에 직접 가봐야 한다고 생각 는 걸까’라는 생각이 들었고, 자연스레 음식물 쓰레 했거든요. 그래야 제가 내는 목소리에 진정성과 영 기에 관심을 갖게 됐죠. 그래서 일주일 정도 가장 늦 향력이 담길 테니까요. 우리나라의 재활용 비율이 게까지 급식실에 남아서 잔반을 확인하고 사진으로 2~30%밖에 안 된다고 해요. 그해 여름, 전국을 다 기록했어요. 이 내용을 정리해서 교육감님한테 메 니며 보고 들은 내용을 자료로 기록했는데요. 그 자 일을 보냈어요. 3개월 동안 30통의 메일을 보내고 료는 교육 자료로 꾸준히 활용하고, 필요한 분들에 한 통의 답장을 받았습니다. 고민해 보겠다는 의례 게도 공유하고 있습니다. 홍다경 홍다경"}, {"p": 26, "t": "자연을 위한 것도 중요하고 사람을 위한 것도 중요해요. 그러니까 맑은 물 세상 현재 수장으로 이끌고 계신 지 맑은 물 세상 지지배는 의미 있는 행보들이 지배(지구를 지키는 배움터)에 대해서도 꽤 많이 있었어요. ‘쓰레기 산 뮤직비디오’ 소개해주세요. 프로젝트도 많은 관심을 받았죠? 홍다경 2017년 처음 시작했을 때는 1인 동아리 홍다경 우리나라에 쓰레기 산이 470개 정도 된 어느 한쪽이 소외되지 였어요. 조직이 있으면 함께하는 사람들이 에너지 다고 해요. 도심에서 떨어진 곳, 사람들의 시선이 닿 않게 서로를 위했으면 를 얻고, 우리의 목소리를 더 효율적으로 전달할 수 지 않는 곳에 생기니 대부분은 관심이 없고, 관심이 좋겠습니다. 있겠다는 판단하에, 지금은 단체로 전환해서 운영 없으니 계속 생기는 거죠. 이 현실을 알리고 싶었어 중인데요. 대부분이 20~30대 친구들인 만큼, 물질 요. 통계나 어떤 구호보다 직접 보여주는 것이 가장 적으로 여유로운 단체는 아니에요. 이름 그대로 자 효과적이라 생각했고, 그래서 쓰레기 산을 배경으 원은 없어도 사람이 성장하는 공간, 배움터라고 생 로 뮤직비디오를 찍기로 했습니다. 뮤직비디오 제 각해요. 회원 중 한 명이 서울 청년정책네트워크 기 작을 위해 1년 동안 기획하고 배우와 스태프를 모집 후 분과에 들어가서, 2025년 예산안에 일회용 전자 하고, 제작비를 마련했죠. 30여 명의 스태프 중, 재 담배 필터 문제 해결을 위한 정책 제안서를 냈고, 지 능기부를 해주시거나 최소한의 비용만으로 참여해 금 예산 심의를 거치고 있거든요. 마찬가지로 지지 주신 분들이 정말 많았어요. ‘뮤직비디오를 통해 한 배 안에서 함께 행동하며 배운 것들을 토대로 또 다 명이라도 더 쓰레기 산 문제를 인식했으면 좋겠다’ 른 곳에서 변화를 만들어낸다면 기쁠 것 같아요. 는 마음, 그 마음 하나로 참여해주신 거죠. 감사하게"}, {"p": 27, "t": "홍다경이 사용 중인 환경 아이템 01. ‌\u0007소방관의 방화복을 재활용해 만든 119 REO 가방, 수익금 일부는 소방관을 위해 기부 02. 플라스틱 병뚜껑으로 만든 리사이클링 키링 03. 플라스틱과 접착제를 최대한 줄인 용기 사용하는 립밤 04. 세탁해 재 사용 가능한 손수건 05. 재활용 종이로 만든 노트북 거치대 06. 일회용품을 줄이기 위해 늘 휴대하는 텀블러와 알루미늄 빨대 07. 빨아서 재사용할 수 있는 면으로 만든 화장 솜 08. 음식 포장 시 1회용품 대신 사용하는 다회용기와 젓가락 도 뮤직비디오에 많은 관심이 생기면서, ‘쓰레기 산 댄스 챌린지’ 등으로 활동이 확장됐는데요. 전국의 쓰레기 산 30곳을 다니면서 댄스 챌린지를 펼친 모 맑은 물 세상 마지막으로 홍다경이 꿈꾸는 지구는 어떤 모습인가요? 홍다경 자연을 위한 것도 중요하고 사람을 위한 습이 다큐멘터리를 통해 방송되기도 했고, <쓰레기 것도 중요해요. 그러니까 어느 한쪽이 소외되지 않 산에서 춤을>이라는 책도 출간하게 됐습니다. 게 서로를 위했으면 좋겠습니다. 지금 모든 정책은 사람 위주예요. 자연까지도 생각하는 정책이 마련 맑은 물 세상 다경 씨의 활동을 보면, 유쾌 된다면, 지구 환경 문제가 완벽하게 해결되지 않더 하고 재미있고 힙한 느낌이 강해요. 신념을 라도 조금씩 나아질 수 있다고 믿어요. 전하고 변화를 촉구하는 방식으로 그 방식 1989년 발효된 몬트리올 의정서가 초반에는 눈에 을 선택한 이유는 무엇인가요? 띄는 성과를 만들어내지 못했지만, 시간이 지나면 환경운동은 여가 생활처럼 이뤄져야 한 서 실제로 남극 오존층의 구멍 크기가 줄어들고 농 다고 생각합니다. 환경 문제가 당장 나의 삶에 영향을 도가 회복되기 시작했다고 하잖아요. 관심을 가지 준다고 느끼는 건 쉽지 않거든요. 심각한 목소리로 현 고 결심하고 행동하면 변합니다. 자연과 사람이 함 실을 보여주고 부정적 미래에 대해 경고하는 것만으 께 공존하는 지구가 되었으면 좋겠습니다. 홍다경 로는 청년들의 참여를 끌어내기가 힘들다는 거죠. 문 턱을 낮춰서 쉽게 접근할 수 있어야 하고 재미도 있어 야 해요. 희망도 있어야죠. 환경운동에 참여했던 많은 분, 단체를 운영했던 분 중에 중도 포기했던 사례가 많 아요. 환경운동은 누가 오래 버티냐의 문제에요. 오래 버티려면 결국 사람이 필요해요. 한 달에 한 번, 아니 1 년에 한 번이라도 함께하는 사람이 늘어나면, 그들 때 문에 버티게 되거든요. 오롯이 몰두하는 한 명보다는 10%의 에너지를 쏟는 100명이 함께할 때, 조금 느릴 지라도 결국 변화를 만들어낼 수 있다고 생각해요. 일 회성 행사보다 더 많은 이들이 쉽고 재미있게 접할 수 있는 영상을 제작하는 등 더 많은 이들과 소통하는 방 식을 고민하는 이유입니다. Vol. 93 2025 신년호"}]}, {"id": "93-28", "no": 93, "label": "2025 신년호", "corner": "트렌드 인사이트", "title": "소분 라이프 시대", "author": "", "start": 28, "end": 31, "pages": [{"p": 28, "t": "we work | 트렌드 인사이트 2024년 여름, 필요한 양 만큼 과일과 채소를 구매할 수 있는 가게에 오픈런* 현상이 발생했다. 1인 가구의 증가로 많은 양의 과일이 부담스러웠던 결과일까? 그런데 이러한 흐름이 다른 분야에서도 나타나고 있다. ‘대용량·다구성’이 대세였던 홈쇼핑은 소분 판매 대열에 합류했다. ‘고비용·다보장’을 추구하던 보험업계도 짧은 기간 필요한 보장만 받을 수 있는 ‘소액단기보험’ 상품을 출시하고 있다. 온라인 플렛폼 역시 시간제로 이용할 수 있는 서비스가 제공되고 지금, 일상은 ‘소량화’, ‘소분화’라는 새로운 패러다임으로 변화하고 있다. 글 채선애 <2025 트렌드 모니터> 저자 나누고 쪼갠다 소분 라이프 시대"}, {"p": 29, "t": "짠 테 크 쪼개고 나누는 이유, ‘가격’ 그리고 ‘시성비’ 이러한 현상의 가장 근본적 이유는 고물가와 경제 불황 때문이 경제적 여유가 조금 없더라도 시간을 잘 관리하면 좀 더 다양한 경험을 할 수 있고, 그것이 다. 소비자들에게 가격은 더 이상 무시할 수 없는 중요한 기준이 되었고, 목돈이 나가거나 지속적인 비용이 요구되는 소비 항목 은 지출 목록에서 빠르게 배제되고 있다. 무지출 챌린지나 짠테 곧 나의 가치를 올리는 경쟁력 있는 콘텐츠가 크**, 거지방*** 같은 절약형 라이프 스타일이 등장한 이유도 여 되는 시대임을 깨닫게 된 것이다. 기에 있다. 하지만 ‘소량화’, ‘소분화’를 주도하는 원인을 가격에서 만 찾기엔 뭔가 부족하다. 이 흐름이 유독, 시간의 효율적 사용과 깊은 관련이 있기 때문이다. 소분 소비를 선택하는 또 다른 이유 는 바로 ‘시성비(시간 대비 성능)’에 있다. ‘소량화, 소분화’ 흐름이 있기 전, 사람들은 콘텐츠에 소비하는 시 간을 줄이기 위해 노력했다. 영상을 빨리 보기 위해 배속 시청을 하거나, 주요 장면만 담은 요약본을 선택하기도 했다. 노래 역시 속도를 빠르게 한 스페드 업(Sped up) 버전 음악을 선호하며, 웨 이팅을 피하기 위해 예약앱 서비스를 이용하는 시성비의 선호도 가 뚜렷했다. 시간을 허투루 소비하지 않고 더 많은, 더 다양한 경 험을 하기 위해서다. 이를 통해 대중은 시간을 효율적 관리가 경 험의 폭과 영역, 범주 등의 전반적인 스펙트럼 확장으로 이어짐 을 체감했다. 경제적 여유가 조금 없더라도 시간을 잘 관리하면 좀 더 다양한 경험을 할 수 있고, 그것이 곧 나의 가치를 올리는 경쟁력 있는 콘텐츠가 되는 시대임을 깨닫게 된 것이다. * 원하는 물건을 구매하기 위해 매장 개점 시간을 기다리다가 문이 열리면 달려가 구매하는 것을 뜻하는 신조어 ** 짜다와 재테크의 합성어로 불필요한 소비를 막자는 의미를 담은 신조어 *** 여러 사람이 모여 지출 내역을 공유하며 서로의 소비 충동을 막아주는 오픈 채팅방 Vol. 93 2025 신년호"}, {"p": 30, "t": "경험의 중요성, 다양성(量)에서 내용(質)으로 시간 대비 효율을 높이는 니즈가 강력해지면서 그 어느 때보다 택지를 제시 받았다. 이 작은 형태로 쪼개진 목표들은 더 많은 사 최대·최다의 경험이 가능해졌다. 그리고, 앞으로도 여전히 대중 람에게 성취감을 선사해 더 큰 가치를 경험하게 한다. 은 이같은 경험을 지향할 가능성이 크다. 다양한 경험은 계층 이 이처럼 심층적인 경험으로 선택의 중심축을 이동하고 있다. 제 동성이 약화되고 정체된 현재의 한국 사회에서 개인의 경쟁력을 품을 소비하는 방식에서부터 일상 생활에서의 선택에 이르기까 높이는 최선의 방법으로 여겨지고 있기 때문이다. 지 전반적인 생활 방식이 소량화, 소형화, 세분화 되고 있는 것. 하지만 최대·최다의 경험은 끝이 없다는 의미이다. 복잡한 선택 이러한 소분 라이프 트렌드가 가속화되면 소비자는 제품과 서 지로 주관적 만족감을 저하시키는 선택의 역설도 발생한다. 이 비스의 본질적 가치와 품질 등 기본과 근본, 오리지널에 점점 더 역설을 피하기 위해 가장 중요한 것은 바로 선택의 폭을 좁히는 집중하게 될 가능성이 높다. 개별 요소들이 모여 전체를 구성하 일이다. 의미없는 다양한 경험이 아닌 내용과 본질이 뚜렷하게 고, 기본적인 요소의 질이 전체의 질을 결정한다는 것을 깨닫게 압축된 선택을 할 수 있도록 폭을 좁히는 것이다. 이때 그 폭은 진 됐기 때문이다. 이렇게 되면 물리적 욕구를 충족시키는 것을 넘 정성을 담보로 한다. 자전거를 배우는 과정을 떠올려보자. 자전 어 심리적 만족을 추구하는 경향이 보다 뚜렷해지고, 평소 중요 거를 타는 기술을 익힐 때 반드시 선행되어야 하는 것이 있다. 직 하지 않다고 생각했던 부분, 너무 작아서 미처 보지 못했던 것들 접 타보는 것이다. 시간 대비 효율을 위해 자전거 타기 요약본을 을 다시 한번 살피고 발견하려는 노력이 많아질 수 있다. 디테일 읽거나, 자전거 타는 영상물을 보는 것으로는 대체 되지 않는다. (Detail)의 중요성을 파악하게 된다는 뜻이다. 원래 디테일의 사 직접 해봐야 스킬이나 전문성이 늘고, 그 경험이 온전한 내 것이 전적 정의는 작고 덜 중요하다는 뜻이다. 그래서 때론 이 ‘작고 덜 될 수 있기 때문이다. 간접 경험은 직접 경험을 대체하기 어렵다. 중요한’이란 수식어 때문에 디테일이 대단하지 않은 사소한 것 따라서 지금까지 시성비 추구를 위해 타인의 경험을 습득했던 으로 여겨지는 경우가 많다. 하지만, 감성에 따라 움직이는 소비 흐름이 이제 직접 즐거움을 느끼고, 가치를 체감할 수 있는 경험 자들은 이 디테일에 민감하게 반응하는 경향이 있다. 사소한 디 의 방향으로 변화할 것이다. 할 수 있는 최선 안에서 진정성을 느 테일 하나에 감동하고 만족하며, 팬덤이 되는 수준에까지 이르 낄 수 있는 경험을 하는 것. 이것이 바로 시성비의 나비효과다. 는 경우가 많다. 따라서 앞으로 작은 단위로 나누어지는 소비 패 턴의 변화를 넘어 근본과 기본, 디테일의 중요성을 따지는 태도 챕터별 경험과 오리지널리티 는 더욱 견고해질 수 있고, 금전적 가치로 환산할 수 없는 가치 이러한 흐름이 견고해지면 일부라도 독립적으로 경험해보려는 의 중요성을 강조하는 사회적 분위기 또한 더욱 높아질 가능성 챕터별 경험의 니즈가 높아지고 있다. 최근 2030세대를 중심으 이 있다. 소분 소비가 지향하는 소분 라이프는, 한 마디로 진정한 로 열풍이 부는 달리기를 예로 들어보자. 함께 모여 달리는 러닝 ‘찐’을 찾는 근본과 기본 그리고 오리지널의 중요성을 재발견하 크루의 급증과 러닝화 시장의 급성장, 지역구 주최 마라톤조차 는 과정이라 할 수 있겠다. 매진되는 상황이 달리기의 인기를 실감케 한다. 여기서 우리가 주목해야 될 부분은 다양해지고 있는 마라톤 코스다. 42.195km 코스를 고집하지 않고, 하프부터 시작해 10km, 5km, 4km, 3km, 2km까지 나뉘고, 쪼개지고 있는 것. 이를 통해 대중은 완전한 형 태의 목표 보다 소소하지만 성취감을 경험할 수 있는 목표의 선"}, {"p": 31, "t": "소분 라이프 트렌드 소분 소비가 지향하는 소분 라이프는, 한 마디로 진정한 ‘찐’을 찾는 근본과 기본, 오리지널의 중요성을 재발견하는 과정이라 할 수 있겠다. Vol. 93 2025 신년호"}]}, {"id": "93-32", "no": 93, "label": "2025 신년호", "corner": "회원 소식", "title": "회원 소식", "author": "", "start": 32, "end": 35, "pages": [{"p": 32, "t": "we work | 회원 소식 테크로스환경서비스 에코비트워터 ERA 주관 수질분야 최우수기관 선정 2024 수질 TMS 활용 공모전 우수상 종합환경기업 테크로스환경서비스는 최근 미국 환경자원협 종합환경기업 에코비트워터가 운영하는 경산공공폐수처리 회(ERA)가 주관한 국제숙련도 시험에서 ‘수질분야 최우수기 시설과 원능수질복원센터가 환경부 및 한국환경공단 주최· 관으로 선정되며, 보유 노하우의 높은 평가를 받아 주목받고 주관 ‘2024 수질 원격감시체계(TMS) 활용 공모전’에서 우수 있다. 6년 연속 같은 성과라 더 의미가 깊다. 국제숙련도 시험 사례로 선정됐다. TMS란 처리용량이 700t 이상인 공공 하· 은 ERA 주관으로 전 세계 환경 관련 기관의 분석능력을 검증 폐수처리시설이거나 폐수배출량이 일일 200t 이상인 사업 하는 장으로, 미국 환경보호청 및 국제 표준화기구가 인증한 장 등 1,077곳을 대상으로 ‘수질자동측정기기’를 부착해 원격 제도다. 으로 방류 수질을 관리하는 체계를 말한다. 지난해 기준 공공 테크로스환경서비스는 이 시험에서 TOC(총유기탄소)와 하수처리시설 631곳, 공공폐수처리시설 151곳, 폐수배출사업 BOD(생물화학적 산소요구량), COD(화학적 산소요구량), 장 295곳이다. SS(부유물질), T-N(총질소), T-P(총인), 총대장균군까지 수질 에코비트워터 경산공공폐수처리시설과 원능수질복원센터 분야 7종 항목에서 모두 ‘만족(Satisfactory)’을 받았다. 이는 는 지난 7일부터 양일간 인천 중구 네스트 호텔에서 개최된 국제 수준의 분석능력을 보유하고 있다는 의미다. ‘2024 수질TMS·생태독성·수질오염방제 합동 토론회’ 현장 테크로스환경서비스 관계자는 “수질분야 분석능력 평가에 에서 국내 수질TMS, 생태독성, 수질오염방제 분야 등 민·관 서 6년 연속 가시적인 성과를 냈다”라며 “앞으로도 최고 수준 이해관계자 약 350명이 참석한 가운데 한국환경공단 이사장 의 분석능력을 유지해 환경기초시설 운영관리 명문 기업으 으로부터 우수상을 받았다. 로 거듭날 것”이라고 말했다."}, {"p": 33, "t": "에코피스 스페이스프로 CES 2025 혁신상 국가품질혁신 경진대회 대통령상 에코피스가 자율주행 기술로 녹조를 제거하면서 수상 레저 스페이스프로(구 한국화이바)가 산업통상자원부와 국가기 를 동시에 즐길 수 있는 ‘힐링 보트(Healing Boat)’를 개발해 술표준원이 주최한 ‘제50회 국가 품질혁신 경진대회’에서 대 ‘CES 2025’ 혁신상 수상자로 선정됐다고 밝혔다. CES 혁신상 통령상을 수상했다. ‘국가 품질혁신 경진대회’는 안전품질, 사 은 미국소비자기술협회(CTA)가 매년 1월 미국 라스베이거스 무간접, 창의개선 등 18개 부문별 현장 품질개선 우수사례를 에서 열리는 CES 개최를 앞두고 엔지니어링, 기능, 디자인, 혁 발표하는 방식으로 경연을 펼치는 ‘산업계의 전국체전’이다. 신성이 우수한 제품에 수여하는 상이다. 지난 1975년부터 열려 올해로 50회를 맞이하는 이번 경진대 공신력이 높아 제품의 우수성을 입증하는 지표가 되고 기업 회는 지난 8월 26일부터 5일간 수원컨벤션센터에서 개최돼, 의 브랜드 인지도와 신뢰도에도 영향을 준다. 해외 바이어들 전국 17개 시·도에서 예선을 거쳐 선발된 298개팀 2,600여 의 관심은 물론 기업 홍보마케팅 효과도 크다. 명의 분임원들이 참가해 열띤 경연을 펼쳤다. 스페이스프로 힐링 보트(Healing Boat)는 3D 디지털 영상 콘텐츠와 결합해 ‘극강품질’ 분임조는 ‘품질검사 프로세스 개선으로 검사 시간 사용자가 자연과 교감하며 수질 보호에 기여하는 혁신 기술 단축’을 주제로 사무간접 부문에 출전해 전국대회 첫 도전에 로 평가받아 세계 최대 규모의 정보기술 및 전자 전시회에서 도 불구하고 ‘대통령상 금상’이란 영예를 안았다. 스마트시티 부분 혁신상을 수상하게 됐다. 에코피스는 힐링 보트를 2025년 1월 7일부터 10일까지 미국 라스베이거스에 서 열리는 ‘CES 2025’ 광주광역시 공동관에 전시할 예정이다. Vol. 93 2025 신년호"}, {"p": 34, "t": "모집안내문 확인하기 지면광고 모집안내 소식지 봄~가을호(94~96호) 지면광고를 아래와 같이 모집합니다! 관심 있는 구독자 여러분의 많은 신청 바랍니다. 모집기간 2. 28.(금)까지 모집규모 2개사 지면위치 내지2 광고금액 1,200,000원/회, 부가세 별도 * 회원사 할인 15% 적용 시 1,020,000원/회 광고절차 신청서 이메일 제출 접수 후 2주 내 세금계산서 발행 신청사별 광고 시안 제출 * 상세 모집안내문과 광고 신청서는 협회 홈페이지 공지사항에서 확인하실 수 있습니다. 광고 게재"}, {"p": 35, "t": "Watch on 지구별 수(水)다 전 세계 식수에서 발견되는 화합물 ‘PFAS’ 칭찬합시다 춘천시 물복지 증진 사례 물 리포트 맑은 물을 위한 국내외 산업 톺아보기 Vol. 93 2025 신년호"}]}, {"id": "93-36", "no": 93, "label": "2025 신년호", "corner": "지구별 수(水)다", "title": "전 세계 식수에서 발견되는 화합물 ‘PFAS’", "author": "", "start": 36, "end": 39, "pages": [{"p": 36, "t": "Watch on | 지구별 수(水)다 사람이 물을 마시지 않고 목숨을 유지할 수 있는 기간은 단 4일이다. 그만큼 식수는 매우 중요하다. 하지만 전 세계에서 PFAS(과불화화합물)에 오염되지 않은 식수를 찾기 어려운 실정에 이르렀다. PFAS는 광범위하게 퍼져있는데, 완전 제거가 어렵고 체내 들어오면 유해하다. 이런 특징 탓에 ‘영원한 화학물질’·‘좀비 화합물’이라는 무시무시한 별명까지 붙었을 정도다. 최근 여러 나라에서 이 성분을 규제하기 위한 다양한 노력을 하고 있다. 글 이슬비 헬스조선 기자 전 세계 식수에서 발견되는 화합물 ‘PFAS’ 나라별 규제책은? 곳곳에 활용된 PFAS의 정체는? PFAS는 1940년대 후반부터 ‘만능’ 소재로 주목받으며, 각종 산업에서 광범위하게 사용됐다. PFAS는 탄소와 불소가 강력하게 로 PFAS 수치를 측정한 후 골밀도를 추적·관찰했더니, PFAS 농도가 두 배 높을수록 골밀도가 감소하는 것으로 확인됐다. 내분 결합한 모든 유기 화합물을 지칭하는 것으로, 매우 안정하다. 내구성이 비계를 교란해 체내 호르몬의 정상 작용을 방해했기 때문이다. 미국 식품 좋고, 열에 강하고, 물과 기름을 모두 밀어내 방수는 물론 얼룩까지 예방 의약국(FDA)는 PFAS 노출이 갑상선 질환과 고혈압, 혈관 노화, 불임, 간· 한다. 엄청난 특성에 옷, 카펫, 식품 포장재, 프라이팬 코팅, 화장품, 의료 콩팥 손상, 비만, 미숙아 출산, 암 발병 위험을 높일 수 있다고 밝혔고, 미국 기기, 잉크, 자동차 부품, 냉매, 리튬 이온 배터리 등 안 쓰이는 곳을 찾기 환경보호청(EPA)에서는 매우 낮은 수준의 PFAS도 인체에 해로울 수 있다 어려울 정도로 다양한 분야에서 활용됐다. 고 발표했다. 이마저도 아직 덜 밝혀진 것이다. 현재 PFAS 중 과불화옥탄 알고 보니 PFAS의 모든 장점은 엄청난 단점이었다. 없앨 방법이 없었다. 술폰산(PFOS)과 퍼플루오로옥탄산(PFOA)에 대한 유해성만 주로 연구됐 내구성이 좋아 잘 분해되지 않고, 열에 강해 소각되지 않는다. 물과 기름 을 뿐, 다른 PFAS계 화합물의 유해성은 제대로 규명되지 않았다. 모든 용매에 녹지 않아, 성분을 분리해 내 제거하기도 어렵다. 이렇게 잔 류 된 PFAS는 대기, 토양 그리고 특히 ‘물’로 지구 곳곳에 퍼졌다. 실제 지 전 세계 식수에 있는 PFAS, 범위 지속 확장 중 난해 미국지질조사국(USGS)이 2016년부터 2021년까지 716개 지역의 PFAS는 특히 ‘물’을 통해 전 세계 인구의 체내로 퍼지고 있다. 식수에서 공공·민간 수도꼭지에서 물 샘플을 수집해 분석한 결과, 45%에서 기준 PFAS가 확인된 곳은 미국뿐만이 아니다. 지난 10월 영국 버밍엄대와 중 치를 넘는 PFAS가 검출됐다. 도시에선 오염률이 75%였다. 국 심천 남방과학기술대·하이커우 하이난대 공동 연구팀은 아시아·유 더 큰 문제는 PFAS가 체내에 들어왔을 때다. 잘 분해되지 않아 체내 축적 럽·북미·오세아니아 15개국에서 생산된 87개 브랜드의 생수를 분석했 되고, 각종 질환 위험을 높인다. 이미 2004년 미국 시민의 99.7% 혈액에 다. 그 결과, 모든 국가의 샘플 99%에서 PFAS가 검출됐다. 특히 천연수가 서 평균 4µg/L의 PFAS가 검출됐다. 현재 이보다 훨씬 많은 양이 축적됐을 정제수보다 PFAS 농도가 높았다. 영국과 중국의 수돗물도 분석했는데, 것으로 추정된다. PFAS의 축적은 생체 시스템을 교란한다. 미국 서던캘리 두 곳 모두에서 PFAS가 검출됐고 중국 수돗물에서 농도가 높았다. 지난 포니아대 의대 연구팀이 당뇨병 발병 위험이 큰 청소년 304명을 대상으 2021년 우리나라에서도 PFAS 실태 조사가 진행됐고, 미량이 검출됐다."}, {"p": 38, "t": "노르웨이에서는 작년 어린이 1,094명의 혈액 샘플에서 PFAS를 분석했는 데, 모든 아이에게서 PFAS가 발견됐고 그중 22%는 유럽식품안전청이 정 한 안전 한도보다 많았다. 더 큰 문제는 PFAS의 범위가 넓어지고 있다는 것이다. 분석 기술이 발전 하면서 새로운 종류의 PFAS가 지속해서 발견되고 있다. 2016년 스웨덴 화학물질청(KEMI)에서는 2,060여 종의 PFAS가 사용되고 있다고 봤는데, 새롭게 식별되는 PFAS가 많아지면서 2022년 미국 환경보호청(EPA)은 이미 확인된 것만 1만 2,000종 이상이라고 발표했다. PFAS의 검출 범위 를 더 확장해 실태 조사를 하면, 전 세계 곳곳에 더 많은 PFAS가 있을 것으 로 추정된다. 말 그대로 절대 사라지지 않는 ‘영원한 화학물질’인 것이다. 국가별 식수 PFAS 함량 규제책 현재 식수 속 PFAS는 미국, 유럽, 캐나다, 호주, 일본, 중국, 대만 정도 에서만 규정을 두고 관리하고 있다. 그중 가장 강도 높게 규제하고 있 는 곳은 미국이다. 지난 4월 EPA는 PFOA와 PFOS의 식수 내 함유 허 용량을 70ng/L에서 4ng/L로 대폭 줄였다. 현재 수질 검사를 할 때 판 독할 수 있는 가장 낮은 수준이다. 이 외에도 PFAS에 속하는 종류인 PFNA·PFHxS·HEPO-DA·PFBS 혼합물도 함유 허용량을 정해 관리하고 있다. 해산물에 함유된 PFAS양도 최근 조사에 착수했다. 오는 2025년 2 월 18일까지 해산물의 PFAS 함량 정보를 제출해야 한다. 워싱턴, 매사 추세츠, 미네소타 등 각 주에서도 자체 법안으로 PFAS를 관리하고 있는 과불화옥탄산(PFOA, Perflorooctanoic acid) F 현재 식수 속 PFAS는 미국, 유럽, 캐나다, F F F F F O F OH F 호주, 일본, 중국, 대만 정도에서만 규정을 F F F F F F F 두고 관리하고 있다. 그중 가장 강도 높게 규제하고 있는 곳은 미국이다. 과불화옥탄술폰산(PFOS, Perfluorooctanesulfonic acid) F F F F F F F F F F S F F F F F F F O O O"}, {"p": 39, "t": "데, 특히 미네소타주에서는 2032년부터 전면 PFAS 사용을 금지한다. 미 금까지 급수 인구 5,000명 이상에서만 적용했기 때문이다. 지난 6월 전 국 다음으로 PFAS 규제를 적극적으로 준비하고 있는 곳은 유럽이다. 유 국 단위 수돗물 PFAS 함량 현황 조사에 처음으로 착수했고, 향후 수질 목 럽연합(EU)은 2018년 식수 지침을 개정해 20가지 개별 PFAS에 대한 한 표를 재검토할 예정이다. 대만도 아시아 지역 중 강력하게 PFAS를 규제 도를 지정했다. 20종 각각은 식수에서 100ng/L를, 총합으로는 500ng/ 하는 국가의 하나다. 이미 PFAS 151종을 규제하고 있고, 지난 10월 357종 L를 넘으면 안 된다. 규제는 더 강해질 전망이다. EU 산하 유럽화학물질 을 독성화학물질로 추가했다. 식수에서는 PFOA 50ng/L, PFOS 50ng/L, 청(ECHA)에서 독일, 네덜란드, 덴마크, 스웨덴, 노르웨이가 지난해 제출 HFPO-DA 70ng/L을 초과하지 않도록 제한하고 있다. 한 PFAS 전면 금지안을 검토하고 있다. 일단 단계적 폐지를 위해 꼭 필요 한 분야 개념, 대안 등을 논의하고 있고, 2026년 이후에야 결정이 나올 것 PFAS의 노출을 줄이는 방법 으로 보인다. 이미 강한 규제를 하는 유럽 내 국가도 있다. 스웨덴은 식수 여러 나라에서 PFAS 분해 기술을 개발하고 있다. 하지만 아직 완벽히 분 에 함유된 총 11가지 PFAS 총 농도 권장값을 90ng/L로 제한하고 있고, 덴 해하는 방법은 나오지 않았다. 미국 리버사이드 캘리포니아대 연구팀은 마크는 4가지 PFAS(PFOA·PFOS·PFNA·PFHxS)가 총 2ng/L를 넘지 않도 지난 5월 자외선과 아황산염을 이용한 공정과 전기화학적 산화 반응으로 록 관리하고 있다. 특히 덴마크는 이미 식품 포장재, 소방용 폼에 PFAS를 PFAS를 분해하는 방법을 개발했다. 이는 고농도 PFAS 처리에 적합한 방 사용하지 못하도록 전면 금지했고, 지난 5월 의류, 신발, 방수제 등에서 법으로 자연계 저농도 PFAS를 완전히 제거하는 것엔 한계가 있는 것으로 도 PFAS를 사용하지 못하도록 정치적으로 합의했다. 내년 7월부터 적용 알려졌다. 또 앞서 소개한 영국과 중국 공동 연구팀도 지난 10월 물을 끓 된다. 캐나다에서는 식수에서 PFAS 25종이 총 30ng/L를, 호주는 PFOA 이거나 활성탄 여과 처리 등 간단한 방법으로 PFAS 농도를 줄일 수 있다 560ng/L, PFOS 70ng/L, HFPO-DA 70ng/L를 초과하지 않도록 규제하고 고 보고했다. 실제 PFAS 종류에 따라 간단한 정수 필터나 끓이는 것 만으 있다. 호주는 최근 규제 재검토에 들어갔고, 더 강해질 전망이다. 아시아 로도 50~90%가 제거됐다. 하지만, 마찬가지로 완전히 제거하는 것은 어 에서는 중국, 일본, 대만이 식수 속 PFAS를 제한하고 있다. 중국은 PFOA 렵고, PFAS 종류에 따라 효과가 매우 달라졌다. 미국 듀크대와 노스캐롤 80ng/L, PFOS 40ng/L 이하로일 때만 식수로 사용할 수 있도록 허용하고 라이나주립대 연구팀이 정밀한 역삼투 정수 시스템을 이용했을 때도 모 있고, 일본은 공공용수와 지하수의 PFOS, PFOA 총합산량이 50ng/L 이 든 PFAS 제거는 불가능했다. 때문에 수돗물은 끓여서 사용하고, 천연수 하가 되도록 잠정 기준을 뒀다. 잠정 기준인 이유는 검사 항목이지만 지 보단 정제수를 마시는 걸 권장한다. 전세계 식수 규제 캐나다 PFAS 25종 총 30ng/L 중국 PFOA 80ng/L, PFOS 40ng/L 일본 PFOS, PFOA 총합산량 50ng/L 유럽 PFAS 20종 100ng/L, 총합으로는 500ng/L 미국 PFOA 4ng/L, PFOS 4ng/L, PFNA 10ng/L, PFHxS 10ng/L, HFPO-DA 10ng/L 호주 PFOA 560ng/L, PFOS 70ng/L, HFPO-DA 70ng/L Vol. 93 2025 신년호"}]}, {"id": "93-40", "no": 93, "label": "2025 신년호", "corner": "칭찬합시다", "title": "춘천시 물복지 증진 사례", "author": "", "start": 40, "end": 41, "pages": [{"p": 40, "t": "Watch on | 칭찬합시다 상하수도사업본부 물복지 증진 사례 맑은 물이 흐르는 호반의 도시 안심하고 마시고 사용할 수 있는 깨끗한 물 제공을 위해 가장 중요한 것은 정부와 지자체의 꾸준한 관리다. 때문에 맑은 물 공급을 위한 우수사례는 행복한 삶의 마중물이라 할 수 있다. 수도시설 유지보수를 통해 물복지를 증진해 2024년 물관리 우수사례 및 우수기술 실용화 발표대회에서 최우수상을 수상한 춘천시 상하수도사업본부의 사례 역시 마찬가지다. 맑은 물 공급을 위해 춘천시는 어떠한 노력을 기울였는지 그 사례를 만나본다. 정리 편집실 | 자료 춘천시 상하수도사업본부"}, {"p": 41, "t": "안전하고 깨끗한 물 공급을 위해 춘천시는 용산정수장 현대화 사업과 안정적 물 공급을 위한 취수장 이전 등을 추진해 맑은 물 생산과 공급을 위해 힘쓰고 있다. 지방상수도 발전을 위해서 는 지자체의 노력이 절대적으로 중요한 만큼, 이러한 점을 인정 받아 2024년 물관리 우수사례 최우수상을 수상하게 됐다. 무엇보다 취·정수장과 상수관로 등 노후화된 상수도를 정비하며 수도시설 유지보수를 신속하게 실시해 주민 의 물복지 증진에 기여한 점이 돋보인다. 이를 위해 춘천시는 「수도법」 제5조 에 따라 일반수도를 적정하고 합리적으로 설치·관리하기 위한 수도정비의 종 합적인 계획을 수립했다고 밝혔다. 특히 춘천시는 산업단지와 아파트 등 대규모 개발 사업이 꾸준히 진행되고 있 는 만큼 사회적 유입인구와 관광인구 증가가 발생하는 지역이다. 이에 춘천시 상하수도사업본부는 장래용수 수요량이 급증한 점을 고려해 안정적인 원수 춘천시 수도 관리 사례 POINT 확보와 정수장, 배수지, 관로 등 수도시설 증설 계획을 수립해 시민에게 양질 의 수돗물을 안정적으로 공급하는 데 최선을 다하고 있다. 아울러, 설치된 지 40년이 경과된 시설물의 노후화에 따른 구조물의 안정성 저하와 불량 발생에 대비하기 위해 노후화된 상수도 공급시설 정비를 통해 깨 끗한 수돗물의 공급기반을 마련하고 용산정수장 현대화 사업을 추진해 시민 에게 안정적인 수돗물 공급을 위해 총력을 다하고 있다. 용산정수장 현대화를 위한 재건설 물복지로 시민의 삶을 행복하게 춘천시는 그동안 지속적으로 발생한 가뭄으로 인해 소양감댐 방류량의 감소 로 취수원의 불안정 문제를 겪고 있었다. 춘천시 상하수도사업본부는 이러한 문제를 해소하고, 안정적이고 깨끗한 원수를 연중 공급하기 위해 다양한 사업 노후화된 수계 송수관로 정비 을 추진 중에 있다. 그중 대표적인 것이 소양취수장 취수원 이전사업이다. 이 를 통해 깨끗한 원수를 확보하고 운영비를 절감하는 데 성공했다. 또한, 사북면과 동산면, 남면, 남산면 등 농촌 상수도 미보급 지역에 안정적인 지방상수도를 공급하기 위해 농어촌 생활용수 개발사업을 실시하고 있다. 이 를 통해 농촌 상수도 미보급 지역에 상수관을 확충함으로써 지방상수도 소외 맑은 물 공급을 위한 소양취수장 이전 지역 주민에게 깨끗하고 안전한 수돗물을 안정적으로 공급해 물복지를 실현 하는 데 기여하고 있는 것이다. 아울러, 춘천시는 상수관로 파열 및 누수 발생에 따른 단수 등 수도시설 유지 관련 문제로 인한 주민 불편 민원을 신속히 해소해 상수도 행정에 대한 신뢰 도를 제고하는 데 크게 이바지했다. Vol. 93 2025 신년호"}]}, {"id": "93-42", "no": 93, "label": "2025 신년호", "corner": "물 리포트", "title": "맑은 물을 위한 국내외 산업 톺아보기", "author": "", "start": 42, "end": 45, "pages": [{"p": 42, "t": "Watch on | 물 리포트 맑은 물을 위한 국내외 산업 톺아보기 출처 워터저널 경제협력개발기구와 미세플라스틱 국제 공동연구 추진 환경부는 경제협력개발기구(이하 OECD)와 협력하여 미세플라 스틱 분야 국제 공동연구 사업을 우리나라가 주도하여 추진할 예 정이다. 이번 공동연구는 경제협력개발기구의 환경·보건·안전 (EHS) 사업으로 채택되어 진행하는 미세플라스틱 분야 공동연구 의 첫 사례다. 환경부는 최근 국제사회에서 미세플라스틱 오염에 대한 우려와 관심이 높아지는 가운데 과학적 근거에 기반한 미세플라스틱 관 국내 동향 련 정책 수립의 토대를 마련하기 위해 제6차 경제협력개발기구 화학생명공학위원회에 이번 공동연구를 선제적으로 제안했다. OECD 대한민국대표부도 이를 전폭적으로 지원하기 위해 3만 유 로의 기여금을 경제협력개발기구에 제공할 예정이다. 국민 안전을 지키는 물관리 패러다임 전환 이번 국제 공동연구는 미세플라스틱의 표준물질 개발, 물리화 환경부는 일상화된 기후재난으로부터 국민 안전을 보호하기 위 학적 특성 평가 및 독성 시험 평가 등의 내용으로 2025년부터 한 치수·이수 대책을 수립해 본격 추진하고 있다. 먼저 미래 물 수 2029년까지 진행되며, 경제협력개발기구 회원국 전문가들의 활 요에 대응한 안정적 물그릇 확대할 계획이다. 4대강 보(洑)를 탄 발한 정보공유 및 공동연구가 이루어질 예정이다. 우리나라는 주 력적으로 운영하고 섬과 내륙 지역에 지하수 저류댐의 설치를 확 도국으로서 미세플라스틱의 환경 및 인체 영향에 대한 과학적 이 대했다. 아울러 대산·여수 산업단지에 해수담수화 기반을 구축 해도를 높이고, 국제 표준화된 평가 방법을 개발하는 등 이번 공 하고, 하수재이용수를 공급하는 등 다양한 대체 수자원을 개발하 동연구의 국제적인 협력 체계에서 선도적 역할을 할 것으로 전망 고 있다. 이 외에도 미래의 물수요와 극한 홍수에 대비해 연간 2억 된다. 5,000만㎥(220만 명 사용 가능)의 물 공급과 홍수 조절을 위한 기후대응댐 건설을 본격 추진 중이다. 지류·지천 홍수 대응능력 강화를 위한 국가 관리 책임도 강화한 다. 이를 위해 지방하천 20곳을 국가하천으로 승격시켰고 국가하 천 수위 상승 시 영향을 받는 국가-지방하천 합류부(411곳)도 국 가가 책임지고 정비토록 했다. 더불어 스마트 홍수 예보를 도입해 인명 피해 예방 위한 골든타임 확보에도 힘쓰고 있다. 보다 빠르 고 촘촘한 홍수 정보를 제공하기 위해 홍수특보지점을 확대(75곳 →223곳)하고 2024년 5월부터 AI 홍수예보를 본격 도입했다. 또 한, 홍수특보 발령 시 침수우려지역 안내 문자를 제공하고, 차량 운전자에게는 내비게이션을 통해 홍수 위험 정보를 제공하며 하 천 안전에 대한 관리를 강화하고 있다. #기후재난 대비 #홍수 인명 피해 예방 #미세플라스틱 #공동연구 첫 사례"}, {"p": 43, "t": "국외 동향 미국, 콜로라도 볼더 대학교 우주 물정화 수처리 기술 개발 콜로라도 볼더 대학교 토목환경건축공학과 스타우브 교수 연구 실은 막을 사용한 수처리 기술 개발에 집중하고 있다. 현재 개발 중인 나노기술 막 공정은 산업과 인류를 위한 물정화 기술에서 큰 진전을 이룰 수 있는 중요한 기술이다. 때문에 미국 항공 우주국 (이하 NASA)은 콜로라도 볼더 대학교 연구실에 미래의 달 기지에 서 사용할 수 있는 시범 물정화 시스템을 개발하기 위한 ‘1단계 중 소기업 혁신 연구상’을 수여하고 지원금을 후원했다. 수산물을 물로만 세척할 경우 폐수배출시설에서 제외 스타우브 교수의 연구실에서 개발한 기술은 물을 가압하는 펌프 환경부는 「물환경보전법」 시행규칙을 일부 개정했다. 이번 개정 만 있으며, 크기와 무게를 줄일 수 있어 현재 부피가 크고 수리가 을 통해 모든 수산물은 채취 상태 그대로 또는 삶은 제품을 구입 잦은 우주 물정화 시스템의 문제점을 보완할 수 있을 것으로 기대 해 단순 물 세척만 하는 시설의 경우 폐수배출시설에서 제외 시켰 된다. 우주는 하나의 응용 분야에 불과하다. 다른 가능성은 도시 다. 이번 개정안 덕분에 수질오염방지시설을 설치하지 않아도 되 상수도 시스템과 산업, 특히 초순수가 필요한 반도체나 컴퓨터 칩 는 등 어민의 부담을 줄였다. 또한 기존 폐기물처리업체 내 정수 제조 분야에 있다. 초순수는 미네랄, 입자, 박테리아, 미생물 및 용 시설에서 발생한 폐수를 별도의 수질오염방지시설을 통해 처리 해된 가스가 없는 물을 의미하는데, 이는 사람이 음용하기에도 안 해야 했으나, 이후부터는 자체 폐기물처리시설로 유입·처리할 수 전한 수준을 훨씬 넘어선다. 스트라우브 교수는 “우리의 작업은 있도록 업체의 부담을 완화했다. 더불어 폐수를 폐수처리업체나 NASA에서 시작됐지만, 반도체용 초순수 시장을 목표로 두고 있 지정폐기물업체에 모두 위탁처리할 경우 폐수의 위·수탁 전산시 다”며 “이 시장은 엄청난 잠재력을 가졌으며, 이제는 상용화하기 스템에서 실적을 확인할 수 있으면 보고 절차를 면제하도록 개선 위해 노력하고 있다”고 말했다. 했다. 이 외에도 ‘해당 사업장’의 폐수를 모두 공공하·폐수처리시설로 유입·처리하는 ‘폐수배출시설’은 생태독성 배출허용기준을 준수 하지 않아도 되지만, 다수의 폐수배출시설을 보유한 단일 사업장 의 경우 다소 혼선이 생길 수 있어 이를 폐수배출시설 단위로 명 확히 했다. 또한 방류수 배출허용기준을 초과하여 사업장이 조업 정지 처분을 받을 경우, 이를 개선명령으로 완화하여 적용받을 수 있는 ‘측정기기부착사업장’을 ‘측정기기부착사업장 중 수질자동 측정기기를 부착한 사업장’으로 명확히 했다. #물환경보전법 개정 #어민의 부담 완화 Vol. 93 2025 신년호"}, {"p": 44, "t": "모로코, OCP 그룹 새로운 담수화 시설 건설 유럽재건개발은행(이하 EBRD)은 모로코의 새로운 담수화 시설 개발을 통해 물안보를 강화하기 위해 모로코 국영 비료회사인 OCP 그룹에 2억 유로(약 2,936억 원)의 대출을 제공하고 있다고 밝혔다. EBRD 대출은 엘자디다의 조르프 라스파와 사피에 위치 한 주요 산업단지에 OCP 그룹이 추진하는 2곳의 해수담수화 시 설 건설에 필요한 자금을 지원하는 것이다. 약 3,500만㎡ 규모의 이 새로운 해수담수화 시설은 글로벌 식량 안보에 필수적인 비료 생산을 가능하게 해 지속 가능한 농업에 필요한 수요를 충족시킬 전망이다. 모로코는 연간 물 공급량이 1인당 790㎥에 불과할 정도로 심각한 물 부족을 겪고 있으며(1인당 1,000㎥ 미만은 만성 물 부족 상황), 엘자디다와 사피시는 물 수요가 가용 담수 공급량의 80%를 초과 호주, 식수보호 위해 상수원보호구역 드론 활용 하는 물 부족이 매우 심각한 지역에 위치해 있다. 새로운 담수화 호주 빅토리아주 주민들에게 식수를 공급하는 멜버른워터는 최 시설이 건설되면 물 집약적인 산업 공정에서 담수 사용을 더욱 줄 첨단 이니셔티브를 통해 멜버른의 세계 최고 수준의 식수를 모니 일 수 있게 되며 증가하는 가뭄을 해소하는데 특히 중요하다. 또 터링하고 보호하기 위해 자율주행 드론을 시험 운영하고 있다. 멜 한 산업용 담수를 제공하고 지역에 식수 공급을 위한 천연 담수자 버른워터는 멜버른시에 약 65%의 식수를 공급하는 멜버른에서 원을 보존함으로써 모로코의 물안보 강화에 기여할 수 있을 것으 가장 큰 상수원 보호구역 중 하나인 실반저수지에 스마트 드론을 로 기대된다. 배치하여 2개월간의 시험 운영을 했다. 드론은 상수원보호 대상 구역 내의 물과 주변 숲에서 무단 활동과 인간과 동물의 잠재적 위험을 모니터링한다. 드론 활동은 상수원 보호 구역 내의 물과 토지로 제한했다. 멜버른워터의 램 람잔 수석 자산 매니저는 “멜버른은 주로 대중 의 접근성이 전혀 없거나 매우 제한적인 유역에서 식수를 취수 및 공급받는 전 세계서 몇 안 되는 도시 중 하나이다. 이를 통해 최소 한의 처리가 필요한 매우 깨끗한 물을 제공할 수 있다”라고 말했 다. 상수원 보호 구역은 멜버른 상수도의 주요 공급원이며, 비음 용 목적으로 사용되는 생활 및 산업용수 등은 담수화수와 재활용 수를 포함한 다른 공급원으로 보충된다. 멜버른의 식수 취수구 주 변 보안 조치는 수질오염 위험을 줄이고, 수처리의 필요성을 최소 화하며, 공중보건을 보호하고, 더 나은 맛의 식수를 보장한다."}, {"p": 45, "t": "Avenue 물 건축이 되다 물 위에 띄운 공간과 감각 플로팅 건축 제철 식탐 새빨간 딸기의 매력 열길 물 속 깨끗한 물을 위한 왕가의 수도 오늘부터 1일 올바른 분리배출을 위한 ‘비·헹·분·섞’ 맑은 물 낱말 사전 좋아요 KWWA Vol. 93 2025 신년호"}]}, {"id": "93-46", "no": 93, "label": "2025 신년호", "corner": "물, 건축이 되다", "title": "물 위에 띄운 공간과 감각, 플로팅 건축", "author": "", "start": 46, "end": 49, "pages": [{"p": 47, "t": "물 위에 띄운 공간과 감각 땅은 좁다. 도심은 포화되었고 환경은 열악해졌다. 이제 인간은 그 생명의 근원이자 문명의 기원인 물 위를 바라본다. 육지를 딛고 살아온 인간에게 물은 극복의 대상이자 넘을 수 없는 자연 그 자체이지만, 오늘날 인간은 잡히지 않고 밟히지 않는 물 위에서 정주하려는 새로운 도전을 진행 중이다. 대지를 대신에 물 위에 공간을 구축하는 플로팅 건축(Floating Architecture)의 시도, 플로팅 건축 극복의 대상이던 유동적인 수공간이 하나의 장소가 되기까지, 물 위에 띄워진 공간과 그곳에서의 감각들을 상상하는 건축가들의 고군분투 속으로 들어가 보자. 글 현창용 중앙대학교 건축학부 교수 | 사진 아키데일리 물의 표면, 삶의 경계가 되다 워터 빌라 Water villa 물과 투쟁의 역사를 논할 때 결코 빠뜨릴 수 집’이다. 워터 빌라는 암스텔 강 하류에 설계 대지를 굴착하지도 않아도 돼 주변의 인접 대 없는 곳, 바로 네덜란드다. 네덜란드의 일부 된 물과의 관계를 극대화한, 오히려 물의 성질 지에 피해를 주지도 않으며, 물의 흐름에 순응 토지의 지표가 수표보다 낮다는 사실은 널리 을 이용하고 순응한 거주공간이다. 물 위에 띄 하고 조수의 차에 적응해 가는 워터 빌라, 심 알려져 있다. 이런 역사를 가진 나라라면 물 우는 부교의 성질을 활용해 수면 위에 넓게 띄 지어 환경에 흉터를 남기지 않고 다른 곳으로 위를 땅 위만큼 잘 사용하려는 다양한 시도들 우는 널찍한 면(面)의 공간을 형성하고, 이를 옮겨갈 수도 있는 플로팅 건축, 플로팅 하우징 이 있었을 법하다. 범지구적 이상기후와 온난 경계로 수면 위 공간과 수면 아래 공간에 각각 의 좋은 사례다. 이젠 ‘별난 건축’으로 하나의 화 문제, 이로 인한 해수면 상승의 문제를 마 생활공간을 띄우고 가라앉힌다. 수면 위 공간 눈요깃거리가 되고 마는 것이 아닌, 환경이 주 주함에 있어, 먼 옛날부터 제방을 쌓아 바닷물 에는 수면의 멋진 전망과 윤슬을 즐길 수 있는 는 경고와 기후의 위기에 맞서는 인간이 겸손 을 막고 땅을 만들어 개척해 왔던 네덜란드의 거실, 주방 등 공용공간과 함께 플로팅 테라스 하게 제안할 수 있는 약한 건축의 보편적인 유 태도가 어떠할지 궁금한 이유다. 를 즐길 수 있는 열린 공간을 계획했다. 앞면 형으로 자리 잡을지도 모를 일이다. 더 많은 강수량, 해수면의 상승에 대응하는 네 은 통유리창으로 계획해 집 안에서 암스텔강 덜란드의 해법은 오히려 그에 순응하는 것이 을 손에 잡힐 듯 바라볼 수 있다. 나아가 암스 다. 둑을 만들고 제방을 쌓아 높아지는 바다와 텔강의 유람선 탑승객에게는 워터 빌라 삶의 유입되는 강물을 막는 것이 아니라, 오히려 물 편린을 잠시 엿볼 수 있는 재미를 준다. 수면 을 이용하는 것인데, 물보다 가볍지만 단단한 하부공간에는 침실, 욕실과 같은 내밀하고 사 플랫폼을 구축하고 속이 비어 있는 공간을 그 적이며 간헐적으로 사용되는 공간들을 배치 위 혹은 밑에 병치해 유동적인 수면의 변화에 하는데, 채광과 환기가 아쉬울 수 있지만 물속 대응하는 공간으 만드는 것이다. 이러한 시도 의 고요한 환경과 일정한 온도가 유지되는 요 를 보여주는 좋은 사례가 +31아키텍처의 워 소들이 장점으로 다가온다. 또한 사적 감각을 터 빌라(Water villa), 그 별칭 그대로 ‘물 위의 극대화할 수 있다는 이점도 있다. 01 \u0007부교의 성질을 활용해 수면 위에 넓게 띄운 워터 빌라 02 \u0007수면 위 마련된 전망을 즐길 수 있는 거실과 주방 등의 공용공간 03 \u0007암스텔강의 아름다움을 24시간 관람할 수 있는 거실 유리창 04 \u0007사적 감각을 극대화한 수면 아래 공간 Vol. 93 2025 신년호"}, {"p": 48, "t": "떠다니는 스포츠 기지 플로팅 카약 클럽 Floating Kayak Club 건축이 물 위에 떠 있기 전에도, 우리는 수공 간이 주는 혜택을 누리기 위해 다양한 장치들 을 사용해 왔다. 체온을 유지한 채 안락하게 수면을 누비기 위해 배 위의 공간을 활용했고, 그 규모에 따라 임시적 부유 공간, 혹은 수개 월을 생활할 수 있는 반-정주공간이 되어주기 도 했다. 하지만 배의 태생이 그러하듯, 출항 하고 귀항하는 운명을 타고났기에 결국 그 정 박을 책임지는 베이스캠프가 필요하다. 덴마 크 어느 해변에는 그 베이스캠프마저도 배와 함께 옮겨 다니며 정박의 변주를 보여주는 플 로팅 기지가 있다. 포스 포 아키텍처의 플로팅 Floating Kayak Club 플로팅 카약 클럽 카약 클럽이 그 주인공이다. 클럽은 해안에서 부교를 따라 임시 부두가 뻗 는 그 끝에 정박한다. 정박한 건축안에 다시 작은 배, 즉 카약들을 정박하는 공간이 마련돼 있는데, 반-고정적, 반-유동적 플로팅 건축의 형태를 띤다. 물위에 뜬 건축물, 그 안에 다시 물 위를 자유롭게 오갈 수 있는 카약이라는 켜 (Layer)가 주는 위계의 중첩은 우리가 땅과 물 을 오가며 그 심도에 따라 느끼는 다양한 감정 을 건축으로 옮겨놓은 듯하다. 플로팅 건축의 출발은 분명 인간이 자연을 이용하는 방식의 고도화된 결과이다."}, {"p": 49, "t": "05, 06 \u0007정박한 건축안에 카약들을 정박하는 이중 공간을 마련해 반-유동적 건축 형태를 띠는 플로팅 카약 클럽 크게 두 개의 볼륨으로, 카약 보관과 관리를 위 히 한다. 카약 탑승자를 위한 최적의 높이, 수 한 공간과 휴식과 식음을 위한 공간으로 나뉜 면 30cm 위의 첫 번째 데크와 걸터앉아 맞이 다. 마치 소중히 감싸 쥔 두 손 모양의 형태고 할 수 있는 스탠드의 조금 더 높은 두 번째 데 07 \u0007스탠드 하부에는 신발이 젖지 않도록 수납장 제작 안뜰을 조성하고 정온한 중정을 만들었는데, 크가 이어진다. 철골 파이프로 바탕을 짜고 그 이 중앙 수상공간으로 카약이 들어오고, 반대 위에 선형의 목재 패널을 이어 붙여 면을 만들 편 카약 정비공간으로 인도된다. 이를 통해 자 어 내는 꽤 구축적인 건축법을 구현하고 있는 연스러운 수상 커뮤니티 공간이 완성되는 것 데, 이러한 장점을 십분 활용해 스탠드 하부에 이다. 훈련과 놀이, 휴식과 교류를 위한 사용 는 신발을 젖지 않게 보관할 수 있는 수납장까 자 공간은 다양한 활동이 가능하다. 야외 바비 지 만들어 놓는 꼼꼼함을 보였다. 큐 파티가 가능한 주방과 선 데크에서는 수상 플로팅 건축의 출발은 분명 인간이 자연을 이 에서 즐길 수 있는 모든 여가 행위를 수행할 수 용하는 방식의 고도화된 결과이다. 모든 것이 있다. 루프 데크로 꺾여 올라가는 스탠드 계단 가라앉고 마는 물 위에 건축을 띄워 냄으로써 을 올라서면 수면보다 한층 더 높은 공간에서 자연의 섭리마저 극복하는 ‘인간성의 극치’를 누리는 경험이 색다른 감정을 전달한다. 상징한다. 무엇보다도 기후 위기가 주는 불안 사용자 공간과 카약 관리 공간이 나뉘어져 있 정으로 인류는 그동안 굳게 의지해 온 ‘땅’에 다고 해도 이 루프 데크의 오르내림은 하나의 대한 고민에 빠졌다. 땅을 대신할 다른 기반을 공간으로 연결되어 있는 느낌을 선사한다. 그 찾는 일은 더 이상 공상 과학 영화의 주제가 연결성은 목재 패널이라는 재료가 더욱 극대 아니다. 곧 물 위의 공간, 플로팅 건축은 생존 화시킨다. 벽과 바닥, 천장, 계단 등 건축물 전 을 위한 불가피한 선택지 중 하나로 받아들여 반에 사용된 목재가 하나라는 연결성을 공고 야 할 때가 올지 모르기 때문이다. 08, 09 \u0007카약 보관과 관리를 위한 공간과 휴식과 식음을 위한 공간으로 나뉜 두 개의 볼륨 10 \u0007카약 탑승자를 위한 최적의 높이로 구축한 첫 번째 데크 Vol. 93 2025 신년호"}]}, {"id": "93-50", "no": 93, "label": "2025 신년호", "corner": "제철 식탐", "title": "새빨간 딸기의 매력", "author": "", "start": 50, "end": 53, "pages": [{"p": 51, "t": "추운 겨울부터 만물 태동하는 봄까지 제철인 딸기가 식탁을 풍성하게 하고 있다. 빨간빛으로 눈을, 상큼한 향으로 코를, 달콤한 맛으로 입을 즐겁게 하는 딸기가 무르익는 계절. 새콤달콤한 딸기의 매력을 다양하게 즐겨본다. 글·사진 이주현 푸드 칼럼니스트 탐스럽고 달콤한 손님 새빨간 딸기의 매력 비타민 C를 듬뿍 함유한 달콤한 영양제 딸기는 겨울에서 늦은 봄까지 수확하기 때문에 오랜 시간 제철로 맛볼 수 다만 과일의 특성상 습도에 약하기 때문에 보관할 때 주의가 필요하다. 있는 과일이다. 작은 한 알에 영양소도 풍부해 건조하고 추워 면역력이 밀봉해서 보관하면 쉽게 물러지거나 곰팡이가 생길 수 있기 때문에 구매 떨어지기 쉬운 겨울 먹으면 좋은 과일이다. 특히 비타민 C의 함유량이 매 한 그대로 종이상자에 담은 채로 두는 것을 추천한다. 바로 먹을 딸기는 우 높다. 100g당 81ml의 비타민 C를 함유하고 있어 8개만 먹어도 하루 비 꼭지를 떼지 않은 상태로 랩을 씌워 냉장고에 보관하고, 싱싱한 상태로 오 타민 C 권장량을 섭취할 수 있다. 또한 엘라그산 성분이 자외선으로부터 래 보관하기 어려운 과일이므로 1주일 안에 먹는 것을 추천한다. 피부를 보호하고 항산화 작용을 일으켜 염증을 낮추는 역할을 한다. 또한 딸기 자체로 먹어도 맛있지만 유제품을 곁들여 먹으면 맛과 영양이 더 풍 딸기의 탐스러운 붉은색을 결정짓는 안토시안 성분은 혈중 콜레스테롤 부해진다. 우유와 요거트, 치즈 등 어떤 유제품이든 좋다. 딸기에는 없는 을 낮추고 혈관의 건강을 돕는다. 칼슘을 보충해 골다공증까지 예방할 수 있다. 집에서 손쉽게 먹는 방법으 다만 딸기의 비타민C는 물에 녹는 성질을 갖고 있으므로, 깨끗하게 세척 로는 우유와 함께 믹서기에 갈아 딸기 우유로 즐기는 것이 대표적이다. 또 하기 위해 딸기를 장시간 물에 담그는 경우 손실될 수 있다. 때문에 물과 한 요거트에 견과류 등의 토핑을 넣어 간편한 아침으로 즐길 수도 있다. 의 접촉 시간은 30초를 넘기지 않도록 주의한다. 또한 딸기는 껍질이 얇 고 과육이 부드러워 상하기 쉬우므로 흐르는 물에 가볍게 씻는 것을 추천 사랑스러운 색감, 달콤한 맛! 한다. 세척할 때에는 소금이나 식초를 사용해 재빠르게 헹구도록 한다. 딸기 롤 & 딸기 바나나 우유 쉽게 구할 수 있는 재료로 만드는 맛있는 딸기 디저트를 소개한다. 식빵 신선하고 맛있는 딸기 고르는 법 으로 돌돌 마는 딸기 롤이다. 불을 쓰지 않고 만들 수 있어 아이들과 함께 딸기를 구매할 때는 꼭지가 마르지 않고 진한 푸른색을 띠는 것을 고르는 만들기도 좋은 음식이다. 딸기는 세척 후 물기를 꼼꼼하게 제거해야 질척 것이 좋다. 과육의 표면은 울퉁불퉁하지 않으면서 매끄럽고, 꼭지 부분까 이지 않게 만들 수 있다. 이때 딸기 바나나 우유를 함께 곁들이면 영양과 지 붉은빛이 도는 것을 고르면 달콤한 딸기의 맛을 충분히 즐길 수 있다. 포만감까지 잡을 수 있는 든든한 간식 세트가 완성된다. Vol. 93 2025 신년호"}, {"p": 52, "t": "recipe 과정1 과정2 과정3 과정4 과정5 과정6 준비 재료 식빵, 딸기, 바나나, 크림치즈, 우유, 견과류 만드는 법 ① 식빵을 밀대로 민 후 가장자리를 제거하고 크림치즈를 발라 딸기와 바나나를 얹어준다. *Chef’s tip : 취향에 따라 크림치즈에 연유, 시나몬 가루, 꿀 등을 추가해도 좋다. ② 식빵을 말아 랩으로 싼 후 10분간 냉장 보관한다. ③ 단면이 잘 보이도록 썰어 접시에 담는다. ④ 단면이 잘 보이도록 썰어 완성한다. ⑤ 딸기, 바나나, 우유, 견과류(취향껏)를 준비한다. ⑥ 믹서기에 갈아 완성한다. *‌\u0007저자 이주현은 요리 연구가이자 푸드 칼럼니스트로 다양한 매체에 음식과 관련한 칼럼을 연재 중이다. 초보자도 따라 하기 쉬운 레시피 안내와 일상생활과 밀접한 요리 칼럼을 주로 연재 중이다."}]}, {"id": "93-54", "no": 93, "label": "2025 신년호", "corner": "열길 물 속", "title": "깨끗한 물을 위한 왕가의 수도", "author": "", "start": 54, "end": 55, "pages": [{"p": 54, "t": "Avenue | 열길 물 속 깨끗한 물을 위한 왕가의 수도관 인류는 수많은 선택의 결과로 지금의 문명을 융성했고, 언제나 문제에 봉착할 때마다 늘 역사에서 답을 찾았다. 수천, 수백 년 전의 이야기가 오늘날 우리에게 쓸모가 있는 이유다. 2025년 <맑은 물 세상>에서는 수도 시설에 얽힌 다양한 역사 이야기를 소개하며 맑은 물에 대한 의의를 짚어보고자 한다. 그 첫 번째 주인공은 우리나라 최초 계획도시로 알려진 사비도성의 수도관이다. 궁궐에 놓인 수도관은 어떤 형태이며 그 의의는 무엇인지 함께 들여다본다. 글 심상육 국립부여문화유산연구소 책임연구원 | 사진 국가유산청, 국립부여문화연구소"}, {"p": 55, "t": "01 \u0007부여 관북리 유적에서 확인된 백제 궁궐터 도수관로와 우물 02 \u0007도수관로 세부 시설 03 \u0007남북소로 배수로 04 \u0007현재의 인공위성사진에서 예측하는 사비도성 전경 05 \u0007수도 조경 시설로 짐작되는 연지 시설 당시 첨단 기술이 적용된 계획도시 백제의 마지막 도읍지인 사비도성은 현재의 부여 이 넓은 공간으로 이루어진 전면 7칸, 측면 4칸의 중층건물터가 남아있다. 군에 위치해 있다. 당시 최첨단 기술을 이용해 계 넓은 마당을 갖추고 있으며, 작은 건물터가 여러 채 모여 있는 곳과, 토기 그 획적으로 만들어진 사비도성은 그 둘레로 흐르는 릇이 다수 확인된 곳 등 용도가 다른 공간이 존재하는 것으로 확인됐다. 또 금강을 자연 해자(垓字)*로 사용했다. 궁궐은 도읍 한 모든 건물에는 기와를 올렸는데 특히, 주요 전각(殿閣) 건물터에서는 연 의 북쪽 중앙부에 위치해 있었는데, 이는 당시 최 화문의 와당과 흙을 구워 만든 전돌을 사용했다. 그리고 이곳의 건물터는 고 권력자가 북쪽에서 남쪽 백성을 바라볼 수 있 도성 내부의 다른 공간에 사용된 것보다 높은 기술로 장식해, 그 당시 최첨 도록 설계한 것이다. 또한 도성 내부에는 철저히 단 기술이 적용됐음을 알 수 있다. 살아있는 사람들의 공간으로 구성해 무덤조차 들 어설 수 없도록 했다. 이는 도성안에 왕릉을 구축 기와로 만든 백제의 수도관 했던 고구려, 신라와 대조되기에 그 특별함을 인 사비도성 내부에는 공공 시설물인 우물이 다수 확인됐다. 이 우물은 지하 정 받아 나성(羅城)** 밖 능원(부여 왕릉원)과 둘 수가 흐르는 곳까지 땅을 파서 그곳으로부터 돌이나 나무 등으로 우물 벽 레인 외곽시설(부여 나성), 도읍 중앙부의 국가 종 을 만들어 용수를 모았던 시설이다. 더불어 궁궐터에서는 우물보다 첨단 기 교시설인 정림사지, 왕성과 궁궐터인 부소산성과 술을 적용한 상수도시설이 확인됐는데, 돌로 만든 위의 우물과 나무로 만든 관북리 유적이 유네스코 세계유산으로 2015년에 아래 우물을 관으로 연결해 물을 정화시켜 용수로 사용한 흔적이 발견된 것 등재됐다. 이다. 이와 더불어 땅을 파 만든 우물이 아닌, 수원지에서 물을 지하로 흘려 백제의 마지막 궁궐터는 부여 관북리 유적으로 부 보내 여러 곳에 물을 공급하는 방식의 흔적도 남아있다. 때문에 물을 지하 소산의 남사면 끝자락에 위치해 있다. 이곳은 동- 로 이동하기 위한 도수관로도 확인됐는데, 흙으로 만든 원통형 관로를 여러 서와 남-북의 도로로 공간이 구분돼 있고, 공간 내 개 연결하거나, 수키와***를 두 개 겹쳐 관을 만들거나, 암키와**** 위에 수 부는 경복궁 근정전 건물과 같이 건물 내부 중앙 키와를 올려 물이 흘러갈 수 있는 공간을 만들었는데, 이러한 시설은 오늘 날 빌라 등의 옥상에 물통을 올려놓고 그 물을 아래로 PVC 관로 등으로 보 내는 것과 유사한 방식이다. 2005년부터 2006년 발굴 조사로 기와 도수관 로로 연결된 우물 3개소와 도수관로는 연장 약 100m가 확인됐다. * 성(城)을 방어하기 위해 그 주변을 따라 깊고 넓게 파 놓은 구덩이 ** 성의 외곽 *** 속이 빈 원기둥을 세로로 반 쪼갠 모양의 기와 **** 지붕의 고랑이 되도록 젖혀 놓는 기와 이처럼 무동력 장치로 깨끗한 물을 도수관로를 통해 흘려보내 현대의 상수 도시설과 같은 우물을 사용한 백제, 이는 궁궐 밖 귀족과 민가에서 사용한 우 물과는 비교할 수 없을 정도로 첨단의 기술이었다는 점에서 의의가 깊다. Vol. 93 2025 신년호"}]}, {"id": "93-56", "no": 93, "label": "2025 신년호", "corner": "오늘부터 1일", "title": "올바른 분리배출을 위한 ‘비·헹·분·석’", "author": "", "start": 56, "end": 57, "pages": [{"p": 56, "t": "AVENUE | 오늘부터 1일 올바른 분리배출을 위한 네 글자 비 헹 분 섞 지속 가능한 환경을 위해 미니멀 라이프를 실천하는 사람들이 늘어나고 있다. 일회용품 배출량 감소를 위해서다. 물론 안 쓰는 것이 가장 좋겠지만, 현대 사회에서는 쉽지 않은 것이 사실. 그렇다면 ‘잘 버리기’라도 실천해 보자. 일회용품의 올바른 분리배출, 지구와 인간을 위한 의미 있는 첫걸음이 될 것이다. 정리 편집실"}, {"p": 57, "t": "분리배출 쉽게 따라 하기 무색과 유색 페트병, 분리해서 배출하세요 2022년 12월부터 투명한 페트병의 별도 분리배출제를 본격적으로 시행하고 있다. 투명 페트병의 별 도 분리배출만 제대로 지켜져도 약 10만 톤 정도의 국내 재활용 원료를 확보할 수 있다고 하니 꼭 따 ① 비운다 일회용품에 담긴 내용물은 깨끗이 비우기 로 분리해 배출하도록 하자. 페트병의 분리배출 방법은 무색과 유색 동일하다. 안의 내용물은 버리고 내부를 깨끗하게 세척한후, 겉면에 붙은 비닐 라벨을 제거하고, 최대한 압축해 배출하도록 한다. 마 ② 헹군다 음식물을 담은 일회용품은 물로 헹구기 요네즈와 케첩, 기름통같이 세척이 어려운 용기는 종량제봉투에 배출한다. 단, 제대로 씻고 말렸다면 재활용이 가능하다. ③ 분리한다 라벨 등 다른 재질의 부착물 분리하기 ④ 섞지 않는다 같은 재질의 일회용품별로 모아 배출하기 헷갈리는 폐지류, 이렇게 구분하세요 폐지류는 특히 분리배출에 있어 헷갈리기 쉽다. 골판지 상자나 신문지, 책자 등은 종이 외 재질을 제 거 후 차곡차곡 쌓아 배출한다. 특히 골판지 상자를 배출할 때에는 테이프와 택배 전표 등을 반드시 제거하며, 책자류의 경우 비닐코팅이 된 표지를 뜯어낸 후 배출한다. 달력, 노트의 경우 스프링 등의 고철을 제거하고, 약물 처리된 감열지는 사용하는 영수증과 기름이 묻어있는 치킨·피자 상자, 깨끗 하게 헹궈지지 않는 컵라면 용기도 재활용 대상이 아니다. 혼합 종이로 제조된 종이 빨대도 분리배출 대상이 아니니 주의하자. 금속 캔과 고철류, 섞이지 않도록 주의하세요 폐지와 플라스틱만큼 분리배출에 주의가 필요한 것이 금속류다. 음료, 통조림 등의 캔은 알루미늄과 철 두 가지 재질로 만들어지는데 구분하지 않고 깨끗이 헹궈 배출하면 된다. 이때 부탄가스나 살충제 용기, 각종 스프레이 용기는 통풍이 잘되는 장소에서 구멍을 뚫어 내용물을 완전히 제거한 후 배출한 다. 반면 냄비나 프라이팬, 옷걸이와 같은 구리, 양은, 스테인리스 등은 비철로 나뉜다. 때문에 캔류와 분리하여 배출하도록 한다. 또한 알루미늄 포일은 철류가 아닌 일반 쓰레기로 배출해야 한다. 분리배출 OX 퀴즈 Q1 Q2 Q3 Q4 과일망은 스티로폼으로 재활용 분리배출이 가능하다. 깨진 유리병은 신문지로 싸서 종량제 봉투에 버린다. 게와 새우 등 수산물의 단단한 껍질은 일반쓰레기다. 페트병 입구와 뚜껑 사이의 링은 반드시 제거해야 한다. OX퀴즈 정답 Q1. Q2. Q3. Q4. Vol. 93 2025 신년호"}]}, {"id": "93-58", "no": 93, "label": "2025 신년호", "corner": "맑은 물 낱말 사전", "title": "맑은 물 낱말 사전", "author": "", "start": 58, "end": 58, "pages": [{"p": 58, "t": "AVENUE | 맑은 물 낱말 사전 언어의 바다에서 이름을 불러주었을 때 꽃이 되었듯, 언어는 일상에 특별한 추억을 선사한다. 때문에 새로운 길어 올린 단어를 안다는 것은 세계가 더 풍부해진다는 의미이기도 하다. 특이 우리 말에는 물과 관련된 우리 말 예쁜 단어가 많다. 알아두면 표현력이 풍부해지는 물과 관련한 낱말을 소개한다. 물 마 루 메 밀 꽃 윤 여 슬 울 바다와 하늘이 맞닿은 메밀의 꽃을 부르는 단어 물결의 표면이 해나 달의 강이나 바다의 물이 세차게 것처럼 멀리 보이는 메밀꽃은 다른 의미로도 빛을 받아 반짝이는 모습을 흐르는 곳을 일컫는 단어로 수평선을 뜻하는 말로, 사용한다. 파도가 일 때 하얗게 뜻하는 단어로, 주로 호수나 바닥이 낮거나 폭이 좁은 파도의 정상을 표현하기도 부서지는 물보라를 의미하는데, 강, 바다와 같은 큰 물결이 곳을 가리킨다. 물살이 한다. 비슷한 의미로 산의 하얀 물보라가 메밀꽃을 닮았다 보석처럼 반짝이는 모습을 매우 역동적으로 흐르는 정상은 산마루라 일컫는다. 해 비유적으로 사용한다. 보았을 때 사용한다. 곳에서 사용한다."}]}, {"id": "93-59", "no": 93, "label": "2025 신년호", "corner": "좋아요 KWWA", "title": "좋아요 KWWA", "author": "", "start": 59, "end": 59, "pages": [{"p": 59, "t": "AVENUE | 좋아요 KWWA <맑은 물 세상> 2024년 가을호 후기에 참여해 주신 모든 분에게 감사 인사드립니다. 그중 다선 분의 후기를 공유합니다. <맑은 물 세상>은 여러분의 관심과 응원으로 함께 만들어집니다. 앞으로도 소중한 의견 부탁드려요. 2024년 가을호 이벤트 당첨자 발표 독자 이벤트 어떻게 읽으셨나요? 오피니언 칼럼 잘 읽었습니다. 한국상하수도협회가 그동안 수돗물에 대한 인식 개선과 음용 촉진을 위해 관련기관과 공동으로 다양한 사업을 하고 계셨네요. 보다 나은 수돗물 공급을 위해 해외의 동향과 정책도 신경 쓰는 협회의 노력에 박수를 보냅니다. 회원탐방에서 소개된 인천시 상수도사업본부 기사를 보며 시민들이 안심하고 마실 수 있는 물 공급을 위해 힘쓰시는 분들의 노고를 엿볼 수 있었습니다. 인천시뿐 아니라 모든 지자체에서도 유사한 노력을 하실 것 같아서 든든하네요. 박영희 님 핫 이슈에 소개된 ‘자연기반해법을 통한 물관리’ 기사 잘 읽었습니다. 기존 하천관리는 홍수 대응에 미흡하며 하천 생태계 퇴화를 유발할 수 있다는 사실에 놀랐습니다. 생태계 환경을 고려해 자연기반해법의 전략이 필요함을 깨달았습니다. 국회물포럼의 한정애 회장님 인터뷰 잘 봤습니다. 건강한 물순환의 체계를 만들고 책임 있는 물관리 거버넌스 확립을 위해 최선을 다하시는 모습이 인상적이었습니다. 기후변화에 따른 안정적 물 공급 방안 마련을 위해 노력하시는 회장님의 행보를 응원합니다. 김태완 님 우봉근 님 자연기반해법을 통한 물관리 글 관심 있게 읽었습니다. 생물다양성 편익도 제공하면서 지속 가능한 관리와 복원을 가능케 하는 자연기반해법이야말로 맑은 물을 위한 가장 좋은 대안이 아닐지 생각해 봅니다. 백풍년 님 강창규 님 2025년 <맑은 물 세상> 신년호 독자 리뷰 이벤트 <맑은 물 세상> 신년호 기사 중 가장 기억에 남는 내용은 무엇이었나요? 여러분의 소중한 생각과 따뜻한 관심이 담긴 리뷰를 남겨주세요. 추첨을 통해 선물을 드립니다. 참여 방법 <맑은 물 세상> 신년호를 정독한 후 QR코드를 스캔해 기억에 남는 내용과 이유를 구글폼에 작성해 주세요. ※개인정보 동의 필수 참여 기간 2월 28일(금)까지 이벤트 상품 커피 기프티콘(5명) Vol. 93 2025 신년호"}]}, {"id": "95-6", "no": 95, "label": "2025 여름호", "corner": "맑은 물 이야기", "title": "한국상하수도협회 국제협력 네트워크 강화", "author": "", "start": 6, "end": 9, "pages": [{"p": 7, "t": "한 국상하수도협회 상근부회장 으로 부임한 유명수 부회장은취 임 사를 국내 물기업의 해외 진출을 적극지원 2025년3월 1일, 한국상하수도협회 신임 상근부희장으로 부임한 유명수 부회장은 취임사를 통해 국제협력 확대와 국내 물기업의 회는국제 네트워크를 적극 활용하여 국내 물기업의 해외 진출을 적극 지원하고자한다”며“해외 시장 개척과 판로 확대를 위한컨 설팅을 제공하는 등 세계 시장에서 경쟁력을 인정받을 수 있는 기 반을 마련하겠다”고 밝혔다. 부임 이후 유 부회장은 이러한 방향성을 구체적인 행보로 이 어가 해외유관기관과의 혐력관계 복원, 수출지원 확대 등 다각적인 전 략을통해 물산업의 글로벌화에 박차 를 가하고 있다. 글로벌 협력,실질적 성과로 이어지다 북아프리카지역까지 협력의 지평을 넓힐 수 있는 교두보로 평가"}, {"p": 8, "t": "6월에는 미국 덴버에서 열린 세계 최대 물 (6\\842)와의 업 무협약 체결 식이 진행되 위한 업부협 약을 체결해 이를 유지해오고 있다. 특히 이번 협약어는 상호 방문 또는 교류 활동수행, 전문가초청 및 최신 산업 정보 기술, 우수사례 공유, 그리고 수출상 담회의 성공적 개최를 위한 협력 능 양국 의 물산업 발전과 해외 시장 진출 지원을 위한내용을 포함하여 더 긴밀한교류를추진할예정이다. 혐 회 는\\00/와의 지속적인 교류를 기반으로 미국 내 상하수도 시스템 운영 기관과의 협력을 확대할 뿐 아니라, 미 국-인도 간 긴 업의 인도시장 진출도지원할계획이다. 동남아시아 협력도 재점 화됐다. 협 회 는 베트남수 도 협회(/\\54) 와의 기존 인연을 바탕으로 양 기관 간 협력을 재정비하고, 양국 전시, 세미나, 물포럼 등 주요 행사에 상호 참여하는 방식으로 협 력의 폭을 넓혀가기 위해 올해 상호 업무협약안을 논의 중이다. 특히 베트남의 고도정수처리,스마트 물관리 분야에 대한수요가 높아지면서,실질적인 기술 교류와 구매력높은 바이어 초청 방안 노함께 논의될 예정이다. 주요상하수도 관런 기관들과의 네트워크 구축도 계획하고 있다. 마련할계획이다. 단절된 협력의 복원,다시 연결되는물산업 네트워크 또한 유 부회장은 “지금까지 축적된 국제 인맥과 경 험 을 살려 소 원해졌던 해외 기관들과의 관계도 다시 회복해 나가고 있다며, “명확한 방향성과 신뢰를 바탕으로협력의 지속성과실 효성 을 확 보하는 것이 목 표”라고밝혔다. 협회는 향후 영국, 프랑스 등유럽 내 주요 상하수도관련 기관들 과의 네트워크 구축도 계획하그 있다. 이를 통해 한국 물산업의 기 술력과 경험이 보다폭넓게 전파되고, 새로운 해외 시장에서도 한국물기업의 경쟁력이 임증될 수 있도록 전략적 접근을 이어갈 표 전시회를 넘어, 글로벌 혐력의 중심 플 랫폼으로 발전시키겠다는 구상을 제시했 다. 실제로 올해 행사에서는 해외 기관, 바 이어, 기업의 참여 비중이 크게 늘었으며, 프로그램 구성 도 기술 세미나, 828 상담 럭과 시장성을 겸비한 국내 기업이 세계 물시장과 만날 수 있는 장을 지속적으로"}]}, {"id": "95-10", "no": 95, "label": "2025 여름호", "corner": "KWWA와 함께 1", "title": "2025년 공공하수도 관리대행 세미나", "author": "", "start": 10, "end": 12, "pages": [{"p": 10, "t": "공공하수도 분야가새로운전환기를 맞이하고 있다.기 후변화, 인공지능확산, 인구감소등빠르게 변화하는사회 속에서 공공하수도 관리대행의 역할또한 변화 에 직면해 있다. 이러한변화 속에서 정책의 방향을 공유하고, 현장의 목소리를나누는 2025년 공공하수도 관리대행 세미나'가 열렸다. 공공하수도의 현재와 미래에 대해 함께 고민하고소통했던 현장을 소개한다. 2025년 공공하수도 관리대행세미나 미래를순 비 한다"}, {"p": 11, "t": "지난5월 22일부터 23일까지 강원도 강릉 라카이 하고 환경부가 후원하는2025년공공하수도 관리 대행 세미냐' 가 열렸다. 빠르게 변하는 시대의 흐름 속 에서 공공하수도관리 정책의 변화와 그에 따른 관리대행의 역할에 대해 함께 고민해 보는 소통의 장.이번 세미나에는 전국의 공공하수도 관리청과 관리대행업체등 하수도 종사 자 300여 명이 참석 했다. 공공하수도관리대행 업무를 맡고 있는실무자인 만큼참가 자들은이번 세미나에 대한 기대가 뚜 렸다.무엇보다 정 부의 공공하수도 관련 정책 방향과 이에 따른 현장 변화에 대해 어떤 준비가 필요한지에 대한 관심이 켰다. 같은 분야 에 종사하는 이들로서, 참석자들은서로의경험을 공유하고 의견을나누고자 하는 열의도 높았다. 광주도시관리공사 김정희 센터장은 “오늘 세미나가다른 기업 관계자와 소통하는 자리를 넘어, 우리 공사 직원들과 앞으로나아갈 방향에 대해 함께 고민하는자리가되었으면 좋겠다\"는 바람을 밝혔다. “명의 공사 직원들과 함께 참석했는더, 공사 안에 센터가 22개가 있는만큼직원들이 한자리에 모이기가쉽지 않습니 나. 오늘 세미나가 공공하수도 관련 다엉한 지침에 대해 정 확히이해하고, 앞으로의 방향성에 대해 공사 직원들과함 께 배우고 소통하는 자리가 되었으면 좋겠습니다? 침이 발표 되는데, 이를정확하게 인지하고현장에 적용하는 것이 무엇보다 중요하다”면서 \"앞으로 공공하수도 관련 정 책이어떻게 변화하게 될지, 변화에 맞춰 준비해야 할 것은 수 있어서 감사하다\"면서 “오늘의 배움을 통해 회사의 성장, 더 나아가서 공공하수도 관리대행의 발전에 도움이 정책,기술, 현장이 연결된 교류의 장 이번 세미나에는 한국상하수도협회 송승종 사무총장, 환경 하수도관리대행의 성장을 위한 발판이 되기를 한마음으로 송승종한국상하수도 협회 사무총장은 개회사를 통해 “공공 하수 처리 기술은 식수 재활용 수준까지 발전했으며, 스마 트관리와 자원 회수를 통해 국가 성장 동력으로 주목받고 있다\"면서 이 자리가 이러한 변화 속에서 각 기관의 경험 과 지혜를나누고, 혐력과 상생의 기반을다지는 소중한자 리가되었으면 좋겠다\"고 당부했다. 서 해엽 환경부 생활하수과장도 축사를 통해 빠르게 변하는 흐름 속에서 정부와 현장의 협력이 필요하다고 강조했다. “어 후 위기,시 기술, 인구감소 등 급변하는 시대 속에서 공 공하수도 분야도 혁신이 필요한 때입니다. 정부도 현장의 목소리에 귀 기울이면서 보다 나은 제도를 만들어갈 수 있 도록 노력하겠습니다? 이어진 시상식에서는 공공하수도 관리대행 성과 평가 우 수시설4개소가 수상의 영예를 안았다. 울산광역시 방어진 무엇인지를 고민하는 자리가 되길 바란다\"는 기 대감을전했다."}, {"p": 12, "t": "공 공하 수처 리 시 설(리 워터)과 세종특별자치시 수질복원 는 환경부 장관상이, 여 주시 가남공공하수처 리시설(보람 엔지니어링 건 축사사무 소,68도화엔지니어링,68건화)와부 여군 부여 분뇨처 리 시 설(부여 환경 주식회사) 2개소에는 한 국상하수도 협회장 표창이 수여됐다. 소식을 듣고 가장먼저, 쉽지 않은환경 속에서도 묵묵히 맡 그간의 노력을 인정받는 자리인 것 같아 뿌듯하고 기쁘다. 앞으로 부족한 점은 채워나가고, 더 높은 목표를 향해 나아 가는 계 기 가 되었으면 한다”는 소감을전했다. 세미나 주제 발표 시간에는 5명의발표자가 각기 다른 전 문 분야와 경험을 바탕으로 '공공하수도 관리대 행' 에 관한 다양한 관점과 정보를 공유했다. 환경부 진창균 사무관이 '2025년 하수도 정책 방향'이라는 주제로 발표의 문을 열었 다. 진창균 사무관은 하수도의 역사와 한국 하수도의 현재 를 뇌 질어 보고,이를 토대로 우리가 함께 고민해야 할 문제 점과향후정책 추진 계획 능 청사진을 제시했다. 수가 준비한 주제는 ' 에너지 자립형 하수처리: 가능성을 넘 실현 가 능성을 소개하며, 에너지 효율 제고를 위한 정책 방 공공하수도 는 단순한 인 프라를 넘 어, 환경과도시 회 복력을 지 탱하는 기 반이자 우리 사회의지속적인 성장을위한자산 이기도 하다. 향을 제 안했다. 특히 관련된 연구 성과와 해외 사례 를 공유 하여 참가자들에게 긍정적인 반응을 끌어냈다. 국립 환경 과학원의 신기 식 연구관 은 '수질 오염 공정시험기 준 제- 개정 현황', 한국상하수도협회 노해연 팀장은' 공 공하 수도 성 과평가: 이것만은 알고 가자', 경 기대학교 이병희교 수는 ' 공공하수도관리대행 제도의 미래 방향성'이라는 주 제로 발표를 진행했는데, 참석자들의 관심이 높은 주제인 만큼 현장의 집 중도가 높았다. 발표 내용을 메모하거나 핸 드폰으로 촬영하는 모습을통해 정책의 변화에 대한관계자 들의 높은 관심 을 다시 한번 확인할수 있었다. 마지막발표 자인 한국강사협회 강래경 회장은 ' 모두 가 행복한 조직 문 회\"에 대한 내용을 유쾌한 강연으로 풀어내어 참석자 들의 웃음과 공감을끌어냈다. 로 마무리됐다. 공공하수도관리대행에 대한다양한정보와 앞으로의 방향성 을 진단해보는 배움의 기 회이자, 현장의 고민을 나누는 소통의 장이 었 던 1박2일. 실제 사례와 정책 방향에 대한 정확한 정보를 전달받고, 현장의 다양한 경험 을 공 유할 수 있었다는 점에서 유익한 시 간 이었다는 평가가 공공하수도는 단순한 인프라를넘어, 환경 과 도시 회복력을 지 탱하는 기 반이자우리 사회의 지속적인 성장을 위한자산 이기도 하다. 2025년 세미나가 남긴 질문과 공감이 참석자 개개인의 성장을 넘어 우리나라 공공하수도관리대행 분야"}]}, {"id": "95-13", "no": 95, "label": "2025 여름호", "corner": "KWWA와 함께 2", "title": "2025년 물관리 유공자", "author": "", "start": 13, "end": 13, "pages": [{"p": 13, "t": "ㅇ . 수상을진심으로 축하합니다.소감한말씀 부탁드립니다. 의 근원이며 깨끗한 물을 안정적으로 공급하는 것은우리 사회의 지속가 능성을 높이기 위한필수적인 과제입니다. 이번 수상은 단순한 기 술개발을 넘어 실질적으로 국민의 건강과 안전을 지키는 데 기여한 점이 인정받은 결과라고 생각합니다 특히, 국내 최초로 최고 품질의 차 아염소산나트륨 소독제를 안정적으로 생산할수 있는차아 염소산나트륨 발생장치를 상용화한 것이 증요한역할을 했다고봅니다. 이를 통해 수못물뿐만 아니라 다양한 산업분야에서 위생 관리를 강화할 수있었고 이러한혁신적인 기술이물관리 분야에서 긍정적인 영향을 미 친 것이 이번 수상의 주요한이유라고생각합니다 앞으로도 더욱책임감 을가지고깨끗하고안전한물을 공급하는데 최선을 다하겠습니다. ㅇ 앞으로의목표가어떻게 되시는지 궁금합니다. ^ 이번 수상을 계기로 더욱책임감을 가지고 물관리 분야의 혁신을 선도 해 나가고 싶습니다. 첫째, 차아염소산나트륨 발생장치의 기술고도화 및 글로벌시장확대 입니다 현재 국내에서 성공적으로 상용화된 차아염소산 나트륨 발생장치를 더욱 발전시켜 해외시장에서도 널리 활용될 수 있도 록노력할 것입니다 둘째 친환경적인 수처리 기술개발 입니다 지속 가능한 미래를 위해서는 환경을 고려한 기술이 필수적입니다. 기존의 화학적 처리방식에서 벗어 나자연 친화적인 방식으로수질을 개선할 수 있는 다양한기술을 연구하 고있습니다 이를통해탄소배출을줄이고보다지속가능한물 관리시스 템을 구축하는것이 목표입니다. 셋째 국민건강과 안전을 위한사회적 기여 확대 입니다 깨끗한 물은 국민 의 건강과 직결되는 문제입니다 저희는 기술 개발뿐만 아니라 물관리의 중요성을 알리고안전한수처리시스템을 구축하는데 기 여하고자합니다. 국내 최대 규모의 물산업 전시회인 국제물산업박람회에서는기업과 지자체 등 각 분야에서 안전하고 깨끗한물을 공급하기 위해 노력한유공자에게 정부포상을 수여한다.<맑 은물 세상>에서는물관리 분야의발전을위해힘쓰고있는유공자 중 대통령표창을 받은 0하이클로 김현택 대표이사와 국무총리표창을 받은 .수상을진심으로 축하합니다. 소감 한 말씀 부탁드립니다. 간 유체유동분야국제공인 교정기관으로 인정받아왔습니다 지빙상수도 현대화사업의 필수 기자재인 저유속 측정이 가능한 전자식 유량계를 개 발해 상수도유수율을 높이고 맑은 물을 보다점확하고 안정적으로 공급 기식 수도미터를 개발해 정확한 수도요금이 책정되는 데 기 여했습니다 앞으로도 지금까지 구축해 온 유량측정 기술을 바탕으로 해외 수출 사업 을 확장하여 국기물산업 발전에 앞장서며, 끊임없이 새로운 기술을 개발 하는데힘쓰겠습니다. . 앞으로의 목표가어떻게 되시는지 궁금합니다. ^우리 회사에서 개발한 상수도관망전산화와 유량블록시스템은 실시간 유량측정으로관망상태를 감시'분석하여 유의미한 정보를 제공하고 있습 (0.01~107/9의 유량측정 신뢰성을 높여 구역 내 야간최소유량을 확인하고 분석할 수 있도록하였습니다 이는누수량을 정확히 판단하고누수원인을 분석해 경제적 손실을 줄이는데크게 기여하고있습니다 다만상수도와 달리 하수관로분야의 유량계는 여러 방식의 제품들이 나 오고 있지만 비만관과 저유속으로 아직까지 상수도 분야 만큼의 정확한 유량을 측정하기가 어럽습니다 이러한 부분을 극복할수 있는 전자기식 방식의 유량계를 개발해 하수도 관로에서도 스마트한 유량관리가 될 수 있도록하고자합니다 더불어 국기물산업클러스터에 생산기지를 둔 기 업들과 힘을 합쳐 국내 시장에만안주하지 않고글로벌 시장개척에 더 많은노력을 기울여 대한 민국의 물 산업이 세계시장에 우뚝설수있도록노력하겠습니다."}]}, {"id": "95-14", "no": 95, "label": "2025 여름호", "corner": "오늘 물 맑음", "title": "한국상하수도협회 주요 뉴스 · 교육 일정", "author": "", "start": 14, "end": 17, "pages": [{"p": 14, "t": "한국상하수도협회(이하 협 회) 는 3월 19일부터 21일까시 3일간 킨텍 공적으로 개 최했다. 도,대만 싱가포르, 베트남, 태국,필리핀 등 17개국60개 사 79명의 해 외 바이어와 국내 물기업143개사가 참여했다. 협회는 기 술럭과 제 품 경쟁력을 갖츠나 국내 시장 포 화로 어려움을 겪는중소 물기업 사전 매칭 과정을 거쳐 진행된 상담 회에서는 총 669건의 상담이이 등 36개사가 있다. 협회는 후속 지원을 통해 실계약으로 이어질 수 있도록 돕겠다는 계획이다 행사를총괄한 송승종사무총 장은 \"물산업은 대한민국 미래성장동 ㅣㆍ 전보건경영 시스템을 운영하며 지속적으로 개선해 나가고 있다 협 력 중 하나이나 다수의 중소기업이 지원을 필요로 한다”며 \"앞으로도 국제물산업박람회와 수출상담회를 통해 국내외 판모 개척을 적극 지 원 하겠다\"고 말했다 근부회장의 안전경영철학을 반영한 안전보건방침을 수립하고 임직 이날 행사는 상근부회장의 안전경영 비전을 임직원과 공유한뒤 관 리감독자 임명과 안전보건방침 선포순으로 순으로 진행되었다 유명수 상근부회장은 모든 경영활동에 안전중심 경영원칙 적 용 을 최우선 핵심가치로 선 포 하고 모든 임직원의 안전보건경영 활동 참여 스안전한 일터 조성 ^체계적인 안전보건경영시스템 운영 ^ 실효성 있는위험성 평가 등을 표명했다 특히 이번 선포식에서는 안전 경영원칙을 실천하기 위해 각부서를 실제 지휘-감독하는 부서장을 관리감독자로 임명하여 체계적인 안 협회 유명수 상근부회장은 선포식에서 \"임직원의 일상속 안전을 강 화하기 위한첫 단계로 안전보건관리 체계를 확립하고자 한다”면서 인하고 예방하여 안전한일터 조성에 힘써달라”고 당부했다. 협회는 안전보건 법규를 순수하고, 모는 이해관계자가 참여하는 안 회는안전 중심의 경영원칙 적용, 임 직원과 협력업체의 참여 확대,사 통해 안전한일터 조성에 힘쓰고있다."}, {"p": 15, "t": "한국상하수도협회(이하 ' 협 회”) 는 5월27일 서울 3센터에서 열린 2025 환경산업 일자리 박람회 부대행사로 국가직 무능력 표 준(405) 직무상담부스를 운영하고 녹색산업 직무 설명회에 참여했다. 환경 인적자 원개발위 원회(50)는2020년 고용노동부와 한국산업 인 력공단 지원 아래 출범한 산업계 주도 인적자 원개 발(10[)) 거버넌스 로, 한국상하수도협회를 대표기관으로 한국환경공단, 한국환경산업 환경산업 일자리 박람 회는2010년부터 환경부가 매년 개최하는 대 표적 인적자 원개발행사로, 환경기업의 우수인력 채용 기회 제공과 구직자의 취업 성과 제고를 목표로 한다. 올해 박람회에는환경 분야 우수기업과 공공 기관, 협회 등 70여 곳이 참가했으며, 현장 면접 과 특히 올해는 환 경|5( 가 거버넌스활성화를 위해 주요 참여기관(환경 력해 일자리 관련 협업 행사 를 처음추진했다. 박람회에서는채용직 무와 \\(5 매칭 현황을 소개하는 직무상담부스가 운영됐으며, 전기 차 충전 인프라, 자 원순환, 소음 분야유망 직무에 대해 전문가 설명 유명수 환 경|6( 위원장은 “환경산업 인적자 원개발지원을 위 한첫협 업이라는 점에서 의미가크며, 앞으로도 \\( 를 지속 개발-보급해 기 환경산업 일자리 박람회참여 한국상하수도협회(이하 \\////ㅅ)는6월 8일부터 11일까지 미국 덴 이번 협약은 기술 교류를 넘어 산업협력과 시장 연계를 포함하며, 양 국간실질적 물산업 협력 확대의 계기를마 련했다. 가 참여하는국내 최대 상하수도 전문기관이며, 4////ㅅ는1881년 설 양 협회는2002년 첫 협약을 체결한 이후3년 주기로협력 관계를유 지해 왔으며, 이번에는 협회 유명수 상근부회 장과 &#///^ 데이비드 라프랑스 6ㅇ가 직접 서명에 참여했다. 협약을 계기로 사절단 교류, 기술교환,공동 세미나 등 다양한실무 협력도 본격화 될 전망이다. 양 기관은 이번 협약을 통해 수출상담회, 수요- 공급자 매칭, 기업 참 관단 운영, 개발도상국공동시장진출등실질적 산업 교류를 추진하 기로 했다. 행사 기간중 유명수 부회장은4 인도지부, 미국물 연이어 면담을 진행하며 국제 네트워크 확대에 힘을 보 태. 진출을 지원하고있지만바이어 발굴에는여전히 한계가 있 다”며 “앞 으 로도&////ㅅ는 물론세계 각국 협력단체와의 연계를 통해 우리 물 기 업의 수출 성과가 체감될 수있도록적극 노력하겠다”고 말했다."}, {"p": 16, "t": "컨소시엄 ㅣ 하수도 》 고육비와 교육일정은 협회 사정에따라 넌경될 수 있으며,자세한 사항은 홈페 이 지(69410\\/\\30<)을 참고해주시기 바랍니다 》 건소시엄재직자교육의 경 우 ,10인 이상 신청 시 기업 출장교육이 가능힙니다 물산업인재교육원 3분기 교육일정"}, {"p": 17, "t": "26。 즐거운만남 회원탐방 2 @우석 에이 엠 테크 대한상하수도학회"}]}, {"id": "95-18", "no": 95, "label": "2025 여름호", "corner": "회원탐방 1", "title": "㈜더웨이브톡 – 국내 최초, 레이저 기술을 활용한 정수 탁도계 개발에 성공하다", "author": "", "start": 18, "end": 21, "pages": [{"p": 18, "t": "시 답러닝 수질 센서 전문기업 더웨이브톡이 한국환경공단 평창수도사업소와꾸준한 받아공공수처리 적용가 능성을 인정받았다. 향후국내수질 계측기기의 국산화 는 물론 국내외 물 산업 발전에 큰 반향을 일으킬 것으로 기대가 모아지는 가운데, 더 웨이브 톡 을 찾아물산업 디지털화의 핵심 솔루션에 대한이야기를 나냈다."}, {"p": 19, "t": "기술적 독립이자혁신, 10-50 질 안전성을 판단하기 위해 없어서는 안될 중요한 측정 도구다. 정 수상에서 생산된 수 물은 정수처리 과정을 거친 후 각 가 정으로 공급되는데 이 과정에서 탁도계가 물속에 부유하는 미세한 입 자나 오염물질의 농도를 실시간으로 측정해 물의 품질과위생 상태를 판단하기 때문이 다. 국민이 수도물을 안심하고 마실 수 있도록 하기 위해 탁도계의 성능과 신뢰성은 공공 안전과 직 결되는데, 안타깝게도 국내 정수장에 설치 손하고 있어 부품 교체 등의 유지보수를 위한 비 용이 많이 발생했다. 이러한가운데 지난 4월 더웨이브톡이 국내 최초로 레이저 광원 기반 탁 도계 10-50'을 개발 하여 국립환경과학원의 형식승인을 획 득했다는 낭보 가 전해졌다 100% 순수 국내 기 술로 개발된 레이저 원 교체가 필요 없이 반영구석으로 사용할수 있어 유 지관리 부담을 획기적으로 줄일 수 있다 특히 바이오 게 측성하는 기술을 세계 최초로 구현한 것이 핵심이 다 또 기존장비는1~3개월을 주기로수작업 청소와 재보성이 필 수 였으나 050 은 정기 세척과 캘 리 브레이션이 필요 없는 구조이기에 이 과정에서 일어날수 있 는불미스러운 사태를 미 연 에 방지 할 수 있다. 기술적 성과 를 넘어 정수장 운영 에 있어서도 문제를 해결할 수 있는 대안인 셈이다. 더욱이 국내 정 수장뿐만 아니라 폐수 처리장과 같은 산업 현장까지도확대 적용할 수 있다는 점에서 이번 형식승 인은국내 물 산업 역 사의 한 페이지를 장식할 획기적 기술 개 발로 주목받고있다. 국산화의가 치를 이룩하기까지 파농을 분석함으로써 기존에알수 없던 정보를 새롭게 파악할수 있다는의미를 담은 더 웨 이 브 톡은2016년 설립 이후 레이저와 닙러닝을 이용한수질 및 미생물 산엄통상자원부장관 。"}, {"p": 20, "t": "측정 기술을 핵심으로 수질 센서를 개발해 왔다. 2018년에는 광신호 기반 기술로 물속의 이물질을 측정하는워톡을 개발했으며, 2020년(스마 트 ㅣ01 물 센서, 홈 가 장비) 등 총 세 차례나(『5 혁신상을 수상했다.2024년에는 싱가포르 국제 물 주 0431/로 우승을 차지했다 가정용부터 산업용까지 다양한 분야에서 수질 안전 을 확보하며 글로벌 시장에서도기술력을 인정받고 있는것 이처럼 창립 이후줄곧 눈에보이지 않는물 속의 모든 이물질을 정량화히며 수질 보상이라도 받듯2024년 마침내 정수의 탁도 및 미생물 고속 검출 기술로 자체 개발한 디닝 알고리즘 기술이 산업통상자원부 국가기술표준원으로부터 국가 통해 검증받은 이 기 술은 세계 최초로 유지보수가 필요 없는 초소형 탁도 센서 와 더불어 미생물(세균)의 양을 동시에 빠르게 측정할 수 있는 기술이며 앞서 소개한 10-50이바로 이 기술력을 기반으로상용화한첫제품 이다 김영덕 대표는 “신기술 인증이 기술력과 더불어 상용화 가 능성까지 높이 평가받 았다는 것이기에 더욱 의미가 있다\"며 \"올해 말까지해당51 인증기반의탁도- 미생물복합측정 센서 상용화도 추진하고 있다”고 밝혔다."}, {"p": 21, "t": "국내를넘어 글로벌상하수도 산 업으로 작으로 반도체 기반 유지보수 제로형 수실 센서 기술 기반 디지털 워터, 디지털 트윈 등 고도화된 스마트물 관리 시장까시 확상할 계획이다. 그러기 위해서는 국 내외 다양한기 업 에 더 웨 이브톡의 기 술을 널리 알리고 빠르게 보급되는 것이 관건 이다. 한국상 하수도협회 에 가입하게 된 계기 역시 협회의 네트워크를 통해 시너 “처음부터 물 산업에 종사한 게 아니 었기 때문에 홍보 에 한계가 있다는 것을 알았습니다. 깨끗한 물의 안정 적인 확보와 공급, 수질 보전과상하수도 분야의 선진 넘어 물 산업 의 디지털 전환을 위한핵심 기 술 로 자리 매 김하고 있다.전 세계 물 산업의 보는 방향과 일맥상통한다고 느습니다. 회원으로 가 입하게 되어 기쁘고 앞으 로서로 윈 윈하며 시 너지를 일으킬수 있도록 노력하겠습니다” 덧붙여 김영덕 대표는내년 3월 개 최될2026 워터코리아에 대해서도 부푼 기대 감을 내 비졌다. \" 한 국상하수도협회에 가입해 국내 시장에서의 신뢰도를 높이고 워터코리아 를 통해 다양한 해외바이어들을 만날 수있다면 더할 나위 없을것 같 습니다. 긴밀한 협력을 통해 앞으로 국내 정수장 및 하수처 리 장에서 글로벌 시장 진출에필요한기반을 확보해나가겠습니다” 성공을 넘어 물 산업의 디지털 선환을 위한핵심 기술로 자리매 김하고 있다 전 세 계 물 산업의 새로운 흐름을 만들어낼 더 웨이브톡의 파동이지구 곳곳에 미칠 수"}]}, {"id": "95-22", "no": 95, "label": "2025 여름호", "corner": "회원탐방 2", "title": "㈜우석에이엠테크", "author": "", "start": 22, "end": 25, "pages": [{"p": 22, "t": "물은끊임없이 \"흐른다\".유동 적인물을빈틈없이 관리하기 위해서는 공급과 흐름을 입체적-체계적으로다루는 시스템이 밑바탕되어야 하는 법.(#우석에이엠테크는 혁신적인 물관리 기 술을 개발하며 주목받고있다. 차 별화 된 물관리 싫스템으로물테크의"}, {"p": 23, "t": "세계 최소 의 -ㅡㅜ 。_ 에 기장 많은 영향을 미치는 핵심 요소인 수압 그리고 동파 및 수질관리 기 술력을 응축한 새로운 물관리 시스템 혁신은 곧 '문제해결이다 현상을 파고들어 정확히 맥을 징고 다각도로 접근하며 해답을 찾아갈 때 비로소 혁신에 이를 수 있다. 2018년 설립된 우석 에이 엠테크는 급격한 기후변화로 인한 각종 워터 리스크에 주목하 고, 수자원 관리 기술의 새로운 해법을 제시했다 안정적인 물 공급과관 리를위협하는폭우, 태풍, 기 몸 지하수고갈등이주요환경 이슈로 떠오 른 가운데 전 세계적으로 정확한 물 사용량 측정을 통한 물관리 기술과 안정성 확보가 요구되고 있는 터.우석에이엠테크는 기존 물관리 방식의 문제를 개선하고자 기술개발에 적극적으로나섰다. 현재의 수도계량기는 미세유량의 측정이 어렵고, 동파위험, 부품고장, 습 기취약등의한계가 존재한다 우석에이엔테크는 이러한 각종 문제점을 개 70를할88해 정밀하게유량을측정합니다 단순 히 초음파를활용하는 것을 넘어 수입과 수온 계측 센서를 탑재한 것이특징이죠. 바관과유량 에 유용하게 활용되는 수온을 면밀하게 파악할수 있습니다 수압 수온 순시유량을 동시에 실시간으로 측정할 수 있는 세계 최초이자유일한스 마트 수도미터입니다” 임형칠부회장은 다기능 초음파 수도미터의 차별화된 면면을 강조했다. 특허 기술인 초음파유량 측정 알고리즘을 적용함으로써 국내 최고의정 밀도를 구현하는가 하면 소재 개발을 통해 내부 에폭시 몰딩으로 완전한 방수 성능을 갖쳤다. 기계적인 부품이 없어 마모와 파손 없이 장기간 사"}, {"p": 24, "t": "용할 수 있는 데다 자석 부품의 영향을 받지 않아 안정적인 계측이 가능 한 것도장점이다 이 같은획기적인 기술적 진화는 우석에이엠테크연구 진의 거듭된 노력이 응축된 결과다 효율 극대화와 비용 절감을 동시에 다기능 초음파 수도미터는 물관리의 효율성과 편리성을 극대화한다 유 량 수압.수온을통합 모니터링함으로써 유수율 향상은 물론 누수와동파 예방, 정압 관리, 유지비용 절감, 부정사용 및 사고방지 효과를 동시에 축했다고 밝혔다. “나기능 초음파 수도미터는 디테일한 정보를 실시긴으로 제공하는 '신경 망'조직과 같은 역할을 합니다. 관리의 효율성과경제적 효과창출을 넘어 수자 원의 가치와 쓰임이 제대로 발현되기 위한기반을마련한 셈입니다” 우석에이엠테크는 차별화된 기 술력을 바탕으로 한국수자 원공사 성과 공 유제 공모에 선정되기도 했다 성과 공유제는 한국수자 원공사와 중소벤 처기업이 공동과제를 수행해 원가절감을 위한공정 개선과 신기술 개발 등을추진하고,협력 활동의 성과 를 나누는 제도다. 우석 에이 엠테크는 지 난해 12월부터 김제시와 장흥군에 다기능 초음파 수도미터를 설치해 운 ) 우석 에이엠테크"}, {"p": 25, "t": "영 중이다. 실제 현장에적용한다기능초음파 수도미터의 기 술적- 경제적 평가를 거친 후 수의계약 자격을 부여받을 계획 이다. 최근 5월에 진행한 중간 점검에서 성과 목표 기 준에 맞는 결과와 유수율 증가 및 누수 진단 터 취득 주기 또한 5분 및 1시간 단위로 설정 가 능합니다. 서온 환경 이나 잔 비 등 다 습한 환경에서도 정상 작동하는 탄탄한 내 구성도 확인할 수 있었습니다 수온 데이터 분석을 기 반으로 동파와 수온 예측 또한 가능해 졌습니다. 특히 유수율 향상이 눈에 띠다.종전 기간 대비 평균 유수율 누수 탐시, 동파예측, 수실 관리 측면의 기술적 발전과 동시에 보다효율 적인 관리 를통한 비용절감등경제적 효과도 기대할수있게 되었다. 우리나라의 수듯물 총 공 급량은2023년 기준 67억9500만ㅁ인데,이 중 누 수 량은.9%에 달한다. 2024년 환경부 조사에 따르면 수돌 음용율 은 36% 수 순 으로00) 평균51%에 크게 못 미치는 실정이다 우석에이 엠테크는 우리의 소중한 수사 원 이 단한 방울도 낭비되지 않고 최 적 의 가 치를창출할수있도록 유수율과 음용율을 높이는것을 목 표로 나아간다 “한 국수사 원공사와 함께 진행 중인 성과 공유세를 통해 얻은 경험과 검증 된 성과 를 토대로 다기능초음파수도 미 터 가 전 국에 확대적 용될 수있도 록 노력하고자합니다 취수원에서 수도꼭지까지, 깨 끗하고 안전한물을 공급하는 스마트 상수도 인프라 구축을 견인하겠습니다. 기 후변화 대응 에 기 여하는것에서 나아가사회적 안전망 구축에도 힘을 보태 고싶어요 1 인 가 구가 증가하면서 고독사가 사회적 문제로 떠올랐는데요 수도 사 용량 분석을 통해 대상자의 생활 패턴과 안부를 확인할수 있도록정확한 데이 터 를 제공함으로써 복시 사각지대 해 소에 도움이 되고자 합니다\" 최광영 대 표는 세계 진출에도 박차 를 가할 예정이라고밝혔다 글로벌 시 스시장규 모를약19조2 천 13억 원으로 전망했다. 빠르게 성장 하는 글로 엠테크는지난 3 월 에 개 최된'2025 워터코리 이\" 전 시에서 국내는 물론해 외 바이어로부터 높은 관심을 받았다. 고객 별 다양한 니즈에 대응하기 위 지구를 아름답게, 생활을 편리하게 우석에이엠테크의 비 전은 명료하다 물관리 패러다임을 선도하고, ' 인간과 소통할 수 있는 물관리 기 술을 통 해 인간과 자연이 공존하는 사회를 만들어갈 계획이다. 우석에 이 엠테크 서 최초의 길을 내고, 인류 공동의 미래 가 지를 창출할 이 들의 미 래를 기"}]}, {"id": "95-26", "no": 95, "label": "2025 여름호", "corner": "즐거운 만남", "title": "대한상하수도학회 권지향 학회장", "author": "", "start": 26, "end": 29, "pages": [{"p": 26, "t": "기후위기의 시대,깨끗한물의 안정적 확보와 관리는 인류생존의 핵심 과제로 떠올랐다. 상하수도 시스템은 이 과제를 실현하기 위 한기반시설임에도 눈에잘띄지 않는다는이유로, 그 중요성이 간 과되기 쉽다. 대한상하수도학회 최초의 여성 학회장이자 건국대 학교 사회환경공학부 교수인 권지향 학회장은 이러한 흐름에 맞 서,새로운 물길을 만들어가고 있다. 우리 사회가 직면한 물 환경 문제의 해법을 모색하고, 미래 환경 인재를 길러내는 일. 권지 향 학회장이 산업 현장과 학문을 오가며 꾸준히 실천해온 일이자 앞 으로도 지속해야 할과제다. 글 박향아 | 사진 고인순 대 한 삼하수도 학회 권 시향 학회장 대한상하수도학회는 상하수도 분야의 산업 기술 정책 제도, 학문 발전에 기여하기 위해 1986년 참립된 전문학회다 '미래와함께 누 리는 맑고 풍요로운 물'이라는 슬로건 아래, 국민 건강과 복지 향상 을 위한연구와 실천을 이어가고있다 권지향 학회장은 학회가 설립 40년 만에 선출된 첫 여성 학회장이 다. 최초, 유일'이라는 수식어가 따라 붙지만, 권지향 학회장의 심 장을 뛰게 하는 것은화려한수식어가 아닌 우리 사회가직면한물 환경 문제를 해결하기 위한'연구의 힘' 이다. 크게 다가왔어요 제가 처음 학회에 가입한 건 석사과정 시절, 논문 으로 활동하면서,전임 학회장님들의 훌륭한행보를 지켜봤잖아요 그 걸음에 누가 되지 않아야 한다는 부담감과 첫 여성 학회장으로"}, {"p": 28, "t": "서 의미 있는 변화 를 만들어나가야 한다는 책임감이 공존했죠. 더 많은 사람이 상하수도에 관심을 갖게 하고, 다양한 연구 성과 가모 여 긍정적인 변화 를 만들수 있도록 토대를 마련하는 것 그게 제가 임기 중 가장 중점적으로 추진해야 할 일이라고 생각했습니다” 보이지 않는 인 프라를위한노력 2년 임기의 반환점을 돌아마지막 길목을 향하고있는지금. 권지 향 학회장이 이끄는 대한상하수도학회는 학문과현장, 정책을 연결하 “기후위기가 심화되면서 상하수도의 역할은 더욱 중요해졌습니다 이에 대한 신속하고적절한대응없이 사회의 안전을 보장하긴 어렵 습니다 지난해 강원도 강릉에서는 극심한 가 붐으로 제한급수를 검 토했고,도심 싱크홀 문제 역시 상하수도 시설과 무관하지 않죠. 상 하수도는 '보이지 않는 인프라' 이지만 사실은 우리 일상에 기장 가 까운 기 반시설이에요 사회 안전과 직결된 만큼, 학회는 학문적 연 구를넘어 사회적 현안 해결에도 적극적으로 동참하고있습니다” 실제로 대한상하수도학회는 여러 분야의 전문가들이 모여 상 하수 도 문제를 다층적으로 연구하고 실천 방안을 모색하고 있다. 도시 침수, 취수원 오염, 싱크홀 등 긴급 현안에 대한 토론회를 개최하는 등 현장중심 활동을 꾸준히 강화하고 있는 것도 이러한 흐름의 일 \"현재 문제 해결에 집중하는 것도 중요하지만, 동시에 미래를위한 기술 개발도 게을리해선 안 됩니다. 기 후변화 속도가 빨라지면서 기존 인프라의 보수와 교체만으로는 한계가 있어요 새로운 변화 에 대응할 수 있는 혁신적 기술이 시급하게 요구되고 있습니다. 우리 등 다양한 연구회를 운영하며 미 래를 준비하는 이 유도 여기에 있습 내일을책임질 인재를 양 성하는일 을 순비하는 일은 권지향 학회장의 또 다른 일터인 대학에서도 동 일하게 진행 중이다 2003년부터 건국대학교 사회환경공학부에 서 교수로 인재 양성에 힘써온 권지향 학회장. 그가 교육자로서, 연 구자로서, 그리고 먼저 그 길을 걸어온 선배로서 가지는 책임감은 하고 싶어요\" 사회환경공학부에 입학한 학생들이 처음 수업에서 이런 얘기를 해요. 환경을 지키고 세상을 더 나은 곳으로 만들겠다 는 소신으로 입학한 친구들인데, 저는 그 나이 때 그렇게 생각하지 못했던 것 같아서 대견하고 기 특하죠 선명한 꿈을 가진 학생들인"}, {"p": 29, "t": "배움에 대한 제자들의 열의는 가르치는 스승의 열정으로 이어지는 법. 권지향 교수의 수업은 단순한 지식 전달을 넘어 실제 문제 해결 능력을 키우는 데 초점 이 맞춰 셔 있다. 실습과 토론, 팀 프로젝트중 심의 수업을 통해 학생들이 스스로 문제를 정의하고, 해결 방안 을 설계해보는 과정을 경험하게 한다. 최근에 수업 과제로 진행했던 을 각사의 방식으로 적용해 수질 관리의 원리와 중요성을 몸소 체 험할수있었던 의미 있는 사례 로꼽힌다. \"환경 문제는 단순히 계산만으로풀수있는게 아니에요 수치 뒤에 있는 사람과 사회를 함께 이해해야 하죠. 그래서 수업에선 기술적 접근뿐아니라, 이 론을 현실에 접목할 때 가져야할정책,윤리적 관 점도 함께 고민하게 합니다. 기 술은 문제를 직시하고 결국 더 나은 사회로나아가기 위한 도구여야하니까요” 학생들과함께하는 시간은 권지 향 학회장에게도또 다른 배 움 이다. 이들이 꾸준히 성장해 꿈을 펼칠 수 있는 사회를 만들기 위해 노력 해야할 부분에 대한 고민도 이어진다 “상하수도 분야 는 열악한 근무환경이나 급여체계, 미 래에 대한 불 투명성 등으로 인해 인재들의 진입이 어려운 현 실입니다. 우리 사 회를위해 꼭 필요한 일임에도, 식업 에 대한 사회석 인식이 낮은 것 도 사실이고요 그렇기에 제자 들에게 사명감만으로 연구를 지 속 하 라고 강요하기는쉽지 않 쇼” 그럼에도 권시향 학회상이 여전히 강단에서 학생들과 환경의 중요 성을 이 야기하고, 시 속가능한 환경을 위한 연구를 시 속하는 이 유는 \"첫 수업에 학생들에게 '환경공학사는 지구를 치료하는 의 사라고 얘기합니다. 우리가 살아가는 지구의 건강을 진단하고, 치 료하며, 더 나아가 아프지 않게 예방하는것 역 할을 하는 거 쇼. 깨끗한물 깨 환경 문제는 단순히 계산만으로풀 수있는게 아니에요. 수치 뒤에 있는사람과 사회를 함께 이해해야하죠.그래서 가져야할정책,윤리적 관점도 함께 고민하게 합니다. 끗한 환경을 만드는 것이 곧 우리 사회를 더 건강하고 행복하게 만 드는 일이라고 확신하기에,관련 분야에 관한 연구는 물론 인재를 권지향 학회장의 행보에는 일관된 키 워 드 가있다. 바로 연 결' 이다 '학회는 전문가들만의 모임 이 아닙니다. 현장 종사자분들 정 책 을 만드는분들, 그리고 미 래를 이끌 학생들과 함께 할 때 진짜힘이생 긴다고 생각해요. 학문은 고립되어선 안 되고, 현장의 목소리와 연 결돼야 하니까요” 권지향 학회상은 학회상에 임명된 후로 우리가 함께 고민하고해결 해나 가야 할 부분에 대한 화두를 끊임없이 제시했다. 미 래를 준비 할 수 있는 다양한 연구회를 활성화하고 여러 분야의 전문가들이 직면한 문제에 대한 의건을 교류할 수있는 토론의 장도 마 련했다. 여전히 해결해야 할 숙제도 남아 있다. 침 체된 국내 학술지에 활기 를 불어넣을 다양한 프로젝트, 상 하수도의 내일을 책임질 인재 양 성을 위한 프로그램도 차 근차근 준비해야 한다. 그 과정에서 한국 상하수도협회와의 긴밀한협력 관계는 필수적이다. 협회에서 주관 하는 세계 물의 날 행사'에 맞춰 학술대회를 개최하고, 대 학에서 의 배움이 산업 현장으로 연결되어 긍정적인 변화 를 만들어 낼 수 있 도록 산학협력 도 꾸준히 이 어나갈 계 획이다. ^모두가 누리는 물 행복권 구현'을 위해서는 상 하수도가 핵심이고, 이를 책임지는 전문가들이 자 긍심을 가지고 일할 수 있는 환경이 조성되어야 한다고 생각합니다. 이를 위해 학회와 대학, 산업계, 정 부가협력하는 시 속 가능한생태계 구축이 중요한데 요 대한상 하수 도학회가 기 술과 사회, 현상과 정책, 세대와 세대를 연결하는 가교 역할을 해 나갈 수 있도록 남은임기 동안 최 선을 다하겠습니다”"}]}, {"id": "95-30", "no": 95, "label": "2025 여름호", "corner": "회원 소식", "title": "회원 소식", "author": "", "start": 30, "end": 33, "pages": [{"p": 30, "t": "장과 경영에 선제적 으로 도입해 그린 스마트 경영 실 현 에 나섰다 특히 첨단 기 술을 현 상에 접목해 인 구감소, 이상기후등의 복합적 인 대외 여건에도 능동적으로 대응하고 있다. 대표적인 사례가 서 부 하수처 리장에 도입 된 스마트 하수처리장 사 업' 이 다. 한국판그 린뉴딜의 핵 심사업 중 하나인 이 사 업은2020년 환경부 시 범사업 으로 선 정 돼 지난해 11월 말준공 및 시운전을 마치고현재 정상가 스마트 관리체계 를 구축하고 빅데이터 기반시를 적용해 안정적인 하수처 리를 위한 최적의 운영 조건을 도출해 내는 것이 핵 심이다. 이를통해 약 품비, 전력비 등 비용 절감과 하수처리 안정성 등을잡 는다. 공단은 이번 사업 을 계기로그간 축석 해 온 경 험과 기 술을 바 탕으로 환경기 초시설스마트화에 앞장설 방침이다. 공급받던 일부 지역의 지 방상수도 공급계통을 신원배 수지 로 전환 면 일원 등총5개 읍- 면이다. 신 원정수장의 가동에 따른 이번 조치 는 보다 안정적인 수듯물 공급과 효율적인 상수도 시설 운영을 위 한 중상기 계 획의 일 환이다. 이번 수계 전환을 통해 군은 수질 개선 과 함께 수듯물 공급의 안정성과 대응력을 강화할 것으로 기 대 하 고 있다 특히 신원정 수장을 중심으로 한공급 체계는 지역 여 건에 보다 세밀하게 대응할수 있어 장기적인 급수 안정성 확보에도 크 게 기여할것으로 전망된다. 진안군은 누수로 인한 수듯물 손실을 줄이고 유수율을 높이기 위 해 상수관로 점검 을 시 작했다. 이번 조치는 노후관로증가로상수 도 누 수가 늘어 남에 따라효율적인 관망 관리 와 유수율 제고를 위 한 선제 적 대응의하나로 600여 <ㅠㅠ에 달하는 상수관로를 야 간에 집중적으로 점 검하기 위해 마련됐다. 탐사는 전자 누수 탐사장비 와청음 장비를 활용하여 관로 누수 여 부를 정밀 점 검하고 계량기 청음까시 확인하는 방식으로 진행됐다. 진안군은 상수도 사용량이 줄고 외부 소 음이 적은 야간 시 간대를 활용함으로써 탐시 정확도 이번 야간 점검 은 유수율 향상과 상수도 경영 개선 을 위한중요한 작업으로, 진 안군은 앞으로도 지속적인 유지관리와 시설 정비를 통해 안정적인광역 상수도공급 기반을 마련해 나갈 예정이다. 대 구광 역 시 는 6월2일 오후 2ㅅ|,달성군국가물산업 클러 스터 에서 클러스터 활성화와 물산업 입주기업 지원을 위한 현장 간담회 를 개최했다. 대 구시는 환경부와 함께 국가 물산업을 육성하고 물기 업의세계 물시장 진 출을 지 원 하기 위해 지난2019년 달성군구지 면 국 가산업 단지 에 국가 물산업 클 러 스터를 조성했으며, 한국물기 술인증원,국가물기자재성 능인증센터 등 물산업 지원기관을 유치 하여 물기업 의 기 술개발부터 실증, 사업화, 해외 진출까지 전 주기 를 지 원하고있다. 이번 간담회는 국가물산업클러스터 입 주기업 협 석해상호 소통과 협력을 강화하고, 물산업 현 안에 대한 해 법 을 함 께 모색하기 위해 마련됐다. 대 구광역시는 앞으로도 현장 중심의 나갈 계획이다 진안군 야간 누수탐사 실시 대구광역시 물 산업분야 현장 간담회개최"}, {"p": 31, "t": "행에 들어갔다. 이번 개정은 물 재이용 활성화와 하수처리시설의 처리 효율 향상을 위해 공공하수도 운영-관리 기 준을 개선하는 것 이 핵심이다. 환경 부는 유역- 지방환경청과 시사체가 협의할 경우, 최종방류구 이전의 하수처 리수도 재이 용시 설에 공급할수 있도록 기 준을 완화했다. 이를통해 많은 비가 내려도 안정적인 수질 의 재 이용원수 확보가 가 능해셨다. 또한, 하수 공급이 필요한 시설과 연 구기관에 대해서도 기 준이 개정됐다. 예를 들어, 폐수처리시설이 시운전을 위해 하수를 요청하거나 대학-연구기관 등이수처리 기 술 연구 목적으로 하수를 요청하는 경우, 최종방류구를 거치지 않 은하수도 제공이 가 능해졌다. 이번 개정을 통해 하수재이용 기반 이 안정적으로 구축됨에 따라 산업단지 내 공업용수 등 다양한분 야에서 물 재이용이더욱 활성화될 것으로 전망된다. 환경부는5월12일, 반도체디스플레이업계 협회 및 주요 기업과 함께 비즈허브서 울센터에서 실무협의체 회의를 개최했다 환경부 는 그간용인 첨단반도체 클러스터 용수공급 등 물관리 분야를 비 롯해 기 후변화- 화학안전 등 정책 분야에서 반도체- 디스플레이업 계와 긴밀히 협 력해왔다. 이러한 토대에서 산업 계와의 소통을 강 화하고, 환경과 관련한 기 업의 현안을 보다 적극적으로 논의하기 위해 물이 용정책관실을 중심으로 이번 협의체를 구성했다. 이날 업계의 의견을 수렴하고 변동성이 커진 현 경제 여건에서 환경 정 책과 기 업의 경쟁력이 상생할 수 있도록 깊이 있는 논의를 진행했 다. 환경 부와 반도체- 디스플레이 업계는 앞으로도 세부적인 이 행계 획을 설성하고 정기적인 논의뿐만 아니라 수시 개별 논의를 통해 실질적 성 과 를 도출할 수 있도록 소통할 계 획이다. 대응 실 무협의체회의개최 환경부기 후위기 환경부는 캄보디아와 물관리 협력을 강화하고국내 물산업의 현지 지난 3월 대전에서 개최 된 제3차 한-메콩 국제 물포럼'과 캄보디 아는 기 후변화로 인해 홍수: 가 붐에 취약하고 상' 하수도 보급률은 각각 29%, 47% 수준으로 낮다. 향후 수자원 인프라, 상하수도확 충, 수실관리 등 물산업 수요가 크게 증가할 것으로 예상되는 나라 다. 이에 환경부는 이번 물산업 협력 사절단 파견을 계기로 최고위 급 대화 를 통해 물관리 협력 체계를 강화하고, 인 공지능!) 홍수예 보 등 우리나라주요 물산업 정책의 수출을 추진했으며, 우리나라 기 업들이 캄보디아물문제 해결에 주도적으로 기 여하며 성장할수 있도록지속지원할 예 성이다. 범 부처 협 력 방안'을 주제로2025년 제2차 정기 연구토론회를 개 최했다. 이번 토론회는 이상기온,가 몸 등 기 후변화로 인한녹조 발 생 증가가 우려되는가운데, 실효성 있는저감 대책 마련을 위해 마 련됐다. 토론회에서는 기 후변 화에 따른 녹조 발생 예측과2025년 환경부의 녹조 저감 정책 방향, 기 후변화 조건에서의 협력적 녹조 대응 방안, 현장 대응 및 녹조저감신기술동향등 네 가지 주제 발 표가 이 뤄셨으며, 각 기 관의 역할과 협업 방향을 구체화하는 시간 이 마런됐다 녹조는 수실, 기후, 생태 등다양한 요인이 복합적으로 작용해 발생하는 만큼, 부처 간 협력이 필수적이다. 이에 따라 이번 토론회에서는 실효적인 정책과 대응 방안을 모색하는 논의가 진행 됐다 국가물관리위원회는 앞으로도기 후위기 시 대에 대응하는통 합 물관리 정책을 시속추진할 방침이다. 국가물관리위원회"}, {"p": 32, "t": "국내 대표 환경 기업인 리뉴어 스(주)가 노동조합과 함께 사회공헌 프로그램 사랑의 폐 배터리 기부 행시'를 개 최했다. 환경보 호와 자 원순환 중요성에 대한 사회적 인식을 높이고 미래 핵심 산업인배 더리 재활용 활성화를 위해 (사)한국배터리순환자원협회와 업무 협약을 체결한 바 있는 리 뉴어스는 전국 61곳 사업 소 에서 64용지 상사 11개 분량의 폐배터리를 모아 협회에 전달했으며, 이를 새 건 전지로 교환했다. 노사상생 프로그램의 일환으로 진행된 이번 행 양의집'에 전달하는 행사를 진행한 것이다. 이번 기부 행사에서는 을 펼치며 지역사회 발전에 이바시해왔다. 앞으로도 리 뉴어 스는 지속적인 사회공헌 활동을 통해 나눔 문화 를 이어갈 계 획이다. ( 수) 한국종합기술이 성환 공공하수처리장 기 존시설 감리 사업의 수행자로 선정됐다. 한국송합기술은 이번 수주를 통해 성환 공공 하수처리장의 기존 시설을 개량 및 4단계 증설 민간투자사업 감독 권한대행 등 건설사업관리를 수행하게 된다. 컨 소시엄에는 삼안과 드림 이 포함됐다. 이번 사업의 기 초 금 액은60억3520만 원으로 프교체 능의 건설사업관리를 수행할 방침이다. 사회공헌 프로그램개최 60억 규모 사업 수주 관하며 환경부가 후원하는 이 프 로 그 램은2020년부터 추진해온 플라스틱 자원순환생태계 구축프로젝트 '마이 60[000'의 일환이 다. 이번 47|에서는 폐플라스틱 의 수거- 선 별- 원 료화 분야에서 전 네트워킹, 연구소 자문, 제품 테스트 기회 등이 제공된다 또한 대 한민국 656 친환경 대선\" 박람회 참가 기 회도 주어진다. 롯데케미 칼은 앞으로도 자원순환 생태계 구축과 플라스틱 문제 해결을 위 입을 추진하고 이를 공식 화 하며, 656 경영을 확산하고 있다. 일토 씨엔엠은6월5일 제33주년 창립기념식을 맞아 임직원을 대상으 하겠다고 공표했다 아울러 대학교를 입학하는 사녀에게는 인원에 상관없이 매년 일정 금액의 학사금을 시원하는 정책을 도입하기로 하는 등 직원 복지를 위한구체적인 지급 기 준과 내용을 사규 에 준 력 하며 우수한 인재발굴을 통한 양실의 일자리 창출에 힘써 왔다 앞으로도 시역경제 활성화와 환경기 술의 선신화를위해 656 경영 자원순환 스타트업 지원 임직원 대상 출산장려금도입"}, {"p": 33, "t": "이재명 정부의 환경정책 수원시상수도사업소 글로벌상하수도 맑은물을위한 국내외 산업 통아보기"}]}, {"id": "95-34", "no": 95, "label": "2025 여름호", "corner": "지구를 위한 약속", "title": "이재명 정부의 환경정책 청사진", "author": "", "start": 34, "end": 35, "pages": [{"p": 34, "t": "만 이근, 우수사, 사가 1.ㅜ-ㅡ~ {한민국의 대전환이 시작 된다. . |국민생활의 전면 적. 전환을 체적 이행 일 아저 1 은 0슬 가자 가이 602 라우 환이 시 작된다. 느 77 사림 \" 은로 설계되었다:"}, {"p": 35, "t": "기장 먼저 눈에띄는 것은 2030년 온실가스 감축목표 이행 과 2035년 이후 로드맵 수립이다 선진국으로서의 책무에 걸맞게 탄소 감축을 과학적으로 설계하겠다는 것이다. 이는 이에 따라 정부는 책임 있는 중간목표를 명시한 법 개정을 추진한다. 이 같은 노력을 국제사회에 천명하기 위한 상징 탄소중립 산업으로혁신 드라이브' 이번 공약에서 또 하나주목할점은 탄소중립과 산업경쟁력 을 동시에 달성히러는 전략이다 단순한감축을 넘어 산업구 조의 혁신을 지향한다 태양광 풍력 전기차 배터리 수전해 쟁력제 고가 핵 심 이 다. 특히 100 산업 단지 조성 은 글로벌 기후규범에 대응할수있는 국내 수출 기업의 역량을 뒷받침 다
