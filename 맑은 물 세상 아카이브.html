최성현 물산업인재교육원장, 강준구 하수도처장 등 협회 이어서 물산업의 핵심 의제를 다루는 전문 세션이 진행됐다. 기후에 5개 처원장이 한자리에 모여, 회원들의 질문과 건의 사항에 대해 성심 너지환경부 이승현 수도기획과장은 2026년 역대 최대 규모인 4,077 성의껏 답변하며 현장의 목소리를 경청했다. 이 자리는 협회가 단순 억 원을 노후 상수도 정비에 투입하는 등 인프라 현대화 계획을 밝혔 한 관리 기구를 넘어 현장과 함께 성장하는 핵심 플랫폼임을 확인시 다. 한국환경연구원 한혜진 선임위원은 극한 가뭄에 대응하여 수원 켜 주었다. (水源)을 다각화하는 ‘워터 믹스(Water Mix)’ 전략을 제시하며, 기후변 화에 강한 회복력 있는 물관리 체계를 강조했다. ㈜그린텍아이엔씨 이태훈 부장은 정수장 및 하수처리장에 적용된 AI·DT 통합운영관리 붉은 말의 굳센 기운으로 도약할 2026년 시스템의 실질적인 성과를 공유하며 지능형 물관리가 현실화되고 있 음을 입증했다. 마지막으로 ㈜건화 나승욱 전무는 베트남 하이퐁 및 뜨거웠던 논의와 소통의 장은 이튿날 진행된 미디어 아트 관람과 요트 에콰도르 산토도밍고 상수도 사업 등 해외 진출 성공 사례를 통해 실 투어로 이어지며, 인천의 정취 속에 회원 간의 화합을 다지는 뜻깊은 질적인 글로벌 시장 공략 노하우를 전수했다. 시간으로 마무리되었다. 이날의 한마디 “2025년의 복합적인 위기 속에서도 헌신을 다해 국민에게 깨끗하고 안전한 물을 공급한 회원들의 노고에 깊이 감사드린다. ‘붉은 말의 해’인 2026년 병오년에도, 이번 워크숍에서 확인한 연대와 혁신적인 기술력이 거센 기후 위기의 파고를 넘어 대한민국 물산업을 새로운 도약으로 이끌어줄 것을 기대하며, 회원 모두의 건강과 행복을 기원한다.”"}]}, {"id": "97-16", "no": 97, "label": "2026 신년호", "corner": "FOCUS KWWA 2", "title": "협회소식", "author": "", "start": 16, "end": 17, "pages": [{"p": 16, "t": "Water Mark _ FOCUS KWWA 2 협회소식 물 회복력(Water Resilience)으로 기후위기에 함께 대응해 나가다 한국상하수도협회(협회장 유정복 인천광역시장, 이하 ‘협회’)는 지난 9월 27일부터 10월 1일까지 시카고의 맥코믹 플레이스 컨벤션센터 에서 미국물환경연합(이하 WEF)가 주최하는 기술 전시·컨퍼런스인 WEFTEC25에 참여해 MOU를 체결했다. WEF는 전 세계 3만여 명의 물 전문가들이 참여하는 비영리 전문기관으로, 설립 이래 하·폐수 처리, 수질 보호, 물산업 혁신을 위한 지식·정책·기술 교류를 선도해 왔다. 매년 미국의 최대 물산업 행사인 WEFTEC을 개최하며, 글로벌한 물 문제 해결과 지속가능한 물 환경 구축을 위해 다양한 프로그램을 운영하고 있다. 물 문제 관련 공통 주제 논의를 위한 활발한 교류방안을 마련하는 것 협회와 WEF의 업무협약은 2014년 첫 체결한 이후 이번이 두 번째다. 에 중점을 두었다. 이번 협약을 계기로 양 기관은 국제 컨퍼런스와 전 기존 협약이 상호 정보교환과 시설견학 지원 등의 목적으로 체결됐 시 플랫폼인 협회의 WATER KOREA(대한민국 국제물산업박람회)와 다면, 이번 협약에서는 협회의 유명수 상근부회장과 WEF의 랄프 에 WEFTEC을 기반으로 새로운 프로젝트를 함께 고민하고, 글로벌 물 릭 엑스턴 사무총장, 존 이케다 사업총괄 임원이 직접 참여해 양국의 문제에 공동 대응할 예정이다. 몽골 울란바토르시 상하수도청과 물산업 협력 논의 한국상하수도협회(협회장 유정복 인천광역시장, 이하 ‘협회’)는 지난 2025년 11월 3일부터 6일까지 3박 4일간 몽골 울란바토르 지역을 방 문하여 울란바토르시 상하수도청(USUG)과 물산업 협력 방안을 논의 하고 주요 상하수도 인프라 현장을 살폈다. 이번 방문은 국내 물기업의 해외진출 지원과 한국-몽골 간 물산업 협 력 네트워크 구축을 위한 사전 교류 성격으로 추진되었으며, 유명수 상 근부회장은 투르후(TURKHUU) 청장 및 다가바수렌(DAGVASUREN) 부청장 등 주요 인사들과 간담회를 통해 상하수도 정책·기술 교류 및 하수처리분야 전문인력 교육, 공동 프로젝트 발굴 등 협력 방향에 대 해 의견을 나누었다. 또한 내년 개최 예정인 WATER KOREA 2026(대 한민국 국제물산업박람회) 행사에 울란바토르시 상하수도청장을 공 협회는 앞으로도 해외 물시장 진출을 희망하는 국내기업과 해외 기관 식 초청했으며, 양 기관은 WATER KOREA 2026을 계기로 MOU를 체 간 네트워크를 촘촘히 연결해, 국내 물기업의 해외판로 개척과 우리 결하고 정기적 교류를 지속적으로 확대하기로 의견을 모았다. 물산업의 경쟁력 제고를 위해 지속적으로 노력할 예정이다."}, {"p": 17, "t": "신년호 한국상하수도협회, 2025년 고용노동부 산업별역량체계 (SQF) 구축사업 참여 우수상 수상 한국상하수도협회(협회장 유정복 인천광역시장, 이하 ‘협회’)는 지난 11월 21일 고용노동부가 주최하고 한국산업인력공단이 주관한 ‘산업 별 역량체계(SQF) 성과발표회’에서 물산업 직무·역량 국가표준체계 구축사업 성과를 높이 인정받아 우수상을 수상했다. 협회는 미래 녹색인재 적기 양성과 종사자들의 지속 가능한 경력개발 지원을 위해 2020년부터 고용노동부와 한국산업인력공단 지정·승 인으로 환경 인적자원개발위원회(이하 환경 ISC)를 운영하고 있다. 그 간 기후, 대기, 토양, 지하수, 자원순환 등 녹색산업 분야별 직무·역량 을 구조화해 국가표준으로 정립하고, 현장 수요를 반영한 교육·훈련 과 자격의 고도화를 위해 다양한 사업을 추진했다. 올해에는 산업현장 유명수 환경ISC 위원장(협회 상근부회장)은 “환경ISC와 협회는 앞으 에서 통용되는 직무를 기준으로 수준별 요구역량, 경력이동체계를 설 로도 녹색산업 전 분야의 청년인재 양성과 지역별 맞춤형 인적자원개 정하고 현재 운영 중인 교육·훈련과정 및 자격제도와 연계하는 역량 발 등 현장의 요구를 반영하고 정부 정책 실현을 지원하기 위한 노력 인정방안(Qualification Map) 마련 사업을 진행했다. 을 지속하겠다”고 수상소감을 밝혔다. 제1회 WATER KOREA 대학(원)생 물 연구 논문 공모전 개최 한국상하수도협회(협회장 유정복 인천광역시장, 이하 ‘협회’)는 지난 10월 12일부터 12월 15일까지 「제1회 WATER KOREA 대학(원)생 물 연구 논문 공모전」 참가자를 모집했다. 이번 공모전은 물산업과 물기 술분야의 미래인재 관심 유도와 국내 연구 활성화를 위해 추진되는 것으로 협회가 주관하고 (사)한국물환경학회, (사)대한상하수도학회 가 공동 주최했다. 논문 주제는 탄소중립과 기후위기 대응을 위한 ‘AI 및 탄소중립 기술 을 접목한 상하수도 인프라’, ‘기후 위기 시대의 지속 가능한 물환경 상하수도 기술’ 등이었다. 공모전 수상팀 최종순위는 부산 벡스코에 ※ 논문 공모전에 참가를 희망하는 대학(원)생들은 (사)한국물환경학회 논문 서 개최하는 WATER KOREA 2026(대한민국 국제물산업박람회)에서 제출처(kswe_contest@naver.com)로 논문을 제출해 신청할 수 있으며, 논문 2차 발표 심사 후, 1차 서류심사 및 2차 발표심사 점수를 합산해서 결 공모전과 관련된 상세 일정은 (사)한국물환경학회 홈페이지에서 확인 가능하다. 정된다. 10편의 수상작에 대하여 대상(1팀, 300만 원), 최우수상(2팀, 각 200만 원), 우수상(7팀, 각 100만 원)을 수여한다."}]}, {"id": "97-18", "no": 97, "label": "2026 신년호", "corner": "FOCUS KWWA 3", "title": "2026년 1분기 교육일정", "author": "", "start": 18, "end": 21, "pages": [{"p": 18, "t": "Water Mark _ FOCUS KWWA 3 물산업인재교육원 2026년 1분기 교육일정 분야 과정명 법정 교육 교육정원 수강료(원) 1월 2월 3월 23-27 수도시설운영기본과정 340,000 9-13 적으로 개발·생산되기 시작했다. 주성분인 탄소(C)와 불소(F)가 강력하게 결합된 안정적인 화학물질로 자연 상태에서는 잘 분해되지 않는다. 분해하려면 1,000℃의 고온과 고압 에서 소각해야 하는데, 이때 PFAS의 일부가 대기 중으로 방출되니 완벽히 분해되는 것도 아니다. ‘영원한 화학물질’이라 불리는 이유가 여기에 있다. PFAS의 유해성은 개발 후 50년이 지나서야 발견됐다. PFAS에 노출되면 항체 반응이 감소하고, 콜레스테 롤이 비정상적으로 높은 이상 지질혈증 등이 나타난다는 보고가 잇따른 것이다. 미국 과학공학의학한림 원(NASEM)에 따르면 영유아와 태아의 성장 감소, 신장암 위험 등과도 연관성이 있는 것으로 나타났다. 당뇨병, 비만, 심혈관 질환 등의 위험을 높인다는 연구도 이어지고 있다. 유해하다고 무작정 노출을 피하기는 어렵다. PFAS는 이미 식품 포장재와 화장품, 의류, 반도체 등 다양한 산업 분야에 활용되고 있고, 그만큼 다양한 경로를 통해 토양과 하수로 배출된다. 이게 수돗물에 흘러들 며 사람에 악영향을 미친다. 미국 지질조사국이 2016~2021년 미국 전역의 수돗물 성분을 분석한 결과, 미국 수돗물의 45%가 한 종류 이상의 PFAS에 오염돼 있는 것으로 나타났다. 사람의 체내에는 얼마나 머 물까. 미국 질병통제예방센터(CDC)에 따르면 사람의 체내에서 PFOA와 PFOS의 반감기(양이 절반이 되는 데 걸리는 시간)는 3.5~4년가량으로 체류 시간이 길다. 국내에서는 공식적으로 환경 모니터링을 통해 2018년 낙동강 정수장에서 처음 검출됐다. 이후 국립환경 과학원은 PFAS 3종에 대해 먹는물 수질감시기준(PFOA 70ng/L 등)을 설정해 모니터링해 정보를 공개하 고 있는데, 지금까지 현행 수질감시기준을 초과한 사례는 없다. 다만 미국, 유럽연합(EU), 일본 등 주요 선 진국이 PFAS의 인체 유해성을 인지하고 관리 기준을 대폭 강화하는 추세이다 보니 국내에서도 이를 고려해 국회, 언론, 학계 등에서 정수장 PFAS 관리를 강화할 필요가 있다는 문제가 제기되고 있다. 지난 10월 30일 서울 중구 소재 더플라자호텔에서 열린 ‘수돗물 과불화화합물(PFAS) 대응 전략 포럼’ ‘과불화화합물’이 건강에 미치는 영향 은 2028년까지 안전한 수돗물을 공급하기 위한 수질 기준 강화 계획을 마련하고, 세부 이행 과정을 구체 화하기 위한 과정의 일환이다. 한국수자원공사, 국 립환경과학원, 지자체 및 학계·업계 관계자 100여 명이 참석한 이날 포럼에는 ‘수돗물 과불화화합물 수질기준 강화 계획’, ‘과불화화합물 정수처리기술 해외동향 및 국내 적용방안’, ‘광역상수도 과불화화 합물 대응방안’, ‘상수도 과불화화합물 대응 기술개발 사업(R&D)’ 등 4건의 주제 발표가 진행됐다. 이어서 수질기준 마련에 대한 심도 있는 토론도 열렸다."}, {"p": 24, "t": "Water Dream _ 워터 이슈 수돗물 과불화화합물 대응 전략 1. 수돗물 과불화화합물 수질기준 강화 첫 번째 발제를 맡은 최인철 국립환경과학원 연구관은 수돗물 PFAS 기준 강화를 위해 분석 기술 고도화, 모니터링 확대, 위해성 평가라는 세 가지 축을 중심으로 2028년까지 단계적으로 추진한다는 계획을 밝 혔다. 첫 번째로 언급한 것은 분석 능력의 획기적 고도화이다. 현재 감시 항목인 3종 PFAS에 대한 정량 한계는 5ng/L 수준이나, 이를 선진국 수준에 맞춰 1ng/L까지 대폭 낮추는 방안이 추진된다. 둘째로 모니 터링 대상과 범위를 전면 확대한다. 모니터링 대상을 대규모 정수장(5만㎥/일 이상) 101개소에서 향후 전 국 427개 모든 정수장은 물론 마을상수도, 소규모 급수시설, 먹는샘물까지 조사 범위를 넓힌다는 계획이 다. 셋째로 종합 위해성 평가를 통한 기준값 도출 계획이다. 2027년까지 충분한 먹는물 조사 결과를 확 보한 뒤 WHO, 미국, 유럽 등의 독성참고값과 국내 여건을 고려한 통합 위해성 평가 연구를 수행한다. 이 를 통해 신뢰도 높은 독성참고값을 확정하고 분석 가능성, 처리 가능성, 비용 편익 등을 종합적으로 검토 해 최종적인 법적 수질기준(안)을 2028년에 마련할 예정이다. 2. 해외 동향과 국내 적용 방안 두 번째 발제에 나선 이윤호 광주과학기술원 환경·에너지공학과 교수는 ‘과불화화합물 정수처리기술 해 외 동향 및 국내 적용 방안’을 주제로 발표했다. PFAS 정수처리의 상용 분리 기술인 입상활성탄(GAC), 이 온교환수지(IX), 나노여과(NF)·역삼투(RO) 막여과 수처리 기술이 미국과 유럽, 일본 등 해외에서 어떻게 적용되는지 일목요연하게 살펴봤다. 예컨대 최근 미국과 유럽 등지에서 입상활성탄과 이온교환수지 도 입이 크게 늘고 있다는 점, 지표수 처리에 활성탄을 적용한 미국 노스캐롤라이나주 월밍턴의 스위니 정 수장, 지하수 처리를 위해 소규모 정수장에 이온교환을 적용한 유럽 벨기에 등 풍부한 해외 동향을 소개 한 후 이 교수는 국내 적용 방안을 타진했다. PFAS의 제거 효율을 높이려면 활성탄 공정의 최적화가 필요 하다는 점은 물론, 미국과 유럽에서 PFAS 처리 기술의 상용화 단계에 진입한 점을 감안하면 국내 역시 기 술의 경쟁력을 위해 수처리 대응 연구개발(R&D) 투자가 필요함을 강조했다. 3. 광역상수도 과불화화합물 대응 방안 과불화화합물 정수처리 전략 및 기술 2단계 전략 분리·농축 무해화: 무기화/고정 Mature 활성탄(GAC) 이온교환(IX) 거품분획(FF) Experimental 기술개발단계 (K-water) 수돗물품질부장은 ‘광역상수도 과불 화화합물 대응 방안’을 주제로 광역정수장의 분해·무해화 막여과(NF, RO) 과불화화합물 대응 현황과 함께 대응 전략을 소개했다. 전은주 부장이 언급한 한국수자원 공사(K-water)의 대응 전략은 ‘사전 준비-처리 열분해 강화-기술 개발-무해화’로 구성된 K-water형 전기산화 신규흡착제 PFAS 대응전략 ‘K-PFAS OUT’이다. 자체 모 고도환원 플라즈마 초음파 초임계산화 광촉매 니터링 강화, 감시·분석기술 고도화를 통해 취약정수장을 선별하는 ‘사전 준비’ 단계, 표 미생물분해 Not Viable 세 번째 발제를 맡은 전은주 한국수자원공사 현장 적용성 Feasible 준정수처리와 고도정수처리를 통해 효율성 을 개선하는 ‘처리 강화’ 단계, 고압막 등 적용"}, {"p": 25, "t": "성 평가 연구와 활성 K-PFAS OUT 개요 탄 재생기술 고도화, 활성탄 수급의 다변 화를 통해 수처리 신 기술을 개발하는 ‘기 술 개발’ 단계를 거 쳐 환경 배출을 최소 화하는 ‘무해화’ 단계 Preparation Fast track Advance Safety 사전 준비 처리강화 기술개발 무해화 자체 모니터링 강화 - \u0007전 정수장 원수 및 정수 월간 40개 항목 - \u0007유역별 대표정수장 정수처리공정 거동분석 표준정수처리 - \u0007분말활성탄 투입 자동화 (사천 등 11개소) 고압막 등 적용성 평가 연구 - \u0007운영인자별 처리효율 평가, 최적 운영방안 마련 활성탄 재생 시 응축수 - \u0007축열연소산화설비(RTO) 등 활용, 고온소각 후 에너지 회수 활성탄 재생기술 고도화 - \u0007PFAS 처리 세부 운전기준 감시·분석기술 고도화 - \u0007LC MS 기반 실시간 분석 장치 고도정수처리 - \u0007전 정수장 고도 도입 확 대 - \u0007활성탄 교체 강화 (6년 ⇢ 1~3년) 취약정수장 선별 처리효율 개선 수처리 신기술 야자계 등 활성탄 수급 다변화 고농도 고압막 농축수 - \u0007광촉매, 저온플라즈마, 생분 해 등 배출수 처리기술 개발 (국가과제 참여) 에 입성한다는 계획 이다. 4. \u0007상수도 과불화화합물 대응 기술개발사업 네 번째로 발제에 나선 문상기 한국환경산업기술원 수석연구원은 ‘상수도 과불화화합물 대응 기술개발 사업’을 주제로, 과불화화합물 전함량 분석 및 감시기술개발(2026년 4월〜2030년 12월)과 과불화화 합물 제거 및 무해화 기술개발(2026년 4월〜2030년 12월) 등 2건의 기술개발사업을 설명했다. 더불어 수돗물 수질기준 강화에 대응해 현장에 적용 가능한 하이브리드 멤브레인 기술, 고효율 흡착소재 개발, 활성탄 처리기술 고도화, 전기화학, 플라즈마 등 과불화화합물 제거를 위한 실효적인 기술개발이 시급함을 강조했다. 2028년까지 PFAS 수돗물 수질기준 마련 전문가 토론에서는 독고석 단국대학교 교수가 좌장을 맡고 이승현 기후에너지환경부 수도기획과장, 김 경현 국립환경과학원 물환경연구부장, 맹승규 세종대학교 교수, 양지연 연세대학교 교수 등이 패널로 참 석, 수질 기준 마련에 따른 유의사항 등에 대한 심도 있는 의견을 나누었다. 과불화화합물 관리와 같은 사전 예방에 초점을 둔 정책은 정부, 지자체, 학계, 산업계 등이 과학적 근거에 기반을 둔 정책 거버넌스를 통해 실효성 있는 기준을 마련하는 것이 중요하다. 우리 정부는 이러한 과정을 거쳐 2028년까지 PFAS에 대한 수돗물 수질기준을 마련할 것을 새정부 국정과제에 반영했다. 2시간 여 진행된 이번 포럼에서 확인할 수 있었던 것은 국민의 안전과 건강을 위한 마음이다. 각계각층 의 마음들이 모였으니 이제 행동하고 실천할 시간이다. 과불화화합물은 앞서 언급했듯 자연적으로 잘 분 해되지 않아 ‘죽지 않는 좀비 화학물질’이라고도 불린다. 이 좀비를 극복하려면 사태를 신속하게 파악하 고 상황 개선을 위해 가슴과 머리를 맞대야 한다. 정부·지자체·학계·산업계 등 각계각층이 과학적 근거와 협력을 바탕으로 함께한다면, 우리는 국민 모두에게 지금보다 더 안전하고 깨끗한 수돗물을 제공하는 미 래를 맞이할 수 있다. 참고자료 1. < \u0007 [창간 21주년 특집] Ⅱ. 수돗물 과불화화합물 대응 전략>, 워터저널, 2025.12.08. https://www.waterjournal.co.kr/news/articleView.html?idxno=84095 2. 수도기획과, <기후에너지환경부, 과불화화합물 수돗물 수질기준 마련 계획 발표>, 기후에너지환경부, 2025.10.30. 환경배출 최소화 출처: 워터저널"}]}, {"id": "97-26", "no": 97, "label": "2026 신년호", "corner": "티타임 1", "title": "㈜한양하이텍", "author": "", "start": 26, "end": 29, "pages": [{"p": 27, "t": "신년호 ㈜한양하이텍은 현장의 문제의식에서 출발한 기업이다. 김윤기 대표는 25년간 상수도 시공 현장을 지켜보며 노후화된 티타임 상수도의 현실을 깊이 고민해 왔다. “현장을 가장 잘 아는 사람이 혁신을 만들어야 한다”라는 신념 아래, 김윤기 대표는 배관 기술 개발과 제조에 본격적으로 뛰어들었다. 새로운 제품과 기술을 개발하는 과정에서는 적지 않은 어려움이 있었지만, 전 직원의 지속적인 노력 끝에 국내 최초의 이중수밀 조인트, 스마트 더블락 누수감지 파이프(ICT 융복합 파이프) 등을 선보이며 상수도 분야에 새로운 패러다임을 일으키고 있다. “혁신으로 물길을 바꾸다” ㈜한양하이텍의 도전 스마트 더블락 누수감지 파이프 사후 예방이 아닌 사전 예방으로 ㈜한양하이텍의 혁신 우리는 누구나 깨끗하고 안전한 물을 마실 권리가 있다. 이를 위 악하기 어려웠던 상수도의 이상 징후를, 자체적인 통신 기술로 해서는 도시의 상수도가 안정적으로 유지되는 것이 중요한 가운 감지해 문제를 사전에 예방할 수 있도록 한 제품이다. 데. ‘튼튼한 상수도’란 사고가 전혀 없는 상태가 아니라, 이상 신호 이 파이프는 누수감지 스마트 태그를 배관 내부에 일체형으로 를 조기에 감지해 문제가 커지기 전에 대응할 수 있는 시스템을 탑재한 ICT 융복합 구조로, 전선이나 배터리 없이도 땅속과 무선 의미한다. 으로 통신할 수 있다는 점이 특징이다. 기존처럼 통신선·전원선· 그러나 상수도는 아주 ‘은밀’하다. 일단 매립되고 나면 관심에서 제어함을 별도로 설치할 필요가 없어서 추가 시공이 요구되지 벗어나기 쉽다. 유지관리는 대부분 배관공의 숙련도에 의존하지 않으며, 평소에는 Sleep 상태로 있다가 문제가 감지될 경우 약 만, 현장의 인력은 만 65세 이상으로 고령화되고 있으며, 인력난 0.3초 만에 구동되는 신속성을 지녔다. 도 심해지고 있다. 이러한 구조적 현실 속에서 상수도 문제, 예컨 김윤기 대표는 “기존 유선 누수감지 시스템은 대규모로 도입하 대 누수 문제와 이를 통한 싱크홀 문제를 사전에 방지하는 시스 기에는 비용 부담이 매우 큽니다. 이러한 구조적 한계를 보면서, 템을 만드는 일은 오랫동안 쉽지 않은 과제였다. 추가 비용 없이 파이프 시공만으로 스마트 기능을 구현할 수 있 ㈜한양하이텍은 이 부분을 먼저 선점해서 상수도의 스마트화를 는 기술이 필요하다고 판단했습니다. 그리하여 개발한 이 파이 선도하려고 한다. ICT 기술을 융합한 새로운 형태의 수도배관 자재 프는, 첫째, 1차 누수가 발생해도 외부로 물이 새어 나가지 않고 를 선보이며 가스관, 송유관, 화학배관, 산업배관 등 기간산업의 2차 수밀부에서 누수를 차단해 지반침하와 같은 2차 피해를 방 전 분야로 진출하기 위해 원천 기술 확보에 만전을 기하고 있다. 지합니다. 둘째, 1차 누수가 발생하는 즉시 2차 차단과 더불어 조 특히 다양한 제품 가운데 가장 주목받는 것은 국내 최초로 개발 인트 내부에 삽입된 스마트 태그가 누수를 감지합니다. 따라서 한 스마트 더블락 누수감지 파이프다. 땅속에 매립된 후에는 파 외부 누출 없이 누수를 감지할 수 있습니다.”"}, {"p": 28, "t": "Water Dream _ 티타임 1 상하수도 분야의 스마트화를 선도하겠다는 포부로 특히 현재, 스마트시티가 전 세계적인 화두가 되면서 우리나라 을 혁신한다는 사명감이 느껴졌고, 저 역시 차츰 그 의미에 깊게 에서도 상하수도 분야의 스마트화를 추진하고 있다. 한국상하수 공감하게 됐습니다. 귀국 후 본격적으로 기술 개발에 뛰어들게 도협회가 매년 여는 WATER KOREA (대한민국 국제물산업박람회) 됐죠.”라고 이야기했다. 에서도 스마트 상하수도 기술을 필두로 한 스마트시티에 대한 물론 개발은 난관의 연속이었다. 지중에 매설된 파이프와 무선 이야기가 부쩍 늘어나는 추세다. 그러나 아무리 기술이 우수해 으로 통신이 가능해야 하고, 전원 없이 작동해야 하는 기술적 요 도 설치가 복잡하거나 비용이 높으면 채택되기 어렵다. 김윤기 구사항은 국내외 어디에도 선례가 없었기 때문이다. 대기업과 대표는 현장의 경험을 바탕으로 제품을 개발하는 데 노력했으 전문기관을 찾아가 기술 자문을 요청했으나 번번이 거절당했고, 며, 함께 회사를 끌어 나가고 있는 김남재 CTO는 기술 연구를 통해 결국 직접 R&D를 하기로 결심했다. 대기업 수준의 처우를 제시 현장에서 신속하게 사용할 수 있는 편리성과 경제성을 도모하며 하기는 어려워 핵심 인재를 들이는 것도 쉽지 않았으나, 사명감 시너지를 더했다. 을 공유하며 지속적으로 설득하자 前대기업 연구원과 엔지니어, 사실 ㈜한양하이텍은 부자가 운영하고 있다. 김남재 CTO는 원래 학계 전문가 등 각 분야의 최고 연구자들이 뜻을 함께해 드림팀 컴퓨터공학을 전공하고, 미국에서 AI와 블록체인 플랫폼을 연구 을 구성할 수 있었다. 김윤기 대표는 “이 드림팀과 함께 최근에는 한 뒤 사업을 준비하고 있었으나, 김윤기 대표의 설득에 합류 관 꺾임 시공을 예방하고, 협소한 도시 현장에서 시공성을 대폭 하게 됐다고. “국가 인프라 산업의 스마트화를 우리 손으로 실현해 개선할 수 있는 가변각 조절 엘보 등 새로운 배관 기자재도 연이어 보자. 국민의 안전과 혁신을 우리가 기술 개발로 만들어 보자는 출시했습니다. 앞으로 상수도 문제 해결을 위한 종합적인 솔루션 말로 저를 설득하셨어요. 단순한 사업이 아니라 국가 기반시설 을 제공하려 합니다.”라고 이어 말했다. 김윤기 대표"}, {"p": 29, "t": "신년호 Water+AI 데이터를 바탕으로 더 나아갈 물의 미래 어느 때나 중요하지 않은 시기는 없겠지만, 2025년과 2026년은 ㈜한양하이텍에 더욱 특별한 의미다. 조달청에 제품을 제출할 당시, ㈜한양하이텍이 개발한 ICT 융복합 파이프는 기존 조달 품목 체계에도 없던 전혀 새로운 개념의 제품이었다. 조달청에 해당 품목을 직접 신설 요청해 제도화하고, 조달청 스마트시티 분야 에서 관망 자재로는 국내 최초로 혁신제품이 지정되는 등 유사 기술이 없던 영역에서 원천기술 개발과 사업화를 동시에 추진해 왔다. 이러한 중요한 시점에 한국상하수도협회에 신규 가입한 것은 자연 김남재 CTO 스러운 선택이었다. 김남재 CTO는 “이러한 변화의 시점에서 한 국상하수도협회에 가입한 것은 매우 의미 있는 선택이었습니 다. 협회를 통해 상하수도 산업 전반의 변화 방향을 함께 논의하고, 기술 개발 기업의 목소리를 전달할 수 있기를 기대하고 있습니다. 기술과 직원이 함께 발전하는 회사 또한 정책·기술 동향, 국내외 인프라 투자 흐름 등 다양한 정보를 체계적으로 제공받을 수 있다는 점도 가입을 결심하게 된 이유 ㈜한양하이텍은 자랑할 거리가 많은 기업이다. 우선은 25년간 였습니다.”라고 말했다. 현장에서 직접 뛰며 상수도 현장을 파악한 대표가 있다는 것이 ㈜한양하이텍은 앞으로 원천기술을 기반으로 국내를 넘어 해외 가장 자랑스럽다고 직원들은 이야기한다. 그다음으로는 기술 혁신 시장으로 확장하는 것을 핵심 목표로 삼고 있다. 석유, 바이오, 속도와 실행력이다. 최근 1년여 간 ㈜한양하이텍의 제품이 조달 에너지 분야에는 이미 대한민국을 대표하는 기업들이 존재하지 청 혁신제품에 3건이나 합격하며 조달청 역사상 신기록을 세웠 만, 물산업에는 아직 ‘국가 대표 기업’이라 부를 만한 기업이 없다 다. 제조업 10년 차에 접어들었지만, 자체 브랜드로 제품을 출시 는 점에서 더 큰 의지를 갖고 있다. 김윤기 대표는 “혁신을 통해 대 한 것은 올해가 처음인 가운데 보인 쾌거였다. 그동안 개발한 기술 한민국을 대표하는 물기업으로 성장하고 싶습니다.”라는 포부를 은 주로 타 기업에 기술이전을 하고 로열티를 받거나, 관련 자재 밝혔다. 를 OEM 방식으로 제조·공급하는 형태가 많았으나 2025년부터 또한 ㈜한양하이텍은 ICT 융복합 파이프를 통해 축적되는 데이 는 자체 브랜드로 스마트 파이프 제품을 선보이며 본격적인 첫 터를 기반으로 지능형 인프라 솔루션을 제공하는 AI 기업으로의 걸음을 내딛고 있는 것이다. 전환을 준비하고 있다. 누수 예측 모델, 위험도 시각화, DT, 자동 의사 마지막으로 ㈜한양하이텍은 따뜻한 사내문화를 보유하고 있다. 결정 등 국가 기반시설 관리의 미래를 열 기술을 개발하며 새로 성평등가족부에서 인증받은 가족친화기업이며, ‘가정이 화목해 운 도약을 준비 중이다. 야 회사 일도 잘 된다’라는 김윤기 대표의 철학을 실천해 회식 문 화를 없애고, 직원들이 퇴근 후 가족과 시간을 보내는 것을 가장 중요한 가치로 여긴다. 사내 야유회도 직원 개인이 아닌 부부나 가족 동반 여행으로 기획해 ‘가족이 우선이다’라는 철학을 회사 전체가 공유하고 있다. 김윤기 대표는 “이러한 문화가 자리 잡아 “물 기업 하면 야 직원들이 회사와 함께 성장할 수 있으며, 기술 개발 과정에서 ㈜한양하이텍을 떠올리는 시대를 도 자연스럽게 책임감과 사명감으로 일하는 분위기가 조성된다 만들고 싶습니다.” 고 생각합니다. 우리 회사의 기술 경쟁력 뒤에는 바로 이러한 건강 한 조직문화가 있습니다.”라고 이야기했다."}]}, {"id": "97-30", "no": 97, "label": "2026 신년호", "corner": "티타임 2", "title": "㈜금강", "author": "", "start": 30, "end": 33, "pages": [{"p": 30, "t": "Write. 채청비 Photo. 황지현 Water Dream _ 티타임 2 ㈜금강은 물이 고이는 곳뿐 아니라, 물이 지나가는 과정에서부터 ‘맑은 물’을 선도하는 회사다. 스테인리스를 기초로 한 제품 티타임 들은 지방자치단체 상수도 관로를 비롯해 상하수도 전반에서 활용되는 중이며, 어느 곳이든 가장 깨끗한 물을 안정적으로 공급하기 위한 기술을 꾸준히 선보이면서 고도화된 기술력을 보여주고 있는 기업이다. 물이 지나가는 길부터 맑고, 깨끗하게! ㈜금강 스테인리스 스폴파이프 직관화 전경 물을 여는 기업 ㈜금강 우리가 매일 마시는 물에서 가장 중요한 가치는 단연 ‘깨끗함’이다. 급수가 가능하다고 판단했다. 그러다 광역 상수도 구간에서 쓰 물이 아무리 좋아도, 그것이 지나가는 길과 머무는 공간이 위생 이는 대형 추출관이나 도복장 강관을 통해 물이 유입되는 대형 적이지 않다면 본래의 가치를 지킬 수 없다. ㈜금강의 기술은 바 탱크를 설치하다 보니, 그 과정에서 녹이나 이물질이 다량 유입 로 이 지점에서 출발한다. 보이지 않는 곳에서 물의 흐름을 책임 되는 문제를 발견했다. 이때부터 물탱크만 스테인리스로 만드는 지는 관로와 설비를 스테인리스 기반으로 전환해 ‘깨끗한 상태 것에 그칠 것이 아니라 물이 지나가는 길목인 파이프 자체를 그대로’ 우리가 마실 수 있도록 만드는 일. ㈜금강은 이 목표를 최 위생적으로 만들어야겠다고 마음먹었다고. 우선에 두고 다양한 제품을 개발하며 파이프와 물탱크 분야에서 처음 개발한 것은 스테인리스와 폴리에틸렌을 결합한 복합관이 전문성을 쌓아왔다. 었다. 그러나 가격 부담이 있었고, 지중 매설 시 토양 부식이나 1998년 진주에서 출발한 ㈜금강은 세계 최초로 스테인리스 금속관의 특성으로 인해 해결해야 할 과제도 존재했다. 보완하 스폴파이프를 개발한 기업이다. 높은 기술력을 인정받아 포스코 기 위해 코팅관 개발에 나섰지만, 폴리에틸렌 코팅은 소형관에 와의 MOU 체결은 물론, 사우디아라비아 네옴시티 프로젝트의 는 적합했으나 대형관에서는 다양한 접목 문제가 드러나는 어려 공식 수도자재로 선정되며 수출을 확대하고 있다. 매해 안정적 움이 있었다. 이후 금강은 그 한계를 넘어서기 위해 폴리우레아 인 성장을 견인하면서 보다 위생적이고 안전한 급수환경을 구축 코팅관을 개발해 왔다. 방만혁 회장은 “지금은 일반 탄소강관 내 하기 위해 끊임없이 노력중인 기업이다. 부에 얇은 스테인리스 관을 합체하는 복합관을 만들고, 외부는 2000년경부터 스테인리스 물탱크 생산을 시작한 이후, 2012년 폴리우레아로 코팅하는 관을 개발하고 있습니다.”라고 밝히며 부터는 파이프 분야까지 영역을 넓혔다. 이유는 확실했다. 초기 향후 계획을 설명했다. 에는 지방 상수도까지는 스테인리스 물탱크만으로도 위생적인"}, {"p": 31, "t": "신년호 “㈜금강의 기술 중심에는 항상 ‘물’과 스테인리스가 있습니다.”"}, {"p": 32, "t": "Water Dream _ 티타임 2 안주하지 않는 기술력과 지속적인 혁신 여러 시도 끝에 얻어낸 결실 방만혁 회장은 줄곧 스테인리스의 중요성을 강조하면서 이야기 물론 어려움도 있었다. 스폴파이프에 사용되는 스테인리스는 두께 했다. ㈜금강의 제품만 보아도 그 철학은 분명하다. 스테인리스 0.5t(0.5㎜)의 매우 얇은 소재다. 여기에 외부 수지를 코팅하고 자재라는 스폴파이프와 스폴조인트, 물탱크 등 주요 제품 대부 냉각하는 과정에서 응축력이 크게 작용해, 초창기에는 원형이 분이 동일한 원칙 위에 놓여 있다. 그렇다면 ㈜금강은 왜 스테인 아닌 삼각형에 가깝게 찌그러진 형태로 제품이 나왔다고 한다. 리스를 선택하게 됐을까. 이후 타원형만 나와도 희망적이라 느낄 만큼 시행착오가 이어졌 우선 스테인리스는 대표적인 친환경·위생 소재다. 내식성이 높아 으나, 끊임없는 개발 끝에 마침내 현재의 완전한 원의 형태로 구 수명이 길고, 물과 직접 닿는 환경에서 가장 안전하게 사용할 수 현할 수 있었고, 품질 인증 등에서도 여러 시행착오를 거친 끝에 있는 재질이다. 염소가스나 결로수, 지하수 유입처럼 까다로운 제품이 완성됐다. 지금은 지난한 시기를 거쳐 안정적으로 회사 조건에서도 안정성을 유지한다. 방만혁 회장은 “처음에는 가격 를 운영하고 있는데, 이 안정적인 운영의 바탕에는 ㈜금강의 기 이 가장 큰 걸림돌이었습니다. 하지만 지금은 물 한 모금을 마실 술력을 이끄는 직원들이 든든하게 자리하고 있다. 때도 위생이 중요하다는 인식이 자리 잡았고, 국민 소득 수준도 ㈜금강은 진주 지역 최초로 근로자복지재단을 설립해 직원들의 올라 스테인리스를 선택할 수 있는 여건이 갖춰진 것 같습니다. 생활 기반을 돕고, 주택담보 대출과 생활자금 대여, 경조사 지원 저희도 고유 기술을 통해 스테인리스의 위생성과 장점을 살리면 등 현실적으로 도움이 되는 복지 체계를 마련했다. 코로나 이전 서 가격 부담을 줄이는 방향으로 나아가고 있습니다.”라고 설명 까지는 설을 전후해 매년 해외연수를 진행했으며, 입사 10년 미만 했다. 이렇듯 ㈜금강의 모든 제품은 스테인리스를 중심에 두고, 직원은 개인으로, 10년 이상은 부부 동반으로 여행을 지원했다. 위생성과 내식성은 물론 내진·내압 성능과 다양한 지반 조건에 전 직원 대상 파상풍, 폐렴, 독감 예방접종과 하루 세 끼 식사 제공 서도 견딜 수 있는 구조 안전성을 기반으로 만들어진다. 특히 대형 역시 자랑할만 하다. 방만혁 회장은 “좋은 환경에서 일한 직원이 스테인리스 물탱크는 포스코와의 공동 개발을 통해 2만 톤까지 결국 좋은 제품을 만듭니다. 야간작업하지 않더라도 저녁 식사 내구성을 입증한 실험을 거치며, 금강의 기술력을 더욱 확고히 까지 먹고 갈 수 있도록 여러모로 신경 쓰고 있습니다. 직원과 회사 보여주는 사례가 되고 있다. 둘 다를 위한 선택이죠.”라고 자신 있게 단언했다."}, {"p": 33, "t": "신년호 앞으로도 굳건하게, 현장에서 답을 찾는 ㈜금강의 길 한국상하수도협회와의 인연은 ㈜금강에게 단순한 행사 참여 이 상의 의미를 지닌다. ㈜금강은 매년 열리는 WATER KOREA(대한 민국 국제물산업박람회)에 꾸준히 참여해 왔으며, 2025년에는 최다 부스 수를 기록했다. 제품을 한자리에서 집중적으로 선보 일 수 있을 뿐 아니라, 실제로 납품을 담당하는 관공서와 지방자 치단체 실무자들이 전시장을 찾기 때문에 실질적인 교류로 이어 지는 경우도 많아 뜻 깊다고. 사우디아라비아 네옴시티 프로젝 트 역시 국제물산업박람회에서 금강의 제품을 눈여겨본 한 담당 자의 소개를 통해 수출 통로가 열리며 성사된 사례였다. 방만혁 회장은 “앞으로 협회가 상하수도 관련 정책을 더욱 뚝심 있게 추진하고, 물기업들의 애로사항을 함께 해결해 나가며 회 방만혁 회장 원사와 밝은 미래를 만들어가길 바랍니다.”라고 전하며 협회에 대한 기대를 덧붙였다. ㈜금강은 남들이 이미 가본 길을 따라가기보다, 언제나 새로운 길을 먼저 열어가는 회사로 남고자 한다. 특히 현장 중심의 기술 개발을 무엇보다 중요하게 여기며 기술력을 보강할 계획이다. 공장의 실험 환경은 늘 일정한 조건을 보장하지만, 실제 현장은 한국상하수도협회가 보내는 선물 지반, 기후, 수압 등 여러 악조건이 한꺼번에 작용한다. 금강은 바로 지난 12월, ㈜금강에 선물이 도착했다. 따뜻한 음료와 간 그 현실을 기준점으로 삼는다. 안정성을 잃지 않으면서도 안주 식이 곁에 있다면 활기찬 하루를 보낼 수 있지 않을까? 하지 않고, 현장의 문제를 해결하는 새로운 기술을 끊임없이 구축 음료를 든 직원들의 얼굴에는 환한 미소가 가득했다. 하는 것, 그것이 ㈜금강이 앞으로도 지켜가려는 방향이다. 방만혁 회장도 직원들과 함께 커피를 나눠마시며 담소를 나눴다. 사진을 찍으려고 하자 한 직원이 “회장님! 환히 웃어보이시소!”라고 농담을 건넸다."}]}, {"id": "97-34", "no": 97, "label": "2026 신년호", "corner": "글로벌 인사이트", "title": "물산업의 2025년 주요 이슈와 2026년 유망기술 전망", "author": "", "start": 34, "end": 39, "pages": [{"p": 34, "t": "Write. 국민대학교 건설시스템공학부 이상호 교수 Water Dream _ 글로벌 인사이트 물산업의 2025년 주요 이슈와 2026년 유망기술 전망 Key Issues in the Water Industry in 2025 and Prospects for Promising Technologies in 2026 글로벌 이슈와 물산업의 현주소 물산업은 최근 수년간 변동성이 계속 확대되고 있다. 러시아-우크라이나 전쟁 이후 가속화된 에너지 비용 상승과 글로벌 공급 망 재편은 여전히 우리 경제에 많은 영향을 주고 있다. 여기에 미국 트럼프 2기 행정부의 보호무역 관세 정책으로 경기 침체 가 능성까지 우려되는 상황이다. 한편, 기후 변화로 인한 물 부족과 홍수 등 위기는 단순한 환경 문제가 아니라 국가 안보와 경제 전반에 파급효과를 미치는 심각한 이슈로 부상했다. 이러한 어려움 속에서도 물산업계는 위기를 기회로 삼아 발전을 위한 새로 운 방향을 모색하고 있으며, 이러한 변화와 도전은 2025년에 이어 2026년에도 계속될 것으로 전망된다. 본 고에서는 2025년 한 해 동안 국내 물산업을 관통했던 핵심 키워드를 다시 되짚어보고, 다가오는 2026년에 정부와 기업, 그 리고 연구자들이 주목해야 할 전도유망한 물 기술과 트렌드를 살펴보고, 이를 통해 다가올 미래를 준비하기 위한 전략적 통찰 을 제공하고자 한다. Global Issues and the Current State of the Water Industry The water industry has experienced growing volatility over the past several years. Since the Russia–Ukraine war, accelerating energy cost increases and the reorganization of the global supply chain have continued to exert significant influence on the overall economy. In addition, concerns are rising over a potential economic downturn due to the protectionist tariff policies of the second Trump administration in the United States. Meanwhile, crises such as water scarcity and flooding caused by climate change are no longer merely environmental issues. They have emerged as critical challenges with significant implications for national security and the overall economy. This article reflects on the core keywords that shaped Korea’s water industry throughout 2025 and explores the most promising water technologies and trends that governments, businesses, and researchers should pay close attention to in 2026. Ultimately, it aims to offer strategic insights to help prepare for the future ahead."}, {"p": 35, "t": "신년호 2025년 물산업의 주요 키워드 상하수도 디지털 전환 2025년 물산업에서 가장 두드러진 변화는 상하수도를 포함한 물관리 전반의 디지털 전환이었다. 기존의 스마트 물관리가 센 서와 계측기를 통해 데이터를 수집하는 단계였다면, 2025년에는 AI가 방대한 데이터를 실시간으로 분석하여 의사결정을 지원 하는 단계로 한층 발전했다. 이는 물 인프라 시스템의 운영 패러다임이 하드웨어 중심에서 소프트웨어 및 AI 솔루션 중심으로 빠르게 전환되었음을 의미한다. 국내 기업들과 기관들도 디지털 전환을 물산업의 신성장 동력으로 인식하고 있다. 예를 들어, 국내에서는 K-water가 2025년 ‘AI 퍼스트’ 전략을 선포하고 인공지능과 DT 기술을 댐 운영, 정수장 및 상수도망 관리 등 물관리 전 분야에 통합하기 시작했다. 기후 탄력성과 대체 수자원 기후 변화로 인한 가뭄과 폭우의 빈발은 우리나라 물 관리 패러다임을 ‘통제’에서 ‘회복력’ 중심으로 전환시켰다. 이상기후에 대 비하여 물 인프라를 얼마나 신속히 복구하고 적응시킬 수 있는지가 중요해졌고, 단순 공급 확장보다 기후 탄력성을 강화하는 방향으로 정책 기조가 바뀌고 있다. 이와 함께 하수 재이용과 해수 담수화 등 대체 수자원 확보는 선택이 아닌 필수 과제로 부상 했다. 2025년 발생한 강릉의 극심한 가뭄사태는 기후 탄력성의 중요성을 다시금 각인시켰고, 안정적인 물 확보를 위해서는 다 변화된 수원 확보와 유연한 물 배분 시스템 구축이 필수적임을 보여주었다. 이에 따라 정부는 2025년 추진한 ‘제2차 물 재이용 기본계획(2021~2030년) 변경’에서 하수 재이용수 공급 확대를 위한 방안을 보완하고, 온배수 재이용을 통해서 해수담수화 사 업을 활성화하기 위한 제도적 기반을 마련했다. 초순수 국산화 2025년은 반도체 산업의 전략적 중요성 부각과 맞물려 초순수 공급 기술 국산화가 물산업의 핵심 이슈로 급부상한 해다. 반도 체 제조공정에 필수적인 초순수는 최고 순도의 물로, 그동안 우리나라는 반도체 생산 강국임에도 불구하고 초순수 설계 및 시 공 기술을 해외 기업에 의존해왔다. 그러나 글로벌 공급망 불안정과 기술 안보 이슈가 대두되면서 핵심 산업용수의 자립이 중 요해졌다. 이에 기후에너지환경부(구 환경부)와 K-water 등 국내 기업 및 연구기관은 2021년부터 R&D를 집중 추진하여 초순 수 국산화 기술을 확보했으며, 2024년 12월에는 SK실트론 공정에 국산 초순수를 공급하고 2025년까지 24시간 연속 공급 실 증을 수행하는 등 상용화 가능성을 검증 중이다. 이처럼 초순수 분야는 단순한 용수 공급을 넘어 국가 핵심 전략산업을 뒷받침 하는 고부가가치 물기술 산업으로 성장하고 있다."}, {"p": 37, "t": "신년호 2026년, 물-디지털 넥서스의 부각 2026년에는 물과 디지털의 연결고리, 즉 물-디지털 넥서스(Water-Digital Nexus) 개념이 물산업 혁신을 주도 할 것으로 전망된다. 물-디지털 넥서스는 ① 상하수도·수자원 운영의 효율·안전·탄력성 확보를 위해 디지털 기 술이 필요하다는 측면(Digital for Water)과, ② 데이터센터·반도체 등 디지털 인프라의 확대에 따라 물 관리 수 요가 증가한다는 측면(Water for Digital)이 상호작용하는 구조를 의미한다. 다시 말해 물을 효율적으로 관리하 려면 디지털 기술이 필요하고(Digital for Water), 동시에 디지털 기술을 운용하는 데에도 물이 반드시 필요하다 (Water for Digital)는 의미다. 2025년 아마존(AWS)은 WEF(Water Environment Federation), 펜실베이니아대학교, LUOW(Leading Utilities of the World)와 함께 ‘물-AI 넥서스 센터(Water-AI Nexus Center of Excellence)’를 설립 하여 이러한 움직임을 공식화했다. 물과 디지털 기술의 융합 없이는 서로의 지속가능성을 담보할 수 없다는 인식이 확산되면서, 2026년부터는 이 러한 넥서스 관점에서의 혁신이 본격화될 것이다. 우리나라 물산업도 디지털과의 접목을 통해 새로운 시장과 가 치를 창출하는 한편, 빠르게 성장하는 디지털 산업을 뒷받침하는 물관리 기술을 새롭게 발굴하는 노력이 요구된 다. 아래에서는 2026년에 특히 주목해야 할 두 가지 방향을 제시한다. Digital for Water 2025년에도 AI를 활용한 상하수도 시설의 지능화가 시도되었지만, 2026년에는 데이터와 AI 자체가 물산업 경 쟁력을 좌우하는 단계로 더 심화될 전망이다. 센서, IoT, 클라우드로부터 실시간 수집되는 방대한 물관리 데이터 를 빅데이터 플랫폼에서 통합 분석하고, 고도화된 AI 알고리즘이 최적의 의사결정을 지원하는 체계가 확산될 것 으로 보인다. 이는 단순히 운영 효율을 높이는 것을 넘어, 신규 비즈니스 모델과 시장을 창출하는 원동력이 된다. 예를 들어 상수도 누수 탐지나 수질 오염 예측 같은 분야에서 AI 기반 예측 서비스 시장이 태동할 수 있으며, 나아 가 축적된 수자원 데이터로부터 가치 있는 인사이트를 추출해서 제공하는 서비스 비즈니스도 가능하다. 이러한 Digital for Water 트렌드는 2026년에 들어 한층 가속화되어, 물산업의 신성장 동력으로 자리매김할 것으로 기대 된다. 즉, 디지털 기술을 얼마나 잘 활용하느냐가 물기업의 핵심 역량에 큰 영향을 주는 시대가 도래하고 있다. Water for Digital AI 발전과 디지털 인프라의 폭발적 성장 이면에는 급증하는 물 수요라는 잠재적 부담이 있다. 데이터센터와 AI 서버는 막대한 전력을 소모할 뿐 아니라, 냉각을 위해 대량의 물을 사용한다. 반도체 생산을 위해서는 많은 양의 초순수가 공급되어야 하며, 2차 전지 생산과정에서는 환경에 영향을 미칠 수 있는 다량의 폐수가 발생한다. 이와 같이 디지털 산업의 성장에 따른 물발자국(Water Footprint) 문제가 표면화되면서, 2026년에는 Water for Digital 분야의 기술과 정책이 유망 영역으로 부각될 것이다. 우선 데이터센터의 냉각 효율을 높이고 물 사용을 줄이거나 물을 재이용하기 위한 기술 개발이 활발해질 전망이 다. 이미 글로벌 대기업들은 물 사용량을 획기적으로 줄일 수 있는 냉각수 재순환 시스템, 하수 재이용 냉각수 등 다양한 기술에 투자하고 있다. 또한 데이터센터를 포함한 디지털 산업 전반에서 물관리 기술 수요가 본격적으로 늘어날 것으로 예상된다. 이는 물산업계에 새로운 블루오션을 제공하는 한편, 물 부족과 환경 영향을 줄이는 지 속가능성 측면에서도 의미있는 방향이다."}, {"p": 39, "t": "신년호 Water for Digital Behind the rapid advancement of artificial intelligence and the explosive growth of digital infrastructure lies a potential burden in the form of rapidly increasing water demand. Data centers and AI servers not only consume enormous amounts of electricity but also require large volumes of water for cooling. Semiconductor manufacturing processes require substantial supplies of ultrapure water, while secondary battery production generates large volumes of wastewater that may have environmental impacts. As issues related to the Water Footprint arising from the growth of the digital industry come to the fore, technologies and policies in the Water for Digital domain are expected to emerge as promising areas in 2026. First, active development of technologies aimed at improving cooling efficiency in data centers, reducing water consumption, and promoting water reuse is anticipated. Global corporations are already investing in a variety of solutions, including cooling water recirculation systems and wastewater-reuse-based cooling technologies that can dramatically reduce water use. In addition, demand for water management technologies is expected to increase in earnest across the digital industry as a whole, including data centers. This trend offers a new blue ocean for the water industry, while also pointing toward a meaningful and sustainable pathway for reducing water scarcity and minimizing environmental impacts. 2026년의 물산업을 위하여 급변하는 글로벌 정세와 기후위기 속에서도, 우리 물산업이 2025년에 보여준 역동성과 혁신 의지는 앞으로 나아갈 방향을 제 시해준다. 2026년에는 이러한 기반 위에서 새로운 기술과 가치를 선점함으로써 세계 물시장을 선도하고, 국민의 물 안보와 환 경 복지를 한층 향상시키는 한 해가 되기를 기대한다. 물-디지털 넥서스 시대를 향한 여정에 모두가 지혜를 모아 함께 나아갈 때, 비로소 지속가능한 물순환과 디지털 번영이 조화를 이룬 미래를 실현할 수 있을 것이다. Looking Ahead to the Water Industry in 2026 Despite rapidly shifting global conditions and the intensifying climate crisis, the dynamism and innovative drive demonstrated by Korea’s water industry in 2025 offer a clear sense of direction for the future. Building on this foundation, 2026 is expected to be a year in which new technologies and values are proactively secured to lead the global water market, while further strengthening national water security and environmental well-being. As we move toward the era of the Water–Digital Nexus, only by pooling our collective wisdom and advancing together can we realize a future in which sustainable water cycles and digital prosperity coexist in harmony."}]}, {"id": "97-40", "no": 97, "label": "2026 신년호", "corner": "환경 지킴이", "title": "<알맹상점> 고금숙 대표", "author": "", "start": 40, "end": 43, "pages": [{"p": 40, "t": "Write. 강지형 Photo. 황지현 Water Dream _ 환경지킴이 ‘포장’은 성의의 표현이나 마케팅 요소로 중요하게 사용이 된다. 그런데 이 포장을 벗겨내고 ‘알맹이’만 판다면 어떨까? 칫솔, 수세미 심지어는 샴푸, 세제까지 제품의 본질만 파는 ‘알맹상점’은 쓰레기를 줄이는 가장 적극적인 실천의 일환으로 탄생한 공간이다. 그리고 같은 가치관을 지닌 이들의 방문이 끊이질 않는 곳이기도 하다. 가장 본질적인 것에 대한 탐구 알맹상점 고금숙 대표 Q. 안 \u0007 녕하세요. 대표님과 알맹상점에 대한 소개를 부탁 드립니다. 처음부터 가게를 운영하려고 했던 것은 아니에요. 직접 가져간 가방이나 용기에 물건을 포장해 오는 개인적인 실천에서 시작을 했습니다. 그러다 보니 화장품이나 청결 용품까지 눈에 들어오 안녕하세요. 자칭·타칭 ‘쓰레기 덕후’ 고금숙입니다. 2018년부터 더군요. 망원동에 사는, 저와 같은 뜻을 가진 일명 ‘알짜’들이 모 망원동에서 ‘알맹상점’을 운영하고 있습니다. 알맹상점에서는 두 였고 그들과 힘을 합쳐 알맹상점의 문을 열게 되었습니다. 가지를 판매하고 있어요. 하나는 정말로 포장을 하지 않은 제품 들, 이를테면 수저, 양말, 실리콘 지퍼백 등을 무포장 상태로 팔고 있어요. 나머지 하나는 세제나 샴푸 등 액체류의 제품들을 용기 Q. 환경문제에 관심을 가지게 된 계기가 궁금합니다. 없이 ‘리필 시스템’으로 판매합니다. 환경 운동 분야에서 오랫동안 활동을 했어요. 엄청난 사명감이 나 대의로 시작한 것은 아니에요. 저는 제가 쓰고 먹는 것들에 관 심이 많았어요. 그래서 점점 더 좋은 제품을 찾게 되었는데, 물건 자체에 대한 정보를 많이 보다 보니 자연스레 그 이면의 환경 문 제에 대해서도 알게 됐죠. 예전에는 어떻게 하면 ‘나’에게 좋은 물 건은 무엇일까를 고민했다면, 점차 ‘나와 지구’에게 좋은 물건은 무엇일까 생각하게 됐어요. 물건을 만들 때 엄청난 양의 물이 사용된다는 걸 아시나요? 청 바지 한 벌을 생산할 때 7천~1만L의 물이 쓰인다고 해요. 물건을 자주 버리고 다시 살수록 그만큼 물도 많이 쓰이는 거죠. 이것을 ‘가상수’라고 해요. ‘물발자국’이라고도 부르는데, 한 제품을 만드"}, {"p": 41, "t": "신년호 KO KUM SOOK 고금숙 제로웨이스트숍 ‘알맹상점’ 대표 플라스틱 프리 활동가 기후위기 대응 활동가"}, {"p": 42, "t": "Water Dream _ 환경지킴이 는 데 쓰이는 물의 총량을 뜻해요. 한국은 가상수를 가장 많이 수 기주전자에 넣으면 물이 남을 일이 없어요. 그리고 추천하고 싶 입하는 나라 5위라고 해요. 인구수에 비해 물 사용량이 많다는 은 것은 바로 초절수형 양변기인데요, 일반적인 가정에서는 6L 뜻이죠. 용량을 사용해요. 연식이 오래된 집의 경우에는 9L까지도 쓰죠. 저는 4.2L 용량의 제품을 사용 중이에요. 물의 양이 절반 정도 적 지만 한 번도 변기가 막힌 적이 없어요. 초절수형 양변기는 많이 Q. ‘\u0007쓰레기 덕후’라고 표현하셨지만, 결국에는 쓰레기 알려지지 않아서 선택지에조차 들지 않아요. 변기는 일상적으로 를 줄이는 일의 일환입니다. 평소 실천하는 친환경 자주 사용하는 제품이니만큼 물 절약 효과가 커서 많은 분들이 습관은 무엇이 있나요? 사용하시면 좋을 것 같아요. 저와 같은 ‘쓰레기 덕후’들은 ‘5R 원칙’을 지켜요. ‘거절(Re fuse)·줄이기(Reduce)·재사용(Reuse)·재활용(Recycle)·퇴비화 (Rot)’인데요, 거절이 가장 쉬운 실천 방법이에요. 장바구니를 들 Q. \u0007태양광 발전기와 빗물 이용 시설에 대해서 설명해 주세요. 고 다니는 건 번거롭지만, 내 가방에 자리가 충분하다면 비닐봉 지를 거절하는 건 비교적 쉽게 할 수 있죠. 그 외에도 설거지를 환경 단체에서 활동하며 밀양 초고속 송전탑 설치 반대 운동에 할 때 마지막에 헹군 물을 모아 두었다가 설거지거리를 불리는 참여했던 적이 있어요. 그때 들었던 말이 ‘너희는 전기 안 쓰냐’는 일에 쓰고, 마시다 남은 차와 같은 헤드렛물은 모아 두었다가 화 것이었어요. 처음에는 무력감이 컸습니다. 어쨌든 저도 원전에서 분에 주고 있어요. 전기주전자에는 사용할 만큼만 물을 넣어 끓 생산되는 전기를 사용하며 생활을 하는 것이 맞으니까요. 그래 입니다. 한 잔의 차를 마시려는 거라면, 컵에 물을 받은 다음 전 서 태양광 발전기 설치를 결심하게 됐어요. 점차 개수가 늘어서"}, {"p": 43, "t": "신년호 하면 더욱 좋지 않을까 생각을 해요. 주택 비율이 높고 텃밭을 가 꾸는 경우가 많으니까요. Q. 앞으로의 목표는 무엇인가요? 친환경적인 생활이 더 많은 분들의 일상에 스며드는 것이에요. 그러기 위해서는 친환경적인 방식을 택하는 사람들이 이득을 볼 수 있어야 한다고 생각해요. 부산행 비행기 표가 적어도 KTX 티켓보다 저렴하지는 않아야죠. 편리한 방법을 택하는 것은 당 연한 일이에요. 편리한 데다 경제적이기까지 하면 어느 누가 KTX를 타고 부산에 가겠어요? 금욕적인 방법의 환경 운동은 전 파나 지속이 쉽지 않아요. 그런 의미에서 하나라도 실천하는 사 람이 그 폭을 넓혀갈 수 있도록 비난하지 않는 자세를 갖추는 것 도 중요해요. 최근에 ‘K-비건’이라는 말에 대해 알게 됐어요. 한식 은 국물 음식이 많고 그 외에도 기본 양념이 많이 쓰이는데, 외식 을 할 때 음식에 멸치 육수가 쓰이는지 알 도리가 없죠. 빼달라고 할 수도 없는 노릇이고요. 그렇다고 모든 끼니를 집에서 먹을 수 도 없고요. 이러한 한식의 특성을 일컬어 ‘K-비건’이라고 부른다 고 해요. 무결한 비건인지를 따지는 것보다 육고기 한 점이라도 안 먹는 일이 더 중요하니까요. 목적을 기억해야 해요. 다양한 사 람들이 자기만의 방식으로 환경을 위한 선택을 하고, 그것이 불 다양한 사람들이 자기만의 방식으로 환경을 위한 선택을 하고, 그것이 불편하지 않은 세상이 되기를 바랍니다. 지금은 옥상에 태양광 패널이 12개가 설치되어 있는데요, 전기 를 많이 쓰는 시기에도 사용료가 5천 원 정도 나온답니다. 빗물 이용 시설은 독일 프라이부르크에 갔을 때 접했어요. 프라 이부르크는 친환경 도시로, 자동차 진입이 금지되어 있고 집집 마다 태양광 패널이 설치되어 있습니다. 그런데 마당에 커다랗 고 네모난 통이 있는 거예요. 봤더니 그게 빗물을 모아 두는 빗물 이용 시설이었던 거죠. 한국에 돌아와서 찾아보니 보조금 지원 을 해주고 있더군요. 그 길로 신청을 해서 사용 중이에요. 도시이 다 보니 독일의 가정처럼 큰 마당이 있지는 않아서 화분에 물을 주고 남은 물은 청소를 할 때 사용하고 있어요. 빗물 이용 시설은 크기나 무게 때문에 사실 도시에서 쓰기는 쉽지가 않아요. 물을 사용할 곳도 마땅치가 않죠. 그래서 대도시 외의 지역에서 사용 편하지 않은 세상이 되기를 바랍니다."}]}, {"id": "97-44", "no": 97, "label": "2026 신년호", "corner": "오피니언 리더", "title": "자연을 닮은 물 관리를 시민과 함께 – 자연기반해법(NbS)", "author": "", "start": 44, "end": 47, "pages": [{"p": 44, "t": "Write. 사회적협동조합한강 염형철 공동대표 Water Dream _ 오피니언 리더 자연을 닮은 물관리를 시민과 함께 자연기반해법(NbS)을 중심으로 사회적협동조합 한강이 가꾼 여의샛강생태공원의 모습"}, {"p": 45, "t": "신년호 국가 물관리, 자연을 앞세우다 할 때, 수자원 공급, 수질 정화, 홍수 조절, 생태계 유지 등 자연이 제공하는 ‘생태계 서비스(Ecosystem Service)’가 극대화되고, 궁 2021년 수립된 제1차 국가물관리기본계획(2021~2030)은 ‘자연과 극적으로 우리 사회의 물 안전과 안정이 커진다는 철학을 담은 사람이 함께 누리는 생명의 물’을 비전으로 내세우고 있다. 한국 것이다. 의 국가 물 계획 중 ‘자연’이 ‘사람’보다 앞에 나온 최초의 사례다. 과거의 물관리가 ‘댐 건설’, ‘상하수도 시설 증설’, ‘관로 확충’ 등 기존의 계획들이 ‘안전한’, ‘풍부한’, ‘깨끗한’을 강조하며 사람을 ‘개발’을 통해 자연을 극복하려고 했다면, 국가물관리기본계획은 위한 물관리라는 목표를 뚜렷했던 것과 큰 차이가 난다. 물의 흐름과 순환을 개선해 재해를 줄이고 회복을 쉽게 하는 자 그렇다고 국가물관리계획의 취지가 자연이 먼저고 사람은 덜 중 연과의 상생을 정책화한 셈이다. 요하다는 것은 아닐 것이다. 자연의 순환 시스템이 온전히 작동 물론 세상의 모든 일이 그렇듯이, 국가계획 하나 세워졌다고 이 러한 변화가 한꺼번에 모든 곳에서 이루어지지는 않는다. 특히 국가물관리기본계획이 수립되자마자 정부가 바뀌었고, 국가 계획도 캐비넷에 갇혀 여러 해를 보내면서 정책의 변화는 더뎠다. 하지만 사람만을 위한 개발의 시대는 자연과 함께 존재하는 시 대로 유유히 흘러가고 있다. 이는 한국만이 아니라 세계의 흐름 이기도 하다. ‘회색 인프라’의 한계와 물정책의 혁신 필요성 기후위기의 시대에 물정책 역시 새로운 도전에 직면하고 있다. ‘회색 인프라(Grey Infrastructure)’의 한계가 명백해지고, 새로운 환경문제들이 등장하고 있다. 시민들의 기대도 변화 중이다. 우선 콘크리트 중심의 시설들, ‘회색 인프라(Grey Infrastructure)’ 의 한계를 넘어야 한다. 이들은 막대한 초기 건설 비용이 들 뿐 아니라, 노후화에 따른 유지 보수와 운영 비용을 지속적으로 발 생시킨다. 정수 시설이나 하수처리장의 경우, 첨단화, 고도화 추 세에 따라 갈수록 더 많은 예산을 요구하고 있다. 댐이나 거대한 방수로 같은 시설은 정해진 용량을 넘는 순간 더 큰 위험을 불러 올 수 있다. 나아가 이들은 생태계 훼손과 경관 저해 등의 문제도 발생시킨다. 그렇다고 이들이 극한 호우와 장기 가뭄 또는 미량 화학물질 같은 문제를 모두 해결할 수도 없다. 예측 불가능한 위험에 대해 첨단 기술과 복잡한 시스템은 통제할 수 없는 사고를 부르고, 과도한 시설 투자는 사회의 붕괴를 불러올 수 있다. 인구 감소와 경제 성 장의 둔화는 이러한 위험을 더 극단화할 것이다. 시설의 확충으로 해결할 수 없는 시대가 도래했고, 이제 회색 인프라를 넘는 물관리로 전환해야 한다. 다음으로 최근 문제가 되는 녹조, 미량 화학물질, 나노 플라스틱 등에 대응해야 한다. 녹조의 경우 유력한 해법으로 보 수문 개방, 나아가 보 철거를 통한 자연성 회복이 주요 방향으로 힘을 얻고 있다. 물이 정체되어 녹조가 심화되고 수질이 악화되었으므로,"}, {"p": 46, "t": "Water Dream _ 오피니언 리더 자연기반해법(Nature based Solutions) 개념도 기반시설 문제 특정 관리 생태계 기반 접근방식 복 구 호 보 사회적 과제 인간 기후변화 완화와 적응 재해 위험 감소 택 성혜 다양 물 생 웰빙 사회·경제적 발전 인류 건강 식량 안보 물 안전 환경 파괴 및 생물다양성 감소 강이 다시 흐르게 해서 녹조를 줄이자는 것이다. 녹조가 뒤덮인 부족하다. 하천에서 물놀이와 산책을 원하는 시민들에게 직선의 강이 뉴스가 되고 녹소 독조 피해가 방송되는 상황에서 상하수 축대, 깊은 호소, 그리고 획일적인 경관 등은 매력이 있을 리 없다. 도 시설을 늘리는 것만으로 시민들의 불안을 잠재울 수 없기 때 문이다. 자연기반해법(NbS), 자연을 모방한 새로운 해법 녹조를 피하기 위해 취수원을 상류로 옮겨달라는 민원을 쫓아가 는 것도 방법이 아니다. 대신 강의 수질을 개선하고 강의 회복력 이러한 난관을 극복할 대안으로 자연기반해법(Nature-based 에 기대 강물을 이용할 수 있게 하자는 논의가 부각되고 있다. 막 Solutions, NbS)이 주목받고 있다. NbS는 기후변화, 물 부족, 재해 대한 공사를 통해 원거리에서 취수-송수하는 구조 대신 도시 가 위험 증가와 같은 복잡한 과제에 대응하기 위해 자연에서 영감 까운 곳에 취수원을 두고 관리하자는 것이다. 문제를 회피하겠 을 얻거나 자연을 모방하여 설계한 솔루션이다. 자연기반해법이 다는 생각보다 긴밀히 살피고 조심하며 적응하자는 이야기다. 과거에 없던 완전히 새로운 개념은 아니지만, 친환경, 근자연, 자연 미량 화학물질이나 나노 플라스틱 문제도 마찬가지다. 발생된 친화 등의 방법과 다른 점이라면 환경적, 사회적, 경제적 과제를 것을 처리하기보다 발생을 억제하는 제도를 도입하거나 사용 과 동시에 해결하려는 통합적 접근이라는 데서 차이가 있다. 세 측 정에서 적절히 대응하는 것이 효율적이다. 시민의 인식을 증진 면의 주요 내용은 다음과 같다. 시켜 조심케 하는 것도 방법이다. 우선 환경적 측면에서 자연기반해법은 자연 시스템의 건강성 또한 시민들의 변화하는 기호도 반영해야 한다. 냉온수, 혹은 탄산 을 회복시키고 생태계의 복원력을 증진하는 것이 목적이다. 예 과 커피를 요구하는 시민들에게 깨끗한 수돗물을 공급하는 걸로 를 들어 훼손된 하천과 산림을 복원함으로써 다양한 생물들의"}, {"p": 47, "t": "신년호 서식지를 제공하고, 멸종위기종의 귀환을 유도하는 등 생물다양 태공원을 위탁운영하면서, NbS에 기대 성과를 낸 바 있다. 성 증진에 기여케 하는 것이다. 습지 복원, 강변 여과(Riverbank 관행적으로 이루어지던 준설을 중단하고, 위험하지 않은 고목을 Filtration) 등으로 오염물질, 영양 염류, 심지어 미량의 화학물질 치우지 않는 등 개입을 줄였고, 연못과 여울의 조성 등 환경을 다 까지 물리적·생물학적으로 저감(또는 절감)하는 것이다. 이는 인 양하게 만들거나 생태교란종을 관리했다. 자연과 사람의 공간을 공적인 정수처리장의 부담을 줄이고 화학약품 사용을 최소화할 구분해 이용케 하면서 동식물을 보호하는 한편 시민들의 편의도 수 있다. 그리고 도시 숲이나 옥상 녹화는 증발산 작용을 통해 도 배려했다. 시 열섬 현상을 완화해 기후변화 완화와 적응에도 기여케 하는 5년여가 지나며 조사된 생물종이 2배가량 늘고, 이용자는 5배 이 것이다. 상 증가했다. 특히 자원봉사자들이 연간 4,000명 이상 활동하 다음으로 사회적 가치(Community Well-being and Security) 측 고, 십여 개의 시민모임들이 움직이면서 프로그램이 풍성해졌 면에서 자연기반해법은 시민들의 삶의 질을 향상시키고 재해로 다. 대한노인회, 영등포 50+, 영등포장애인복지관 발달장애인 등 부터의 안전성을 높이는 것이 목적이다. 강변을 복원하고 도시 20여 명에게 사회적 일자리를 제공하기도 했다. 숲을 만들어 시민들에게 휴식, 레저, 교육의 기회를 제공하는 귀 공간을 정확히 이해한다는 것은 꼭 필요한 일을 효과적으로 추 중한 공공 공간으로 만드는 것이다. 이는 지역 공동체의 유대감 진하고 가치 있는 성과를 낼 수 있게 했다. 그리고 사업이 구체화 을 강화하고 환경 교육의 장으로 활용될 수 있다. 녹지 공간 증가 할수록 공원 운영이 점차 공원 주변 주민들의 몫이 됐다는 것도 는 시민들의 신체적, 정신적 건강 증진에도 긍정적인 영향을 미 의미가 있다. 칠 것이다. 빗물 정원, 투수성 포장 등의 저영향개발(LID) 기법은 시민들이 세금을 내고 그 세금으로 관료들이 공간을 관리토록 빗물을 분산시키고 지하로 침투시켜 도시 침수 위험을 줄이고, 하는 것이 근대의 체계였다면, 시민들이 직접 지역을 관리하고 지역사회의 재해 대응 능력을 강화할 것이다. 지하수 함양의 확 정부가 약간의 지원을 하는 정도의 시스템도 가능하다. 시민이 대는 ‘물 순환의 회복’과 장기 가뭄의 대책이 될 수 있다. 정부 정책의 수혜자로서만이 아니라 물관리 시스템의 공동 설계 마지막으로 경제적 가치(Cost-Effectiveness and Job Creation) 자이자 능동적인 관리 주체가 될 수 있다. 측면에서, NbS는 하수처리장 증설 등 자연의 기능을 활용하면서 시설 운영 및 유지 보수 비용을 절감하는 것이 목적이다. 시간이 자연을 닮은 물관리를 시민과 함께 지남에 따라 자연 시스템이 성숙해지면서 시설의 성능이 향상되 고, 인프라의 여명을 연장시키는 것이다. 생태 복원, 녹색 인프라 국가물관리기본계획의 비전처럼, ‘자연과 사람이 함께 누리는 설계, 유지 관리, 생태 관광 등으로 새로운 분야에서 고용을 창출 생명의 물’은 가능하다. 자연을 회복하고, 경제에 활력을 가져오 토록 하는 것이다. 며, 시민을 행복하게 하는 새로운 물관리 패러다임을 시도할 때 결론적으로, NbS는 단일 목표가 아닌 다중 혜택(Co-benefits)을 가 됐다. 창출하며, 기후위기 시대에 지속 가능하고 탄력적인 물관리 시 스템을 구축하는 전략이 될 수 있다. 시민이 앞장서고 시민을 위하는 물정책 그리고 자연기반해법(NbS)은 시민의 참여를 필요로 한다. NbS 가 자연의 회복력에 의지하는 만큼, 강의 미세한 변화를 기억하 고 이를 이용할 수 있는 강 주변의 주민들과 공동체의 역할이 절 대적이기 때문이다. 또한 사람의 개입을 적시에 적당한 수준으 로 한정하는 것이 NbS의 관리 방법이라면, 역량 있는 공동체가 필요한 때 필요한 만큼 역할토록 하는 것은 거대 예산을 투입하는 것보다 더 큰 효과를 가져올 수 있다. 필자가 속한 사회적협동조합 한강은 지난 6년간 여의도샛강생 사회적협동조합 한강이 가꾼 여의샛강생태공원의 모습"}]}, {"id": "97-48", "no": 97, "label": "2026 신년호", "corner": "워터브리핑", "title": "워터브리핑", "author": "", "start": 48, "end": 49, "pages": [{"p": 48, "t": "참고. 워터저널 Water Dream _ 워터브리핑 워터브리핑 포항공과대학교 기계공학과 이상준 교수 연구팀과 미래 #에너지 회수형 정수 #단일 모듈 #다양한 규모로 응용 가능 국내 포항공대 기계공학과 이상준 교수 연구팀 날씨에 영향받지 않는 해수담수화 기술 개발 기계기술 프론티어 리더 양성 교육연구단 히긴스 윌슨 (Higgins Wilson) 박사 연구팀은 낮과 밤, 날씨에 상관없이 바닷물을 빠르고 안정적으로 담수화할 수 있는 기술을 개 포항공대 기계공학과 이상준 교수 연구팀 발했다고 밝혔다. 태양열 계면증발(ISG) 기술에 5V 이하 저전압 줄(Joule) 가열 방식을 결합해 24시간 연속 담수 생산이 가능한 시스템을 구현한 것이다. 이 기술은 햇빛으 로 물 표면만 가열하는 기존 ISG 방식의 한계를 보완해, 태 양광이 없는 밤에도 전기열만으로 작동한다. 핵심 소재로 는 유리질 탄소 스펀지(Glassy Carbon Foam)를 사용해 물 과 공기의 접촉면을 극대화하고, 티올(Thiol)이라는 화학 물질 처리를 통해 흡수력을 높이고 전기저항을 약 0.75Ω (옴)까지 낮춰 전기가 잘 흐르도록 했다. 연구팀은 대형 모듈화 시스템을 제작해 실외 테스트를 진 서울대 공대 전기정보공학부 김성재 교수 연구팀 정제수·수소 동시 생산 기술 개발 이다. 특히 재생에너지와 결합해 에너지 소모를 최소화한 서울대학교 공과대학 전기정보공학부 김성재 교수 연구팀 독립형 담수화 장비로 발전시킨다는 구상이다. 은 정제수와 수소를 동시에 생산할 수 있는 에너지 회수형 정수 시스템을 개발했다. 이번 기술은 염수에서 불순물을 제거하는 동시에, 수소 이온을 전극에서 환원시켜 수소 가스를 생산하는 기술이다. 기존 담수화 시스템 및 수전해 시스템을 통합해 에너지 손실을 최소화하는 방식으로 구현 됐다. 이는 양이온 교환막을 이용한 이온농도분극 현상에 기반해 단일 모듈에서 염 제거와 수소 발생을 동시에 구현 하는 나노전기수력학적 정화 시스템이다. 연구팀은 기존 이온농도분극 담수화에서 그대로 소모되 던 에너지의 8~10%를 돌려받을 가능성을 제시하고, 이번 에 개발한 장치에서 생성된 수소를 연료전지로 다시 공급 하면 일부 전력을 스스로 생산하는 에너지 자립형 정수 장 #해수담수화 #태양열·전기열 #물부족 대응 기술 치도 발전할 수 있음을 보여주었다. 특히 이 장치는 소형 개인용 정수기부터 재난 대응용 이동형 장치까지 다양한 규모로 응용이 가능하며, 군사 작전 지역이나 우주 탐사 환경 등 인프라가 제한된 장소에서도 유용하게 사용될 수 있을 것으로 기대된다. 서울대 공대 전기정보공학부 김성재 교수 연구팀 행하고, 상용화 단계에서도 효율과 안전성을 검증할 계획"}, {"p": 49, "t": "신년호 영국을 기반으로 활동하는 주요 상수도 및 폐수 처리 기업 #산림과 물 #데이터 기반 지도 #지속가능한 수자원 해외 서번트렌트 위성 기술 통해 홍수 피해 최소화 및 주택 보호 인 서번트렌드(Severn Trent)는, 원활한 하·폐수 시스템 운 영 및 극한 기후 추적을 위해 공중 전자 감시 장치 같은 최 첨단 위성 기술을 활용한다고 밝혔다. 서번트렌트는 미들 랜즈 전역에서 홍수와 하·폐수 관리의 혁신을 위해 영국 최초로 글로벌 위성 기업 ICEYE와 협력한다. 서번트렌트 최첨단 합성개구레이더(SAR) 위성은 두껍고 짙은 구름이 덮여도 지상에서 일어나는 일을 확인한다. 이를 통해 홍수 위험을 파악하고 주택이 침수되기 전에 문제를 예방한다. 홍수와 호우는 하·폐수 관로 유량을 초과해 혼란을 초래 할 수 있지만, 이번 기술을 통한다면 악천후 후 홍수를 신 속하게 평가하고 취약 지역을 파악하며 그 어느 때보다 빠 르게 조치를 취할 수 있다. 양 사는 영국에서 홍수 피해가 가장 잦은 도시 중 하나인 아버 데이 재단 산림·담수 수질 연계 글로벌 지도 최초 공개 슈루즈버리(Shrewsbury)에서 홍수 지도를 작성하는 것을 시작으로, 서번트렌트 담당 지역 전체로 확대하고 있다. 아버 데이 재단(The Arbor Day Foundation)은 산림과 지도 모델 ‘포레스트–워터 임팩트 맵(Forest-Water Impact Map)’을 공개했다. 이 지도형 분석 도구는 나무 심기가 특정 지역의 수질 개선 에 미치는 영향을 ‘수치’로 분석하고, 재조림 사업이 수자원 측면에서 가장 효과적인 지역을 제시한다. 전 세계를 대상 으로 구축했으며 나무 심기, 즉 재조림을 통한 물공급량(수 자원) 개선 효과를 가장 폭넓고 의미 있게 보여주는 자료로 평가된다. 파트너사인 피프티투 임팩트(52impact)와 협력 해 이 지도를 개발했으며, 수자원 개선 효과를 투명하고 신뢰성 있게 산정하기 위해 실제로 활용되는 수자원 개선 효과 산정 지침에 맞춰 해당 도구를 설계했다. #위성 기술 #홍수 대응 #하·폐수 관리 이 지도는 산림과 물 사이의 긍정적인 관계를 수치로 보여 주며, 깨끗하고 건강한 물을 확보하기 위해 어떤 방향이 필요한지를 짚어줄 것으로 기대된다. 아버 데이 재단 물의 연관성을 데이터 기반으로 시각화한 세계 최초의"}]}, {"id": "97-50", "no": 97, "label": "2026 신년호", "corner": "뉴스마당", "title": "뉴스마당", "author": "", "start": 50, "end": 51, "pages": [{"p": 50, "t": "Water Dream _ 뉴스마당 정부·지자체 ‘통합물관리를 위한 물관리기본법 개정 방안’ ‘통합물관리를 위한 물관리기본법 개정 방안’ 국회토론회 개최 강릉시 연곡 지하수저류댐 착공 국회물포럼은 지난 11월 28일 ‘통합물관리를 위한 물관리기본법 개정 강릉시는 생활용수의 87%를 공급하는 오봉저수지의 의존도를 낮추 방안은?’이라는 주제로 국회 토론회를 개최했다. 이 자리는 현장 사례 고 도시 전역의 용수공급 안전을 위한 수원 다변화 사업을 본격 추진 를 통해 통합물관리 제도의 성과와 한계를 점검하고 국가 차원의 물 한다고 밝혔다. 기후변화와 도시 성장에 따른 용수 수요 증가 등 단일 관리 거버넌스 재정립 방향을 모색하는 자리였다. 수원 의존이 한계에 이르렀다고 판단, 다양한 수원을 연계한 안정적 이번 토론회는 박제량 홍익대 교수가 좌장을 맡아 진행했다. 주제발 공급체계로 전환하기 위한 중장기 물관리 전략을 추진한 것이다. 표는 이태관 계명대 교수가 ‘현장사례로 본 통합물관리의 시사점과 특히 지난 12월 연곡면 송림리 일원에서 착공한 지하수저류댐 설치사 과제’를 발표하고, 공동수 경기대 교수가 ‘유역기반 통합물관리를 위 업은 총 250억 원의 사업비가 투입됐으며, 완공 시 하루 1만 8000t 한 물관리기본법 개정 방안’을 발표했다. 지정토론에는 다양한 전문 규모의 지하수 취수 시스템이 구축된다. 이를 통해 가뭄에도 영향 가들이 참여해 강릉·속초·도암댐 등 현장 사례에서 드러난 문제를 받지 않는 안정적인 대체수원을 확보하게 되고, 기존 연곡천 복류수 통해 부처 간 협업의 한계를 짚고 통합물관리 2.0 체계 구축을 위한 와 함께 총 3만 4500t 규모의 원수 확보가 가능해져 강릉 북부권과 「물관리기본법」을 논의했다. 도심권의 급류 안정성이 크게 향상될 전망이다. 국회물포럼은 통합물관리 발전 방안 모색을 위해 지난 6월부터 진행 498억 원 규모의 연곡정수장 현대화사업과 500억 원 규모의 증설사 된 3차례의 토론회에서 도출된 후속과제들을 모아 입법화할 예정이다. 업에 대한 기본 및 실시설계도 발주한다. 사업이 완료되면 강릉시 전 출처 환경타임즈 (2025.11.24.) 역의 상수도 공급 능력이 대폭 향상될 것으로 기대된다. 출처 파이낸셜뉴스 (2025.11.12.) 5대강 하수처리시설 방류수 내 인(P) 함유량, 충북도 상수원만큼 줄인다 2026년 하수도사업 국비 3,018억 원 확보 기후에너지환경부는 현재 1L당 0.3∼0.5㎎인 ‘Ⅱ 지역’과 ‘Ⅲ 지역’ 내 충북도는 2026년 환경부 소관 하수도사업에 국비 3,018억 원을 확 하루 하수 처리 용량 1만t 이상 공공하수처리시설 방류수 총인(T-P) 보했다고 밝혔다. 이는 전년도 대비 1,546억 원(205%)이 증가한 역대 기준을 Ⅰ ‘ 지역’ 시설에 적용되는 1L당 0.2㎎으로 낮추는 「하수도법」 최대 규모다. 시행규칙 개정안을 지난 10월 30일부터 12월 9일까지 40일간 입법 세부 국비 확보액은 하수처리장 확충 10지구 213억 원, 농어촌마을하 예고했다. 수도 정비 69지구 1천 146억 원, 하수관로정비 43지구 676억 원, 도시 개정안의 취지는 5대강 주변 대형 공공하수처리시설에서 내보내는 침수대응사업 17지구 682억 원, 면단위하수도정비 1지구 42억 원, 하 방류수 내 인 함유량을 상수원보호구역 시설의 방류수만큼 낮추겠다 수관로BTL임대료 11지구 259억 원 등 총 151지구 3,018억 원이다. 는 것이다. 기후부는 방류수 총인 기준이 강화되는 대형 공공하수처 충북도는 이 사업을 통해 하수처리 인프라를 대폭 확충, 생활하수로 리시설이 5대강 수계 하수처리시설 방류수 96%를 내보내는 만큼, 기 인한 수질오염을 줄이고 쾌적한 주거환경을 조성할 것으로 보인다. 준 강화로 5대강에 배출되는 총인이 하루 586㎏으로 기존의 하루 1천 또한 극한 호우로부터 침수 피해 예방에 효과가 있을 것으로 예상되 783㎏보다 51%(1천 207㎏) 감소할 것으로 예상했다. 는 것은 물론, 지역 균형 발전에도 큰 역할을 할 것으로 보고 있다. 하수도법 시행규칙 개정안은 4년 후인 2029년 12월 1일 시행된다. 출처 미디어타임즈 (2025.10.01.) 기후부는 개정안 시행 전 시설이 개선될 수 있도록 지자체와 협력할 계획이다. 출처 연합뉴스 (2025.10.28.)"}, {"p": 51, "t": "신년호 단체·기업 한국수자원공사 한국물산업협의회 ‘세계 최초’ AI 정수장 OECD ‘글로벌 인프라 품질 인증’ 획득 물기업 해외진출 역량 강화 도모 한국수자원공사의 AI 기반 정수장이 지난 11월 12일 대구 EXCO에 한국물산업협의회는 지난 10월 28일 제16회 물산업미래비전포럼과 서 열린 ‘2025 대한민국 국제물주간(KIWW)’ 행사에서 OECD(경제 연계해 부산광역시 물산업 해외진출 전략 세미나를 개최했다. 부산 협력개발기구)가 주관하는 글로벌 인프라 품질 인증 ‘BDN(Blue Dot 벡스코 제1전시장에서 진행된 이 세미나는 국내 물기업의 해외진출 Network)’을 세계 최초로 획득했다. BDN 인증은 지속가능성, 경제성, 역량 강화를 위해 물기업과 관련기관 재직자를 대상으로 진행됐다. 환경 및 사회적 책임, 투명한 거버넌스 등을 충족하는 인프라에 부여 주요 교육 내용은 ‘국가별 물산업 주요 이슈와 사례’를 다룬 글로벌 물 하는 국제 품질 보증 제도다. 산업 현황 및 이슈, ‘현지시장 현황 및 바이어 발굴 전략·벤더 등록 및 AI 정수장은 2020년부터 한국수자원공사가 기후에너지환경부와 함 계약실무 및 기업사례’를 다룬 중동 진출 전략 및 비즈니스실무 등이 께 추진한 ‘스마트 물관리 사업’의 대표 성과 중 하나로, 정수 처리 전 었다. 이번 포럼은 성황리에 마무리됐으며, 물기업의 해외 진출 역량 과정을 AI와 빅데이터를 활용해 운용한다. 특히 정수장 전체 공정을 강화에 참고할 만한 다양한 인사이트를 제공했다. AI가 스스로 학습하고 운영하는 ‘스마트팩토리형 정수장’이라는 점에 출처 국토일보 (2025.10.20.) 서 전 세계 최초 사례로 평가받고 있다. 기후위기와 심각한 물 부족 문제로 AI 기반 공공 인프라 기술에 대한 글로벌 수요가 급증하는 가운데, 한국수자원공사는 이번 인증을 계기 바로 잡습니다 로 해외 진출에 박차를 가할 계획이다. 출처 대전투데이 (2025.11.12.) 지난 <맑은 물 세상> 가을호(96호) 제작 중 회원소식 원문 기사의 요약·발췌 과정에서 오류가 발생하여 이를 바로 잡고자 합니다. 부강테크 Proteus기술, EU 수처리시장 진출 청신호 수처리 전문기업 부강테크는 프랑스 Saur(소르) 그룹의 엔지니어링 자회사 Stereau(스테로)와 Proteus기술의 프랑스·스위스 독점 사용권 협약을 체결하며 EU 시장 진출을 본격화했다고 밝혔다. 부강테크가 개발하고 상용화 한 Proteus는 화학물질 없이 하수 내 고형물과 유기 물을 신속하게 제거하는 고속 여과 기술이다. 부강테크는 환경 규제가 엄격한 미국과 캐나다, EU 등에서 기술 성능 을 검증하며 신뢰를 쌓아왔으며, 이번 협약은 그동안의 기술 성과가 유럽 선도기업으로부터 공식적으로 인정받은 의미 있는 성과로 풀이 <맑은 물 세상> “코팅코리아 장수명 PEP관 공개”(일부 발췌) (…) PEP관은 공인시험을 통해 기존 주철관(30년), PVC(15년)에 비해 압도적인 내구성을 인증했다. <원문 기사> 철강금속신문 “코팅코리아, ‘2025 베트남 워터 위크’에서 PFP관 선봬” (일부 발췌) (…) 약 2년간의 공인기관 시험을 통해 PFP 수도관 제품의 수명이 최소 50년 이상임을 시험 결과 보고서를 통해 확인됐다. 그동안 대부분의 지자체에서 이해하고 있는 수도관의 경우 지방공기업 법상 명시된 관종별 감가상각년수를 고려했을 때 주철관 30년, PVC 등 플라스틱관 15년이었다. 된다. 현재 EU 주요 회원국들은 강화된 EU 폐수 지침(DERU II)을 자국 법률로 전환 중이며, 이를 충족할 수 있는 기술 대안을 검토하고 있다. 이러한 흐름 속에서 Proteus는 해당 요구를 충족할 수 있는 기술로 최종 선정됐고, 양사는 향후 EU 환경 규제 강화와 기후변화에 대응해 기술 적용과 사업 확장을 이어갈 계획이다. 출처 국토일보 (2025.11.21.) 원문 인용 과정에서 회계상 감가상각 기준인 ‘내용연수’와 관의 교체 를 고려하는 기준인 ‘내구성’을 동일 의미로 잘못 사용했습니다. 이에 주철관과 PVC관의 내구성을 각각 30년, 15년으로 표기함으로 인해 PVC관 등의 품질이 PEP관에 비해 낮다는 오해가 생길 수 있다는 오류가 있었습니다. 상수도설계기준 해설편(한국상하수도협회, 2025)에서 제시하는 PVC관의 국내기준 내구연한은 40~60년입니다."}]}, {"id": "97-52", "no": 97, "label": "2026 신년호", "corner": "동심 그리기", "title": "전래동화 《금도끼 은도끼》", "author": "", "start": 52, "end": 53, "pages": [{"p": 52, "t": "Write. 편집실 Water Plant _ 동심 그리기 전래동화 《금도끼 은도끼》 산신령이 지키던 고요하고 신성한 연못"}, {"p": 53, "t": "신년호 영험한 연못에 대한 호기심 한국의 어린이라면 모를 리 없는 전래동화 《금도끼 은도끼》. 값진 전래동화가 대부분 그러하듯, 《금도끼 은도끼》 역시 전형적인 권선징악 주제를 담고 있다. 가난하지만 선물을 얻었던 나무꾼의 해피엔 성실한 나무꾼. 어쩐 일인지, 나무를 베다가 그만 연못에 도끼를 빠뜨리고 만다. 기다렸다는 듯 나타난 딩은 그 시절의 우리에게 ‘정직하 산신령은 금도끼와 은도끼를 보여주며 “이 도끼가 네 것이냐” 나무꾼을 떠보며 유혹의 질문을 던진다. 게 살면 보답받는다’는 교훈을 가 나무꾼은 두 번 모두 “아닙니다. 제 도끼는 쇠도끼입니다”라며 순수의 화신처럼 솔직하게 ‘쿨 대답’을 내 르쳐줬지만, 산자락 깊숙이 자리한 놓는다. 신성한 연못. 그 신비로운 물의 그 정직함에 감동한 산신령은 나무꾼에게 금도끼, 은도끼, 쇠도끼 모두를 선물한다. 반면 욕심 많은 이웃이 비밀은 여전한 궁금증으로 남아 이 소식을 듣고 따라 하다 연못에 빠져 죽는 최후를 맞이한다. 훈훈한 결말이기도 하지만 어쩐지 섬뜩한 있다. 종결 같다. 정직은 보상을 가져오고, 욕심은 화를 부른다는 이야기의 줄거리와는 상관없이, 유년 시절의 누군가는 궁금했을 것이다. 도대체 이 연못은 무엇이고, 영험한 산신령은 또 어떤 존재인가. 현실 세계와 초자연적 세계를 잇는 통로 “이 금빛 도끼가 네 것이냐?” 나무꾼은 연못가를 한 번 신비롭고 고요했던 그 연못은 진실을 비추는 거울이었을 것이다. 동화 속에 등장하는 물은 있는 그대로의 진실을 비추는 장치이자, 흔들리지 않는 양심과 정직의 상징이 아니었을까. 물속에 빠진 도끼는 ‘유혹과 바라보고 고개를 저었다. 시련’의 시작을 의미한다. 연못은 인물의 진심을 가늠하는 무대이고, 산신령은 심판관 같은 존재처럼 느 “아닙니다. 제 도끼는 껴진다. 전래동화에서 물은 종종 죄, 거짓, 욕심을 씻어내는 정화의 요소로 활용된다. 《금도끼 은도끼》의 쇠도끼입니다.” 연못 또한 다르지 않다. 탐욕을 씻고 바른 마음을 되찾게 하는 잘 관리된 상수도랄까. 연못은 땀 흘리는 산신령의 얼굴이 환해졌다. 나무꾼의 현실 세계와 초자연적 세계를 연결하는 ‘경계 공간’으로서의 물이다. “네 마음이 더 귀하구나. 그러니, 금도끼, 은도끼, 연못을 상상하다 쇠도끼까지. 이 세 자루를 모두 가져가거라.” 나무꾼의 인생을 뒤바꾼 연못은 어떤 모습이었을까. 동화의 줄거리에 기반하여 상상의 나래를 펴보자. 산신령이 사라진 연못은 연못은 오래된 참나무, 소나무에 둘러싸여 있을 것이다. 숲은 시간이 만든 성전(聖殿)처럼, 눈에 보이지 햇살을 받아 잔잔히 흔들렸고, 그 물결엔 나무꾼의 솔직한 마음이 그대로 비치고 있었다. 않는 이야기를 품고 있다. 오래된 생명의 숨결 속에서 그 숲을 지키는 연못은 이따금 산길을 지나는 이들 과 멧돼지, 노루, 산새들의 생활용수이자 식수원으로 사용되었을 것이다. 산속 깊은 자리, 아침저녁의 물 안개. 현실 속에 실존하는 연못이라 하더라도, 분명 신비로운 분위기를 자아낼 것 같다. 나뭇가지 사이로 성글게 내려와 물 위에 반짝이는 햇빛, 도끼를 빠트리는 일 따위 없다면 바람이 만든 잔잔한 물결만이 느 껴지는 연못은 언젠가 한 번쯤 가보고 싶은 의지를 불러일으킨다. 산속에서 자연적으로 형성된 웅덩이 또는 샘물형 크기일 것으로 추측되지만, 산신령이 기거한다는 점을 감안할 때, 그리고 ‘욕심 많은 이웃의 최후’를 근거로 예상해 볼 때, 최소 2~3m쯤의 깊은 수심이 그려진다. 풍경으로만 치자면 꽤 아름다웠을 것이다. 오솔길 인근. 푸른 이끼와 바위가 물기를 머금은 채 자리하고, 동물의 울음만 가끔 전해질 뿐인 그토록 고요한 풍경 아래 연못에서, 산길을 지나는 수많은 이들이 ‘정직’과 ‘욕심’을 시험받았을 것이다. 이야기는 거기서 끝나지만, 여전히 더 궁금한 것들이 떠오른다. 그래서, 그 정직한 나무꾼은 어찌 됐을까. 금도끼, 은도끼를 처분했을까? 밑천 삼아 가산을 불렸을까? 트로피처럼 집 안에 모셔둔 채 계속 나무꾼이라는 직업을 유지했을까? 그 뒤의 이야기는 <맑은 물 세상> 독자들의 몫이다."}]}, {"id": "97-54", "no": 97, "label": "2026 신년호", "corner": "에코노트", "title": "물을 보호하는 아이템 5가지", "author": "", "start": 54, "end": 55, "pages": [{"p": 54, "t": "Write. 편집실 Water Plant _ 에코노트 우리가 매일 사용하는 물은 눈에 보이지 않는 거대한 상수도 시스템을 거쳐 우리에게 도달한다. 기후위기와 물 부족 우려가 커지는 지금, 생활 속 절수 습관은 단순한 실천을 넘어 하나의 미래를 만드는 행동이기도 하다. 지금부터 일상에서 쉽게 시작할 수 있는 절수 팁과 물을 아끼는 데 도움 을 주는 유용한 아이템들을 소개한다. 작은 습관 하나가 도시의 물을 지킨다! 물을 보호하는 아이템 5가지"}, {"p": 55, "t": "신년호 절수형 샤워기(저유량 샤워헤드) 좁은 미세 살수 구멍을 통해 물의 속도를 높여서 물 사용량을 30~50%까지 줄여주는 샤워기다. 물줄기의 세기는 유 지하면서도 실제 물 사용량은 줄어들기 때문에 피부 자극도 적고 세정력도 충분하다. 가장 손쉽게 교체할 수 있는 절 수 아이템으로 가정에서 바로 효과를 체감할 수 있다. 샤워 시간 타이머 샤워 시간을 1분만 줄여도 약 12L의 물을 아낄 수 있다고 한다. 그렇다면 3분, 5분을 줄인다면 절수 효과는 더 커지지 않을까? 이를 실천하는 가장 쉬운 방법이 바로 샤워 타이머다. 방수 기능이 있는 제품을 구매해 사용할 수도 있지만, 사실 꼭 따로 준비할 필요는 없다. 물이 닿지 않는 곳에 소리가 큰 알람을 설정해 두기만 해도 충분히 같은 효과를 얻 을 수 있기 때문이다. 스마트폰이나 알람시계 하나면 되니 비용 부담도 없고, 일상에서 자연스럽게 절수를 실천할 수 있다. 절수형 세척 밸브 변기는 가정 내에서 물 사용 비중이 가장 큰 설비 중 하나다. 하루에도 여러 번 사용되는 만큼, 작은 변화만으로도 절 수 효과가 크게 누적된다. 가장 쉬운 방법은 절수형 변기를 구매하는 것이지만, 변기를 하루아침에 교체하기는 쉽지 않다. 이럴 때는 절수형 세척 밸브를 사용하는 것도 좋은 방법이다. 설치만으로 기존 대비 절반에 가까운 물을 절약할 수 있어, 큰 비용이나 공사 없이도 절수를 실천할 수 있다. 재사용 싱크대 거름망 싱크대 배수구에 간단히 끼워 사용하는 일회용 또는 재사용 거름망은 음식물 찌꺼기와 기름 성분을 효과적으로 걸 러준다. 배수구가 막히지 않으면 설거지 과정에서 물을 반복적으로 틀어 씻어낼 필요가 줄어들어 물 사용량을 자연 스럽게 절약할 수 있다. 또한 기름기 섞인 물이 하수도로 직접 흘러가는 것을 막아 정화 비용 절감과 환경오염 방지 에도 도움이 된다. 설치 과정이 전혀 필요 없고 바로 사용할 수 있어 가장 실용적인 절수 아이템 중 하나다. 빗물받이통 베란다나 정원이 있는 가정이라면 빗물을 모아 화초 물주기나 바닥 청소 등으로 손쉽게 재활용할 수 있다. 작은 용량 의 빗물받이통은 설치가 간편하고 가격도 부담스럽지 않다. 굳이 전용 제품이 없더라도, 집에 있는 방수 용기 하나면 충분하다. 한 번 비가 내리면 수십 리터의 물을 대신 사용할 수 있어, 일상 속에서 자연스럽게 지속가능한 생활습관을 만들 수 있는 방법이다. 알아두면 좋을 절수 TIP 물 절약은 거창한 목표가 아니라 생활 습관의 변화에서 시작된다. 예를 들어, 양치할 때 컵을 사용하면 최대 4.8L의 물이 절약된다. 설거지할 때는 그릇 에 묻은 기름기를 깨끗이 닦아낸 다음 세척하고, 물을 받아서 사용하면 청결하게 닦이면서도 물도 절약할 수 있다. 그다음, 샤워 시간을 1분만 줄여도 한 사람 당 하루에 약 2L를 아낄 수 있다. 또한 겨울철 누수 점검, 세탁물 모아서 돌리기 등은 물뿐 아니라 에너지 절감으로도 이어진다. 절수는 곧 탄소저감, 비 용절감, 지속가능한 생활로 연결되는 셈이다."}]}, {"id": "97-56", "no": 97, "label": "2026 신년호", "corner": "청정 라이프", "title": "맑아야 사는 식물 물수세미", "author": "", "start": 56, "end": 57, "pages": [{"p": 56, "t": "Write. 편집실 Water Plant _ 청정 라이프 우리가 마시는 물처럼 깨끗한 맑은 물만을 필요로 하는 청정 생물에는 어떤 것들이 있을까? 우선은 가까이에서 보면 깃털처럼 섬세하고 아름다운 물수세미를 소개하고 싶다. 특유의 우아한 생김새 덕분에 ‘앵무새깃’, ‘물민들레’ 등 다양한 이름으로도 불리는 물수세미는 깨끗하고 맑은 물에서 자라는 대표적인 수생식물이다. 맑아야 사는 식물 물 수 세 미 한글로 고작 네 글자인 ‘물수세미’. 학명은 의외로 길다. Myriophyllum은 그리스어 myrios(무수히 많은)와 phyllon(잎)에서 유 래한 단어로, 합치면 ‘잎이 매우 많은 식물’을 뜻한다. verticillatum은 ‘돌려난’을 의미하는 데, 물수세미의 줄기 마디마다 잎이 빙 둘러 나는 구조에서 비롯된 이름이다. 끝 글자의 ‘L’은 이 학명을 붙인 덴마크 출신 식물학자 칼 폰 린네(Carl von Linné)가 이름 붙였다는 것에서 가져왔다. Myr io phyllum ve r t ic illatum L."}, {"p": 57, "t": "신년호 Feature 물수세미는 맑은 물에서 사는 대표적인 생물이다. 특히 연못과 느리 게 흐르는 개울에서 바르게 자라는 담수 수중 식물이며 가정에서 쉽 게 키울 수 있지만 그만큼 맑은 물을 그때그때 갈아줘야 하는, 무던한 듯하지만 까칠한 식물이기도 하다. 줄기는 높이 50cm 정도로 밑부분 은 진흙으로 들어가 땅속줄기가 되며 위쪽 끝이 물 위에 뜬다. 잎은 줄 기의 마디마디 4장씩 돌려나며, 깃털 모양으로 깊게 갈라진다. ‘수세미’라는 이름이 붙었다고 해서 “말려서 설거지할 때 쓸 수 있을 까?”라고 생각하는 것은 금물이다. 물수세미는 주로 관상용이나 수질 정화용으로 활용된다. 뿌리를 통해 물속에 녹아 있는 질소와 인을 흡수 해 영양분으로 삼고, 줄기와 잎 내부가 텅 비어 있는 발달한 통기조직 을 통해 공기 교환을 하며 수질 정화에 큰 도움을 주는 효자 생물이다. 물수세미를 키우는 방법 난이도 ●●●○○ 햇빛 ●●●●○(강한 햇빛 필요) 물수세미는 집에서도 관상용으로 잘 자란다. 물을 매우 좋아하 므로 흙이 마르지 않도록 매일 물을 주고, 일주일에 한두 번은 뿌 리가 잠긴 물을 갈아주는 것이 좋다. 햇볕이 잘 드는 환경에서 특 히 건강하게 성장한다. 맑은 물과 햇빛만 있다면 비교적 키우기 쉬운 편이지만, 예상보다 빠르게 자랄 수 있어 정기적인 가지치 기가 중요하다. 특히 봄철에는 죽은 줄기를 제거하고 주기적으로 가지를 다듬어 주어야 한다. 그렇다면 물의 온도는 어느 정도가 적당할까? 깨끗한 물이라면 물수세미가 견딜 수 있는 온도 범위는 매우 넓다. -30℃의 혹한 부터 35℃의 더위까지 버틸 수 있으니, 물수세미는 맑은 물에는 까다롭지만 온도에는 관대한, 단순하면서도 예민한 생물이라고 볼 수 있다."}]}, {"id": "97-58", "no": 97, "label": "2026 신년호", "corner": "물 수다", "title": "흐르는 강물을 거슬러 오르는 물에 담긴 지혜", "author": "", "start": 58, "end": 59, "pages": [{"p": 58, "t": "Write. 편집실 Water Plant _ 물 수다 흐르는 강물을 거슬러 오르는 물에 담긴 지혜 “\u0007물이 깊을수록 \u0007 소리가 없다.” 깊은 물이 겉으로는 고요히 흐르듯이, 덕망이 높고 생각이 깊은 사람은 자신을 과시하지 않는다. 참된 실력과 인격을 가진 사람은 허세를 부리지 않고 겸손하게 행동한다는 뜻이다. “\u0007물은 결국 돌은 닳게 한다.” Water will wear away stone. 물은 결국 돌을 닳게 한다. 아무리 단단한 돌이라도 물방울이 오랜 세월 끊임없이 떨어지면 결국 깎여나간다. 굳건해 보이는 대상이라도 꾸준한 노력과 시간이 쌓이면 변화하지 않을 수 없다는 뜻이다. “\u0007큰 물고기는 깊은 물에서 헤엄쳐야 한다.” A big fish must swim in deep waters. 큰 물고기는 깊은 물에서 헤엄쳐야 한다는 뜻이다. 큰 인물은 작은 울타리 안에 머물러서는 성장할 수 없고, 더 넓은 세계에서 경험을 쌓아야 한다."}, {"p": 59, "t": "신년호 우리가 살아가는 일상 속에서 물은 빼놓을 수 없는 자원이다. 목을 축여 주고, 땅을 적셔 주며, 생명을 이어가는 데 꼭 필요하다. 그래서일까, 옛사람들은 물을 빗대어 수많은 속담을 만들어냈고, 오늘날까지도 그 말들이 전해 내려오고 있다. 물처럼 흘러온 속담들을 따라가다 보면 우리 삶과 사람 사이의 관계를 다시금 돌아보게 된다. “\u0007잔잔한 물은 깊다.” Still waters run deep. 겉으로 드러나는 모습만 보고 사람을 판단할 수 없다. 말수가 적거나 내성적인 사람이라도 내면에는 깊은 지혜, 감정, 혹은 복잡한 성격이 숨어 있을 수 있다는 의미다. “\u0007깊고 얕은 물은 건너 \u0007 보아야 안다.” 사람은 겉만 보고는 알 수 없으며, 서로 오랫동안 같이 지내면서 겪어보아야 비로소 알 수 있다. 인간관계 맺음에 대한 조심성을 드러내는 말이다. “\u0007윗물이 맑아야 \u0007 아랫물도 맑다.” 윗물이 흐리고 탁하면 아랫물도 깨끗하지 않다. 아랫사람은 윗사람을 본받기 마련이다. 지도자나 어른이 올바르지 않으면 아랫사람도 잘못된 길로 가기 쉽다는 의미로, 윗사람의 모범이 중요함을 강조한다."}]}, {"id": "97-60", "no": 97, "label": "2026 신년호", "corner": "물이 있는 낭만여행", "title": "대한민국 최북단, 하늘과 맞닿은 호수 파로호", "author": "", "start": 60, "end": 63, "pages": [{"p": 60, "t": "Write. 편집실 Photo. 황지현 Water Plant _ 물이 있는 낭만여행 겨울의 파로호에는 차가운 낭만이 깃든다. 기온이 낮을 때 피어나는 서리꽃과 호수 근처에 자리한 나무들, 자그마한 마을 풍경은 도시에서는 좀 처럼 마주하기 힘든 ‘설국’ 같은 매력을 전한다. 아름다운 외관을 넘어, 한국전쟁의 역사를 품은 거대한 호수 파로호는 바라보고 있노라면 깊고 차 가운 맑은 물의 세계로 천천히 빨려 드는 듯한 느낌을 준다. 대한민국 최북단 하늘과 맞닿은 호수 파로호"}, {"p": 61, "t": "신년호 깊은 골짜기의 물 ‘파로호’ 강원도 양구군과 화천군 사이에 위치한 파로호는 우리에게 의미 가 깊은 ‘물’이다. 높은 산들에 둘러싸여 신비한 매력을 한껏 머금 은 채 숨어 있는 파로호는 우리나라 최북단에 있는 인공 호수로, 그 탄생은 일제강점기 댐 건설로 거슬러 올라간다. 당시에는 하 루에 구만리를 날아간다는 상상의 새 대붕(大鵬)과 호수의 모양 이 닮았다고 하여 ‘대붕호’라 불렸다. 이후 한국전쟁 당시 화천 전 투에서 수많은 전과를 거두며 ‘오랑캐를 무찌른 호수’라는 뜻의 파로호(破虜湖)라는 이름을 얻게 된, 유서 깊은 장소다. 북한 금강산에서 발원해 상류의 평화의 댐을 지나온 북한강 본 류와 양구의 서천이 합류해 이곳에 머문다. 비가 오면 수위가 크 게 상승해 커다란 강처럼 보이기도 하고, 눈이 내리면 특유의 신 비로운 풍경으로 사람들을 이끈다. 천연기념물인 황쏘가리를 비 롯해 50여 종의 어류가 서식하고 있으며, 여러 종의 조류는 물론 1급수에만 서식하는 수달도 광범위하게 분포하고 있다. 널리 알려진 호수인 만큼 파로호를 가는 방법도 다양하다. 가평 에서 출발해 국도 75호를 따라 한 바퀴를 도는 길은 파로호와 낭 만적인 만남을 하게 만드는 드라이빙 코스다. 화악산 기슭의 깨 끗한 물을 품은 삼일계곡과 길게 이어지는 북한강의 전경을 감 상하며 달리다 보면 파로호가 모습을 드러낸다. PA ROH O"}, {"p": 62, "t": "Water Plant _ 물이 있는 낭만여행 물문화관 세계 평화의 종 ‘평화누리호’ 유람선을 이용하는 방법도 있다. 구만리 선착장에 를 타고 약 1시간 20분 정도 이동해 도착하면 되는데, 향하는 길 서 출발해 파로호를 지나 평화의 댐까지, 약 23km의 북한강 상 이 호수와 산이 이어져 있어 이동하는 시간마저 운치가 깊다. 파 류를 따라 운행하는 유람선이다. 겨울에는 기상 여건에 따라 운 로호와 평화의 댐을 잇는 화천댐만 둘러봐도 ‘물의 나라’에 와 있 행 시간이 제한될 수 있지만, 왕복 약 1시간 30분의 부담 없는 코 다는 느낌을 받게 된다. 스로 파로호 곳곳을 물 위에서 한가로이 바라볼 수 있어 낭만을 평화의 댐 주변에는 비목공원과 트릭아트 등 다양한 즐길 거리 더하기에 좋은 선택지다. 가 마련되어 있다. 특히 ‘세계 평화의 종’은 60여 개국의 분쟁 지 파로호 근처에는 즐길 거리가 많다. 파로호를 한눈에 내려다볼 역에서 수거한 탄피로 만들어져 그 의미가 더욱 깊다. 주변에 사 수 있는 전방대나 상무룡 출렁다리를 비롯해, 곳곳에 자리한 시 람이 많지 않다면 혼자, 혹은 함께 온 이와 타종을 해보는 것도 설물과 겨울을 맞이한 나무들만으로도 절경을 이룬다. 그뿐만 인상적인 경험이 된다. 아니라 인근에는 양구 농부들이 재배한 고구마, 감자로 만든 빵 댐 아래에는 평화의 댐 오토캠핑장과 국제 아트파크가 자리한 을 맛볼 수 있는 카페 등, 잠시 앉아 쉬기 좋은 공간들도 군데군 다. 이곳에서 올려다보는 평화의 댐은 위에서 내려다볼 때와는 데 자리하고 있다. 또 다른 인상을 남긴다. 인근에는 한국수자원공사에서 관리하는 ‘물문화관’도 있다. 물문화관은 단순한 전시 공간이라기보다, ‘물 의 역사’를 정리해 보여주는 장소에 가깝다. 평화의 댐 건설 과정 물을 따라 닿는 곳 과 당시의 기록, 금강산댐과 관련된 남북한 수자원 이슈, 물을 둘 ‘평화의 댐’ 러싼 전쟁과 정책 등 사회·역사적 맥락을 한눈에 살펴볼 수 있다. 전시를 여유 있게 감상한 뒤에는 잘 가꾸어진 로비에 앉아 바깥 북한강 최상류의 물줄기를 막아 건립된 DMZ를 잇는 평화의 댐 을 바라보는 것도 좋다. 통창 너머로 보이는 공원과 건축물, 그리 은 파로호에서 약 30분 정도 이동하면 닿을 수 있다. 댐 높이는 고 겨울 햇빛이 스며드는 풍경이 인상적이다. 대한민국에서 가장 높고, 저수 가능량은 26억 3천만 톤으로 금 강산댐의 저수량보다 1천만 톤이 더 많다. 건립 이후 여러 이야기 가 오갔던 댐이지만, 주변에는 평화롭게 둘러볼 수 있는 공간들 피난민들이 지은 장터 이 조성되어 있고, 특히 겨울에는 고요히 멈춰 선 댐을 바라보고 ‘화천시장’ 있으면 절로 명상하는 듯한 기분이 들어 일부러 찾는 이들이 더 러 있다. 이곳을 가는 길도 파로호에 가는 것처럼 물길의 연속이 한참 물이 있는 풍경을 따라 여행했다면, 자연스레 시장해지기 다. 화천읍 방향으로 내비게이션을 찍고 이동하거나, 평화누리호 마련이다. 양구도 매력적인 지역이지만 식사를 염두에 둔다면"}, {"p": 63, "t": "신년호 화천군으로 이동하는 편이 좋다. 군인들이 자주 찾는 만큼 양이 넉넉한, 가격이 합리적인 식당들이 많고, 강원도의 특색을 살린 음식점들도 즐비하다. 화천시장은 우리나라에서 가장 북쪽에 위치한 전통시장이다. 이 시장도 파로호와 평화의 댐과 맥이 닿는다. 1940년대 화천댐 건 설로 인해 화천의 인구가 크게 증가하면서 기장이 활발해졌다. 그러나 화천군은 한국전쟁의 격전지였기에 시장이 계속 운영되 지 못하고 사라지다가, 결국에는 한국전쟁이 끝나며 북쪽에서 내려온 피난민들이 모여서 음식을 판매하고 먹는 곳이 됐다. 시 장에는 만두와 장떡, 손만두 등 간단히 즐길 수 있는 먹거리들이 있고, 아침보다는 점심 시간이 조금 지난 뒤에 도착해야 선택지 가 더 넉넉하다. 메밀전병 역시 강원도 특유의 담백하함을 살린 화천시장 맛으로, 여행의 마지막을 마무리하기에 잘 어울린다. 강원도를 떠올리면 빼놓을 수 없는 옹심이를 파는 곳들도 화천 시장 곳곳에 자리하고 있다. 감자와 녹말을 적절히 섞어 만든 쫀 득한 옹심이에, 아삭하게 직접 담근 김치를 곁들여 먹으면 도시 여행 TIP 에서는 쉽게 만나기 어려운 구수한 감자 맛이 입안 가득 퍼진다. 뜨거운 것은 뜨거운 것으로 이겨내듯, 겨울에는 차가운 것을 차 신비로운 물이 빚어낸 아홉 가지 아름다운 경치라는 뜻의 ‘비수구미(秘 갑게 마주해보는 것도 특별한 경험을 준다. 특히 겨울에 고이고 水九美)’ 마을은 평화의 댐 갈림길에서 비포장도로를 따라 약 2km 들어 흐르는 물은 탁함 없이 고요와 여유를 품어, 물길을 바라보는 것 가야 만날 수 있다. 이후에는 선착장 앞에 차를 세워두고 20분가량 걸어 만으로도 자연스레 명상에 잠기게 한다. 들어가야 한다. 평화누리호를 이용하면 약 50분 정도 후 비수구미 인근 의 숲길에 도착하게 되는데, 물과 숲이 어우러진 풍경을 배경으로 천천 새로운 마음으로 맞이하는 신년, 아직 추위가 가시지 않았을 때 히 걸으며 사진을 남기기에도 좋다. 스마트폰 통신이 되지 않을 때도 잦 이곳을 찾는 건 어떨까. ‘이냉치냉’의 마음으로 파로호와 그를 잇 으니 메모장에 일정을 미리 정리해 둘 것. 는 물길을 찾는 일이 또 하나의 특별한 겨울 경험이 될 것이다. 강원도의 맛집 양구농사꾼 옹기종기 위치 \u0007강원 양구군 양구읍 파로호로 937-30 위치 \u0007강원 화천군 화천읍 중앙로6길 13 1층 문의 0507-1397-8827 문의 033-442-5525 추천 메뉴 감자빵, 사과빵과 아메리카노의 맛이 유독 좋다. 추천 메뉴 감자를 듬뿍 넣은 걸쭉한 국물과 쫄깃한 옹심이가 일품이다."}]}, {"id": "97-64", "no": 97, "label": "2026 신년호", "corner": "물결 따라 세계여행", "title": "물이 빚어낸 치유의 도시 대만 타이베이 베이터우(北投)", "author": "", "start": 64, "end": 67, "pages": [{"p": 64, "t": "Water Plant _ 물결 따라 세계 여행 물이 빚어낸 치유의 도시 대만 타이베이 베이터우(北投 베이터우(北投)) 푸르른 산자락 아래, 짙은 유황 내음이 섞인 수증기가 끊임없이 피어오르는 곳. 타이베이 북쪽에 자리한 베이터우는 단순히 온천을 즐기는 휴양지를 넘어, 찾는 이에게 치유를 선사한다. Write. 편집실"}, {"p": 66, "t": "Water Plant _ 물결 따라 세계 여행 대지에서 솟아오른 치유의 물 물길을 따라 이어진 문화유산 베이터우가 특별한 이유는 바로 그곳에서 솟아나는 물에 있다. 베이터우의 문화유산은 온천수를 따라 조화롭게 자리 잡고 있 베이터우는 지열 활동이 매우 활발하여 성분이 다른 세 가지 유 다. 이 지역의 온천 문화는 일제강점기 시절 일본인들이 휴양과 형의 온천수가 나오는데, 이 모든 물은 지열곡(地熱谷)에서 시작 치료 목적으로 대규모 온천 시설을 지으면서 생겼다. 베이터우 된다. 90°C 이상의 강산성 온천수가 끊임없이 뿜어져 나오는 지 온천 공원 언덕에 위치한 베이터우 온천 박물관은 이 시기에 만 열곡은 뿌연 수증기가 수면 위를 맴돌아 전설 속 호수와 같은 신 들어진 것으로, 동아시아 최대 규모의 공중목욕탕이었다. 그러나 비로움을 자아낸다. 지열곡의 온천수는 온도가 높고 강한 산성 오랫동안 방치되다 주민들의 노력에 의해 대만의 색을 입고 다 을 띠고 있어 입욕이 불가하지만 이 물이 흘러 내려오며 자연적 시 태어났다. 빅토리아풍의 외관과 일본식 내부 구조가 결합된 으로 냉각 및 희석되어 몸을 담글 수 있는 온천물이 만들어진다. 목조 건축물은 대만의 역사를 상징적으로 보여준다. 1층에 들어 지열곡에서 발생한 세 가지 온천수 중 하나인 청황천(青磺泉) 서면 웅장한 로마식 대형 온천탕이 반긴다. 2층에는 일본식 다다 은 강한 산성을 띠고 있기에, 역시나 물에 들어가지는 못하지 미 휴게실이 있고, 온천 역사 전시실에는 베이터우 온천의 발견 만 색다른 특별함을 지니고 있다. 바로 청황천에서 만들어지는 과 발전, 온천수와 베이터우석에 대해 자세히 설명되어 있다. 베이터우석(北投石)이 그것이다. 베이터우석은 청황천의 라듐 같은 공원에 자리 잡은 베이터우 도서관 역시 놓치지 않고 방문 성분이 수천 년에 걸쳐 침전이 되어 생성된 광물이다. 1905년 일 해야 할 명소이다. 대만 최초로 녹색 건축 인증을 받은 이 도서관 본 학자에 의해 처음 발견되었으며, 세계적으로 대만 베이터우 은 목재 구조와 친환경적인 디자인이 돋보인다. 빗물을 모아 화 와 일본 아키타현의 다마가와(玉川) 온천 두 곳에서만 나오는 희 장실 용수와 식물 관개에 재활용하고 지붕에 태양열 패널을 설 귀 광물로, 대만의 천연기념물로 지정되어 있다. 치하는 등, 도서관 자체가 ‘물’의 순환을 닮은 친환경 구조를 지니 가장 대중적인 백황천(白磺泉)은 유백색을 띠는 온천수로, 미 네랄 성분을 다량 포함하고 있어 매끄러운 감촉을 선사하며 고 있다. 창을 통해 들이치는 햇빛 아래에서 고요히 독서하는 것도 치유와 휴식의 공간인 베이터우를 즐기는 또 하나의 방법이다. 피부 미용과 혈액 순환 개선, 피로 회복에 도움이 된다. 다른 온 천수 중 하나인 철황천(鐵磺泉)은 중성에 가까워 입욕이 가능하 지만 매우 희귀해 체험을 해보고 싶다면 취급하는 시설을 별도 로 찾아보는 것이 좋다. 베이터우 온천 박물관"}, {"p": 67, "t": "신년호 베이터우 도서관 출처: tripadviso 치유와 휴식을 완성하는 미식 만라이라면(滿來溫泉拉麵) 위치 No. 30, Zhonghe St, Beitou District, Taipei City, 대만 112 운영 시각 11:30~21:00 (월요일 휴무) 온천욕이 몸을 정돈하는 과정이라면, 미식은 마음의 허기를 달 래는 마무리이다. 베이터우의 먹거리는 온천욕으로 피로가 풀린 몸에 영양과 따뜻함을 더해주는 데 집중되어 있다. 가장 대표적 인 음식은 온천 라면으로, 베이터우 온천가에는 일본의 영향을 받은 정갈한 라면집들이 줄지어 서 있다. 뜨끈하고 깊은 국물은 온천욕으로 노곤해진 몸에 활력을 불어넣어 준다. ‘만라이라면’ 추천 메뉴 백탕종합라멘, 온천계란 은 현지인과 관광객 모두에게 사랑받는 맛집으로, 온천수로 면 출처: Google Maps 반죽을 하고 육수를 내 만든 특별한 라면을 맛볼 수 있는 곳이다. 뽀얀 국물의 라면이 기본적인 메뉴이지만 매운맛을 좋아하는 이 들을 위한 지옥라면은 별미 중 하나이다. 온천 공원 주변에는 목재를 활용하거나 오래된 건물을 개조한 카페가 있어 산책 후 커피 한 잔을 즐기기 좋다. 대만식 수제 디 샤오광만(韶光慢) 카페 저트를 곁들인다면 달콤한 휴식이 될 것이다. 물이 주는 치유, 역 위치 \u0007No. 51號, Section 1, Fengnian Rd, Beitou District, Taipei City, 사가 주는 영감, 그리고 미식이 주는 만족감까지. 베이터우는 일 대만 112 운영 시각 월금토일 12:00~19:00 / 목 13:00~19:00 (화, 수 휴무) 추천 메뉴 스페셜 블렌드 커피, 용과&파인애플 주스, 레몬 타르트 상에 지친 우리에게 완벽한 재충전의 시간을 선물한다."}]}, {"id": "97-68", "no": 97, "label": "2026 신년호", "corner": "독자마당", "title": "독자마당", "author": "", "start": 68, "end": 69, "pages": [{"p": 68, "t": "Water Plant _ 독자마당 독자마당 〈맑은 물 세상〉은 여러분과 함께 만들어가는 책입니다. 보내주신 소중한 의견을 바탕으로, 더 좋은 콘텐츠로 찾아뵙겠습니다. 내 마음에 ‘쏙!’ 들었던 기사 〈맑은 물 세상〉 2025년 가을호 리뷰 이벤트에 참여해주신 구독자 여러분께 감사드립니다. 그중 일부 구독자분들의 후기를 소개합니다. 김○아님 오○경님 유○열님 상근부회장님의 국제 협력 강화 행보가 인상 깊 지난 여름 가뭄과 장마를 경험하면서 물의 원활 글로벌 상하수도 디지털 전환 현황을 잘 살펴보 었습니다. 국내 물기업들이 세계 시장에서 경쟁 한 수요공급의 문제가 중요하다는 걸 알았습니 았습니다. 물산업 강국으로 나아감에 있어 디지 력을 갖추고 꿈을 펼칠 수 있도록 돕겠다는 따 다. 물은 있으나 제대로 공급되지 못하는 경우 털 도입이 큰 모멘텀이 되고 있지 않은지 생각했 뜻한 의지가 느껴져 마음이 든든했습니다. 를 보면서 물스트레스 시대에 대한 관심을 가지 습니다. 게 됐습니다. 김○근님 강○숙님 쉽고 친환경적인 욕실 청소 팁이 매우 유용했습니다. 특히 부위별 관리 마늘 버터 가리비찜 제철음식 요리 레시피를 맛나게 잘 읽었습니다. 글 는 정보를 찍어 저장하고 다시 읽으면서 실천하기 좋은 내용이네요. 지 로나마 제철 식재료를 활용한 건강한 요리를 만나고 나니 입안 가득 군 인에게도 공유하고 싶었습니다. 침이 돌기 시작하더군요. 2026년 <맑은 물 세상> 물 한 컵 에세이 백일장 2026년 〈맑은 물 세상〉의 주제는 ‘평등한 물’입니다. 물과 관련된 짧은 ‘한 컵 에세이’를 작성해 응모해 주세요. ‘평등한 물’이라는 주제 아래 자유롭게 글을 써서 보내 주시면, 장원에게 특별 선물(20만 원 상당)을 드립니다. 참여 방법 주제 평등한 물 QR코드를 스캔해 구글폼에 분량 1,400자 내외 제목과 함께 글을 작성해 주세요. 이벤트 상품 20만 원 상당의 친환경 제품 예시) 제 \u0007 목: 평등한 물 본문: 물은 어디에서나 흐른다. ※ 개인정보 동의 필수"}, {"p": 69, "t": "물기업 소개 ZDF Zeolite Deodorant Filter 상온에서 생활 악취 및 유분을 흡착하고 촉매분해 작용으로 제거분해 되는 상온 악취 제거 장치 흡착제+촉매 흡착제 : 취기성분 흡착 촉매 : 흡착된 취기성분을 저분자화 하여 분해 허니컴 형상 고표면적에 의한 높은 탈취효율 및 저압손으로 배기라인 적용 가능 강한 탈취효과 저렴한 운전비용 황화합물, 질소화합물계 악취에 강한 탈취효과, 사용기간이 2~5년이며 별도의 동력원이나 열원 불필요. 저압력 손실 재생 및 재사용 가능 허니컴 형상의 넓은 비표면적을 제공하여 압력손실이 낮음. 장시간의 사용에 의해 탈취성능이 저하된 경우 재생이 가능함. 적용처 ▼H석유화학 탈취설비 ▲물환경센터 하수처리장 ◀정수,하수처리장 본사 및 공장 : 충남 아산시 온천대로 1122번길 46-5 Tel 041-531-0657 Fax 041-0531-0659 ㈜세라컴 서울 사무소 : 서울시 송파구 송파대로 260, 제일오피스텔 906-907호 Tel 02-744-1777"}]}] const PARTICLE2 = /(에서는|으로는|에서|에게|으로|이란|과의|와의|에는|에도)$/;
const PARTICLE1 = /(은|는|을|를|의|와|과|에)$/;
const stripP = w => { w = w.replace(PARTICLE2, ""); if (w.length >= 3) w = w.replace(ENDING, ""); return w.length >= 3 ? w.replace(PARTICLE1, "") : w; };
const ENDING = /(한가요|인가요|했나요|하나요|되나요|있나요|이에요|예요|해요|하는|하다|되는|된|한|이)$/;

const norm = s => s.toLowerCase().replace(/[^0-9a-z가-힣]/g, "");
const isAscii = s => /^[0-9a-z]+$/i.test(s);

/* build page index */
const PAGES = [];
DATA.articles.forEach((a, ai) => a.pages.forEach(p => {
  PAGES.push({ai, p:p.p, t:p.t, n:norm(p.t), low:p.t.toLowerCase()});
}));
const ART_HEAD = DATA.articles.map(a => norm(a.corner + a.title));

function terms(q){
  const raw = q.split(/[\s,·・/|?!.]+/).map(w => w.trim()).filter(Boolean);
  const out = [];
  const joined = norm(q);
  // multi-word synonyms keys (e.g. "물 재이용", "디지털 전환")
  for (const k of Object.keys(SYN)) if (k.length >= 3 && joined.includes(k) && !out.some(o => o.key === k)) out.push({key:k, vars:SYN[k]});
  for (let w of raw){
    w = stripP(w);
    if (w.length < 2 && !isAscii(w)) continue;
    if (STOP.has(w)) continue;
    const k = norm(w); if (!k || STOP.has(k)) continue;
    if (out.some(o => o.key === k || o.vars.some(v => norm(v) === k))) continue;
    out.push({key:k, vars: SYN[k] || [w]});
  }
  return out;
}

function countIn(page, v){
  if (isAscii(norm(v))) {
    const re = new RegExp("(^|[^a-z0-9])" + norm(v) + "($|[^a-z0-9])", "g");
    return (page.low.match(re) || []).length;
  }
  const nv = norm(v); if (!nv) return 0;
  let c = 0, i = 0; while ((i = page.n.indexOf(nv, i)) !== -1){ c++; i += nv.length; } return c;
}

function search(q){
  const ts = terms(q);
  if (!ts.length) return {ts, results:[]};
  const N = PAGES.length;
  const df = ts.map(t => PAGES.filter(p => t.vars.some(v => countIn(p, v) > 0)).length);
  const idf = df.map(d => Math.log(1 + N / (d + 0.5)));
  const byArt = new Map();
  PAGES.forEach(p => {
    let s = 0; const hit = new Set();
    ts.forEach((t, ti) => {
      let c = 0; t.vars.forEach(v => c += countIn(p, v));
      if (c){ s += idf[ti] * (1 + Math.log(c)); hit.add(ti); }
    });
    if (!s) return;
    const e = byArt.get(p.ai) || {ai:p.ai, pages:[], hit:new Set()};
    e.pages.push({p:p.p, s, t:p.t}); hit.forEach(h => e.hit.add(h));
    byArt.set(p.ai, e);
  });
  const results = [...byArt.values()].map(e => {
    e.pages.sort((x, y) => y.s - x.s);
    let s = e.pages[0].s + 0.5 * (e.pages[1]?.s || 0) + 0.25 * (e.pages[2]?.s || 0);
    ts.forEach((t, ti) => { if (t.vars.some(v => ART_HEAD[e.ai].includes(norm(v)))) { s += 2 * idf[ti]; e.hit.add(ti); } });
    s *= (0.4 + 0.6 * e.hit.size / ts.length);
    return {...e, score:s, art:DATA.articles[e.ai]};
  }).sort((x, y) => y.score - x.score);
  return {ts, results};
}

function snippet(text, ts, len = 150){
  const low = text.toLowerCase();
  let at = -1, hitLen = 0;
  for (const t of ts) for (const v of t.vars){ const i = low.indexOf(v.toLowerCase()); if (i >= 0 && (at < 0 || i < at)) { at = i; hitLen = v.length; } }
  if (at < 0) return esc(text.slice(0, len)) + "…";
  const s = Math.max(0, at - 50), e = Math.min(text.length, s + len);
  let out = esc(text.slice(s, e));
  for (const t of ts) for (const v of t.vars){
    if (v.length < 2) continue;
    out = out.replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => "<mark>" + m + "</mark>");
  }
  return (s > 0 ? "…" : "") + out + (e < text.length ? "…" : "");
}

const pageList = ps => {
  const a = [...new Set(ps)].sort((x, y) => x - y); return a.map(p => "p." + p).join(", ");
};
const locHTML = (art, pages) =>
  `<b>${art.no}호</b> · ${esc(art.label)} · 〈${esc(art.corner)}〉 · 기사 p.${art.start}${art.end > art.start ? "–" + art.end : ""}` +
  (pages && pages.length ? ` · 관련 쪽 <b>${pageList(pages)}</b>` : "");

/* ---------- Claude ---------- */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let sampleOff = false;

function buildPrompt(q, refs){
  const blocks = refs.map((r, i) => {
    const a = r.art;
    const pg = r.pages.slice(0, 3).sort((x, y) => x.p - y.p)
      .map(p => `  (p.${p.p}) ${p.t.slice(0, 1800)}`).join("\n");
    return `[${i + 1}] ${a.no}호(${a.label}) 〈${a.corner}〉 「${a.title}」${a.author ? " 글: " + a.author : ""} / 기사 범위 p.${a.start}–${a.end}\n${pg}`;
  }).join("\n\n");
  return `당신은 한국상하수도협회 소식지 《맑은 물 세상》 과월호 아카이브의 안내 챗봇입니다.
아래 [자료]는 사용자 질문으로 과월호 원문을 검색해 찾은 기사 발췌입니다. (p.숫자)는 인쇄된 매거진 쪽수입니다.

규칙
1. [자료]에 적힌 내용만 근거로 답합니다. 외부 지식이나 추측은 쓰지 않습니다.
2. 질문과 실제로 관련된 내용이 [자료]에 하나도 없으면, 다른 말 없이 NOT_FOUND 한 단어만 출력합니다. 단어가 스치듯 언급만 된 경우도 관련 없음으로 봅니다.
3. 관련 있는 기사만 고릅니다(최대 5개). 관련 없는 자료는 언급하지 않습니다.
4. 형식(한국어, 마크다운은 굵게와 '-' 목록만):
   첫 줄: 질문에 대한 종합 답변 1~2문장.
   그다음 관련 기사마다 한 항목:
   - **[번호] 기사 제목** (N호 p.쪽수) — 해당 내용 요약 2~3문장.
   쪽수는 그 내용이 실제로 나온 (p.숫자)를 씁니다.
5. 원문 일부는 스캔본 OCR이라 오탈자가 있을 수 있습니다. 문맥으로 이해하고, 요약에는 바른 표기로 씁니다.

[질문]
${q}

[자료]
${blocks}`;
}

function md(text){
  const lines = text.trim().split(/\n+/);
  let html = "", inList = false;
  for (let ln of lines){
    let h = esc(ln.trim());
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[(\d)\]/g, '<span class="ref">$1</span>');
    if (/^[-•]\s+/.test(ln.trim())){
      if (!inList){ html += "<ul>"; inList = true; }
      html += "<li>" + h.replace(/^[-•]\s+/, "") + "</li>";
    } else {
      if (inList){ html += "</ul>"; inList = false; }
      html += "<p>" + h + "</p>";
    }
  }
  return html + (inList ? "</ul>" : "");
}

let busy = false;
async function ask(q, opts = {}){
  q = q.trim(); if (!q || busy) return;
  busy = true; $("#send").disabled = true;
  const log = $("#log");
  const qe = document.createElement("div"); qe.className = "q"; qe.textContent = q; log.append(qe);
  const box = document.createElement("div"); box.className = "a"; log.append(box);
  qe.scrollIntoView({behavior:"smooth", block:"start"});

  const {ts, results} = opts.article ? {ts:terms(opts.article.title), results:[opts.forced]} : search(q);
  const top = results.slice(0, 6);

  if (!top.length){
    box.innerHTML = `<div class="nf">${NOT_FOUND_MSG}<small>수록된 ${DATA.issues.length}개 호(${DATA.issues.map(i => i.no + "호").join("·")})에서 관련 단어를 찾지 못했습니다. 다른 표현으로 물어보세요.</small></div>`;
    done(); return;
  }

  const srcHTML = (cited) => `<div class="srcs"><h4>${cited ? "출처" : "검색된 기사"}</h4>` + top.map((r, i) => {
    const used = !cited || cited.has(i + 1);
    if (cited && !used) return "";
    return `<div class="src"><span class="num">${i + 1}</span><div><div class="loc">${locHTML(r.art, r.pages.slice(0, 3).map(p => p.p))}</div><div class="tt">${esc(r.art.title)}</div></div><div class="snip">${snippet(r.pages[0].t, ts)}</div></div>`;
  }).join("") + `</div>`;

  box.innerHTML = `<div class="status"><span class="dot"></span><span>원문 ${top.length}건을 찾았습니다. AI가 요약하는 중…</span></div><div class="answer"></div>` + srcHTML(null);
  const ans = box.querySelector(".answer"), st = box.querySelector(".status");

  const sample = sampleOff ? null : await samplePromise;
  if (!sample){
    st.innerHTML = "<span>AI 요약을 쓸 수 없는 화면이라 검색 결과만 보여 드립니다. Claude에서 이 페이지를 열면 요약이 함께 나옵니다.</span>";
    done(); return;
  }
  try {
    const {text} = await sample(buildPrompt(q, top), {
      modelTier:"default",
      onText: ({text}) => {
        if (/^\s*NOT_FOUND/.test(text)) return;
        st.innerHTML = '<span class="dot"></span><span>요약하는 중…</span>';
        ans.innerHTML = md(text);
      }
    });
    if (/NOT_FOUND/.test(text) || !/\[\d\]/.test(text)){
      box.innerHTML = `<div class="nf">${NOT_FOUND_MSG}<small>단어가 언급된 쪽은 있지만, 질문에 답할 만한 내용은 없었습니다.</small></div>` +
        `<details class="note"><summary>단어가 언급된 쪽 보기</summary>${srcHTML(null)}</details>`;
      done(); return;
    }
    const cited = new Set([...text.matchAll(/\[(\d)\]/g)].map(m => +m[1]));
    st.remove();
    ans.innerHTML = md(text);
    box.querySelector(".srcs").outerHTML = srcHTML(cited);
  } catch (e){
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled" || code === "capability_disabled" || code === "not_declared"){
      sampleOff = true;
      st.innerHTML = "<span>AI 요약이 허용되지 않아 검색 결과만 보여 드립니다.</span>";
    } else if (code === "rate_limited"){
      st.innerHTML = "<span>요청이 많아 요약을 잠시 쉬고 있습니다. 조금 뒤 다시 물어보세요. 아래는 검색 결과입니다.</span>";
    } else {
      if (e && e.text) ans.innerHTML = md(e.text);
      st.innerHTML = "<span>요약이 중간에 끊겼습니다. 같은 질문을 다시 보내 보세요. 아래는 검색 결과입니다.</span>";
    }
  }
  done();
  function done(){ busy = false; $("#send").disabled = false; }
}


/* ---------- UI ---------- */
const views = {home:$("#v-home"), search:$("#v-search"), toc:$("#v-toc")};
function go(tab){
  for (const k in views) views[k].hidden = k !== tab;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
  $("#composer").hidden = tab !== "search";
  window.scrollTo({top: tab === "search" ? document.body.scrollHeight : 0});
  if (tab === "search") setTimeout(() => $("#qbox").focus({preventScroll:true}), 50);
}
function askIn(q, opts){ go("search"); $("#empty").hidden = true; ask(q, opts); }

const issuesDesc = DATA.issues.slice().reverse();
$("#cov").textContent = `수록 ${DATA.issues.length}개 호 · ${issuesDesc.map(i => i.no + "호").join(" ")}`;

/* category chips + keyword list */
let cat = CATS[0].id;
$("#cats").innerHTML = CATS.map(c => `<button class="cat" type="button" data-cat="${c.id}" aria-pressed="${c.id === cat}">${c.emoji} ${esc(c.label)}</button>`).join("");
function topOf(q){ const r = search(q).results[0]; return r ? `${r.art.no}호 〈${r.art.corner}〉 p.${r.art.start}` : ""; }
function renderK(){
  const list = KEYWORDS.filter(k => cat === "all" || k.cat === cat || (cat === "hot" && k.hot));
  const c = CATS.find(x => x.id === cat);
  $("#ktitle").textContent = `${c.emoji} ${c.id === "hot" ? "추천 키워드" : c.label}`;
  $("#klist").innerHTML = list.map(k => `<button class="krow" type="button" data-ask="${esc(k.q)}"><span class="icon ${k.tone}">${k.emoji}</span><span style="min-width:0"><span class="kt">#${esc(k.label)}</span><span class="kd" style="display:block">${esc(topOf(k.q))}</span></span><span class="arrow">›</span></button>`).join("");
}
renderK();
$("#quick").innerHTML = KEYWORDS.filter(k => k.hot).map(k => `<button class="cat" type="button" data-ask="${esc(k.q)}">${k.emoji} ${esc(k.label)}</button>`).join("");

/* issue shelf + toc */
$("#shelf").innerHTML = issuesDesc.map((i, n) => `<button class="icard c${n % 6}" type="button" data-vol="${i.no}"><span class="v">Vol.${i.no}</span><span><span class="l" style="display:block">${esc(i.label)}</span><span class="n">기사 ${i.toc.length}편</span></span></button>`).join("");
let vol = issuesDesc[0].no;
function renderToc(){
  const n = issuesDesc.findIndex(i => i.no === vol), i = issuesDesc[n];
  $("#vols").innerHTML = issuesDesc.map(x => `<button class="vol" type="button" data-vol="${x.no}" aria-pressed="${x.no === vol}">Vol.${x.no}</button>`).join("");
  $("#ihead").innerHTML = `<div class="ihead c${n % 6}"><div><div class="v">Vol.${i.no}</div><div class="l">${esc(i.label)} · 발행 ${i.date.replace(/-/g, ".")}</div></div>${i.ocr ? '<span class="ocr">스캔본 · 문자 인식</span>' : ""}</div>`;
  $("#toc").innerHTML = i.toc.map(t => `<button class="trow" type="button" data-art="${i.no}-${t.p}"><span class="pg">${String(t.p).padStart(2, "0")}</span><span style="min-width:0"><span class="c">${esc(t.corner)}</span><span class="t">${esc(t.title)}</span></span><span class="ai">AI 요약</span></button>`).join("");
}
renderToc();

document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-go],[data-cat],[data-ask],[data-vol],[data-art]");
  if (!el) return;
  if (el.dataset.tab) go(el.dataset.tab);
  else if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.cat){ cat = el.dataset.cat; document.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b === el)); renderK(); }
  else if (el.dataset.ask) askIn(el.dataset.ask);
  else if (el.dataset.vol){ vol = +el.dataset.vol; renderToc(); go("toc"); }
  else if (el.dataset.art){
    const a = DATA.articles.find(x => x.id === el.dataset.art);
    if (!a.pages.length){ askIn(a.title); return; }
    const forced = {art:a, ai:DATA.articles.indexOf(a), pages:a.pages.map(p => ({p:p.p, s:1, t:p.t})), score:1};
    askIn(`${a.no}호 〈${a.corner}〉 「${a.title}」 기사를 요약해줘`, {article:a, forced});
  }
});
$("#ask").addEventListener("submit", e => { e.preventDefault(); const v = $("#qbox").value; $("#qbox").value = ""; askIn(v); });
window.__search = search;
})();
</script>

</body></html>
