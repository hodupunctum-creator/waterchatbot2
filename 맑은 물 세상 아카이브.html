<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>맑은 물 세상 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: a phone-width app column (home / AI 검색 / 호별 목차) over a soft lavender wash, with a fixed bottom tab bar. */
:root{
  --wash1:#e7eafc; --wash2:#f3f1fb;
  --card:#ffffff; --ink:#1c1f3b; --muted:#7c819c; --line:#e7e9f4;
  --pri:#4a5af0; --pri-ink:#ffffff; --pri-soft:#eaedff; --chip:#f1f2f9;
  --warn:#c2541c; --warn-soft:#fff1e8; --mark:#fff0a8;
  --bar:#ffffff; --shadow:0 6px 24px rgba(60,70,160,.08);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --latin:"Poppins","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wash1:#14163a; --wash2:#0f1128; --card:#1c1f42; --ink:#eceefe; --muted:#9ca2c8; --line:#2b2f5a;
  --pri:#8d98ff; --pri-ink:#11132e; --pri-soft:#2a2f63; --chip:#252955;
  --warn:#ffab7a; --warn-soft:#3b2620; --mark:#5d5114; --bar:#181b3c; --shadow:0 6px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --wash1:#14163a; --wash2:#0f1128; --card:#1c1f42; --ink:#eceefe; --muted:#9ca2c8; --line:#2b2f5a;
  --pri:#8d98ff; --pri-ink:#11132e; --pri-soft:#2a2f63; --chip:#252955;
  --warn:#ffab7a; --warn-soft:#3b2620; --mark:#5d5114; --bar:#181b3c; --shadow:0 6px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body,button{word-break:keep-all;overflow-wrap:break-word}
body{background:linear-gradient(180deg,var(--wash1),var(--wash2) 420px) var(--wash2);background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0;min-height:100vh;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.view{display:grid;gap:16px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.topbar h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.03em}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:500}
.beta{font-family:var(--latin);font-size:11px;font-weight:600;color:var(--pri);background:var(--pri-soft);padding:3px 10px;border-radius:99px}

/* search pill */
.searchpill{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.searchpill svg{flex:none}

/* category chips */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1.5px solid transparent;background:var(--chip);border-radius:99px;padding:7px 14px;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cat[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}

/* banner */
.banner{position:relative;overflow:hidden;background:var(--card);border-radius:22px;padding:22px 20px 24px;box-shadow:var(--shadow);min-height:168px;cursor:pointer;border:0;text-align:left;width:100%;display:block}
.banner .bq{font-size:19px;font-weight:800;line-height:1.4;position:relative;z-index:1;max-width:62%;text-wrap:balance}
.banner .go{margin-top:10px;font-size:13px;font-weight:700;color:var(--pri);position:relative;z-index:1}
.tiles{position:absolute;right:-10px;bottom:-14px;width:46%;height:150px}
.tile3d{position:absolute;border-radius:22px;box-shadow:inset 0 3px 6px rgba(255,255,255,.55),inset 0 -6px 12px rgba(0,0,0,.12),0 10px 18px rgba(60,70,160,.18);display:grid;place-items:center;font-size:30px}
.t1{width:78px;height:78px;right:96px;bottom:18px;background:linear-gradient(145deg,#8fd3ff,#3e8bff);transform:rotate(-10deg)}
.t2{width:86px;height:86px;right:14px;bottom:40px;background:linear-gradient(145deg,#c8b8ff,#7a62f5);transform:rotate(8deg)}
.t3{width:58px;height:58px;right:150px;bottom:-6px;background:linear-gradient(145deg,#ffd0e2,#ff8fb4);transform:rotate(14deg);font-size:22px}
.drop{position:absolute;width:26px;height:26px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:linear-gradient(135deg,#bfe8ff,#5ab0ff);box-shadow:inset 0 2px 4px rgba(255,255,255,.6)}
.d1{right:120px;top:4px}.d2{right:6px;top:-6px;width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){.t2{animation:bob 5s ease-in-out infinite}.t1{animation:bob 6s ease-in-out -2s infinite}}
@keyframes bob{50%{translate:0 -6px}}

/* section header */
.sec{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.sec h2{font-size:17px;font-weight:800;margin:0}
.sec .more{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer}

/* keyword list */
.klist{display:grid;gap:4px;background:var(--card);border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.krow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px;border-radius:14px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.krow:hover{background:var(--chip)}
.icon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:24px;box-shadow:inset 0 2px 4px rgba(255,255,255,.5),inset 0 -4px 8px rgba(0,0,0,.08)}
.krow .kt{font-weight:700;font-size:16px}
.krow .kd{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .arrow{color:var(--muted)}
.g-blue{background:linear-gradient(145deg,#cfe3ff,#8fb6ff)}
.g-violet{background:linear-gradient(145deg,#e2d9ff,#a995ff)}
.g-mint{background:linear-gradient(145deg,#d3f7ec,#7fdcc0)}
.g-peach{background:linear-gradient(145deg,#ffe6d6,#ffb68c)}
.g-pink{background:linear-gradient(145deg,#ffe0ec,#ff9fc1)}
.g-sky{background:linear-gradient(145deg,#d9f3ff,#86d0f5)}
.g-lemon{background:linear-gradient(145deg,#fff5cc,#ffd76b)}
.g-navy{background:linear-gradient(145deg,#4b56c9,#20257a)}

/* issue cards (home, horizontal) */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:148px;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.icard{border:0;cursor:pointer;text-align:left;border-radius:20px;padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow)}
.icard .v{font-family:var(--latin);font-weight:700;font-size:26px;line-height:1}
.icard .l{font-size:13px;font-weight:500;opacity:.92}
.icard .n{font-size:12px;opacity:.85}
.c0{background:linear-gradient(150deg,#6f7bff,#3b47d6)}
.c1{background:linear-gradient(150deg,#9b7bff,#6146d6)}
.c2{background:linear-gradient(150deg,#58b8ff,#2e74e0)}
.c3{background:linear-gradient(150deg,#6ad1c4,#2a9a8f)}
.c4{background:linear-gradient(150deg,#ff9fb8,#e0607f)}
.c5{background:linear-gradient(150deg,#7f87a8,#4a5276)}

/* notice card */
.notice{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:grid;gap:6px}
.notice b{font-size:16px}
.notice p{margin:0;color:var(--muted);font-size:13.5px}

/* chat */
.chathead{display:flex;align-items:center;justify-content:space-between}
#log{display:flex;flex-direction:column;gap:14px}
.empty{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.empty h3{margin:0 0 4px;font-size:18px;font-weight:800}
.empty p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.q{align-self:flex-end;background:var(--pri);color:var(--pri-ink);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:85%;font-weight:500}
.a{background:var(--card);border-radius:22px 22px 22px 8px;padding:18px;box-shadow:var(--shadow);min-width:0}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pri);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.answer{margin-top:8px}
.answer p{margin:0 0 10px}
.answer ul{margin:0 0 6px;padding-left:18px}
.answer li{margin-bottom:10px}
.answer .ref{font-family:var(--latin);font-size:11px;font-weight:600;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:1px 6px;margin-right:2px}
.nf{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:14px 16px;font-weight:700}
.nf small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:13px}
.srcs{margin-top:12px;display:grid;gap:8px}
.srcs > h4{margin:4px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.src{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px;border-radius:16px;background:var(--chip)}
.src .num{font-family:var(--latin);font-size:12px;font-weight:600;color:var(--pri-ink);background:var(--pri);border-radius:8px;width:24px;height:24px;display:grid;place-items:center}
.src .loc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.src .loc b{color:var(--pri);font-weight:700}
.src .tt{font-weight:700;margin:2px 0}
.src .snip{font-size:13px;color:var(--muted);grid-column:1/-1}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
details.note{margin-top:10px;font-size:13px;color:var(--muted)}
details.note summary{cursor:pointer}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding:10px 16px;z-index:5}
.composer form{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 18px;box-shadow:0 8px 30px rgba(60,70,160,.16)}
.composer form:focus-within{border-color:var(--pri)}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:8px 0}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.send[disabled]{opacity:.45;cursor:default}

/* toc view */
.vols{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.vols::-webkit-scrollbar{display:none}
.vol{flex:none;font-family:var(--latin);font-weight:600;border:1.5px solid transparent;background:var(--chip);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px}
.vol[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.ihead{border-radius:22px;padding:20px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ihead .v{font-family:var(--latin);font-weight:700;font-size:30px;line-height:1}
.ihead .l{font-size:14px;opacity:.9}
.ihead .ocr{font-size:11px;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 9px;white-space:nowrap}
.toc{background:var(--card);border-radius:22px;padding:8px;box-shadow:var(--shadow);display:grid;gap:2px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:0;background:none;text-align:left;cursor:pointer;border-radius:14px;width:100%}
.trow:hover{background:var(--chip)}
.trow .pg{width:44px;height:44px;border-radius:13px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-family:var(--latin);font-weight:600;font-variant-numeric:tabular-nums}
.trow .c{font-size:12px;color:var(--muted);display:block}
.trow .t{font-weight:700;font-size:14.5px;display:block}
.trow .ai{font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer;padding:4px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--pri);font-weight:700}
</style>

<div class="app">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="topbar">
      <div><h1>맑은 물 세상</h1><div class="sub">한국상하수도협회 소식지 과월호 아카이브</div></div>
      <span class="beta">BETA</span>
    </div>
    <button class="searchpill" type="button" data-go="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      궁금한 주제를 물어보세요
    </button>
    <div class="cats" id="cats" role="group" aria-label="분야"></div>
    <button class="banner" type="button" data-ask="하수열 에너지 관련 기사">
      <div class="bq">“하수열, 다룬 적 있나요?”<br>과월호에서 AI가 찾아드려요</div>
      <div class="go">질문해 보기 ›</div>
      <div class="tiles" aria-hidden="true">
        <span class="drop d1"></span><span class="drop d2"></span>
        <span class="tile3d t1">📘</span><span class="tile3d t2">💧</span><span class="tile3d t3">🔍</span>
      </div>
    </button>
    <div class="sec"><h2 id="ktitle">🔥 추천 키워드</h2></div>
    <div class="klist" id="klist"></div>
    <div class="sec"><h2>📚 수록 호</h2><button class="more" type="button" data-go="toc">목차 전체 ›</button></div>
    <div class="shelf" id="shelf"></div>
    <div class="notice">
      <b>답변은 이렇게 만들어져요</b>
      <p>과월호 원문에서 먼저 찾고, 찾은 기사만 근거로 AI가 요약합니다. 원문에 없는 내용은 “매거진에서 찾을 수 없습니다”라고 답해요. 쪽수는 인쇄된 매거진 쪽수 기준입니다.</p>
    </div>
  </section>

  <!-- SEARCH -->
  <section class="view" id="v-search" hidden>
    <div class="topbar">
      <div><h1>AI 검색</h1><div class="sub" id="cov"></div></div>
      <span class="beta">BETA</span>
    </div>
    <div class="empty" id="empty">
      <h3>무엇이 궁금하세요?</h3>
      <p>주제를 물으면 실린 호와 쪽수를 찾아 요약해 드려요.</p>
      <div class="cats" id="quick"></div>
    </div>
    <div id="log" aria-live="polite"></div>
  </section>

  <!-- TOC -->
  <section class="view" id="v-toc" hidden>
    <div class="topbar">
      <div><h1>호별 목차</h1><div class="sub">기사를 누르면 AI가 요약해요</div></div>
    </div>
    <div class="vols" id="vols" role="group" aria-label="호 선택"></div>
    <div id="ihead"></div>
    <div class="toc" id="toc"></div>
  </section>
</div>

<div class="composer" id="composer" hidden>
  <form id="ask">
    <label for="qbox" hidden>질문</label>
    <input id="qbox" placeholder="예: 물 재이용 사례를 다룬 기사 알려줘" autocomplete="off">
    <button class="send" id="send" type="submit" aria-label="검색">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</div>

<div class="tabbar">
  <nav role="tablist">
    <button class="tab" role="tab" data-tab="home" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>홈</button>
    <button class="tab" role="tab" data-tab="search" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg>AI 검색</button>
    <button class="tab" role="tab" data-tab="toc" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z"/><path d="M12 6v13.5"/></svg>호별 목차</button>

먼저 해외 바이어 초청 국내 수출상담회, 해외 유망 전시회 현회는5원 내부 규정을 개정해 사무국 내 지원단을 신설하고, 7월에는 물산업$하외 협럭 특별 위원회를통해 지원단의 입무 및 예산을 의결함으로써 물기입의 수출 활성화를 위한 본격적 인 행보에 나서고 있다 향후 지원단은 국내 물기업이 수출 과정에서 겪는 현장에서의 애로를 적극적으로 발굴 .해소하는 데 잎장설 예정이다. 또 기업의 수출 역량과 경쟁력 강화를 모색해 내수시장 포화에 직면한 기업들이 해외시장 진출을 통해 새 성장동력음 확보해 사업을 안정 적으로영위하고, 글로벌 물기업으로 도약할 수 있도록 다각적인 노력을 기울일 겨획이다. 물산업 수출 기업 지원을 위한지원단본격 운영 협회는지원단의 역할과 그에 따른 세부 업무를 설정하고 기획하는 과정에서 수출 지원과관 련된타산업 및 기관들의 현황과 사례들을 분석하고, 지원단이 보유한 강점과 약점 등을 진단 .ㅎㅠ 검과를반영해 운영 방향을정린했다. 간략히 설명하면 크게 세 기지다. 첫째 지원단은 미치지 못한 시각지대를 보완$해소할 수 있는 업무를 추진함으로써 선택과 집중을 통한 효율 성과 차별성을 중심으로 운영한다. 셋째 기업 현장의 목소리에 귀 기울이고 전문가들의 의견 한국관 운영 및 참가 지원 등 기존에 수행하던 업무에 대해 사전 준비 기간획대 사후 관리 강 기관, 기업 및 협회-단체 등이 회 원 으로 가입 된 거버넌스 조직이라는 장점을 살려 각 기관과"}, {"p": 8, "t": "의 업 무협약 역할 분담 등을 통해 물기업 수출 지원의 허 브(146), 플랫폼 (21300007)의 역할과 기능을 모 색할 계획이다. 마지막으로 물류비 절감 컨 소시엄 사업' 과 같이 물산업의 고유한 특성이 반영된 새로운 사업 아이디 어 들은 일부 기 업 이 참여하는 시범 사업 을 거쳐 일정한 효과가 확인되면 확대 제 공할 예 정 이다. 2023년 물산업 수출지원 사업설명회 성료 지원단은 첫 대외활동으로 지난 8월 18일 서울 1\\/컨벤션 그랜드볼륨에 서 '2023년 물산업 수출지원 사업 설명 회' 를 진 행했다. 이날 행 사에는 국 내 물산업 수출기업 및 관련 기 관의 임직원 약 90명이 참석했다 특히 @에 13개 사의 대표이 사가 직접 자리 해 지원단에 대한 업계의 기 대 를 확인할 수 있었다. 설명회는 물산업수출지원단의 업무 현황을 소개하고 이에 대 한 기업의 의견을 수렴하는 시간음 시작으로 대한무역투자진흥공사, 한국 6-82655기업 수출진흥협 회에서 바이어 발굴, 해외 공공 조달 시장 진출에 관련된 지 원사업 을 안내하는 일정으로 진 행됐다. 참석 자들은 기 존의 수출 지원 사업 간 차별화나 특별한 개선 없이 사업명만 달리해 시행되는 관행 에서 벗어나 물산업 실정을 반영한 실효성 있는 지원 을 펼쳐 달라고 요청 물산업 수출지원 자문단활동 시작 한편, 수출지원 업무는 다양한 영역에 걸친 고도의 전문성을요구할 분만 아니라 여러 전문 기 관과의 협 업 이 필수적이라는 판단하에 물산업 수출지 0 물산입 수출지원 플랫폼 운영 6한국물산업럽의회 물 산업 수출 시 원 단 플랫폼 운영 흐제이텍워터 이니 반드 스가 기 재이"}, {"p": 9, "t": "원 업무 전반에 걸쳐 전문가들의 종합적이고 체계적인 자문을 얻고자 '물 산업 수출지원 자문단 구성을 추진했다. 자문단은 기업회원의 수출 현황 및 애로사항 파악을 위해 지난 6월 실시한 '기업회원 수출 현황 조사' 결과 를 반영하여 증소기업 특화 분과, 해외 건설 연계 분과, 전시.마케팅 분과, 인 증. 조달'물류 분과, 녹색$환경 및 물산업 분과 등 5개 분과로 구성됐다. 투자진흥공사, 중소벤처기업진흥공단, 한국수출입은행 한국환경산업기술 기업의 실무 전문가 총 28명으로 구성했으며 2년의 임기로 활동하게 된다 촉식을 겸해 물산업 수출지원단 업무 현황 및 자문단 운영 계획을 설명하 고 전문가 의견을 수렴하기 위한 간담회를 개최했다. 이날 참석한 자문위 원들은 협회에서 제시한 수출지원 업무에 대한 문제점 및 개선 방안 추진 간 고려 사항, 기관간 협업방안뿐만 아니라 신규사업 아이디어, 타 분야 성 공 사례 등 다양한 의견을 제시했다 앞으로 자문단은 정기 회의뿐만 아니 라 현안 발생에 맞춰 대면 화상, 서면 등 탄력적인 운영을 통해 협회 기업 회원을 비롯한 국내 물기업의 수출지원을 위한 실효성 있는자문을 제공할"}]}, {"id": "88-10", "no": 88, "label": "2023 가을호", "corner": "포커스 2", "title": "2022년 물산업 통계조사(2021년 기준)", "author": "", "start": 10, "end": 13, "pages": [{"p": 10, "t": "물산업 활동을 영위하는 종사자1인 이상모든 사업체를 대 상으로 진 행한'2021년 기준 물산업 통계조사 결과가 공개됐다. 물산업 통계조사는 우리나라신성장 동력으로 물산업의 중요성이 부각됨에 따라 물산업에 대한 현황 및 실태를 파악하기 위해 지난 2011년부터 매년 실시하고 있는국가승인 통계조사다. “2021년 기준 물산업 통계조사\" 결과, 사업체 수를 비롯해 물산업 분야 매출액 및 수출액 모두 전년도에 이어 성장한 것으로 나타났다. 항목별로 살펴보면 물산업 분야 사업체 수는1만7283개 사로 전년(만 원 으로 조사됐다. 조사 항목은 물산업 사업체 일반 및 인력 현황등 20개로, 이번 조사에서는 수출 활성 화와 전문 인력 양성 필요성에 따라해외 입찰 -수주 현황등도 항목에 포함됐다."}, {"p": 11, "t": "@.@ㅇ)%.ㅅ 가인 소!자가 선택하며 사용하는 물관리 650명으로 확인됐다. 아울러 물산업 사업체 중 연 구개 발을하는 사 _ 위한솜 더 적극적인 노력이 필요한 것으로 분석 됐다. 업체 비율은16.9%, 전체 연 구개 발 비 는 8.260억 원으로 전 년04.8%, _ 이번 통계조사에 대한 보다자세한 내용은 환경부 물기술종합정보시 8.020억 원) 대비 높아졌으나, 물기술 혁신과 산업 경쟁 력 을 높이기 _ 스 템6205.0.<0)에서 확인할 수 있다. 제품 제조업 관,밸브, 펌프 등 물미[|송 , 처리 및 사용과 관련한 모든 활돔메 사용 되 는 기자재 및 기기 및 소모품 등을 제조하는 사업 취수, 급수, 배수메 걸친 삼수도와 하수저리, ' 그리고 산업 용수 듬에 관한 문영을 담당하는 사업 소사 기 준일을 기 준으로 현재 국내 메서 물산업 관련 활동을 염위하고 있는 (또는 염위한) 종사자 1인 0|삼의 사업체 사업체 일반 현황, 인력 현황, 수출 관련 사항 듬 20개 함목 - 전문 조사원 에 의한 1 내 1 방문 면접조사 - 물산업 분류체계 ※ 수열에너지 범위 추가, 물산업 조사표 보완 - 한국표준산업 분류 코드 (<810) : 세세 분류 기준 82개 국내 물산업분야 사 업 제 분류 2021년 기준 물산업 통계 조사 개요 과학기술, 설계 및 엔 지[|머 링 서비스업 상하수도 및 산업 용수 관련 인프라, 닥수하 플랜트 등의 설계감리, 컨설틱, 수질분석 및 관련 교육 및 연구"}, {"p": 12, "t": "산업 통계조사 산업 사업체 및 좀사자 현황"}, {"p": 13, "t": "사 업체수… 종사자 수 물산업분야 매출 발생 형태별 비중 단체 표준인증 지역별 물산업 사업제현황"}]}, {"id": "88-14", "no": 88, "label": "2023 가을호", "corner": "오피니언", "title": "2023 상수도공동연구협의회 해외 선진지 연수 보고 – 기후위기에 대비한 미국의 수도현황을 엿보다", "author": "위미경 한국상하수도협회 상수도처장", "start": 14, "end": 17, "pages": [{"p": 15, "t": "한국상하수도협 회(이하 협 회)에서는 특- 광역시, 제주특별자치도, 세 종 특별 자치시, 한국수자 원공사 를 중 심 으로 상수도 현안을 공유하고, 수도사업자의 연구 역량강화를위한상수도 공동연구 협의회(이하협의회)를 2005년부터 운영 중이다. 최근 협의회 실 무위원회 위원들은 해외 선진지 현장 방문을 통한 상수도의 미래 발전 방향모색을위해 5박8 일(2023.4.17.~24.) 일정으로 미국 라스베이거스, 로스앤젤레스 지역 년 한강에 취수관 개설"}, {"p": 20, "t": "]-ㅎ ㅜㅠ 정수장에 도입된 정수처리 방법은 완속여과법이었 집 약품의 주입 없이 자연 침강과 여과에 의존하는 방식 으로서 ㅣ 완비된 최첨단 아리수 생산 시설인 뚝도아리수정수센터는 현재 영국과 유럽에서 주로 행해지던 정수 방법이었다. 통수 당시 뚝 도정수장의 정수 시설을 살펴보면 침전지 2지, 여 과 지 5면, 정수 ：， 속하는 71개동102만여 명의 아리수를 책임지고 있다. 아울러, 아 지 1개가 있었다. 여과지는 동파 방지를 위해 철근콘크리 트조로 、 리수의 우수성을 체험할 수 있는 교육 공간도 함께 운영 중이다. 문개를 하고, 낭 부에 두께6000의 토 사를 덮 었 으며, 래를 삭 . @ 뚝도수원지 제1정수장이었던 수도박물관 로는 여과수의 집수장치로서 여과지 중앙에 종방향으로 직사각 。 지를 횡방향으로 18개의 지선 집수로를 파서 여과수를 집 수했던 _。 것으로 밝혀지고 있다. 평균 여과 속도는 약 27500/일 이었던 것 。 으로 추정된다. @1960년서울 뚝도정수장 전경 @1970년대 초 뚝도정수장 여과지 공사 현장 115년의 역사를 간직 하고 있는 뚝도정 수장 은 이제 뚝"}]}, {"id": "88-22", "no": 88, "label": "2023 가을호", "corner": "회원탐방 1", "title": "창원시 상수도사업소", "author": "", "start": 22, "end": 25, "pages": [{"p": 22, "t": "물 복지 향상을 위해 창원시 상 수도사업소 행보를 이어 가다"}, {"p": 23, "t": "창원시 상수도사업소의 목표는 안전하고 깨끗한수 물 공급을 통해 시민의 물 복지와 신뢰도를 꾸준히 향상하는 데 있다. 이들이 엄격한 수질 관리와 더불어 노후관망 정비, 정수 및 상수도 공급시설 개선, 블록화 구축사업 추진 등 다방면으로 상수도 발전을 위한 걸음을 멈추지 않는 이유다. 더불어 기후변화, 수질사고 등 예측 불가능한 변화에 능동적으로 대처해 안정적으로 맑은 물을 공급하는 데 최선의 노력을 기울이고 있다는 창원시 상수도사업소의 다음목표는 무엇일까. @. 창원시 상수도사업소의 주요업무에 대해 소개 부탁드립니다. 쇼. 창원시 상수도사업 소는 5과(수도행정과, 수도시설과, 칠서정수과, 대산정 수센터) 28개 팀으로 구성돼 있습니다. 안전하고 깨끗한 수 물 생산 및 공급 을 통해 시민에게 신뢰받는 상수도사업소를 목표로 다양한 노력을 기울이고 있죠. 특히 수 듯물에대한 시민들의 신뢰도 향상을 위해 깐깐한 관리 기준을 적용하고 있습니다. 그 결과, 올해 4개 정수장에서 생산되고 있는 창원시 수 물 청아수 모두 10722000 국제 인증을 취득하는 성과도 거 듭 니다. 주민 생활 여건 개선을 위해 농어촌 지역에 지방상수도 공급 공사를 하고, 노 후 상수관로 교체 및 송수시설 정밀안전 점검 등 유지관리 를 통해 안정적인 상수도 공급체계를 구축하기 위한 노력도 진행 중입니다. 더불어 스마트 관망 관리 인프라 구축사업 시행, 정수처리 공정 관리시스템 개선, 정수처리 시설 개선 등의 업무를 추진해 궁정적인 성과를 얻고 있습니다. 창원시 상수도사업소만의 “지역 특화 업무'가 있을까요. . 장원시특례시는 칠서, 대산, 석동 3개의 정수장을 각각 운영하고 있습니다. 창원시특례시의 주요 정수 시설로 수도 공급의 핵심 역할을 하는 곳들이죠. 이에 상수도사업소에서는 각 정수장을 서로 연계해 상호 보완적으로 운영하 고 있습니다. 아울러, 상수도 사고 발생 시 장시간 단수로 인한 시민 불편을 해"}, {"p": 24, "t": "소하고,비상 연계 관로를 통한 안정적인 상수도 공급체계 구축 _ 수 있는 고품질 수듯물을 계속해 공급할 수 있도록 노력할 계획 @. 업무 수행에 있어 가장 어려운 점을 꼽는다면. . 쉼게 예측할 수 없는 '자연환경'에 대비해야한다 는 점 이가장 어려운 것 같아요. 기후변화로 인해 강우량이 불규칙하게 증가 또는 감소하거나 기온이 상승하면 미생물 활동에영 향 을미 저원 을 다. 일례로, 조류경보 경계 단계가 발령되면 정수장에서는 녹조 저요. 또 수질 모니터링을 통해 맛과 냄사,유충 모니 터 링을강화 。 하고, 조류 유입에 대해 선제적으로대응하기 위해 상류 원수 수 질검사가 실시되는 등 체계적이고 탄력적인 대응 방안이운영되 고 있습니다. @. 올해 모든 정수장수 둘 생산시 설에 |5022000 국제 인증 롱.| 점이 있다면. 든 과정에서 발생할 수 있는 위해 요소를 사전에 파악하고 차단 4 < 및 제거하는 등 식품을효과적으로 관리하기 위해 규정한 국제표_ * ' 준규격입니다. 안전하고 신뢰성 있는 수듯물을 제공하기 위해 꼭 필요하죠. 이에 창원시 상수도사업소에서는 숫물에대한 시민 들의 신뢰도 향상과 체계적인 관리를 위해 대산-북면-석 동 3개 정 수 장은2023년4월, 칠서 정수장은 6월에 각각 인증 취득을 완 료했습니다. 인증 취득후, 다양한 변화와 개선이 이뤄졌어요. 특히 5022000 인증을통해 더 체계적이고 통합된 수질 안전 관리 체계를 구축, 수듯물품질에 영향을 끼칠 수 있는 유인들을 예방하고 관리할 수 있게 됨으로써 수질 안전성이 향상됐죠. 또 수듯물 생산 시설 의 위생 관리 강화와 더불어 위생에대한 직원들의 인식 교육을 확대함으로써 전반적으로 위생 수준이 높아겼습니다. 아울러, 앞 으로 시민들에게 창원특례시수듯물의 안전성을 지속적으로 홍 보할 예정이에요. 또 매년 실시하는 150222000 인증 사후 심사 및 3년마다 진행되는 갱신 절차 를 성실히 수행해 안심하고 마실"}, {"p": 25, "t": "&. 청아(속된 티가 없이 맑고 아름답다) 한 물' 이라는 의미를 담 _ 산을 위해 유충 유입 차단시설, 정 수처리 공정 간 유충 이농 방지 고 있는 청아수는 칠서, 석동, 대산 3개 의 정 수장에서 생산, 공급 _ 시설 설치를 추진하고 있으며, 노후상수관망 정비를 통해 누수 되는데요. 칠서 정 수 장은 낙동강의 중하류 지 표 수 를, 석 동 정수장 _ 저감과 유수율 제고를 위해서도 노력하고 있습니다. 은 낙동강의 하천수와 성주 호소수를 취 수하며, 대 산정수 장 은낙__ 시민들의 물 복지 증진을 위해 수 듯물 수질 민원 서비스도 더욱 동강변 고수부지 여 과수를 취 수해 고도정 수처리 시 설 로 정 수하 _ 강화할 예정 입니다. 현재 신속한 수듯몰 수질 민원 처리를 위해 고 있습니다. 취 수된 물은 고도 처 리 공정 인 오존처리 과 정을 거 _ 수질연구센터 및 각 급수 센터에서 원스톱으로 민원 대응 및 처 쳐 정 수지로 보내 지 며, 염 소를 투입 해 소독한후 각 가 정의수동 _ 리가 이뤄지고 있는데요. 이 외에 노후관 지역 수질 모니터 링 을 현재 창원특례 시 에 서는 청아수 음용 활성화 계획 수립, 청아수_ 통해 시민이 안심하고 수듯물을 마실 수 있도록 돕는 데 최선을 이용 실태 및 시민의식 조사 등 다방면으로 홍보 활 동 을 펼치고 _ 다할 계획입니다. 있습니다. 또 정수장 및 급수구역 현황, 수듯물 생산 및 공급 과정 물론 홍보 동영상 시청, 샌 드 크래프트 체험 등 다양한 견학 프로 @. 시민들의 물 복지 증진을 위한창원시 상수도사업소의 앞으_ 노- 로의 계획이 궁금합니다. 쇼.먼저 안전한물 공급을 위해 여러 시설물을 개선해 나갈 계획 이에요. 이미 기후변화, 수질사고 능으로 하천 수위가 저 하되는 비상 상황에 대비해 칠서 취수장 시설 개선 사업 이나 예곡가압 장 시설물 개선 및 보수 공사, 대산 정수장 중앙 감시 제어시스템 창원시 삼수 도사업소 홍보관 개선 등 노후화된 시설물을 정비 중입니다. 더불어 깨끗한 물 생 통해 수질 민원에 선제적으로 대응하는 한편, 무료 수질검사를"}]}, {"id": "88-26", "no": 88, "label": "2023 가을호", "corner": "회원탐방 2", "title": "(주)대양환경기술 · 웍스글로벌(주) · (주)케이엠에스", "author": "", "start": 26, "end": 37, "pages": [{"p": 26, "t": "대 양환경기술은 그야말로 팔방미인이다. 공 공폐수시설 운영관리는 물론수처리 분야기술 진단 등 환경기초시설 운영관리 전반에 걸쳐 높은 기 술력과 체계적인 노하우를 보유하고 있기 때 문이 다. 자타가 공인하는그들의 경쟁력은 무엇일까."}, {"p": 27, "t": "환경 엔지니어링 ( 수)대양환경 기술 대 양환 경 기 술 은 환경-수 처리 분야 기초 조사와 오염원을 정확하게 분석해 진단하는 등 환경기초시설 전반에 걸쳐 우수한 기술을 보유 행 기관 및 환경 전 문공사업, 개인 하수처리 시 설 관리업 등에 대한 __ 하고 있는 사업장 중 주문진- 속초- 고성 등 다수의 공공폐 수처리 시설 전문 기술력을 토대로 공 공폐 수시설 운영관리 사업 을 시 작했으며, 2014년에는 원주지 방환경청 제1호로 공공하수도 분야 기술 진단 전 문기 관 면허를 등록하고, 수처리 분야 기술 진단 사업을 이 행했다. 또 2016년에는 하수, 폐수, 정수 등 전반적인 물산업 관련 핵심 전문인 력 양성 사업에 총력 을 기 울었으며, 2019년에는 국내 최초로 악 취분 _ 했던 것이다. 야 기술 진단 전 문기관 면허를 취득, 악취 분야측정 대행 업까지 사업 을 확장하는 등 거 침없는 행보를 이어가고 있다. 김재규 대 양환경기술 대 표 이 사 는 \"수년간 쌓아온 노하우와 특화된 전문성을 바탕으로 친환경적인 처리시설 관리 및 효율적인 운 영을_ 탄소원 주입 없이 탈질(표층에서 만들어진 질산이 질소가스로 환원 최선을 다하고 있 다”며 \"단순한 관리 를 넘어 환경시설 전반에 걸친 문제점 도출 및 개선 방안을 제시하기 위해 수처 리- 악 취 시스템 의효__ 또 다양한관찰 결과를 토대로 현상별 적정 관리 운전 조건 계획을 세 율을 높이는 데 필요한 기술을 개발하는 기 업부설 연 구 소를 운 영하__ 움으로써 부하 변동에도 안정적인 수질 관리를 할 수 있는 저희만의 는 등 다각도 로 노력 중\"이라고 말했다. 이어 \"특히 최 근 에는 복합 악 __ 경쟁력을 갖게 됐고 요 이것이 저 희 가 환 경' 수처리 분야에서 선 도기 취의시료 채취와 분석을 통해 데이터를 생산하는 등 수처리 및 악취 분야전반에 걸친 환경 업무 활성화에 집중하고 있 다” 고 덧붙였다 기술의 완성도를 높이고, 계속해 더 나은 기술 서 비스를 제공하는 것. 김재규 대표이사는 기업 운영에 있어 이점에 가장 집 중한다. 대 양 환 경기술의 대표 기술로 손꼽히는 ' 고 농도- 고분사 유기성 폐 수 처리 운 전 기 술' 이 개발된 배경도 여 기에 있다. 대양환경 기술이 관리를 대행 의 수산물 가공 폐수에서 고농도의 부유물이 배 출됐기 때문이다 또 유기물 영양 염류 뿐 아니라 세척수와 탈염, 염 상 공정에서 유출되는 염 화나트륨으로 인해 하수나 산업 폐수보다 유입원수 내 높은 염분 농도를 포함하고 있어 이 부분에 적절히 대처할 수 있는 기 술이 필요 “수산물 가공 폐수 공정은 냉동 원 료의 수급 및 생물 어 획 량에 따라 농도의 변화 비 율도 매우 크 고 요. 그래서 이에 대한 대 응책으로 외부 돼 공중으로 발산하는 것)을 통한 질소제거 운전 기술을 실용화했죠. 업 으로 사리 매김 할 수 있었던 비 결 이라고 생각합니다” 여기서 끝이 아니다. 대양환경 기 술은 최고의 서 비 스를 제 공하기 위 해 사업소별 특성에 따른 맞춤형 운영 관리를 제공한다. 김재규 대표 이 사 는 \"안정적인 수질 관리를 비롯해 경제성, 운영 효율의 극대화, 시속 가능성, 위치 대처 능력 등 5가지 영역에 대한 철저한 유지 관리"}, {"p": 28, "t": "계획을 세워 공공하수 및 폐수 처리시설이 더 효율직으로 운영되도 록 힘쓰고 있다\"고 강조했다 상생 가치 경영에 주목하다 차별화된 서비스에 더해 대양환경기술이 추구하는 기업 가치가 하 나 더 있다 바로 직원과 회사, 사회가 모두 상생할 수 있는 기업을만 드는 것이다 이의 일환으로 대양환경기술에서는 교육비 지원 등을 통해 식원들의 자기 계발을 적극 독려하고 있다 덕분에 전체 직원의 90% 이상이 업두와 관련된 전문 자격증을 보유하고 있으며, 지난해 _ * 에는 '제4회 강원도 일자리 대상'에서 우수상을 받기도 했다. 또 올해 3월에는 미래 성장 가능성이 높은 기업에게 주어지는 '경영 혁신형 중소기업 인증도 받았다 \"기술 서비스를 제공하는 기업인 만큼 직원의 실무 능력 헌장감을 높 여야 회사도 성장할 수 있다고 생각해요 경영인으로서 누구나 입사 하고 싶은 회사를만드는 게 제 꿈이기도 하고요 오래 기업을 경 영해 _ 다 대양환경기술에서는 이를 위해 (- 기반의 계측 감시, 제어설비 를 보니 당장의 이익보다 미래의 비전을 위해 투자하는 것이 나중 에더_ 도입해 실시간으로 처리 공정을 진단하고 최적의 운영 지원체계를 큰 성과로 돌아오더라고요. 지금에 만족하지 않고, 직원뿐만 아니라 _ 구축한다는 계획이다. 가족들에게도 혜택이 돌아갈 수 있도록 지원을 점점 확대해 니 갈계_ '경험에 의존했던 기존 운영 방식에서 벗어나 빅데이터를 통해 하수 아울러 656 경영도주목하고 있다 기후 위기에 대응한 탄소 중립 실 ㆍ 깨끗하고 안전한 물 환경 관리를 위한 하수도 서비스를 제공하는 데 현을 위해서는 공공하수 및 폐수처리시설의 유기물 및 오염물질을_ 목표를두고 있어요. 아울러, 에너지 저감 부분에서도 사회적 흐름에 제거하면서 높은 에너지 소비량을 절감시킬 수 있는 대안이 필 요하 _ 부응하는 가치 친화적 경영을할 게획입니다\" 처리시설의 에너지 절감 및 각종 수질사고에 유연하게 대응함으로써"}, {"p": 29, "t": "공공하수도 관리 대행사업 분야 확대 및 매출 증대를 위한 목표로는 첫째, 물산업의 체계적인 유지관리 방안 마련 및 업무의 표준화, 일원 화,전신화를 통한 업무 효율성 증대에 필요한제도개선. 둘째 최적의 운전 조건 적용으로 유지관리 기술의 전문성을 높이고, 운전 향상 기 술 제안 및 유지보수 가선 사례를 통한 사업소별 기술 공유를 통해 수 처리 분야기술력 강화 마지믹으로 셋째는사업소 요인별점검 및 분 석 데이터를 기반으로 비상 상황 발생 시 신속 대응 및 사전 예방을 위한위험 관리를 철저하게 한다는 계획이다. 아울러, 악취 분야의 경우 악취 검사기관으로 지정받기 위한 과정이 현재 진행형이다. 현재 마지막 단계 인 <0ㄴ6 인증 인정제도를 통한 진단 전문기관 면허를 보유하고 자체적으로 악취를 분석할 수 있는 기관은 강원도에서 대양환경기술이 유일하다\"며 \"강원도 및 원주지 방환경청 담당 지역 증 민간 악취 검사기관이 없는 지역이 다수 있으 므로 향후 악취 중점 관리지역, 탈취기 성능 보증, 악취 실태조사,공 공하수도 악취방지시설 설치 검사 및 유지관리 등 사업 분이를 확대 할 계획\"이라고 밝혔다. 현재 해외 진출을 위해 여러 기관 및 기업과협의 중이라는 김 대표이 사.탄탄한 기술력과 차별화된 노하우를 바탕으로 글로벌 기업으로 성장할 대양환경기술의 미래가 기 대된다."}, {"p": 30, "t": "웨스글로벌은 슬러지 계면계, 슬러지 농도계 등 환경 계측 기기를 해외 40여 개국에 수출하고 있는, 해외 에서 먼저 찾는 1<-기업이다. 지난해 신기술 실용화진흥 공로로 산업통상자원부 장관상을 받는가 하면, 올 초에는 수출 경쟁력이 있는 글로벌 강소 물기업으로성장가능성을 인정받아 혁신형 물기업으로 지정되기도 했다. 계측 산업의 글로벌 선두 기 업' 으로 자리매김하고 있는 웨스글로벌의 경쟁력과 다음 목표는 무엇일까."}, {"p": 31, "t": "수처리 계측기 계측이란 무게나 길이, 부피, 온도 등을 기계나 기구로재어 계 산하고_ 기 전문기업이다. 창업 이듬해부터 기업 부설 연구소를 설립해 지금 측정하는 것으로 모든 산업에서 중요한 역할을 한다. 수처리 분야에_ 까지도 매년 매 출의 30% 기까이 연구개발에 재투자하며 기술력을 서도 마찬가지다. 계측값이 정확할수록 수질 향상과 수처리 효 율이 _ 강화하고 있다. 높아지기 때문이다. 수처리-환경산업 분야의 공정제어 구 축 을 위한 __ 권남원 웨스글로벌 대표이사는 \"하수처리장, 정수장, 폐수처리장 등 산업용 계측기기를 개발-제조하는 웨스글로벌의 기술력이 주 목받는_ 처리장 지능화가 진행됨에 따라 공정의 자동화에 기여할 수 있는 계 이유가 여 기 에 있다. 2004년 창립한 웨스글로벌은 국내외 하 수폐수_ 측기기에 대한 수요가 점진적으로 증가하고 있다\"며 \"초음파를 이용 처리장, 정수장 등 각종 수처리 시설 및 반도체, 발전소, 제철소 광산 __ 해 배관 바깥쪽에서 손쉽게 측정할 수 있는 산업용 계측기기는 국내 등 전 세계 다양한 산업현장에 제품을 공급하는 글로벌 수처리 계측 _ 외를 통틀어 저희 제품이 유일하다\"고 자랑했다. 이어 \"신제품 인증 (0460) 성능 인증, 조달 우수제품 등 각종 기술 관련 인증 및 다수의 국내외 특허를 보유하고 있지만, 여전히 제품 경쟁력을 높이기 위한 연구 개발에 집중하고 있다\"고 강조했다. 압도적인 기술력, 20년간 매진한 연구개발의 성과 했다. 팬데믹 장기화로 지난 몇 년 간 산업 시장 전반이 어려움을 겪 고 있고, 여전히 외국 제품을 수입해 국산으로 둔갑시키는 업체들이 난무한 가운데 오로지 자체 기 술력으로만 일귀낸 놀라운 성과다. 인도뿐만 아니라 독일 미국, 중국 등 여러 세계 세장에서 꾸준히 주 두 가지 이다. 40여 개국에 수출 중인 초음파 슬러지 계면계는하수, 정수 및 각종 폐수처리장의 침전지 또는 농축조 내 침전된 슬러지 높 이를 실시간으로 계측하고 주변 장치와 연동해 슬러지를 자동 인발"}, {"p": 32, "t": "해수는 장치이다. 웨스글로벌만의 독창적인 측정 알고 리 즘을 탑재하 _ 국내외 시장에 널리 보급할 예 정”이라고 덧붙였다. 이미 몇 곳의지자 고 있어 다양한 현상에서 적용 가 능하며, 계면계에내장된비정상 신 __ 체 하수저리장과 시스템 도입을 협의 중이며, 전국으로 확대할 계획 차단해줘 최적의 인발 시점을 관리할수 있다. 또 자동 센서 세정장치 가 내장돼 별도의 유지 보수가 필요 없어 장기간 사용도 가 능하 다. 슬러지 농도를 비접촉 방식으로 측정한다. 덕분에 일반적으로 농도 _ 목표는무엇일까. 를 측정하는 센서는 배관 안에 삽인돼 있어 찾은유지보수와 센 서교__ “우선 웨스 스마트 솔루션(수처리 자동화 시스템) 개발에 주력할 계 제 등에 문제가 따르지만, 웨스글로벌의 농도계는 배관을 교체하거 나 제작하지 않고 배관의 외벽에 초음파 센서를부착해배관 내의 슬 _ 프로세스제어반 등 상하수도 제어용 기기 전반에 걸쳐 통합 운영관 러지 농도를 실시간으로 측정할 수 있다. 유체의 특성인 점착성,부식 다. 또 비정상적인 신호를 필터링하고 에너지 면적을 측성해 그 에너 경기에 따른 부침이 큰 세계 시장에서 꾸준히 인정받을 수 있었던 비 결을 묻자, 권남원 대표이사는 \"매출액 달성이 아닌 연 구개 발 에 집중 . ㅠ =-- 했기 때문\"이라고 명료하게 말했다 이어 \"계속해 선두기업으로 자리 매김하기 위해서는 얼마나효율적인 스마트화를 이 루 느 냐가 관 건\"이 - 늘ㅇㅠ 라며 \"기존의 산업용 계측기 제 소'개 발뿐만 아니라 빅 데이터 0ㅣ 기 . 빼 글로벌 기 업\" 으로의 도약이 다음 목표 획 이에요. 이 솔루션이 완성되면 계측기 기뿐만 아니라 계장제어장치, 리가 가 능하죠. 상하수처리 전 과정의 스마트화 를 통해 깨끗하고 안"}, {"p": 33, "t": "전한 물관리 체계 및 안정적인 하수도 운영-관리 체계 구축을위한연 구개발도 지속할 예정이고요 더불어 상하수도 분야에 스마트 기술 기반의 저비용 -고효율 관리체계를 도입해 하수도 안전 강화 및 지탄 소 상하수도관리체계 구현에도 기여하고 싶습니다\" 하나 더, 계측기기를 인공지능 수준까지 끌어올리는 것도중 하나다 버튼 하나만 누르면 혹은 아무도 터치하지 않아도 기기 스스로 판단 과 측정을 할 수 있도록 만드는 것이다. “전문성에만 집중하다 보면 기계의 버튼을 많이 누르게 만드는 경향 이 있는데, 과정이 복잡해지면 오류가 더 지주 발생할수 있어요 가 격이 비싸다 보니 현장에서 조작을 꺼리기도 하고, 실제로 설정만 바 같아요 그동안 전자부품의 수준이 많이 높이져현실로구현하는것 이 더 쉬워졌거든요. 5년 정도면 실현 가능하지않을까요?\" 이와 더불어 시증에 출시된 제품들의 단점을 보완하는 연구개발도 시도해 볼 계획이라는 권남원 대표이사. 이미 전 세계적으로 인정받 는 제품을 개발했음에도 더 나은 기술력을 완성해 대한민국 브랜드 로벌의 앞으로가 더 기 대된다."}, {"p": 34, "t": "깨끗한물 공급을 위해 중요한것 중 하나는 상수도의 관 로 를 깨끗하게 관 리 하 는 것이다. 2019년, 인천시 적수 사태 를 마주하고 케 이 엠에스 직원들은 다짐 했다. ' 안전하면서 동시에 친환경적인 관로세척 방식을 개발해 내 겠 다' 고. 다짐은 현 실이 됐다. 현재 케이 엠에스는 관로세척 분 야의 1위 기 업으로 우뚝서며 뛰어난기 술력과 상수도관리 노하우를 바탕으로해외 시장 진출을 준비하고 있다."}, {"p": 35, "t": "솔루션 전 문기업 특허받은 공법으로상수도 관로를 말끔하게 케이엠에스는 원래 상수노를 모니터링하고 시스템을 분 석하는소프 _ 격자형 관로 세척 문제 해결, 오염된 세척수 배출 문제 해결 등과 더 지게 됐고, 환경 부에서 스마트 상수 관리체계 사업을 발 표했어요. 그 __ 니다. 세척한 뒤에 시꺼먼 오염수가 발생했기 때문이죠. 그래서 이 부 때 '기회'가 왔음을 직감하고 그동안 수질 감시 시 스 템 을 운영하며 쌀 아온 노하우를 관망 세척 기 술을 개발하는 데 쏟 아부 었 죠. 그렇게 개 _ 특허를 취 득했습니다” 이용한 세척 공법의하나로, 20%의 흐르는 유체와 회전 발사체의 통 해 발사되는 압축공 기 간의 물리적 작용으로 발생하는 강한 와 류와 _ 에 따라 세척 강도도 조절할 수 있다. 더불어 케이 엠에스는 그동안의 캐비테이션 작용 시에 충격파 버블링 및 속도 에너지를이용해 관내 _ 수질관리 101 시스템 관리 노하우를 관망 세척과 결합하는 데 집중했 “우리나라 도시 상수도 대부분은 격자형 관로로 되어 있어요. 일직선 이 아니라 수없이 가지를 뻔어 나가는 형태라 세척이 까다롭죠.그래_ 수질 기준치 이내 도달시 세척을 종료하고 있다 이는 세척수로 인한 공법'은상수 관로의 절단도 필요 없고, 기존 유 량 을 이용한 세척 공 _ 세척수는 1차와2차의 처리 과성을 거쳐 수질 기준치 이 내 의 정 수 로 법 이기 때문에 경제 적입니다. 또 흐르는 물과 회전 발 사체를통해 발 __ 만들어진다. 필요시 정수된 물은 각종 용수로 재사용할 수 있다. 더불 사되는 압축 공기 를 활용해 충격을 주는 방식 이기 때문에 친환경적 으로 관로를 아주깨끗하게 쓸 수 있죠” 친환경 특허 공법, 101 시스템과 만나다 \"관로 세척 공법을 개발할 때 주력했던 것이 깨끗한 세척'과 ' 친환경 분을 친환경적으로 처리하기 위해 1, 2차 세척수 처리 기술을 개발해 법은 다양한 관종,관경, 관로 조건에 제한 없이 석용할 수 있고 상태 다. 세척 효과에 대한 물리적 검 증을 위해 세척 구간 마다 내시경 촬영 2차 수질오염 을 차단 하는 친환경 공 법 이다 어 이 특허 공법 은 누수 지점 및 불명관 위치를 판단할 수 있어 공사"}, {"p": 36, "t": "공사 기간을 단축할 수 있다는 이야기다 상수도 세척사업을 통 해유_ 재질을 사용하는 것은 물론이고 역류방지형 제품 요청 시에는 역류 수율 및 안정적인 수안, 수질 유속을 회복해 수자원을 보호하는 것은 _ 방지형 수도계량기를 제작할 수 있는 기술력도 보유하고 있다 물론이고 경제성까지 높일 수 있는시스템을완성해 낸 것이다. 물관리 솔루션 기업으로 도약하다 지금은 상수도 세척 사업으로 더 유명해졌지만, 케이엠에스 는 물관 _ 서도 우수섬을 인정받아 ( 적합 인증을취득했다. 필터는 인체에 무 리 솔루션 기업으로서 상하수도를 모니터링하며 쌓아 놓은 누하 우를_ 해한 제품으로 적정수압 기준에 맞취 제작한 제품으로 강한 수압이 사업 영역 전체에 녹여 내고 있다 특히 관로 세처다음으로 집 중하고_ 나 진동에도 정적 동적 균형을 이루도록 구조체의 안정성을 높여 정 있는 상수도 1( 통합관리시스템 은 65 및 성능 인증을 보 유해 그 신 _ 밀어과 능력을 높어 특허를 취득했다. 특히 차압계를 설치해 실시간 뢰성을 입증하고 있다. “상수도 10 통합관리시스템은 지역별 상수도관에 블록을 설정한 후 블록 내 관망 시스템을 구축하는 방식으로 진행돼요 유량 및 수압 센 서,수질 계측 센서, 원격 누수 감시 센서, 누수 감시 센서 등을 일원화 해 각 측정기에 실시간으로 측정되는 측정값이 센서를 통해 표시부에 정보시스템)음 활용해위치정보와 계측정보름 도니터 링합니다 수집, 기는 무선으로 종합상황실이나 모바일시스템에 전달해 구역 마 다발 ＊\\ 1, 생하는 모든상황을 종합적으로 판단할 수 있는 기술이고요” 케이먼에스의 상수 관망 유지권리시스템 은 구축된관망 관리시스 종합적인 데이터를 분석해 정량적 해석과 정성적 해석을 통해 유지 불 \\\"그매 관리에필요한 의사절정을 지원한다. 또한 수질 변화에 따른염 소탁 불량의 주요 원인과구역 내 급수관의누수도감지할수 있다 이러한 트립 역량과 기술력을 비탕으로 케이엠에스는 현재 러닝 기반 누수 모 아울러 케이엠에스는 취급상 양수기 또는 수량계, 유량계라고도 부 르는 수도관을 흐르는 물의 총량을 측정하는 계측기, 수도계량기를 시접 제작하고 있다 이곳에서 제작하는 수도계량기는 기계식 복갑 습식 수도계량기와 디지털 일체형 복갑 건식 수도계량기 두 가지다. 환경마크 및 < 인증 형식승인을 취득한 제품으로, 무엇보다 재질의 재활용이 가 능하다는 특징이 있다. 게다가 내식성 및 내마모성,인장 강도가 우수하고 장기간 사용 시에도 탈 아연 부식현상이 발생하지 않는다. 관경 기준 15~5000까지 유량을 측정할 수 있는 제품으로 미 소 유량에서도 감도 및 정밀도의 정확한 측정이 가능하며 동파 방지 기능이 있어 결빙 시에도 적산할 수 있다 인체에 해가 없음이 입증된 정밀여과 장치도 직접 개발하고 있는데, 스테인리스 재질을 주재료 로 사용한다 이 또한 친환경 제품인데, 제품의 용출시험에서 안전함 을 인정받아성능 인증을 취득한 것은 물론 수압 및 필터 제거 효과에 모니터링이 가능한제품으로 유지관리의 효율성과 기 능성을 높였다."}, {"p": 37, "t": "국내를 넘어 해외 시장으로 케이엠에스의 중장기적 목표는 연 매출 50억을 넘어 3년후 100억 을 목표로 독보적인 전문기업으로서의 브랜드 가치를 높이고 경영 안정화 를 이루는 것이다 “고도의 전문성과 독창적인 기술력으로 독일처럼 대기업과도 당당히 기도 하지요” 더불어 케이엠에스는 국내외 시장을 넘나드는 지속 성장을 추구하고 있다. 그에 맞는 그릇과 역량을 갖추기 위해 내부 역량을 깅화해 주력 사업의 기술경쟁력을 한층 강화하는 것은 물론이고 현재 시장성 확 대를 위해 노력 중이다. 실제로 13년 동안 상수도 분야에서 활동하며 전문성을 인정받은 케이엠에스는 그동안의 노하우를 바탕으로 국외 시장으로 진출하기 위해 실질적인 스템을 밝아 나가고 있다. “현재 대부분의 해외 시장은 상수도 관로를 세척할때 물을한 번에_ 록 준비하고 있다. 넣었다 빼는 플러싱 세척을 하고 있습니다. 이런 상황에서 물과공기 _ “에이엠에스는 새로운 기회를 창출하기 위해 내수시장에 머물지 않 만 가지고 친환경적으로 관로를 세척하는 우리의 기술은아주 경쟁 력이 있다고 생각합니다” 현재 동남아 및 남미, 북미, 유럽 시장 진출을 위한 현지 방문 및 시범 __ 으로 해외 시장에 진출해 실적을 쌓고 그 경쟁력으로 점차 시장을 확 세척을 위한 인프라를 구축한 상태로,현지의 상수 관망에맞는 시뮬 _ 대해 나갈 계획입니다” 레이션을 통해 케이엠에스의 세척 기술을 제대로 현지화할 수 있도 고 해외 시장 진출을 통해 그 기회를 준비하고 있습니다. 세계 물 시 장의 규모에 비해 국내기업의 해외 진출은 미약한 수준인데 성공적"}]}, {"id": "88-38", "no": 88, "label": "2023 가을호", "corner": "KWWA 초대석", "title": "안병옥 한국환경공단 이사장", "author": "", "start": 38, "end": 41, "pages": [{"p": 39, "t": "디지털전환-탄소중 립-656는 더 나은 환경을 위한 최선의 선택 입니다 안병옥 한국환경공단 이사장 기획재정부에서 발표한2021, 2022년도 공공기관 경영평가에서 2년 연속 (우수) 등급을 받는 큰성과를 올린 한국환경공단. 전세계 기후변화 위기에선제적으로 대응하기 위해 탄소중립, 656 경영 등을 목표로다양한 환경 정책을 수립해나가고 있는 한국환경공단의 수장 안병옥 이사장을 만나물위기극복 및 물산업 성장을 위해 현재 추진 중인 정책의 방향과 앞으로의 비전에대해 들어봤다. @. 공공기관 경영평가에서 지난해에 이어 올해도^(우수) 등급_ 과를 거둘 수 있었습니다. 기후 변화 등 침수로 인한 더 큰 피해 을 받으셨습니다. 축하드립니다. &. 2021년도 경영평가에서 공단 설립 이후 최초로 %(우수)' 등급_ 제라고 생각합니다. 이에 공단은 앞으로도 도시 침수 예방을 위 을 받았으며, 지난해 94개 준정부기관 중 유일하게 2년 연속수상_ 한 선진화된 하수도 시설의 보급 및 기술지원에 주도적인 역할을 하는 쾌거까지 이8습니다. 공단 임직원들의 노력과 성 과 를 국민 _ 수행할 수 있도록 최선을 다할 계획입니다. 여 러분께서 높이 평가해 주셔서 기관장으로서 다시 한번 감사의 인사를 전하고 싶습니다. 여기에 안주하지 않고 국민이체 감 할수 _ 0. 물부족 문제 해결의 효과적인 대안으로 꼽히는 하수 재이용 있는 더 좋은 환경 서비스를 제공하기 위해 계속해 최선을 다하겠 @. 최근 기후변화로 인한 극한 호우로 도심 지역에 침 수가 일 _ 급격한 공업용수 수요 증가에 대응하기 위해 공업용수도를 활용 어나는 등 큰 피해가 빈번하게 발생하고 있습니다.현 재한 _ 한 하수처리수 재이용수 공금을 법제화했고, 안정적인 하수처리 국환경공단(이하 공단)에서는 어떻게 대응하고 계 신가 요。__ 수 재이용을 위한 운영-관리 예외 기준을 설정하는 등 행정절차 . 도심 지역의 반복되는 침수 피허 해소를 위해 공단은환경부 _ 도 적극 개선했죠. 와 지난 2013년부터 현재까지 총 173개 지역을 중점 관리 지 역으_ 또 경기 남부지역 및 전남 여수산업단지 등 만성 가몸 지역에물 로 선정, '도시 침수 대응 하수도 정비사업.」을 진행하고 있 습니_ 재이용 민관 협의체를 운영, 물부족 문제 해결을 위해 발 벗고 나 다. 특히 설계 단계부터 최신 기법을 적용히 우수관로크기 확대， 서고 있습니다. 일례로 지난 2022년11월 , 삼성전자에 하수처리 빗물 펌프 설치 등 하수도 인프라 개선을 통한 근본적인 침수 원 _ 수 재이용수를 공급하기 위해 경기 남부지역과 관계기관 간 업 인 제거에 집중하고 있는데요. 그 결과, 올해 유독 강했던 장맛비 _ 무협약을 체결했는데요. 이는 기후변화로 인한 극한 가몸에따 에도 사업이 완료된 51개소 지역에서는 침수가 발생하지 않는 성 _ 른 공업용수 공급의 불확실성을 해소하는 산업계 물공급의 패러 가 예상되는 현시점에서 하수도 정비사업은 더욱 확대될 핵심과 활성화를위해서도 여러모로 노력하고 계신 줄로 압니다. &. 환경부와 함께 물 재이용과 건전한 물순환 확산을 목표로 제 도 개선, 민관 협업, 정책 발굴 등 다방면으로 노력하고 있습니다."}, {"p": 40, "t": "지자체의 하수처리 재이용수를 이용해 물부족 문지 를 허 결 할수 8300 바0을한자어:오아 있도록 추진 방향을 제시하는 등 국가 차원의 하수 재이용 활성 화에도 노력을 기울이고 있습니다. ㅇ.공단에서 운영 중인 국가 물산업클러스터의 역할 및 물기업--봄69448: 출25) 추세 관련 지원사업에는 어떤 것들이 있는지 궁금합니다. 의 물기업이 입주하고 있습니다. 공단은 국가 물산업클러스터를 통해 기술 개발, 기술 검증, 실적 확보, 국내 사업화, 해외 진출등 _ 대해 환경 및 시설개선을 했으며, 상수원이 전혀 없는 4개 마을에 사업 활동의 전(수) 주기를 지원하고 있는데요. 단계별 주요 지 _ 공용 관정을 설치해 일일 199톤의 마시는물을 공금했죠. 원사업을 살펴보면, 기술 개발 단계에서는 기존 물기술 제 품에 _ 올해 도 1000여 개 이상의 개인 관정 개선 및 마을 공용관정 설 스마트 기능을 추가하는 '물기술 능동형 디지털화 지원사 업' 과 、 치를 지속해 지원할 예정입니다. 2050 탄소중립에 발맞춘 온실가스 감축을 위한 '수요기반 탄소 중림 실증지원사업\", 물기업 기술 애로사항 극복을위한 맞춤형 _ 0. 올해 1월에 개설한 '한강유역하수도지원센터'의 역할 및 향 는 소재-부품
