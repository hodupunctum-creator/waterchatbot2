배출 업종에 대해서는 저탄소 공정 전환과 기술혁신 지원 책이마련된다.기 후데크880 예산 확대 탄소중립 신기술 이재명 정부는 건축물과 수송부문에도 대대적 틸탄소화 를 예고했다 노후건물의 그린리모델링 지원 확대 전기차보급 확대, 노후경유차 조기 폐차 지원이 대표적이다 동시에 국 민의 참여를 유도하는 탄소포인트제 인센티브도 강화된다 농업 부문도포함된다. 영농형 태양광 보급 친환경 탈탄소 모델을 제시한다. 여기에 정의로운 전환 특구 지정과 기후대응기금 확 전환부담을 덜기 위한 제도 장치도 포함되었다. 환경 선환의 공정성을 제도적으로 담보하겠다는 의지다. 재생 에너 지 로 달리는 에너지 고속도로` 이번 공약의 또 다른축은 에너지 대전환이다 정 부 는 2040 너지 자립을 함께 추구한다 눈길을 1는 것은 한반도 에너지고속도로 구상이다.2030 력망을 기반으로 한 분산형 재생에너지 체계다 이는에너지 플라스틱과 생태계도함께바꾼다 '탈플라스틱 국가 로드맵\" 수립도 공약에 포함됐다 특히 바 이우플라스틱 산업 육성을 통해 환경과 신산업을 동시에 챙 긴다는복합전략이다 생태계 복원도 주요 과제다. 산불 발생 지역 생물다양 성 복원, 육상-해양 생물보호구역 확대, 4대강 재자연화 (86\\1008) 및 수질 개선 등이 주요 과제로꼽힌다. 이와 연 이재명 정 부는2025년6월부터 법령 정비메 착수하고, 추진한다.2025~2030년까지의 연간 총수입 증기분과 지"}]}, {"id": "95-36", "no": 95, "label": "2025 여름호", "corner": "칭찬합시다 1", "title": "수원시상수도사업소", "author": "", "start": 36, "end": 37, "pages": [{"p": 36, "t": "여름이면 폭염과 함께 찾아오는불청객녹조.작년 팔당호에서 9년 만에 최대 농도가 관측되며 먹는물 안전에 대한 우려가 쏟아졌다. 맑은물공급을위해 지속적이면서도실용적인관리 대책이 시급한이때, 수원시상수도사 업소가인공수류 생성으로 호소내 녹조를 저감하는 사례를 발표했다. 수원시삼수도 사업소"}, {"p": 37, "t": "발생하는데 조류 중에서도 진녹색을 띠는 남조류가 과다하게 성장 하면서 발생하는 현상이다. 여기에 농업 산업 활동으로 인한 영양염 류 유입이 더해지면 녹조 발생이 기속화된다 이처럼 녹조는 지극히 자연스러운 생태현상이지만 일부 남조류가 독소를 배출하면서 수질오염과 생태계 파괴| 시민들의 건강 우려까 지 영향을 미치기에 두고 볼 수만은 없다. 실제로 녹조로 인한 어류 폐사나 악취 문제가 발생하며 시민들의 불안이 커지자 각 지자체에 서는 화학적 조류 제거제를 사용하거나 물리적 저감 장치를 활용하 는 등 여러 방법으로녹조 발생을 억제하고있다. 다만효과가 단기적이고, 비용이 많이 든다는 단점이 있어 이를보완 할수 있는 대책이 필요했다 이에 수원시상수도사업소는 녹조 문제 를 해결하기 위해 지속 가 능하면서도 비용면에서도 효율적인 방안 을 모색했고수질 관리를 담당하고 있는광교저수지를 중심으로 모 터가 아닌 압축공기를 활용해 저수지에 수류를 만들어 내는 장치를 광교저수지는 수원의 중요한 비상급수원이자 많은 시민이 찾는 소 중한 여가 공간이다. 수원시상수도사업소수질검사팀은 갈수록심해 지는 광교저수지의 녹조 문제를 해결하기 위해 2020년부터 본격적 인 수질 관리 사업을 도입했다 니라한 여름에는 직접 직원들이 보트를 타고 들어가녹조 제거제를 살포하는 등 맑은 물 제공에 최선을 다했다. 이번 업무 개선 사례 역 시 맑은 수못물생산에 실질적으로 도움이 될 방안을 지속적으로 고 발한새로운 인공 수류 장치는 모터가 아닌 입축공기를활용해 수류 를 만들어 내는것이 핵심이다. 기존의 수류 장치가 반경 20~300의 한정된 범위에서만 효과를발 휘했다면 압축공기를 활용한 장치는 훨씬 넓은 범위에 걸쳐 강한수 류를 만들어 녹조 발생을 억제할 수 있다. 실제로 1년간의 시험 운명 을 통해 가동해본 결과 녹조 발생이 저감되는것을확인할수있었다. 증되며 인근 지자체에서도 문의가 이어지고 있는 상황 수질관리팀 에서는 매일 광교저수지를 찾아장치가 잘 작동하고 있는지와 수질 을 모니터링하며 지속적으로 관리하고 있다. 시민들이 안심하고 물 을 마시며 여유를 누릴 수있도록 녹조제거는물론저수지 수질을지 키는 데 중점을 두겠다는 수원시상수도사업소. 그들의 진심 어린 고 민으로부터 만들어진 이번 사례가 지자체의 녹조 문제 해결에 대한 새로운가 능성을 여는모범 사례로 자리 잡을것으로 기대된다."}]}, {"id": "95-38", "no": 95, "label": "2025 여름호", "corner": "칭찬합시다 2", "title": "남양주도시공사", "author": "", "start": 38, "end": 39, "pages": [{"p": 38, "t": "시 민 과함께하는 지속가능한 도시 인프라 하수처리장은 도시 인프라의핵심 시설이지만 혐오시 설로 인식되며 각 지자체에서는 처리장을 지역사회와 소화롭게 공손하는 공간으로 재 탄생시키기 위한 다양 한 시도를 하고 있다. 남양주시 역시 이러한 흐름에 발 맞춰 공공하수처리시설을 현대화하고, 기존 부지를 시 민을위한 공원으로 조성하는프로젝트를 추진해왔다 화도푸 른물센터가 그 대표적인 예로, 약 3만7700 규모의 부지를 공원으로조성해 시민들에게 여가와 휴 식 공 간을 제공하고 있다. 피아노폭 포' 라고도 불리는 공원에 들어서면 방류수를 활용한 인공 폭포 가시원한 모양의 이색 화 장실이 자리잡고있다 화장실로 올라가는 계단에는 센서를 설치해 발로밝을 더위가 시 작 되는7~8월에는 '친환경 물놀이장'을 무료 로 개장해 시민들에게 피서지 를 제 공한다. 5507 길이 거리로 구성되어 있어 여름철 남양주시의 관광명소 로 시 민을위한 휴식 및 놀이 공간 제공 반류수 처리장치 구축 으로 하수처리 용량증대 및 부하 저감 고효율하수처리 시스템 고안으로 비용절감 지난 3월 화도푸 른 물 센터는2025년 환경기초시설 운영기술 개선 경진대 회 와 2025년 하수도 업무개선사례 발표회에 참가해 '하수처리장의 부하 서감 및 처리 용량 증대를 위한 반류수 처리장치 구축 ' 사이드스트림 스크리닝을 이용한 고효 율 하수처리 시스템'을 주세로 발표해 대한상하수도학회 우수상과 한국상하수도 협회장상을 연이어 수상했다. 이 성과는 기 후변화 대응과 물자원 관리의 혁신적 모델로 주목받고있다 술과 생물학적 처리기술을 결합한 고도의 하수처리 기 술로 설치 면적을 술일수 있어 부지 절감은 물론 미세 오염물까지 제거 가 능하다는 장점이 있다. 반면 막세 어 주기 적인 역 세척과 화학세정이 필요하다는 단점 이 있었다. 회도푸른물센터는 이를 개선하기 위한 방 안을 고민했고, 워 터 파크에서 주로사용 하는사이드스트림 방식을 떠 올렸다. 물전체 보유량의 일부를 조금씩 빼서 순환 시키는 방식으로사이 드스트림을 설 치한 뒤 사이 드스트림 형 태를 1년 동안 시범 도 길어져 비용 절감 효과가 뚜 하게 나타났다. 그리고 시범으로 만들었던 설비 를6월부터 본격적으로설치중이다. 하수 처리량이 많아시는 장마 를 앞두고 있시만 해당 설비를 운영한다면 막힘 현 상이나 긴급 보수를 하는 일이 조금은 줄어들지 않을까기 대하고 있다 화도푸른 물센터는 올해 안에 이를 자동화해 운영할 계획도 갖고 있다. 기존 하수처리 공정 의 한계를 극복하고기후변화대응을 위한 새로운 패러다임을 제시한 회도푸른물 센터는앞으로도기술적, 환경적 혁신을 이 어나갈것이다."}, {"p": 39, "t": "깨끗한물 공급을 위한필수 인프라인 하수 처리장. 하수처리와 각종 설비의 유지 보수 에는막대한비 용이 소 요 되고특히 맑은물로 처 리하는 과정에서 발생하는에너지 소모량은 대표적인 비용 상승의 요인으로꼽힌다. 이에 남양주도시공사 화도푸른물센터는 사 이스트림드 활용한 고효율 하 수처리 시스템을 고안해 운영함으로써 실질적인 성과 는 물론기술적 개선 효 과까지 이끌어내고있다."}]}, {"id": "95-40", "no": 95, "label": "2025 여름호", "corner": "지구별 수(水)다", "title": "글로벌 상하수도 디지털 전환 현황", "author": "", "start": 40, "end": 43, "pages": [{"p": 40, "t": "전환이 필요한 디지털 기술로 복원력을 키우는 미국 상하수도 미국은 노후화된 상하수도 인프라위 기를 디지털 기 술로 돌파하고 있다. 워싱턴 와 로스앤젤레스는 디지털 트윈 스마트 센서, 인공지능 분식 등을 활용해 운영효율성과 복원력 을 ㅋ게 향상시켰다 워싱턴 0( 수도 청(0( \\5167은 하수관로 흐름 압력 유량을 실시간으 로 시뮬레이션하는 디지털 트윈 시 스템을 운영 중이다이 시스템은비가 동이나 배수 전환 등의 선제 대 응을 가능하게하며, 매년 약 700만 달러 의 피해 복구 비용을줄이고 있다"}, {"p": 41, "t": "기후위기, 인프라노후화 인구 감소라는 복합적인위기가 상하수도산업의 전통적인운영 방식에 큰 균열을 내고있다. 물은 도시의 생명선이지만, 이를 관리하는 시스템이 여전히 아날로그에 머문다면 미래 위기에 무기력할 수밖에 없다. 이에 전 세계 주요국은 상하수도 시스템의 디지털 전환 에 박차를 가하고있다. 특히 실시간모니터링, 인공지능분석, 디지털 트윈 기 반의 예측 시스템을 앞세워 한층스마트하고유연한물관리 체계를 구축하고있다. 하지만국내상하수도 시스템은 여전히 제한적인 시범사업 수준에 머물고있다. 본고에서는 미국과 일본등해외 주요 사례를 중심으로상하수도 디지털 전환 현황을 살펴보고, 국내에 필요한전략적 방향을 모색해 본다."}, {"p": 42, "t": "로스앤젤레스 수도 국(.4(0//?)은2만 개 이상의 스마트 미 터 를 통 해가 ㅣ 일본환경성은 '스마트수처리 플랫폼 정책을 통해 수질수량 에너지 사 정별 수듯물사용량 누수 여부, 이상 징후를 실시간 모니터링하며, 인공 지능이고장이나이상패턴을 자동 감지한다 이를통해 유수율이92%까- 」 화하며 2027년까지 전국 하수처리장75%에원격 감시 기능 도입을 목표 인 구감소에 대응하는 일본의 스마트수처리 술로 확보하고 있다. 인구 감소와 인력 부족이 심각한 지방 중소도시 를 충심으로 클라우드기반 원격 운영 체계를 적극 도입하고있다. 중앙 관제센터에서 실시간으로 원격 제어하는 통합 운영 시스템을 구축 했다. 펌프 가동, 수실 변화, 유입량 등을 하나의 플랫폼에서 모니 터 링 하 며,자동 경보시스템으로무인 운영도 가 능하다 용량등의 데이 터를 전국적으로 수집- 표준화하고, 민간과 기술 험 력 을 강 로 한다. 일본은 상하수도 디지털화 를 단순한 기술 도입이아닌 인구 감 디지털화에뒤처진 국내 상하수도 시스템은 글로벌 흐름과 비교할 때 심 각한 격 차가 있다. 국내 상하수도 시스템이 스마트 전환에 실패할 경우 여러 문제가 발생할 우려가크다 특히 관망운영, 인력 구조, 데이터 활용, 먼저 관망 운영에서는해외 주요국들이 디지털 트윈으로관로 상태를 실 시간으로 예측하고 진단함으로써 사고 예방과 효율적 유지관리를 실현"}, {"p": 43, "t": "플루는 20랄프 아이라 하고 있다. 반면 국내는 대부분 수동 점검에 의존해 누수나 관 파열 문제 를 사전에 포착하기 어렵다. 따라서 예지보전 체계 를 구축해 선제 대 응이 가능한운영 방식으로 전 환해야 한다. 인력 측면에서도 일본 능은 자동화와 원격 운영으로 인력 부족과 고령화 문제에 대응하고 있다 무인 시 스템과 클라우드기반 관제는 지방소도시 에서도안정적인 운영을 가능케하며,숙련 인력의 은퇴에 따른 공백을 최 소화한다. 그러나 국내는 기술 인력 고령화에도 불구하고자동화 도입이 아직 걸음마 단계다 디지털 운영 시 스템의 빠른 확산이 시급하다. 데이터 활용은 해외가수질,수량에너지 등 다양한 데 이터를 표준화하고 통합플랫폼에서 공유하며,시 분석을 통해 운영 효율과정책 결정을 지원 한다. 반면, 국내는 부처별-지 자체별로 데이터가 산재해 통합 관리와 실 시간 분석 에 한계가 있다. 이를 극복하기 위해서는 데이터 허브 구축 과 표준화된 공유 체계 마련이 필요하다. 마시막으로 재정 구조에서는해외 가 민관 협력 모델을 통한 다양한 투자 방식을 모색하는 데 비해 국내 는 지방자치단체 예산에 크게 의존하고 있다. 장기적이고 안정적인 디지털 전환을위해 중앙정부주도 투자와 민간협력체계 구축이 필수석 이 다. 따라서 국내 상하수도 시스템은 해외 선진 사례 대비 디지털 전 환이 시급 하며, 스마트운영 체계 없이는 기 후변화와 인프라 노후화라는복합위기 에 효과적으로 대응하기 어렵다. 따라서 체계적인 예지보전,인력 자동화, 데이터 통합, 재성 지원이라는 네 축을 중심으로 한 전면적 전환 전략이 먼저 국가 주도형 통합플랫폼 구축이 필요하다 스마트 정 수장-하수처리 장 실증사업을 넘어 전국 단위의 통합 관세 플랫폼을 구축해야 한다 클 라우드 기 반으로상수, 하수, 수질, 에너지 등 데이터를 실시간통합관리 하는국가 수처리 데이터 허브가 필요하다 또한민간혐력형 디지털 인프라투자가 활성화되어야한다 스마트미터, 101 센서, 시 분석 솔루션 등 민간 기 술을 공공 인프라에 적극 도입하고, 산 기 반을 마련해야 한다. 끝으로 디지털 전문 인력 양성과 운영 소직의 혁신이 뒷받침 되어야 한 다. 노후된 상하수도 사업소를 스마트 워터 센터모 전환하고, 기술직 공 무원을 대 상으로 ^, 데이터 분석 등 디지털 역량 교육을 확대한다. 동시 에 민간전문운영 인력 확보를 위한제도기 반도 정 비해 야한다. 기후 위기 시대, 물은 더 이상무한한 자 원이 아니다 기술로 물의 흐름을 읽고, 예 측히며, 제 어할 수 있어야 도시의 지속 가 능성도 보장된다 세계는 이미 디지털 기 반의 스마트상하수도 체계로 빠르게 전환하고있 다. 국내도 이제는 시범사업 단계를 넘어 전국적 확산과 제도화 를 통해 시능형 물순환 시스템 구축에 나서야할 때다. 지금 필요한 것은 기 술' 보"}]}, {"id": "95-44", "no": 95, "label": "2025 여름호", "corner": "물 리포트", "title": "맑은 물을 위한 국내외 산업 톺아보기", "author": "", "start": 44, "end": 47, "pages": [{"p": 44, "t": "고수온-적조 선제 대응으로피해 최소화 줄이기 위한 '2025년 고수온-적조 종합대책을 수립하고 본격 시 행에나섰다 올해 연안 수온은 평 년 보다 (가량 높아 7월 말 고 해수부는 지난 2월부터 액화산소 공급장치 등 대응 장비를 조기 지원하고, 사전 점검을 통해 피해 예방 체계를 강화해 왔다 조피 고 조기 출하와소비 촉진도 유도한다. 유학생 30어 명을 대상으로 국내 물관리 정책과 기반시설에 대 등 17개국 출신의 공무원 유학생들이 참가해 우리나라선진 물관 리 정책에 대한 이해를 높이고 향후 국제 협력 기반을 다지는 기 참기자 들은 인공지 능(^) 기반홍수예보 시스템을 포함한 물관리 정책 전반을 소개받고, 한국수자 원공사의 물종합상황실을 찾아 디지털 기술을 활용한 실시간수자원 관리 체계를 견학했다. 또한 대청맥의 수자원 운영 현장을 둘러보고 신탄진 정수장에서 취수부터 정수까지의 전 과정을 직접 살펴보며 생활용수 공급체 계에대한실무적 이해를 높였다. 환경부는 이번 견학을 계기로 외국 정책인재들과의 지속 가능한 물 분야 협력을 확대하고 향후 해외 물시장 진출과 국제 네트워"}, {"p": 45, "t": "티안에서 '라오스 안전관리 시스템 구축사업\" 착공식을 개최 했 최근 기 후변화로 강력한 태풍이 빈발하면서 라오스에서는 지난 르 농경지 침수 피해가 발생했다. 라오스는 안전관리 규정, 전 문인력기 자재가부족해 재난 대응에 어려움을 겪고있다 이에 농식품부와 한국농어 촌 공 사는2028년까지 총 55억 원을 투입해 제도수립,기반시설구축, 인력 양성을 포함한'냄 안전관 리 시스템을 구축한다. 우리나라의 정밀안전진단 실무지침을 기 반으로 라오스 상황에 맞춘 안전관리 체계를 마련하고, 중앙 안전 모니터링센터 설치와 8개 시범 지구 정밀안전진단, 교육 프 로그램도병행한다 이번 사업은 라오스 정부가 자립적으로 들안전하게 운영 할 수 있도록 역량을 강화하는 데 중점을 두며 한국과 라오스 간 기후 위기 대응협력의 상징적인 성과가 될 것으로 기대된다. 영국정부, 수도기업에 대한수질오염책임 강화 영국 환경식 품농 림 부(26『2)는「수자 원(특별조치) 법」의 새로운 규 정이 6월 6일부터 시행됨에 따라 템스 워터, 요크셔 워터 등 6개 주요수도 기업 임원의 불공정 보너스지급을 금지했다고밝혔다. 이번 조치는 수도기업의 환경-고객 성과저조 시 임원 보너스 지 급을 차단해 책임경영을 강화하고,정부가 추진하는 수도부문개 혁과 투자 활성화 전략의 일환이다. 지난 10년긴 수도기업 사장 들은1200억 원 규모의 보너스를 자율 지급해 왔으며, 지난해 한 해 에만760만 파운드가 지급됐다. 그러나 이번 법 시행으로 성과 보너스 지급 제한 대상은 환경오염,재정 악화, 고객 서비스실패, 형사유죄 판결 등 핵심 기준을 충족하지 못하는 임원이다 오프 영국 정부는 이 조 치 와함께194조 원 규모의 민간투자확보를 통 해 향후 5년간 하수 방류량을 절반으로 줄이고 수도 인프라 를 현 대화할 계획이다. 이번 법 시행은 수도기업의 투명성과 책임성을 높이고, 환경 보호 및 고객 서비스향상을 위한강력한동기 부여 책으로평가받고있다."}, {"p": 46, "t": "등 3건의 신규통합문영 계약을 체결하며 수처리 분야리더신을 이번 계약을 통해 26만 8천 명 이상이 안정적인 물 서비스를 공급 받게 되며, 총 20개 이상의 정수장, 13개 50017 이상 유압회 로망관리가 포함된다 특히 라리우하지역에서는 합작두자 를 통 해 19개 하수처리장과 1개 정수장을 통합 운영하고,칼라호라 에 이와 함께 바다호스 주와는 15개 지자체 대상 급수 서비스 운영 계약을,국영기업 &\"5와는 전략적 대 유압시설 운영 계약 을각각체결했다 각 계약은 시설 헌대화 재생에너지 활용 디지 털 기반 관리체계 강화 등음 포함하고 있으며 테다구아는 이를 통해 지속 가능한물순환관리 모델의 선도기업으로 인지를확대 미국 플로리다, \"커 및{| 르원 80정수 시설”준공 미국 플로리다 키스 수 도 국『<&&)은4700만 달러를 투입 해 커 +1르윈스톡아일랜드 역삼투압(80))정수시설을 준공하고,본 격가동에들어갔다. 수관에 의존하고 있으며 허리케인 등 재난 발생 시 물공급 중단 이번에 준공된 시설은 기존 용량의 두 배인 하루 1만5천 톤의물 을처리할 수있으며극한기후에도 안정적으로작동하도록설계 됐다 에너지 효율이 높은최신 멤브레인 기술을 적용해 에너지 소 수 실비 외에도수질 실험실과 재난대응인력 숙소까지 포함됐다. 플로리다주는 이번 시설을 통해 재난 회복력과물공급 신뢰성을 동시에 확보하고, 관광성수기 인구증가에 따른수요 대응도 가 능해질 것으로 기대하고있다 카 롤로 엔지니어링 등 민간협력사 들의 기술력이집약된 이 시설은 지역 사회의장기적 물인보 해법 며 미국 내 지속 가능한 물인프라의 모범 사례로평가받고있다"}]}, {"id": "95-48", "no": 95, "label": "2025 여름호", "corner": "물 즐거움이 되다", "title": "다이내믹한 여름을 즐기다", "author": "", "start": 48, "end": 51, "pages": [{"p": 49, "t": "청정한 해변을 간직한 제주도라면 그 기 뽑이 욕장보나 파도가 고 높은 덕분에 여 름이 되 면 해양 레포츠를 즐기 려는 사람들이 몰려든 는 프리 서퍼들의 질주를 보는 것만으로 도 가 슴이뱅 뜰리는 기분이다. 직접 경 험한다면 서 도로 달려오는 물의 흐름을 읽고 힘의 강약 을 소설하며 마침내 파도에 올라 틀 때 성취감 이 밀려 든다. 초보자라면 해변 주변의 서 핑 캠 것. 물론 처 음에 는 서 툴겠지만, 보드 위를 뒤 뚱거리다 물에 빠져 첨 병 거 리더라도 도전의 티를 즐길 수 있다. 해변 길이가 약 560 에 에 자리하고 있다. 이처럼 독특하고 아름다운 비경을 가까이에서 감상할 수 있는요트 투어 도 놓치지 말 것. 요트를 타고 바다 한가운데 을 비롯해 멀리 가 파도와 마라도까지도 항해 제주 바다를 더욱 압도적인 스피 드로 즐기고 싶다면 비 바제 트보트를 체험해 보사. 바다위 를 달리는 스텔스 전 투기라고 불리는 만큼 맹 렬한 속도를 자랑한다. 숙 련 자가90도 끼 와 360도 꺼기등 다양한 기 술을 구사하는데,롤"}, {"p": 50, "t": "한석하게 수상 레서를 슬길 수 있나. 강원도 이다 시내와 가까운 거리에 위치한 장호항은 반달 형태의 새하얀 해안선이 아름다워 한국 못 다른 아 눅하고 신비로운 장관을사랑한다 명한 강화 플라스틱으로 제작한 카약 안에서 은 바닷물 덕분에 시야가 깨끗한 것이 장점. 따라 몸을 흔드는 해양 식물들, 그리고 바다 경은 마치 수족관 안을 산책하는 듯한 기 분을 선사한다. 하 늘을 바라본 채 몸을 기대도 좋 다. 푸른 동해 위를 동동 떠다니는 경험을 할 거가 인 아하22하세제 수영을 하며 돌 사이사이를 유영하는작은 해 비 닷길을 따라 달리는 경험도 특별하다. 장호 항에서 7번 국도를 따라 북쪽으로 올라가면 목에 다양한 테마의 해양터널이 마련돼 있는 데,터널 안에서 빛과 레이저를 활용한 볼거리"}, {"p": 51, "t": "서울 도심 한가운데서도 물살을 가르는 낭만 능에 자리한 클럽에서 다양한 수상레서 체험 프로그램 을 제 공한다 대표적인 한강 레저로 손꼽히는 윈드서 핑 은 보드 위에 서서 세일 이라고 부르는 놓을 소절 해 앞으로 나아가는 스포츠다. 바 람의 방향과 세기에 맞춰 균형을 잡으며 전진하는 방식이 다. 보드에 몸을 의지한 채 바람을 느끼고 강 의 잔잔한 파도를 타는 순간, 마치 자연과 내 가 혼연일체가 되어 항해를 누리는 기 분이다 세련된 고층 빌딩과 아파트 사이의 강을 가로 시르는 풍경도 한강만이 선사하는 특별한 경 경 스포츠인 것도 장점. 보드 위에 온전히 혼 자 서야 하므로 어렵게 느껴질 수 있지만, 초 보자도 쉽게 배울 수 있다 강습을 통해 기본 한 기 술이 필요하시 않으므로 누구나 시작할 크서핑을 추천한다. 서핑은 바다의 파도를 기 수는 파도를 활용한다. 처음에는 보트에 달려 있는 로프를 잡고 출발한 후, 일성 시 간이 지 나면 로프를 내려놓고 내 몸의 중심을 활용해 가의 디테일한 강습을 통해 훈련하면 서울 도 신감과 용기로 연마하는 과정이 아닐까 무더 을 가르며 도전에 나선다면 올여 름이 더욱 특 별하게 기억될 것이다."}]}, {"id": "95-52", "no": 95, "label": "2025 여름호", "corner": "제철 식탐", "title": "달콤한 수분 충전 참외", "author": "", "start": 52, "end": 55, "pages": [{"p": 52, "t": "글사진 이주현 푸드 칼럼니스트 함유된 풍부한 엽산과 절분은 사궁 건강을 지키는 데 도움을주기 때문이다. 과육안쪽 한 과일을 먹는 것이 꺼려지는 체중 조절을 하는 다이어 터에게도 반가운 식품이다 또 한 비 타민(가풍부해 피부 미 용에도 효과적이니 올여름 맛달콤하게 영양을 총전하고 고르는 것이 좋다. 구매한 참외는 밀봉하여 냉장 보관하는 것이 좋다 먹을 때는 깨끗 참외는 음료로 마시면 특유의싱그러운 향과 달콤한 맛을 잘느낄 수 있다 기장 쉽고 로 먹거나 요거트를 결들여 든든한 디저트로 맛보는 것이 유행이다. 레시피도 따라하 기 쉬우니 여름철 별미를만들어닷있게 즐겨 보자."}, {"p": 55, "t": "먹으면 간단하면서 맛있는다이어트간식이 완성된다. 무더운 날씨에 더운불앞에서 요리하기 지친다면 시원하 '만드는과정 기 호에 따라블루베리나 딸기 등의 과일을 함께 결들인다. \"저자이주현은요리 연구 가이자 푸드 매체에 음식과 관련한 칼럼 을연재 중이다. 레시피 안내와 일상생활과 밀접한요리 칼럼을 주로 연재중이다."}]}, {"id": "95-56", "no": 95, "label": "2025 여름호", "corner": "오늘부터 1일", "title": "친환경 세탁법", "author": "", "start": 56, "end": 58, "pages": [{"p": 56, "t": "이로인해물과전기,세제 사 용량도 함께증가하면서 환경에 미치는 영향도 커지게 된다. 환경을 보호하면서도깨끗하게 세 탁하는 친환경 세탁법을 실천해보자. 물과 에너지 절약은 물론옷감 손상도 줄이고쾌적한 여름을 보낼수있다. 정리 편집실"}, {"p": 57, "t": "세탁기는 가득 채워 돌리는 것이 물과 전기를 효율적으 로사용하는 방법이다. 너무 적게 넣으면 에너지와 물이 낭비되고 너무 많이 넣으면 세탁력이 떨어진다 적절한 용랑으로 세탁해 환경과 옷감을 동시에 보호하자. @)저온세 탁으로에너지 절약 40도 이상의 고온세탁은 에너지 소비가크게 증기한다. 일상 의 류 는 30도 이하의 찬물 세탁으로도 충분히 깨끗 해진다. 특히 섬세한옷감은 저온 세탁으로 손상을 줄이 고 에너지도 절약할 수 있다 세탁기 내부 필터를주기적으로 청소하면 세탁 효율이 올라가고, 미세섬유가 하수구로 배출되는 것을 줄일 수 시탁기 관리가 중요하다 표백제와 섬유유연제는 화학성분이 강해 환경에 부담 을 주고 피부 자 극을 일으킬 수 있다. 반드시 필요한 경 우에만 권장 사용량 이하로 사용하자. 베이킹소다는 많이 친환경 세탁법 이렇게 실천해 보 재 세제 사 용하기 세제를 선택하자. 이들 화학물질은 하천과 토양 오염의 인증 혹은친환경 인증 마크가있는 제품이 안전하다 옷을자주 세탁하기보다 통풍'이나 '부분 세탁'으로 오염 리 손상되고 환경부하가 커진다. 특히 청바지나 외투는 세탁 주기를 늘리는것이 좋다 건조기는 많은 전 력 을 소 비한다. 가능한 자연 건 조를 활 용해 에 너 지 를 아끼고옷감손상도 술 이자. 햇빛이 강한 곳에 서는 자 외 선에 의해 실균효과도 기 다할수 있다. 가 능하다면 절수 세탁 코스를 활용하자 신기술 세탁기 는물을적게 쓰면서도 세탁 성능을 유지하는 모델이많 다. 물 절약은 에너지 절약과직결된다 낮은 온도- @)자연 건조 활용하7| 물사용줄이기 건조기는 항상사용하는게 위생적이다. 자연 건 조가 친환경적"}, {"p": 58, "t": "기루변하로 인한 몰 부족과 위 710 성과 와 다양한 부 나 행.를 통해 몰 사연스 럽게 느낄 수 있었 습 다 2025년<맑 은 물 세상> 여름호독자리뷰 이벤트 <맑은물세상>여름호 기사 중 가장 기억에 남는내용은무엇이었나요? 여러분의 소중한생각과 따뜻한관심이담긴 리뷰를남겨주 세요. 추첨 을 통해 선물을드립니다. <맑은 물 세상> 여름호를 정독한 후08코드를 스캔해 기억에 남는 내용과 이유를 구글폼에 작성해 주세요 ※개인정보동의 필수 69 이벤트상품 커피 기프티콘(5멍) <맑은 물세상>2025년봄호후 기에 참여해 주신모든분에게 감사인사드립니다.그중다섯분의 후 기를 공유합니다. <맑은 물세상>은 여러분의 관심과 응원으로함께 만들어집니다.앞으로도소중한의견 부탁드려요. 경보 스템 담수하7」술 등 몰순환 언 나 미클 림0) 환정보전은 물론 정제적 독자 이벤트"}]}, {"id": "95-59", "no": 95, "label": "2025 여름호", "corner": "좋아요 KWWA", "title": "좋아요 KWWA", "author": "", "start": 59, "end": 59, "pages": [{"p": 59, "t": "ㆍ 정기 적인 광원 교체 불필요 ㆍ 1005% 국내 기술로 외산 제품 대체 ※ 외산 대비 최대 60% 수준의 가격 및 낮은 유지보수 비용 ㆍ 한국환경공단을 통한 사용성 평가 완료 시 기술 인증"}]}, {"id": "96-6", "no": 96, "label": "2025 가을호", "corner": "KWWA와 함께", "title": "유정복 제13대 협회장 취임식", "author": "", "start": 6, "end": 9, "pages": [{"p": 6, "t": "KEYNOTE | KWWA와 함께 제13대 한국상하수도협회장 취임식이 열린 한국상하수도협회 청사 비상홀 제13대 한국상하수도협회장 유정복 인천광역시장 취임식 “깨끗한 물·지속 가능한 미래”를 향한 유정복 협회장의 힘찬 출발 지난 8월 5일, 한국상하수도협회 청사 1층 비상홀에서 유정복 인천광역시장이 제13대 협회장 취임식을 갖고 향후 3년(2025~2028년) 임기의 힘찬 출발을 알렸다. 이날 행사는 물 관련 학계와 산업계, 공공기관 주요 인사, 협회 임직원 등 100여 명이 참석한 가운데 성황리에 열렸으며, 유정복 회장은 국민이 안심하고 마실 수 있는 깨끗한 물 공급과 기후위기 대응, 첨단기술 기반의 물관리 혁신을 향한 비전을 제시했다. 글 조은겸 | 사진 박창수"}, {"p": 7, "t": "깨끗한 물과 지속 가능한 미래를 향한 첫걸음 접 방문해 직원들과 인사를 나누며 현장의 의견을 청취 청사 앞에는 취임 축하 화환이 줄지어 섰고, 안팎으로 환영 했다. 사무총장실을 비롯해 기획경영처, 회원지원처, 상수 인사가 이어졌다. 협회장실에서 간단한 보고를 받은 유정복 도처, 하수도처, 물산업 인재교육원, 상하수도정책지원실 회장은 본 행사장인 1층 비상홀로 이동했다. 행사장에는 ㈜ 등 모든 부서를 방문해 현황과 주요 과제를 살폈다. 도화엔지니어링 박승우 대표이사, 한국물환경학회 김성표 그는 각 부서의 역할과 가치를 강조하며, 일에서 보람을 찾 학회장, 한국상하수도학회 조민현 회장, 중앙대학교 박규홍 고 국민 삶의 질과 안전 향상에 힘써줄 것을 당부했다. 또한, 교수 등 물 관련 주요 인사와 협회 임직원 100여 명이 참석 위험 요소를 사전에 발견해 예방하는 노력의 중요성을 언 해 자리를 빛냈다. 급하며, 교육과 전문성 강화를 통해 상하수도 문제 해결에 개회 선언과 국민의례 후 환영 꽃다발이 전달됐다. 이 앞장서 달라고 전했다. 부서 곳곳에서는 박수가 터져 어 단상에 오른 유정복 회장은 국민이 안심하고 마 나왔으며, 협회 안에는 새로운 리더십과 미래에 대 실 수 있는 깨끗한 물의 중요성과 기후위기·기술혁 한 기대감이 확산됐다. 신에 대응한 물관리 체계의 변화 필요성을 언급했 2002년 「수도법」 제39조에 근거해 설립된 한국 다. 또한, 첨단 기술과 환경정책을 접목해 물관리의 상하수도협회는 올해로 창립 23년을 맞았다. 환경 효율성과 안전성을 높이겠다는 비전을 제시했다. 부 산하 공공기관으로서 전국 168개 지방자치단체, 유 관 공사·공단, 학계, 기업 등 약 1,300명의 회원을 보유 국민 안전부터 세계 무대를 향한 도약까지 하고 있다. 역대 회장으로는 고건(1대/前 서울시장), 유정복 회장은 앞으로 3년간 협회 운영의 기조를 안상영(2대/前 부산광역시장), 허남식(3~4대/前 부 제시했다. 그는 회원 참여 확대, 국민 안전 확보, 미 산광역시장), 오세훈(5~6대/前 서울시장), 박원순 래 환경 변화에 선제 대응, 국내 물 기업의 국제 경쟁 (7~8대/前 서울시장), 권영진(9~10대/前 대구광역 력 강화, 시설 관리의 전문화 등을 중심축으로 협회를 시장), 이용섭(11대/前 광주광역시장), 강기정(12대/前 운영하겠다고 전했다. 이를 통해 협회가 국민의 삶과 직 광주광역시장)이 있으며, 이번에 바통을 이어받은 유정복 결된 물관리의 수준을 상승시키고, 세계 무대에서도 인정받 회장은 민선 6기와 8기 인천광역시장을 비롯해 행정안전부 는 전문 기관으로 도약하겠다는 의지를 드러냈다. 장관, 농림수산식품부 장관 등을 역임한 풍부한 행정 경험의 소유자다. 첨단기술 물관리 체계로 향하는 새로운 다짐 제13대 협회장의 첫날은 그렇게 힘차게 막을 올렸다. 기후 취임식은 선출증 수여와 기념 촬영으로 이어졌다. 단체 사 위기와 기술혁신이라는 거대한 흐름 속에서 협회와 유정복 진을 촬영할 때는 전 직원이 환한 웃음과 함께 하나 되는 분 회장이 써 내려갈 ‘국민 안심 물관리 체계’의 역사가 시작되 위기였다. 공식 행사 후 유정복 회장은 각 부서 사무실을 직 는 순간이었다. 각 부서를 방문해 직원들과 인사를 나누는 유정복 협회장 Vol. 96 2025 가을호"}, {"p": 8, "t": "KEYNOTE | KWWA와 함께 “‌균형·창조·소통으로 물관리의 새 기준을 세우겠습니다” 안녕하십니까. 제13대 한국상하수도협회장으로 취임하게 된 인천광역시장 유정복입니다. 먼저, 중책을 맡겨주신 회원 여러분께 진심으로 감사드립니다. 자리를 빛내주신 이사님들과 임직원 여러분께도 깊이 감사드립니다. 오늘 이 자리에 서니 대한민국 물산업 발전에 대한 막중한 책임감과 함께 시민을 위한 봉사 자로서의 사명감이 더욱 깊게 다가옵니다. 깨끗한 물은 국민의 권리 저는 깨끗하고 안전한 수돗물은 국민에게 주어져야 할 기본 권리이며, 삶의 질을 결정하는 필수 조건이라는 신 념으로 시정을 이끌어 왔습니다. ‘오직 시민, 오직 미래’를 지향하는 저에게 안정적인 수돗물 공급은 무엇보다도 중요한 책무였습니다. 한국상하수도협회는 지난 23년간 대한민국 상하수도 업무를 주관하는 전문 기관으로서 상하수도 선진화와 국 민 물 복지 증진에 앞장서 왔습니다. 2015년 공공기관 지정 이후 조직의 공공성을 강화하고, 투명하게 사회적 가 치를 실현하며 국민 삶의 질 개선을 위한 첨병 역할을 해 왔습니다."}, {"p": 9, "t": "물관리의 중요성과 당면한 과제 물은 국민의 건강과 삶의 질을 좌우하는 척도일 뿐 아니라, 환경과 국가 경제발전의 핵심 인프라입니다. 이 혜택 을 온전히 누리고 갑작스러운 위협으로부터 지켜내기 위해서는 효율적 관리, 첨단 기술 도입, 그리고 상하수도 시스템에 대한 지속적인 투자와 관리가 필요합니다. 4차 산업혁명 기술의 급속한 발전은 상하수도 분야에도 전 례 없는 변화와 도전을 요구하고 있습니다. 특히 기후위기라는 거대한 도전 속에서 물관리 문제는 매년 중요한 이슈로 부각되고 있으며, 신기술 융합을 통한 스마트 물관리 시스템의 조속한 정착이 시급한 시점입니다. 극한 폭우와 폭염, 예측 불가능한 기상이변은 우리 물관리 시스템을 직접 위협하고 있습니다. 안정적인 상하수도 공급과 효율적인 시설 운영의 중요성이 더욱 커지고 있습니다. 저는 협회가 쌓아온 소중한 가치를 지키고, 공공기관으로서의 위상을 강화하고자 회원 여러분과 함께 역량을 결집하겠습니다. ‘균형, 창조, 소통’이라는 철학을 바탕으로 이러한 위기를 함께 극복하고, 협회 발전의 새로운 동력을 창출하겠습니다. 물관리 5대 중점 추진 방향 이를 위해 다섯 가지를 약속드립니다. 첫째, 회원과 함께하는 공공기관 역할에 충실하겠습니다. 상하수도 정책, 기술, 운영 등 각 분야 전문가와의 소통을 확대하고, 정부·지자체·민간기업과의 교류 협력을 강화하겠습니다. 둘째, 국민 안전을 최우선으로 하는 조직을 만들겠습니다. 지반침하, 맨홀 추락사고 등 국민 안전과 직결되는 문 제에 대해 정부·지자체와 협력하여 기준 강화와 예방 대책을 마련하겠습니다. 셋째, 미래 물관리 문제에 선제적 으로 대응하는 협회를 만들겠습니다. AI와 탄소중립 등 급변하는 환경에 대응해 한국형 AI 정수장 도입과 상하 수도 시설의 온실가스 감축을 적극 추진하겠습니다. 넷째, 국내 물 기업의 해외 진출과 경쟁력 강화를 지원하겠 습니다. ‘워터코리아(Water Korea)’를 통해 해외 판로 개척과 매출 성장을 뒷받침하겠습니다. 다섯째, 상하수도 시설 개선과 운영 전문화를 적극 추진하겠습니다. 노후 시설에 대한 재투자와 효율적 운영을 위해 정비사업, 사 후관리, 운영 전문화를 지원하겠습니다. 맑은 물, 세계로 흐르는 길 물은 우리 국민의 삶과 미래를 지탱하는 가장 소중한 자원입니다. 협회가 대한민국 상하수도의 미래를 이끄는 구심점이 되도록 회원 여러분과 함께 앞장서겠습니다. 국민이 언제 어디서든 안심하고 마실 수 있는 깨끗한 물 을 확보하고, 국내 물 기업의 경쟁력을 강화하는 것이 협회의 사명입니다. “준비된 자만이 위기를 기회로 만들 수 있다”라는 말처럼 기후위기와 AI 기술혁신이라는 도전에 당면했지만, 회 원 여러분의 전문성과 경험, 그리고 저의 열정과 노력이 함께한다면 현명하게 극복하리라 확신합니다. 여러분의 적극적인 참여와 변함없는 성원을 부탁드립니다. 감사합니다. 제13대 한국상하수도협회장 유정복 Vol. 96 2025 가을호"}]}, {"id": "96-10", "no": 96, "label": "2025 가을호", "corner": "맑은 물 이야기", "title": "수돗물홍보협의회 공익광고 촬영 현장", "author": "", "start": 10, "end": 13, "pages": [{"p": 10, "t": "KEYNOTE | 맑은 물 이야기 수돗물홍보협의회 공익광고 촬영 현장 “‌\u0007가치 있는 물, 같이 먹는 물” 수돗물의 일상 속 가치와 지속 가능성을 말하다 지난 7월 25일, 경기도 파주에 있는 스튜디오에서 김석훈 배우가 참여한 수돗물홍보협의회의 공익광고 촬영이 진행됐다. 이번 공익광고는 안전성·경제성·친환경성이라는 수돗물의 핵심 가치를 쉽고 따뜻한 시선으로 전달하고자 기획됐다. 여름 햇살이 유난히 뜨거웠던 그날, 촬영 현장은 맑고 차분한 에너지로 가득했다. 글 편집실 | 사진 수돗물홍보협의회·고인순"}, {"p": 11, "t": "일상 속 수돗물, 장면마다 깃든 메시지 이번 광고는 ‘가치 있는 물, 같이 먹는 물’이라는 주제를 중심으로, 일상 속 다양 광고는 357개 수질검사와 24시간 모니터링을 강조하며, 수돗물이야말로 한 장면에서 수돗물이 어떤 역할을 하는지를 섬세하게 풀어냈다. 총 16개 장면 으로 구성된 콘티에는 아일랜드 식탁에서 과일을 씻는 가족, 운동 후 텀블러에 수돗물을 받아 마시는 커플, 반려견을 목욕시키는 아버지, 실험실에서 수질을 플라스틱 사용을 줄이고 지하수 고갈을 검사하는 전문가의 모습 등이 담겼다. 수돗물은 단순한 생활의 일부가 아니라 막으며 탄소 배출을 줄이는 친환경 환경과 건강, 지속 가능성까지 품고 있다는 메시지가 곳곳에 녹아 있다. 선택임을 알린다. 광고 말미에는 김석훈이 스튜디오 한가운데 서서 “가치 있는 물, 같이 먹는 물, 수돗물”이라는 인사를 전하며 영상의 중심을 잡았다. 조용하지만 묵직한 그의 내레이션은 수돗물에 대한 신뢰를 다시금 환기한다. “믿고 마시는 수돗물, 지구를 지키는 첫걸음입니다” 라디오 캠페인 버전에서는 김석훈이 직접 내레이션에 참여했다. “이제 우리가 바꾸지 않으면 지구가 더 이상 버티지 못하겠구나… 그래서 저는 물을 바꿨습 니다.”로 시작하는 내레이션은 단순한 정보 전달을 넘어 환경을 위한 행동 변화 로서 ‘수돗물’을 제안한다. PROFILE... 광고는 357개 수질검사와 24시간 모니터링을 강조하며, 수돗물이야말로 플라 스틱 사용을 줄이고 지하수 고갈을 막으며 탄소 배출을 줄이는 친환경 선택임 을 알린다. 김석훈은 “작은 습관이 지구를 위한 숲이 된다”는 메시지를 차분한 목소리로 전하며, 수돗물이 미래를 위한 물임을 강조한다. 김석훈 1998년 드라마 <해바라기>로 데뷔한 이후 <불새>, <불멸의 이순신>, <제3병원> 등에서 믿음직한 이미지로 사랑받아 온 배우. 다큐멘터리 내레이션, 사회공헌 캠페인 등에도 꾸준히 참여하며 신뢰받는 방송인으로 자리 잡았다. 환경, 교육, 공동체 이슈에 대한 관심도 깊은 그는 이번 수돗물 캠페인에서 “물에서부터 지구를 위한 실천이 시작된다”는 철학을 담았다. 진정성으로 전하는 물의 가치 현장에서 만난 김석훈은 대기 시간에도 대본을 다시 읽고, 컷마다 촬영팀과 동 선·표정을 논의하며 몰입하는 모습을 보였다. 스태프들은 그의 진지한 자세에 박수를 보냈다. 사전 리허설부터 촬영 종료까지 흐트러짐 없는 집중력, 그리고 컷 사이사이에도 웃음을 잃지 않는 여유가 인상적이었다. 컵에 수돗물을 따르 는 장면에서는 실제로 마시는 연기를 자연스럽게 이어갔고, “이 장면은 제 일상 과 다르지 않아요”라며 미소를 보였다. 수돗물홍보협의회 관계자는 “수돗물은 국가가 책임지는 공공재이자 탄소중립 실현을 위한 열쇠”라며 “이번 광고를 통해 수돗물이 단순한 생활용수가 아닌, 미래를 지키는 자원의 하나로 인식되길 기대한다”고 말했다. Vol. 96 2025 가을호"}, {"p": 12, "t": "KEYNOTE | 맑은 물 이야기 친근한 환경 전도사, ‘쓰저씨’ 김석훈 “처음엔 ‘쓰레기 아저씨’라는 별명이 어색했죠. 그런데 오 히려 이 별명이 환경 문제를 자연스럽게 이야기할 수 있게 ‘水퀴즈 온 더 블록’에서 배우 김석훈을 만나다 해주더라고요.” 그는 이 별명이 사람들과 환경을 연결하는 가교 역할을 한 다고 말했다. 환경이라는 다소 무겁고 어려운 주제를 친근 하게 전달할 수 있어 좋다는 것이다. 유튜브를 통해 환경 콘 텐츠를 시작한 계기에 대해 그는 “사람들이 환경 문제를 어 렵게 느끼지 않고 일상에서 접근할 수 있도록 친숙한 이미 지로 다가가고 싶었다”고 설명했다. 또한 방송·강연 등 다 양한 플랫폼을 통해 환경 메시지를 꾸준히 알리고 있다. 덜 쓰고, 덜 만들고, 덜 버리는 삶 김석훈 씨는 최근 제주 국제환경 포럼에서 “덜 만들고, 덜 쓰고, 덜 먹고, 덜 입자”라는 메시지를 강조했다. “환경보호는 어려운 일이 아닙니다. 중요한 건 욕심을 조금 덜어내는 겁니다. 과잉 소비와 생산을 조금만 줄이면 환경 은 자연스럽게 나아집니다. 큰 결심이 아니라 작은 다짐부 터 시작하는 게 중요합니다.” 그는 환경 문제의 근본 원인이 현대인의 지나친 소비·생산 욕구에 있다고 강조하며, “경제 성장을 이루면서 풍족한 생 활을 누리게 되었지만 그만큼 환경 오염도 심각해졌어요. 우리가 욕심을 조금씩 내려놓으면 충분히 환경 문제를 해 결할 수 있습니다”라고 덧붙였다. 수돗물과 함께하는 일상의 행복 이번 수돗물 공익광고를 촬영하며 그는 어린 시절 수돗물 에 얽힌 기억과 그때 느꼈던 따스한 감정들을 떠올렸다. “어릴 때 운동장에서 뛰놀다가 수도꼭지에서 바로 수돗물 을 마셨던 기억이 생생해요. 예전에는 녹물도 있고 소독약 냄새도 강했지만, 지금은 정말 깨끗하고 좋아졌어요.” 그는 특히 페트병 생수의 미세플라스틱 문제를 언급하며 수돗물의 장점을 강조했다. “페트병 생수보다 오히려 수돗물이 안전할 수 있다는 사실 을 많은 분들이 알아 주셨으면 좋겠어요. 우리가 매일 사용 하는 수돗물이 얼마나 철저하게 관리되고 있는지 깨닫는다 면 더 고마운 마음으로 사용하게 될 겁니다.” 인터뷰 과정에서 소개된 지자체의 수돗물안심확인제나 옥 “‌\u0007작은 습관 하나가 세상을 바꿉니다”"}, {"p": 13, "t": "진심 어린 눈빛과 부드러운 목소리로 환경 이야기를 꺼내는 김석훈 배우는 친환경 전도사로 알려져 있다. 그가 유튜브 채널 ‘나의 쓰레기 아저씨’를 통해 전하는 환경보호 메시지는 많은 사람들의 공감을 이끌어내고 있다. 광고 촬영이 끝난 후 한국상하수도협회 유튜브 채널 ‘水퀴즈 온 더 블록’에서 김석훈 배우와 한국상하수도협회 김상남 내배관 교체 지원 사업 등에 대해 김석훈 씨는 “이러한 제도 상하수도정책지원실장과의 미니 토크가 진행됐다. 소소한 일상에서 들이 더욱 잘 알려져 시민들이 안심하고 수돗물을 사용할 환경을 위한 작은 실천을 강조하는 그의 따뜻한 이야기를 전한다. 수 있으면 좋겠다”고 공감을 표시했다. 물 없는 하루, 상상하기 어렵죠 그는 물이 없는 세상을 상상하는 것만으로도 마음이 무거 워지고, 그만큼 물의 소중함과 이를 지켜야 할 책임을 절실 히 느낄 뿐 아니라, 지금 우리가 당연하게 누리는 맑은 물이 얼마나 큰 가치인지를 새삼 깨닫게 된다고 했다. “수돗물이 없다면 생활 자체가 마비될 겁니다. 씻는 것도, 마시는 것도 불가능하니까요. 우리가 깨끗한 물을 언제든 편리하게 사용할 수 있다는 건 정말 감사해야 할 일입니다.” 그는 세계 곳곳에서 물 부족으로 고통받는 나라를 방문했 던 경험을 떠올리며, “물을 쉽게 얻을 수 있는 우리나라의 환경은 정말 큰 축복입니다. 우리가 물을 소중히 여기고 깨 끗하게 관리하는 것은 후손들에게 더 나은 세상을 물려주 는 길”이라고 말했다. 환경보호는 일상 속 작은 선택 그는 환경보호를 특별한 것으로 여기지 말고, 일상에서 실 천할 수 있는 작은 습관으로 만들자고 제안했다. “환경보호는 결코 거창한 일이 아닙니다. 물 한 방울, 공기 한 모금의 소중함을 인지하고 작은 행동부터 바꿔 나가면 됩니다. 우리의 작은 선택 하나하나가 모여 미래 환경을 바 꿀 수 있어요. 앞으로도 많은 분들과 함께 좋은 환경을 만들 어 가기 위해 노력하겠습니다.” 그는 환경보호가 특정 집단이나 전문가의 몫이 아니라 모 두가 일상에서 함께할 수 있는 과제임을 강조했다. 이어 앞 으로도 다양한 활동을 통해 더 많은 이들과 환경 가치를 나 누고 싶다는 포부를 전했다. 김석훈 씨의 따뜻하고 진솔한 이야기는 작은 실천이 얼마 나 큰 변화를 만들어 내는지 다시금 생각하게 했다. Vol. 96 2025 가을호"}]}, {"id": "96-14", "no": 96, "label": "2025 가을호", "corner": "오늘 물 맑음", "title": "한국상하수도협회 뉴스 · 교육 일정", "author": "", "start": 14, "end": 17, "pages": [{"p": 14, "t": "KEYNOTE | 오늘 물 맑음 2025 KWWA NEWS 박정남 신임 사무총장 취임 개인정보보호 캠페인 전개 한국상하수도협회(협회장 유정복, 이하 ‘협회’)는 박정남 전 인천광역 한국상하수도협회(협회장 유정복, 이하 ‘협회’)는 9월 8일 서울 신도 시 상수도사업본부장이 신임 사무총장으로 공식 취임했다고 9월 17일 림역 인근에서 ‘개인정보보호의 날(9월 30일)’을 맞아 생활 속 개인 밝혔다. 정보보호 캠페인을 개최했다. 협회는 지난 7월 22일 제13대 회장에 취임한 유정복 인천광역시장이 이번 행사는 개인정보 유출 위험이 커지는 환경에서 대국민 경각심 박 후보를 추천했으며, 9월 16일 개최된 이사회에서 임명을 최종 승 을 높이고, 개인정보보호 문화를 산업 전반에 확산하기 위해 마련됐 인했다. 이번 인사는 협회의 정책 역량을 강화하고 조직 혁신을 가속 다. 현장을 찾은 임직원들은 출근길 시민에게 안내 자료를 배포하며 화하기 위한 조치로 풀이된다. ‘내 정보 지키기’ 행동 수칙을 설명했다. 박 사무총장은 인천광역시 상수도사업본부장을 비롯해 상하수도 행 협회는 개인정보보호 주간(9월 29일~10월 3일)에 SNS 홍보, 임직원 정 전반에서 풍부한 경험과 현장 이해도를 쌓아온 전문가로 평가받 대상 교육, 개인정보보호 슬로건 공모전 등 다양한 프로그램을 이어 는다. 특히 수돗물 공급 안정화, 노후관 개선, 수질 관리 등 주요 현안 갈 계획이다. 또 회원사와 연계한 맞춤형 교육을 통해 현장 업무의 보 을 직접 다루며 실무형 리더십을 발휘해 왔다. 그는 협회의 발전을 위 안 의식도 높일 방침이다. 협회는 이번 활동을 계기로 산업 현장의 정 한 전략 수립과 회원사 지원에도 강점을 지닌 것으로 알려졌다. 보보호 수준을 점검하고, 제도 개선 의견을 수렴할 예정이다. 그는 취임 소감에서 “상하수도 분야의 지속 가능한 발전과 국민 물 유명수 상근부회장은 “AI 대전환 시대에 사이버 위협과 개인정보 침 복지 향상을 위해 책임감을 갖고 협회 운영에 임하겠다”며 “전국 지 해가 더욱 증가할 것으로 예상된다”며 “협회는 정보보호 강화와 문화 자체와 전문가, 유관기관과 협력해 실효성 있는 현장 중심 활동을 강 확산을 위해 지속적인 노력을 기울일 것”이라고 말했다. 그는 “데이 화하겠다”고 말했다. 이어 “물산업의 혁신과 국제 협력도 적극 확대 터 관리 역량은 신뢰도와 직결된다”며 보안 강화를 강조했다. 해 나가겠다”고 덧붙였다. 협회는 이번 캠페인을 계기로 상하수도 산업 전반에서 개인정보보 협회는 박 사무총장이 중심이 돼 회원사와의 연대와 정책 추진을 강 호 인식을 높이고 실천을 확산해 나간다는 방침이다. 협회 관계자는 화하며 미래 상하수도 발전을 이끌 것으로 기대하고 있다. 협회 관계 “안전한 데이터 관리 체계를 확립해 국민이 안심할 수 있는 서비스 자는 “현장을 잘 아는 지도자의 합류로 협회의 위상과 역할이 한층 환경을 제공하겠다”고 덧붙였다. 넓어질 것”이라고 전했다."}, {"p": 15, "t": "Y-ESG 클러스터 빗물받이 정화활동 2025 물산업 진로캠프 성료 한국상하수도협회(협회장 유정복, 이하 ‘협회’)는 6월 27일 영등포구 한국상하수도협회(협회장 유정복, 이하 ‘협회’)는 8월 11일부터 14일 신길동 저지대 반지하 주택가에서 ‘영등포구 Y-ESG 클러스터’(이하 까지 경기도 가평비전센터에서 ‘2025년 물산업 단기 진로(취업)캠 클러스터)와 함께 빗물받이 정화활동을 실시했다. 이번 활동은 여름 프’를 3박 4일 일정으로 개최했다. 철 집중호우로 인한 침수 피해를 예방하고, 생활환경을 개선하기 위 이번 캠프는 환경부의 물산업 전문인력 양성사업의 하나로, 지난해 해 추진됐다. 협회는 “지역 환경 문제를 함께 해결하자는 취지에서 공 에 이어 두 번째로 마련됐다. 협회는 청년들에게 물산업의 미래 가능 공기관들이 뜻을 모았다”고 설명했다. 성과 실제 업무 환경을 소개하고, 현장에서 필요한 역량을 키울 기회 클러스터는 농업정책보험금융원, 시청자미디어재단, 우체국금융개 를 제공하기 위해 프로그램을 기획했다. 발원, 한국상하수도협회, 한국우편사업진흥원, 한국장애인개발원, 전국 40여 개 대학에서 약 90명이 지원했으며, 최종 35개 대학 54명 한국해외인프라도시개발지원공사 등 7개 공공기관으로 구성돼 ESG 이 참가해 전원 수료했다. 참가자들은 수처리·공공기관·시험분석·엔 기반 지역 협력 과제를 추진하고 있다. 이날 참가자들은 약 80개의 지니어링 등 5개 분야 물기업 현직자와 만남을 통해 취업 정보를 얻 빗물받이에서 담배꽁초와 생활 쓰레기를 수거하고, 막힌 배수구는 고, 덕소정수장과 춘천 하수처리시설을 견학하며 현장의 업무 과정 안전신문고를 통해 관계 부서에 조치를 요청했다. 을 체험했다. 자기소개서 작성법과 모의면접 등 취업 코칭도 함께 진 클러스터는 “지역사회를 중심으로 공공기관의 ESG 경영을 실천하고 행돼 실질적인 준비가 가능했다. 안전하고 지속가능한 환경을 조성하겠다”며 “침수 취약지 지원과 사 프로그램은 물산업 이해도 제고와 취업 역량 강화를 목표로 특강, 현 회적 약자 보호 등 안전을 중시하는 ESG 실천을 확대하겠다”고 강조 장 실습, 멘토링 세션 등으로 구성됐다. 참가자들은 조별 프로젝트를 했다. 협회는 이런 활동이 단순한 봉사 차원을 넘어 지역과 공공기관 통해 산업 과제를 논의하고, 발표를 통해 의사소통과 문제 해결 능력 간 협력 모델로 자리 잡길 기대하고 있다. 을 높였다. 협회는 이 과정을 통해 “짧은 기간이지만 교육과 현장을 협회는 이번 활동을 계기로 지역사회와 협력해 기후위기 대응과 환 결합한 맞춤형 커리큘럼을 완성했다”고 설명했다. 경 개선을 위한 공공기관 역할을 강화할 계획이다. 연내에는 추가 정 협회는 “참가자들이 물산업 현장을 직접 보고 느끼며 진로를 구체화 화활동과 안전 점검을 병행하며, 장기적으로는 침수 대응 매뉴얼을 하도록 돕는 것이 중요하다”며 “앞으로도 청년 맞춤형 일경험 프로그 공동 개발하는 방안도 검토 중이다. 램을 확대해 산업 성장과 청년 일자리 창출을 지원하겠다”고 말했다. Vol. 96 2025 가을호"}, {"p": 16, "t": "물산업인재교육원 4분기 교육일정 분야 과정명 상수도 교육시간 소규모 390,000 340,000 수계전환담당자과정 340,000 수도시설운영기본과정 35시간(5일) 고도정수처리운영과정 340,000 상수도관망관리대행업운영요원과정 340,000 전문교육 하수도 공통교육 건설기술인 설계시공 소규모 급수시설 운영관리과정 16시간(2일) 200,000 27-28 하수도행정과정 320,000 13-17 하수도관리자과정 350,000 공공하수처리시설운영요원과정(설비운영) 35시간(5일) 320,000 공공하수처리시설운영요원과정(수질관리) 320,000 21시간(3일) 180,000 측정기기관리대행업기술인력과정 24시간(4일) 169,000 하수도설계기준과정 물 생태탐방 체험과정 35시간(5일) 20-24 24-28 21시간(3일) 1-5 19-21 13-16 3-7 390,000 24-28 22-24 상하수도설계시공 승급교육(특급)[회원] 270,000 13-17 상하수도설계시공 승급교육(특급)[비회원] 350,000 13-17 35시간(5일) 스마트 하수도의 이해 5시간 하수도 하수관로 유지관리 실무 6시간 하수도시설 기술진단 실무 6시간 그린뉴딜 물산업 상품개발 전략 6시간 하수관로 기술진단 및 정밀진단 8시간 1-4 390,000 270,000 17-21 350,000 17-21 5시간 •중소기업: 무료 •대기업: 20% 부담 ▶ 컨소시엄 재직자 교육의 경우, 10인 이상 신청 시 기업 출장 교육이 가능합니다. ▶ 교육비와 교육일정은 협회 사정에 따라 변경될 수 있으며, 자세한 사항은 홈페이지(edu.kwwa.or.kr)를 참고해주시기 바랍니다. 3-7 320,000 물산업 수출역량강화교육[회원] 8-12 320,000 공공하수도관리대행업기술인력과정(혼합) 하수도 시공관리 및 표준시방서 과정 10-14 27-31(강 원) 320,000 공공하수처리시설운영요원과정(고도처리) 스마트 상수도의 이해 ▶ 문의사항 02-3156-7800 8-12 24-28 29-30 상수도 기타 10-14 200,000 물산업 수출역량강화교육[비회원] 컨소시엄 재직자 교육 20-24 16시간(2일) 공공하수처리분뇨처리시설운영요원과정 측정기기 17-21 먹는물 시료채취 기술인력과정 320,000 12월 1-5 340,000 390,000 11월 3-7 340,000 공공하수처리시설운영요원과정(기본) 하수도 13-17 수도시설관리자과정 유량계관리과정 법정교육 10월 배급수관리기본과정 수질분석 및 관리과정 상수관망 수강료(원)"}, {"p": 17, "t": "We Work 회원 탐방 1 이엠씨㈜ 회원 탐방 2 ㈜씨제이케이 즐거운 만남 부산광역시 상수도사업본부 김병기 본부장 회원 소식 Vol. 96 2025 가을호"}]}, {"id": "96-18", "no": 96, "label": "2025 가을호", "corner": "회원 탐방 1", "title": "이엠씨㈜", "author": "", "start": 18, "end": 21, "pages": [{"p": 18, "t": "WE WORK | 회원 탐방 ① ICT 기반한 스마트 물관리 기술의 발전과 함께 수질오염물질 모니터링 산업이 ‘‌\u0007메이드 인 코리아’ 새로운 성장 분야로 주목받고 있다. 이엠씨㈜는 수질 TMS용 측정기 제조부터 운영에 시약 제조·공급, 연구용역까지 수질 환경 분야에 특화된 서비스를 제공하는 수질 모니터링 시스템, 필요한 ‘수질오염물질 자동모니터링 토탈솔루션’ 기업이다. 경쟁력 있는 기술력으로 해외 진출도 적극 모색하고 있는 이엠씨㈜를 찾아 그간의 성과와 계획을 들어봤다. 글로벌 시장에 도전! 이엠씨㈜ 글 고영민 | 사진 박창수"}, {"p": 19, "t": "수질TMS 산업을 겨냥해 창업 물환경보전법은 수질TMS의 유지관리 사업을 일 1990년대 낙동강 페놀 유출 사고를 계기로 4대강에 정 자격을 갖춘 사업자만 할 수 있도록 규정하고 있고, 매 대한 실시간 측정이 정책으로 채택되고, 하·폐수 처리 년 우수관리대행업자를 선정해 공시토록 하고 있다. 염 대표는 “국내 1호 우수사 량의 96% 이상을 자동모니터링하게 되는 등 수질원 업자로 선정된 이엠씨는 수질TMS 운영관리 유공으로 환경부 장관 표창을 받는 격감시체계(TMS)는 우리나라 물 환경 정책에 있어 중 등 관리대행업자로서 서비스 품질을 인정받았다”며, “직원 19명 중 80% 이상이 요한 부분을 차지한다. 통계에 따르면 수질TMS 도입 기술 인력으로 등록되는 등 서비스 분야에 최선을 다하고 있다”고 역설했다. 전인 2008년 대비 2024년 오염부하량은 56% 이상 감소한 것으로 나타났다. 특히, 정부는 2023년부터 하 ClassicTOC, ‘성능인증’과 ‘혁신제품’ 지정 루 700톤 이상 하·폐수를 처리하는 곳은 TOC(총유기 이엠씨가 첫 번째로 내세우는 기술과 제품은 시료 탄소) 기준으로 유기물 측정을 하도록 일원화했다. 의 잔량에 따른 오차를 최소화한 잔량 배제 시스템을 무 설치 기준이 강화되면 시장 확장성은 더욱더 커질 적용한 열연소산화방식의 ‘TOC연속자동측정기’(제 것으로 보인다. 품명: ClassicTOC)다. 이는 중소벤처기업부가 개발 한국환경공단, 민간기업 등에서 관련 경력을 쌓아 온 비를 지원하는 세대융합 창업캠퍼스 프로그램에 참 염은성 대표는 이러한 시장 흐름을 내다보고, 수질자 여함으로써 탄생했다. 해외제품 일변도였던 측정기 동측정기의 국산화, O&M(운영·유지보수) 표준화, 애 의 국산화를 이뤄냈다는 의미도 있지만, 관련업에 종 프터마켓 등을 타깃으로 2017년에 창업했다. 2021년 사하는 전국 260여 개 업체 중에서 중기부의 ‘성능 기술개발을 완료해 본격 제품 판매를 시작했는데, 측 인증’과 조달청의 ‘혁신제품’ 지정을 받은 기업은 이 정기 설치·관리 대행, 이동형 수질 감시시스템 설치·유 엠씨가 유일하다. 염 대표는 “TOC측정기는 한국환 지관리, 연구개발 용역 등의 주요 사업을 진행하며 지 경공단과 공동기술개발을 통해 이루어낸 성과”라고 속적인 매출 증가세를 이루고 있다. 평가했다. 신기술 적용과 우수성을 인정받아 환경부 ClassicTOC Vol. 96 2025 가을호"}, {"p": 20, "t": "주최 ‘2018 환경창업대전’에서 우수상, ‘서부경기문화창조허브 창업경진대회’에 서 장려상, ‘2023년 공공구매 촉진대회’에서 중소벤처기업부 장관상을 수상했다. 또 다른 기술은 microTMS(수질TMS 축소형태)로 불리는 ‘이동식수질감시시스템’ 이다. 하·폐수처리시설에 고농도로 유입되는 폐수를 처리하는 폐수수탁처리업체 에서 처리 용량을 초과할 경우, 수질 기준을 만족하지 못하는 방류수를 발생시킬 수 있다. 이엠씨와 인천시는 이를 방지하고자 ‘실시간감시시스템’을 전국 최초로 개발했다. 현재 5대가 설치·운영되고 있는데, 부족한 인력을 대체하며 원하는 현 장에 설치해 폐수 상태를 24시간 확인하는 이동식 수질감시시스템은 한국환경공 단 ‘2022년도 K-eco 상생협력 우수과제’에서 민관이 유기적으로 협력한 우수사 례(장려상)로 선정됐다. 최근 환경부 그린뉴딜사업으로 추진되는 국가 수질자동측정소 및 새만금호 수질자동측 정소 민간위탁 사업에 3개 사가 컨소시 엄을 구성해 3차 년도 사업을 수주했는 데, 이엠씨는 2026년 12월까지 민간위 탁 사업자로 업무를 수행할 예정이다. 이동형 수질감시시스템"}, {"p": 21, "t": "단순히 측정 장비를 수출하는 데 그치지 않고, 수질TMS 제도를 함께 전파함으로써 우리나라 수질 정책의 우수성과 고도화된 기술이 해당 국가의 표준으로 자리 잡도록… ODA 확대에 남미·아프리카 진출 기대 진행한다. 협회는 ODA 사업 중 연수사업에서 기술교육과 국내 하·폐수처리시설 이엠씨는 우리나라 수질TMS의 해외 진출에 역량을 집 의 견학·연수 등을 담당할 계획이다. 중하고 있는데, 콜롬비아, 모로코, 페루, 에콰도르, 타지 향후 ODA 사업이 순조롭게 진행되면 남미는 물론 아프리카 진출의 길도 열릴 것 키스탄, 방글라데시 등에서 세일즈 활동을 적극 펼치 으로 기대된다. 염 대표는 “글로벌 업체가 주도하던 수질계측기 시장에 메이드 인 고 있다. 특히, 수질측정장비 제조업체 최초로 코이카 코리아 제품이 해당 국가의 수질 정책 자료로 활용된다는 점에서 큰 의의가 있다” 의 2024년도 정부부처·지자체·공공협력사업(ODA 사 고 강조했다. 이엠씨는 단순히 측정 장비를 수출하는 데 그치지 않고, 수질TMS 제 전타당성 조사)에 선정됐는데, 한국지능정보사회진흥 도를 함께 전파함으로써 우리나라 수질 정책의 우수성과 고도화된 기술이 해당 원(NIA)과 컨소시엄을 통해 콜롬비아에서 컨설팅을 수 국가의 표준으로 자리 잡도록 한다는 목표를 세우고 있다. 환경과 에너지를 결합 행했다. 콜롬비아 사업은 보고타 시를 관통하는 보고 한 하이브리드형 수질자동모니터링시스템 비즈니스 모델은 이엠씨가 개발한 수 타강 유역(약 380km)에 대한 15개 수질감시 측정소 출형 모델로, 모로코 수자원부 등에서 큰 관심을 표하고 있다. 정부는 세계 10위권 설치로, 2024년에 수행한 KOICA 정부부터 지자체·공 ODA국가로 도약하고자 공적재원 확충 및 재원 다양화 등을 추진하고 있는데, 이 공협력사업 Q-DEEP(1단계)의 후속사업인 Q-DEEP(2) 엠씨는 그 흐름에 발맞춰 새로운 성장을 위한 노력을 지속할 계획이다. 파일럿 사업에 지원될 예정사업으로 확정되었다. 또한 더 나은 환경을 위한 혁신을 지향해 온 이엠씨는 수질TMS 관리 사업에 참여하며 한국산업기술진흥원(KIAT)에서 주관하는 ‘산업·에너 국내 하수도 정책 및 운영관리 향상에 기여해 왔다. 염 대표는 “앞으로 국내외 수 지 기술지도(TASK) 수요조사 및 기획’(생산현장 애로 질자동모니터링 시장에서 기술 기반 기업으로서 선도적 역할을 하고자 한다”며, 기술 지도)으로, 보고타강 유역 후속 사업과 페루 지역 “측정할 수 없다면 관리할 수 없고 관리할 수 없다면 개선할 수도 없다는 창업 초 에 대한 수요조사 사업을 한국상하수도협회와 협업해 심을 잃지 않고 모든 임직원이 끊임없이 노력할 것”이라고 덧붙였다. Vol. 96 2025 가을호"}]}, {"id": "96-22", "no": 96, "label": "2025 가을호", "corner": "회원 탐방 2", "title": "㈜씨제이케이", "author": "", "start": 22, "end": 25, "pages": [{"p": 22, "t": "WE WORK | 회원 탐방 ② 환경오염, 기후변화 등으로 인해 수자원 관리의 불확실성이 높아지면서 수자원의 지속 가능성 확보를 위한 노력이 다방면으로 이뤄지고 있다. 첨단 기술을 활용한 친환경 수처리 솔루션 개발과 적용도 중요한 과제로 떠올랐다. ㈜씨제이케이는 수처리 솔루션 전문기업으로서 이 분야에서 두드러진 기술력과 성과를 꾸준히 선보이고 있다. 글 강진우 | 사진 조병우 수처리 기술의 새 지평을 열어가다 ㈜씨제이케이"}, {"p": 23, "t": "때아닌 가뭄과 사라진 장마철, 극한의 국지성 폭우와 전례 없는 폭염까지… 우리는 위기 상황으로 치닫는 기후변화를 몸소 경험하고 있다. 지속적 미래를 지향하는 수처리 기술 때아닌 가뭄과 사라진 장마철, 극한의 국지성 폭우와 전례 없는 폭염까 지… 우리는 위기 상황으로 치닫는 기후변화를 몸소 경험하고 있다. 더 큰 문제는 기후변화로 인해 우리가 생명을 유지하고 일상을 살아가는 데 있어 꼭 필요한 수자원을 효율적으로 관리하기가 점점 더 어려워지고 있 다는 사실이다. 기후변화와 함께 글로벌 이슈로 자리매김한 환경오염도 수자원 운영과 수처리 전반의 큰 부담으로 작용하고 있다. 이 같은 상황에서 수처리 업계는 지구와 인류의 지속 가능성을 담보할 수 있는 수처리 솔루션 개발에 힘을 쏟는 중이며, 국내에서는 씨제이케이가 선두에서 주목받고 있다. 김상욱 대표가 직접 개발에 참여한 역삼투 멤브레인(RO Membrane) 을 토대로 2004년 설립한 씨제이케이는 공업용수 전처리, 순수·초순 수 생산, 하·폐수 재이용, 해수 담수화, 폐수 무방류 시스템(Zero Liquid Discharge, 이하 ZLD) 등을 주 사업 영역으로 삼는 수처리 종합 솔루션 전 아주드 오토 스트레이너(AZUD Auto Strainer) 문기업이다. 이 중에서도 ZLD는 수자원 활용 효율을 극대화하는 동시에 폐수로 인한 환경오염을 원천 봉쇄할 수 있는 혁신적 수처리 기술로 평가 받는다. “공장에서 발생한 폐수를 방류하면 환경에 나쁜 영향을 미칩니다. 폐수 정화 설비를 갖춘다고 해도 모든 유해 물질을 완벽하게 걸러내기란 쉽지 않은데요. 이런 점 때문에 선진국과 ESG 경영에 힘쓰는 글로벌 기업은 폐 수를 외부로 배출하지 않고 전량 재처리해 다시 사용하는 ZLD를 속속 도 입하고 있습니다. ZLD를 거친 폐수는 깨끗한 물과 고형물로 완전히 분리 됩니다. 물을 재사용하는 데서 한발 더 나아가, 고형물 내의 유가 자원을 탈이온화 시스템(Di water system) 모형 회수함으로써 생산성 향상에 나서는 사례도 늘어나는 추세입니다.” Vol. 96 2025 가을호"}, {"p": 24, "t": "‘내일의 수처리’를 내다보는 선견지명 씨제이케이는 친환경·고효율 수처리 기술이 미래 먹거리가 될 것이라고 예견하고 10여 년 전부터 ZLD 개발에 착수했다. ZLD는 크게 각종 멤브레 인을 활용한 전처리 공정과 증발 농축을 통해 물과 고형물을 분리하는 공 정으로 나뉜다. 앞단의 공정은 씨제이케이가 확보한 멤브레인 기술로 충 분히 구현할 수 있지만, 뒷단 공정을 위한 핵심 설비인 증발농축기(MVR) 관련 기술은 아직 완전한 내재화를 이루지 못했다. 따라서 씨제이케이는 일본의 한 선도적 수처리 전문기업과의 제휴를 통 해 기업 고객에게 ZLD를 납품하고 있는데, 김상욱 대표는 “자체적인 증발 농축기 관련 기술을 고도화하고 있는 만큼 머지않아 세계적 수준의 국산 증발농축기를 완성할 수 있을 것으로 보인다”며 강한 자신감을 드러냈다. 최근 수처리 업계의 현안으로 떠오른 과불화화합물(이하 PFAS) 제거 기 술도 씨제이케이의 주요 연구 개발 과제 중 하나다. PFAS는 분해가 어렵 고 체내 축적성이 높은 유기 불소계 화합물을 통칭하는 용어로, 과불화 옥탄술폰산(PFOS), 퍼플루오로옥탄산(PFOA) 등이 대표 물질로 꼽힌다. PFAS는 약품에 강하고, 불에 잘 타지 않으며, 전기가 통하지 않는 특성이 있어 생활과 산업 전반에 널리 활용되고 있다. 하지만 PFAS가 건강에 악영향을 미칠 수 있다는 점이 여러 연구를 통해 알려지면서 전 세계적으로 규제가 강화되고 있다. 특히 일부 상수도에서 PFAS가 검출되면서 선진국을 중심으로 상수도 수처리 시설에 PFAS 제거 설비를 도입하는 속도가 빨라졌다. 이 같은 상황을 면밀하게 지켜보던 씨제이케이는 2023년부터 국내 대학 연구팀과 공동으로 PFAS 제거 기술 개발에 돌입했으며, 연구실 실험에서 의 성과를 토대로 국내 보급을 위한 실증사업에 박차를 가하고 있다. 기존의 상하수도 기술에 우리가 보유한 고도화된 수처리 기술을 더해서 시민과 기업이 지금처럼 큰 불편 없이 수자원을 활용할 수 있도록 적극 지원할 계획"}, {"p": 25, "t": "‘원활한 수자원 활용’의 든든한 지원군 끊임없는 연구 개발을 통해 고도화된 수처리 기술력을 보유한 씨제이 케이는 ‘Poly-Ketone UF 중공사 분리막 모듈 파일럿 플랜트 성능평가’, ‘ASTM TYPE 1등급의 차세대 초순수 제조장치 개발 및 제품화’, ‘초순수 공 정용 차세대 역삼투시스템 개발 및 제품화’ 등 다양한 수처리 국책과제에 적극적으로 참여하고 있다. 지난 5월에는 환경부가 주관하고 한국환경산 업기술원이 주관하는 대형 국책과제인 ‘해수 담수화 플랜트 디지털 전환 및 농축수 자원화 기술 개발’ 참여 기업으로 선정됐으며, 특히 담수화 농축 수 내 용존 이온 11종 이상을 추출해 자원화하는 기술 개발에 나섰다. 씨제이케이가 최근 한국상하수도협회에 가입한 것도 이 같은 사업 확장 노력의 일환이다. 지금까지는 순수 및 초순수 제조 시스템, 해수 담수화, 폐수 처리, ZLD 등 기업 고객을 중심으로 한 사업에 집중해 왔지만, 이제 는 하·폐수 재이용 설비, 상수도 PFAS 제거 기술 등을 속속 갖추고 있는 만큼 한국상하수도협회 및 회원사들과 시너지 효과를 낼 수 있을 것이라 고 본 것이다. “많이 배우겠다는 겸손한 자세로 협회, 회원사들과 함께하 겠다”고 밝힌 김상욱 대표의 눈빛에는 더 나은 미래를 향한 기대감과 그 길을 함께 걸어갈 동료들에 대한 신뢰가 담겨 있었다. “PFAS뿐만 아니라 녹조 등 환경오염과 기후변화로 인해 고도의 수처리 기술이 점점 더 필요해지고 있습니다. 우리 회사는 기존의 상하수도 기술 에 우리가 보유한 고도화된 수처리 기술을 더해서 시민과 기업이 지금처 럼 큰 불편 없이 수자원을 활용할 수 있도록 적극 지원할 계획입니다. 아 울러 농축 PFAS 처리 기술 등 앞으로 유용하게 활용될 수처리 기술을 선 제적으로 개발해 전 세계에 보급하는 데 전력을 다하겠습니다.” Vol. 96 2025 가을호"}]}, {"id": "96-26", "no": 96, "label": "2025 가을호", "corner": "즐거운 만남", "title": "부산광역시 상수도사업본부 김병기 본부장", "author": "", "start": 26, "end": 29, "pages": [{"p": 27, "t": "상수도의 공익성과 경영 합리화의 공존, 취수원 다변화, 노후화된 상수원의 효율적 유지·보수, 기후변화 대응책 마련 등은 시민들에 게 깨끗한 수돗물을 안정적으로 공급하기 위해 반드시 해결해야 할 과제들이다. 산적한 과제들이 놓여 있지만, 부산광역시 상수도사업 본부와 김병기 본부장은 ‘부산 상수도의 지속 가능한 미래’를 완성 할 수 있다는 일념으로 동분서주하고 있다. 과연 김병기 본부장의 손에는 어떤 설계도가 들려 있을까. 글 강진우 | 사진 박창수 부산 상수도의 지속 가능한 미래를 설계하다 부산광역시 상수도사업본부 김병기 본부장 장기적 관점으로 단행한 경영 합리화 부산광역시 상수도사업본부(이하 부산시 상수도사업본부)는 330 만 명에 이르는 부산 시민에게 상시 깨끗한 수돗물을 공급하기 위 해 최선을 다하는 상수도 전문 기관이다. 원수 취수부터 정수, 배수 까지의 전 과정을 체계적으로 운영하며, 엄격한 수질 검사와 지속 적 모니터링을 통해 수돗물의 질을 최고 수준으로 관리하고 있다. 엄격한 수질 검사와 지속적 모니터링, 그리고 시설 유지 보수를 통 해 공급 안정성을 확보하고 있으며, 민원 대응과 비상 상황 대비 체 계 또한 철저히 갖추고 있다. 부산시 상수도사업본부는 지방 직영 공기업으로서 공무원들이 임 직원 역할을 한다. 상수도의 공공성을 염두에 둔 선택으로, 운영 재 원의 약 80%를 시민들이 납부하는 수도 요금으로 충당한다. 하지 만 최근 불확실한 국제 정세, 급격한 기후변화 등으로 인해 에너지 및 원자재 가격이 급등하면서 수돗물 생산원가가 수도 요금 대비 높은 상황이 상당 기간 이어졌다. 시민 부담을 최소화하기 위해 요 금 인상을 미뤄 왔지만, 2024년 7월 부임한 김병기 본부장은 질 높 은 상수도를 지속적으로 공급하기 위해서는 경영 합리화를 추진해 Vol. 96 2025 가을호"}, {"p": 28, "t": "야 한다는 사실을 직시했다. 부산시 상수도사업본부가 그해 9월 상 부산시 상수도사업본부는 소속 공무원 수가 1,200명에 가까운 큰 수도 요금 인상안을 발표한 배경이다. 공기업이지만, 1인당 장비 관리 소요는 전국 최고 수준이다. 게다가 “그때 본부는 이미 심각한 재정 적자를 겪고 있었습니다. 이대로 가 부산은 지역 특성상 산이 많다 보니 수도 가압 설비 등으로 인해 여 다가는 우리 본부의 책무를 다할 수 없는 경영 상황에 놓일 수 있다 느 지자체 대비 많은 전기를 상수도 시설 운영에 사용하고 있으며, 고 판단했고, 2026년까지 단계적으로 요금을 인상하기로 했습니 낙동강 상류보다 오염된 하류의 물을 수돗물로 탈바꿈시켜야 하기 다. 대신 복잡하고 불필요한 분쟁으로 초래했던 누진제는 폐지하고 에 정수 처리 비용도 크게 든다. 이런 상황에서 상수도의 공공성을 요금 체계를 가정용, 일반용, 욕탕용, 공업용으로 단순화함으로써 유지하면서도 경영 합리화를 실현할 수 있는 가장 좋은 방법은 첨 시민들이 수도 요금을 직관적으로 파악할 수 있도록 조치했습니다. 단 기술을 적극 도입·활용해 생산성과 효율성을 극대화하는 것이 아울러 일반 가정의 경우 상수도 1톤당 월평균 60원만 추가로 부담 라고 김병기 본부장은 힘주어 말했다. 하면 됩니다. 요금 인상으로 거둔 추가 재원을 상수도 시설과 기술 “현재 누수 탐지 및 노후 상수관 유지 보수에 활용하고 있는 상수도 에 투자할 계획이라는 점을 중점적으로 홍보했는데요. 그래서인지 블록 시스템은 수돗물 공급에 필요한 관망 체계를 대·중·소블록으 부산 시민들이 상수도 요금 인상의 필요성과 재원 활용 계획에 많 로 구역화하고, 각 블록에 유량계 및 센서를 부착하게 돼 있는데요. 은 공감을 보내 주셨고, 별 탈 없이 요금 인상안이 정착됐습니다.” 누수가 발생하면 수집한 블록 데이터를 바탕으로 먼저 누수가 일어 나는 블록을 파악하고, 지역을 점점 좁혀 들어가는 방식으로 정확 첨단 기술로 모색하는 상수도 생산성 향상 방안 한 누수 지점을 찾습니다. 현재는 소블록 중심으로 데이터를 수집 수돗물은 시민 삶의 질과 직결되는 중요한 공공재다. 부산시 상수 하고 있으나, 이를 대블록까지 확대하고 개발 시기나 건축물 준공 도사업본부는 이런 측면을 십분 고려해 요금 인상률을 최소화했다. 연도 등 다양한 정보를 함께 분석하면 누수 예측과 선제 대응이 가 그러다 보니 2026년까지 계획대로 요금을 인상하더라도 여전히 능하다고 봅니다.” 생산원가가 수도 요금보다 높은 상황이 이어진다. 당장 한숨 돌릴 김병기 본부장은 2002년부터 12년간 뉴욕시장을 지낸 마이클 블 수 있게 됐지만, 앞으로도 누적될 손실은 어떻게 보전할 수 있을까. 룸버그가 구축한 화재 예측 시스템을 예로 들었다. 블룸버그 시장 김병기 본부장은 인공지능(AI)과 빅데이터 기반 통합 플랫폼 등 이 취임 직후 뉴욕에서는 많은 화재가 발생했다. 소방 책임자들은 노 른바 ‘첨단 기술’을 해답의 키워드로 제시했다. 후화된 건물이 많고 인력이 부족해 화재 예방 활동에 한계가 있다"}, {"p": 29, "t": "수돗물은 시민 삶의 질과 직결되는 중요한 공공재다. 부산시 상수도사업본부는 이런 측면을 십분 고려해 요금 인상률을 최소화했다. 고 답했다. 블룸버그 시장은 과거에 화재가 발생했던 건물의 데이 인데요. 우리 본부는 앞으로도 상수도와 첨단 기술을 접붙여서 보 터를 광범위하게 수집했다. 건물의 준공 연도, 구조 형태(목조·콘크 다 나은 상수도 운영 성과를 창출하는 데 힘쓸 계획입니다.” 리트), 소유주와 거주자 정보, 위치 등 세부 자료를 분석한 결과 화 한편 부산시 상수도사업본부는 취수원 다변화도 모색하고 있다. 취 재 취약 건물의 패턴을 발견했다. 이에 블룸버그 시장은 화재 취약 수량의 90%를 낙동강에 의지하고 있는 데다가 비상 급수원도 회 건물에 소방대원을 집중적으로 보내 안전진단과 예방활동을 시행 동저수지 하나뿐이다 보니 기후변화, 수질오염 등으로 인한 대응력 했다. 그 결과 블룸버그 시장 재임 중 뉴욕시의 화재 건수는 종전의 이 취약할 수밖에 없는데, 이런 한계를 극복하기 위해 경상남도 등 절반 이하로 줄었다. 인근 지자체와 협의해 추가 취수원을 다수 확보하는 방안을 적극적 “AI 기반 빅데이터 수집 및 분석 시스템이 고도화됐기에 블룸버그 으로 논의 중이다. 시장의 사례를 교훈 삼아 누수 관련 데이터를 폭넓게 모으고 연관 “이와 함께 물금취수장 인근에 심층 취수탑을 건설해 표층 유해 조 성을 파악한다면 상수도관 및 누수 관리의 효율성을 극대화할 수 류가 90% 이상 줄어든 심층부의 깨끗한 물을 취수하는 사업, 기장 있습니다. 이렇게 되면 자연스럽게 운영에 드는 시간과 비용이 줄 군에 11년째 방치돼 있던 해수담수화시설을 활용해 하수를 정수한 어들 것이고, 수도 요금을 적게 받아도 적자가 나지 않는 상황을 만 뒤 동부산 지역 산업단지에 공업용수로 공급하는 프로젝트, 최근 들 수 있을 거라고 확신합니다.” 이슈로 떠오른 미량오염물질 제거를 위한 대용량 막여과공정 도입 검토 등을 속도감 있게 추진하고 있는데요. 이처럼 다방면에 걸친 다각적 사업으로 여는 상수도의 지속 가능성 상수도 사업을 진행함으로써 부산 상수도의 지속 가능성을 확보하 부산시 상수도사업본부는 지난 2007년 취수장에서부터 가정 내 고, 부산 시민에게 깨끗한 수돗물을 끊임없이 공급하는 게 우리 본 수도꼭지까지의 전 공정 데이터를 모니터링 및 관리할 수 있는 ‘물 부의 궁극적인 목표입니다.” 공급운영시스템’을 구축해 상수도 운영에 활용하고 있다. 이 같은 부산시는 내년 3월 열릴 ‘2026 워터코리아’의 개최지다. 이에 따라 성공적 경험이 있는 만큼 김병기 본부장이 언급한 AI 기반 빅데이 부산시 상수도사업본부는 야심 차게 추진하고 있는 각종 사업과 관 터 수집 및 분석 플랫폼 구축도 충분히 실현 가능한 과제다. 실제로 련 기자재를 홍보하는 특별관을 운영하고, 물 산업 분야 취업박람 부산시 상수도사업본부는 상수도관 디지털 데이터 플랫폼 개발을 회를 함께 개최하는 등 ‘2026 워터코리아’의 성공을 위해 다각적 지 환경부 등 정부 부처 및 유관기관과 협의 중이다. 원을 아끼지 않을 방침이다. 아울러 지금껏 해 온 것처럼 한국상하 “관내 상수도관망과 똑같은 가상의 상수도관망을 개발해 시뮬레이 수도협회 및 회원사와 적극적으로 협업함으로써 부산시, 나아가 대 션을 수행하고, 효과적인 결과를 실제 운영에 반영하는 디지털 트 한민국의 상수도 산업 발전에 일조하겠다고 강조한 김병기 본부장. 윈(Digital Twin) 프로젝트도 추진하고 있습니다. 현재 수행 중인 ‘부 그가 설계한 청사진이 부산 상수도의 새로운 미래로 자리 잡고, 더 산 상수도관망 디지털 트윈 구축 계획 수립 연구용역’이 그 첫걸음 나아가 전국 물 관리 혁신의 이정표가 되기를 기대한다. Vol. 96 2025 가을호"}]}, {"id": "96-30", "no": 96, "label": "2025 가을호", "corner": "회원 소식", "title": "회원 소식", "author": "", "start": 30, "end": 33, "pages": [{"p": 30, "t": "WE WORK | 회원 소식 정부 환경부 환경부 강릉 가뭄 현장 점검 수돗물 안전 위해 정수장 102곳 점검 환경부는 8월 22일 강릉 오봉저수지를 방문해 심각한 가뭄 상황을 환경부는 지난 5월부터 한 달간 전국 102곳 정수장의 녹조 대응 체 점검하고 지자체의 대응 현황을 확인했다. 현장에는 물관리정책 계를 점검한 결과, 대부분 시설이 기준을 충족했다고 밝혔다. 이번 실, 원주지방환경청, 한국농어촌공사 등 관계 기관이 함께했다. 점검은 여름철 녹조 발생 위험에 대비해 추진됐다. 강릉시는 계량기 잠금 제한급수, 공공시설 수압 조절, 수영장 휴관, 주요 점검 항목에는 취수원 조류차단막 설치, 중염소·고도처리 설 응원급수 협력, 민방위 급수시설 가동 등 다양한 절수 조치를 이미 비 운영, 분말활성탄 비축, 비상 대응 체계 구축, 조류독소 및 냄새 시행 중이다. 현재 하루 3만7천 톤의 원수를 확보해 생활용수 공급 물질 감시 활동 등이 포함됐다. 점검 결과, 일부 정수장은 개선이 필 을 유지하고 있다. 요했으나 대다수 시설은 양호한 준비 상태였다. 또한 시는 송수관로 복선화, 하수처리수 재이용사업 국가계획 반 환경부는 추가로 7월 9일 한국수자원공사 인재개발원에서 모의훈 영, 운반급수 예산 지원 등을 장기 대책으로 건의했다. 환경부는 지 련과 학술 세미나를 열어 실제 상황 대응 절차를 점검했다. 이를 통 자체가 신속히 시행하는 긴급 조치와 병행해 보다 실질적인 중앙 해 전국 정수장 운영자들의 현장 대응 역량 강화를 지원하고 있다. 정부의 추가 지원 방안을 검토할 예정이다. 환경부 환경부 ‘2024 수문조사연보’ 발간 연내 녹조 종합대책 마련 환경부는 7월 31일 ‘2024 한국수문조사연보’를 발간했다고 밝혔다. 환경부는 8월 19일 정부세종청사에서 열린 정책 브리핑에서 연말 이번 연보에는 전국 2,349곳에서 수집한 수위·유량·강수량 등 주요 까지 녹조 종합대책을 수립하겠다고 발표했다. 최근 기후위기 심 수문자료가 항목별로 세분화돼 체계적으로 수록됐다. 화로 낙동강 등 주요 수계에서 녹조 문제가 심각해지고 있으며, 이 특히 최근 기후변화로 인해 빈번해진 국지성 호우와 집중호우에 보 에 따른 수질 악화와 생태계 교란 우려도 커지고 있다. 다 신속하고 과학적으로 대응하기 위해 새로 설치된 수위관측소 144 개선안의 핵심은 조류경보제 개편으로, 채수 위치를 취수구 인근 곳과 유량관측지점 44곳의 최신 자료가 새롭게 포함됐다. 이를 통해 으로 조정하고 분석·경보 발령을 당일 처리하는 방식으로 전환하 기존 대규모 하천뿐 아니라 중소규모 지류하천까지 정밀한 관측과 는 것이다. 또한 조류독소 농도를 경보 기준에 반영하기 위해 관련 분석이 가능해지면서 홍수 예·경보의 정확도도 높아질 전망이다. 법령 개정도 추진된다. 환경부는 올해 AI 기반 홍수예보 지점을 223곳으로 확대하고, 수 아울러 가축분뇨 자원화, 비점오염 저감시설 확충, 하수처리장 방 위·유량 관측망도 단계적으로 보강할 계획이다. 또한 제2차 수문조 류수 기준 강화 등 근본적인 오염원 저감책이 포함된다. 환경부는 사기본계획에 따라 전국 수문 데이터 관리체계를 고도화하고, 예 농산물·공기·수질 등 매체별 녹조 모니터링을 강화해 다각적 대응 측·분석 역량을 강화해 물재해 대응과 국민 안전을 높일 방침이다. 체계를 구축할 계획이다."}, {"p": 31, "t": "지자체 울산시 고양시 도로·하수관 병행 시공으로 26억 절감 주교 배수지 증설로 물 공급 강화 울산시는 도로 확·포장공사와 하수관로 공사를 병행 시행해 예산 고양특례시는 재개발로 늘어나는 물 수요에 대비해 주교배수지를 절감과 시민 불편 해소 효과를 거두었다. 강동~방어진 하수처리시 증설하고 송수관로 복선화 사업을 추진하고 있다. 설 연계관로 총 13km 중 5.4km가 도로사업과 겹쳐 재굴착이 불가 배수지는 기존 2,800㎥에서 7,200㎥로 확대되며, 총 485억 원을 피했으나 병행 시공으로 문제를 해결했다. 투입해 2028년 준공을 목표로 진행 중이다. 시는 안정적인 상수도 이 과정에서 도로 복구비 26억 원을 절감했으며, 공사 하자 구분이 공급망을 마련하고, 하수관 분류식 전환을 병행해 수질 개선과 악 명확해지고 구조 훼손 예방도 가능해졌다. 또한 종합건설본부가 취 해소에도 힘쓰고 있다. 하수도 특별회계 집행 권한을 갖도록 조례를 개정해 보다 안정적 또한 국도비를 확보해 사업 속도를 높이고, 노후 송수관로 복선화 이고 효율적인 협업 기반을 구축했다. 를 통해 단수 없는 공급 체계를 구축하고 있다. 이번 사업은 주교동 시는 이번 경험을 향후 다른 도로·하수관 사업에도 적용해 예산 효 을 시작으로 고양 전역으로 확대될 예정이며, 지역 생활환경 개선 율성과 사업 관리 개선에 활용할 방침이다. 과 주민 편익 증진에 기여할 것으로 기대된다. 전주시 경주시 노후 수도관 교체로 3,600세대 지원 APEC 앞두고 하수처리장 새 단장 전주시는 안전하고 깨끗한 수돗물 공급을 위해 올해 총 5억 9천만 경주시는 APEC 정상회의를 앞두고 해외 대표단을 맞이하기 위해 원을 투입해 3,676세대의 노후 급수관 교체를 지원한다. 지원 대상 공공하수처리장 환경정비와 홍보관 리모델링을 완료했다. 이번 정 은 공동주택과 단독주택, 다가구주택, 사회복지시설 등으로 폭넓 비는 단순한 처리시설을 넘어 친환경 물 환경 홍보공간으로 기능 게 포함되며, 특히 기초생활수급자는 전액 지원을 받을 수 있어 취 을 확대하려는 목적에서 추진됐다. 약계층의 부담을 덜어줄 전망이다. 홍보관 외벽에는 ‘APEC, 물과 화합’을 주제로 벽화를 시공했으며, 시는 2010년부터 옥내급수설비 지원사업을 꾸준히 추진해 지금 내부에는 GK-SBR 기술을 활용한 아담한 식물정원이 조성됐다. 탐 까지 총 94개 단지와 시설의 개선을 완료했으며, 지난해에도 1,887 방로 정비와 어류 관찰데크, 비즈니스실 리모델링도 함께 마쳐 해 세대를 대상으로 사업을 진행해 시민의 생활환경 개선과 수돗물 외 대표단 방문에 차질이 없도록 대비했다. 신뢰도 제고에 크게 기여했다. 경주시는 이번 행사를 계기로 남미 지역 진출을 본격적으로 모색 앞으로는 국비 확보와 자체 예산 확대를 통해 더 많은 세대가 혜택 하고, 동시에 글로벌 친환경 물도시로서의 위상과 브랜드 이미지 을 받을 수 있도록 사업을 지속 추진하고, 안전한 급수 기반을 확립 를 한층 더 높일 것으로 기대하고 있다. 해 쾌적하고 건강한 주거환경 조성에도 힘쓸 방침이다. Vol. 96 2025 가을호"}, {"p": 32, "t": "기업·단체 부강테크·케이에이디 감염병 대응형 하수처리장 개발 K-water 전사 AI 전환 추진 물산업협의회 혁신형 물기업 스케일업 지원 부강테크와 케이에이디는 세계 최초로 감 한국수자원공사는 물관리 전 분야의 AI 전 한국물산업협의회는 ‘혁신형 물기업 플러 염병 대응과 에너지 자립을 동시에 실현할 환 전략을 확정하고 2027년까지 클라우드 스’ 제도를 신설해 성과 우수 기업의 글로벌 수 있는 하수처리장 개발에 착수했다. 이번 기반 데이터 허브를 구축한다. 이를 통해 방 강소기업 도약을 체계적으로 지원한다. 이 사업은 ‘투모로우 워터 프로젝트’를 기반으 대한 물 데이터를 실시간으로 관리·활용할 제도는 기존 졸업 기업을 대상으로 상장 준 로 도시 보건·환경 인프라를 혁신하는 것을 수 있는 지능형 물관리 체계로 발전시킬 계 비, 기술 고도화, 해외 판로 개척을 패키지 목표로 한다. 개발 중인 ‘Co-Flow Campus’ 획이다. 로 지원하는 것이 특징이다. 모델은 하수 속 유기물을 활용해 에너지를 AI 기술은 ▲수질 예측 ▲누수 탐지 ▲정수 혁신형 물기업 지정제도는 2020년 시작돼 생산하고, 질소·인을 농업용 자원으로 전환 장 자동화 ▲산업용수 수요 예측 등 전 영역 현재 60개 사가 참여 중이며, 기업당 최대 하며, 처리수는 데이터센터나 SMR 냉각수 에 적용된다. 이를 통해 국민 생활과 직결된 5년간 5억 원 규모의 지원을 받는다. 제1기 로 공급한다. 여기에 케이에이디의 하수 기 물관리 효율성을 높이고, 물재해 대응력을 기업들은 매출 43%, 수출 102%, 특허 118 반 감염병 감시 기술이 더해져 도시 전역의 강화할 방침이다. 건 증가 등 뚜렷한 성과를 거두며 우수한 성 감염병 추적이 가능하다. 또한 수열·수력·수상태양광 등 물 기반 재 장 잠재력을 입증했다. 이 모델은 운영비를 자체 충당할 수 있는 구 생에너지를 확대해 RE100 달성과 지역 상 협의회는 전시회 참가와 기술 실증, 해외 시 조를 갖춰 하수도 보급률이 낮은 개발도상 생형 ESG 경영을 실현한다. 해외사업에도 장 공동개척을 확대해 기업의 수출 경쟁력 국에서도 적용 가능성이 높다. 한국형 스마 AI 모델을 적용해 물관리 컨설팅을 제공하 을 높이고, 국내 중소 물기업의 글로벌 시장 트 인프라의 해외 확산에도 중요한 역할이 고 글로벌 물시장에서 경쟁력을 강화할 예 진출을 적극 지원할 계획이다. 기대된다. 정이다."}, {"p": 33, "t": "Watch on 지구를 생각하는 사람들 정주희 기후캐스터 칭찬합시다 안산시 상하수도사업소 안양시 상하수도사업소 지구별 수(水)다 물 스트레스 시대, 메가시티의 지속가능한 해법은 무엇인가? 물 리포트 맑은 물을 위한 국내외 산업 톺아보기 Vol. 96 2025 가을호"}]}, {"id": "96-34", "no": 96, "label": "2025 가을호", "corner": "지구를 생각하는 사람들", "title": "정주희 기후캐스터", "author": "", "start": 34, "end": 37, "pages": [{"p": 34, "t": "WATCH ON | 지구를 생각하는 사람들 기후에 마음을 더하다 날씨는 잠시 머무는 풍경이지만, 기후는 세대를 건너 남는 기록이다. 유일무이한 기후캐스터 정주희는 ‘날씨’에서 ‘기후’로, 그리고 ‘정보 전달자’에서 ‘함께 행동하는 사람’으로 자신의 역할을 확장했다. 길가의 쓰레기를 그냥 지나치지 않고, 다회용기를 가방에 가지고 다니는 일상. 그 안에서 ‘기후와 환경을 말하는 삶’을 살아가는 중이다. 거창한 선언보다 작은 실천으로, 큰 보폭 대신 꾸준한 걸음으로 변화를 만들어가고 있다. 가르치려 기상캐스터에서 기후캐스터로, 정주희 하지 않고, 강요하지 않으며, 다만 자신의 방식으로 ‘기후캐스터의 길’을 가고 있는 그녀의 이야기를 들어본다. 글 박향아 | 사진 조인기 Q. 독자들에게 간단한 자기소개 부탁드립니다. Q. ‘기후캐스터’라는 수식어는 어떤 의미인가요? 안녕하세요. 저는 지난 7년간(2014~2020) SBS에서 기상캐스터로 활동 ‘기후캐스터’라는 말은 제가 만든 저만의 정체성입니다. 제가 활동했던 기 했습니다. 지금은 ‘기후캐스터’로서 기후·환경 분야의 장벽을 낮추기 위 상캐스터 분야를 비롯해 스포츠·교통·증권 등 여러 분야에 캐스터가 있 해 SNS에 짧은 영상을 올리고, 글을 쓰며, 이따금 강연으로 시민들을 만나 듯, 기후도 일상에 닿는 언어로 좀 더 쉽고 직관적으로 '우리가 할 수 있는 고 있습니다. 한때는 “오늘은 비가 오겠습니다”라고 전하던 사람이었지 일'을 전하는 사람이 필요하다고 생각했습니다. 만, 이제는 생활 속에서 기후를 이해하고 행동으로 옮길 수 있는 구체적인 많은 채널이 기후위기의 심각성만 강조하지만, 저는 그럼에도 불구하고 방법들을 알리고, 독자들이 스스로 해볼 만한 실천을 찾도록 돕는 역할을 우리가 당장 할 수 있는 일에 초점을 맞춥니다. 전문가가 아니어도 일상 하고 있습니다. 그것이 지금의 저입니다. 에서 쉽게 실천할 수 있는 방법을 소개하고, 일상 언어로 기후 이야기를 쉽게 풀어주는 가교(징검다리) 역할을 하는 것, 그것이 제가 말하는 ‘기후 Q. 기후캐스터로 전환하게 된 계기와 그 과정에서 얻게 된 캐스터’이며, 기후·환경의 장벽을 낮추는 일이 제 소임입니다. 깨달음은 무엇이었나요? 2020년 9월에 아이를 낳고, 출산 전부터 복직 의사를 회사에 알렸지만 Q. 콘텐츠를 기획하고 제작할 때 가장 중요하게 생각하는 받아들여지지 않았습니다. 사실 그전에는 출산 후 복귀한 선배가 없었고, 부분은 무엇인가요? 시대가 바뀌었기에 제가 새로운 선례를 만들고 싶었는데 현실은 달랐습 저는 세 가지를 기준으로 삼아요. 공감할 수 있을 것, 실천으로 이어질 것, 니다. 당시엔 방송이 전부라고 생각했기에 절망했지만, 돌이켜보면 그 경 그리고 유쾌할 것. 기후 위기는 결국 데이터가 아니라 삶의 문제잖아요. 그 험이 새로운 길을 여는 계기가 되었습니다. 래서 저는 어려운 용어나 공포 대신 익숙한 언어, 일상의 사례, 그리고 약간 크고 작은 방송국을 거치며 12년간 방송만 바라보던 저는 ‘앞으로 어떻게 의 유머를 더해 이야기하려 합니다. 사람들이 “나도 할 수 있겠다”고 느끼 살 것인가?’라는 질문을 던졌고, 그 답을 찾는 과정에서 기후·환경 분야를 는 순간, 기후 이야기는 자기 이야기가 되고 실천의 문턱도 훨씬 낮아지거 만났습니다. 기상캐스터 시절에는 매일의 날씨를 전했다면, 지금은 날씨 든요. 저는 “당신은 왜 실천하지 않나요?”라고 묻기보다 “저는 이렇게 해요. 너머의 이야기를 전합니다. 그래서 스스로를 “기후에 마음을 더하는 사 이렇게도 할 수 있어요.”, “이런 것도 있어요.”를 먼저 보여줍니다. 그러면 사 람”이라 정의하고, 화려하지 않아도 꼭 필요한 일을 묵묵히 해내는 것, 그 람들이 “오~ 이런 방법도 있구나.”, “이렇게도 생각해 볼 수 있구나.”라고 생 것이 제 소명이라고 생각합니다. 각해 보게 되죠. 그 변화를 순간을 만드는 것. 그게 제 콘텐츠의 핵심입니다."}, {"p": 36, "t": "Q. 평소 실천하는 친환경 루틴은 무엇인가요? 구체적인 사례를 예를 들면 온 가족 외출 시 텀블러 3개를 챙기는 모습을 보여주고, 배달 대 들려주세요. 신 직접 가서 다회용기에 담아달라고 하는 모습을 보여주고, 제가 먼저 “여 저희 집 현관에는 “아 맞다, 텀블러”라는 포스트잇이 붙어 있어요. 이제 텀 기 쓰레기가 있다!” 하고 주우면 아이도 자연스레 줍더라고요. 나중에 저보 블러는 핸드폰처럼 반드시 챙기는 물건이 됐습니다. 강연이나 인터뷰, 행 다 제 아들이 더 훌륭한 친환경 리더가 되지 않을까 하는 생각도 해봅니다. 사 진행 같은 중요한 일정에 제가 늘 입는 연두색 셔츠가 있어요. 예전에 “흰 면 티셔츠 한 장을 만드는 데 2,700ℓ의 물이 든다”는 사실을 알고 나 Q. 직접 운영 중인 플로깅 모임 ‘정주는 운줍깅’은 어떤 활동을 서 옷 소비 습관을 돌아보게 됐고, 반성의 마음으로 그 셔츠를 4년째 입고 하는 모임인가요? 있죠. 처음엔 환경을 위한 선택이었는데 시간이 지나면서 “오늘 뭐 입지?” 우선 ‘정주는 운줍깅’을 만든 계기부터 이야기해 볼까요? 기후 위기를 공 라는 고민도 줄고, 제 이미지에도 자연스럽게 녹아들었어요. 요즘은 자기 부하고, 환경 모임에 나가고, 관련 계정을 팔로우하며 2년을 보내면서 느 다움이 중요한 시대잖아요. 저는 “좋아하는 하나의 색을 정해 반복해서 낀 건 “왜 이렇게 환경은 그들만의 리그처럼 느껴질까?”였습니다. 우리 모 입는 것”이 자신을 표현하면서도 환경을 지키는 좋은 방법이 될 수 있다 두가 지구를 공유하고 책임이 있는데, 왜 하는 사람만 하고 안 하는 사람 고 생각해요. 은 안 할까? 이 질문을 품고 있다가 방송 경험과 크리에이터 활동을 연결 하기로 했습니다. 방송인·크리에이터 지인들을 특별 게스트로 초대하면 Q. 기후 실천을 ‘강요’ 대신 ‘선택지 제시’로 접근하시는 이유와 그들의 팬들까지 환경 실천의 장에 들어올 수 있겠다는 생각이 들었거든 방식은 무엇인가요? 요. 그렇게 너무 덥거나 추운 달을 제외하고 매달 한 번씩 진행하고 있습 기후 실천은 정답이 하나가 아니에요. 각자의 상황도 다르고요. 그래서 저 니다. ‘운줍깅’이라는 이름은 오타니 쇼헤이 선수의 말에서 영감을 받았습 는 실천을 강요하기보다 선택지를 보여주는 방식으로 접근하려고 해요. 어 니다. “쓰레기는 남이 무심코 버린 운(運)이다.” 저 역시 쓰레기를 줍다 보 떤 분은 손수건 쓰기가 익숙할 수 있고, 어떤 분은 자가용 대신 대중교통을 면 정말 ‘운’이 따라오는 순간들이 있다고 믿습니다. 이용하는 게 더 쉬울 수 있어요. 각자의 속도와 방식이 존중받는 분위기에 서야 실천이 오래 지속될 수 있다고 믿습니다. 기후 위기를 이야기할 때 가 Q. ‘정주는 운줍깅’ 활동을 하면서 가장 기억에 남는 순간과 장 조심해야 하는 건 ‘불편함을 감수해야 한다’는 압박이에요. 그 벽을 낮추 그로 인한 변화는 무엇인가요? 는 게 저의 역할이라고 생각합니다. 그래서 아이에게도 친환경을 가르치기 가장 기억에 남는 건 지난 6월, 독일대사관에서 먼저 연락을 주셨을 때입 보다는 생활 속에서 제 모습을 보여주고 있어요. 니다. 의도치 않게 ‘글로벌 운줍깅’이 된 거죠. 운줍깅은 단순히 쓰레기만"}, {"p": 37, "t": "줍는 활동이 아닙니다. 줍깅 전에 환경 강연을 하고, 강연 내용을 토대로 Q. 기후변화와 물순환이 맞물리는 지점에서 도심 홍수나 친환경 퀴즈를 내고, 맞히면 친환경 선물을 드리는데요. 6월에는 독일대 가뭄을 겪으며 물 환경의 중요성을 절감한 사례가 있나요? 사관과 함께한 행사였기에 제가 독일의 환경 정책을 직접 공부했고, 그 내 2025년 7월 17일, 경남 산청에 하루 413mm, 13~20일 누적 700mm가 용을 강연에 풀어냈습니다. 한국과 독일의 정책을 비교하며 서로의 장점 넘는 비가 쏟아졌습니다. 광주와 서산도 500mm 이상을 기록했고요. 1년 과 보완점을 이야기할 수 있었고, 이렇게 깊이 있는 대화를 나눌 수 있다 강수량의 절반이 며칠 만에 내려서 ‘괴물 폭우’라고 불렸습니다. 이런 폭 는 게 참 좋았습니다. 우는 주변 인프라를 마비시키고 농작물 생장을 어렵게 할 수밖에 없잖아 요. 반대로 비가 너무 오지 않아 가뭄이 극심해지는 경우도 마찬가지입니 정주희의 ‘지구를 사랑하는’ 소소한 습관 다. 채소 가격이 치솟는 걸 볼 때마다 물 환경이 우리의 식탁과 직결되어 있음을 늘 실감합니다. 일상 속 작고 귀여운 실천이 기후를 바꾼다! Q. 기후 불안·우울을 겪는 시민들에게 방송인이자 활동가로서 어떤 메시지를 전하고 싶으신가요? “나 하나 바꾼다고 뭐가 달라지나”라는 마음, 저도 잘 압니다. 하지만 매일 의 실망은 희망을 잠식해 버린다고 하죠. 인간은 희망이 없을 때 살아갈 수 없다고 합니다. 저는 그럴 때 연대의 힘을 떠올립니다. 아이 키우기도 버거 운데도 운줍깅을 계속하는 이유는 함께할 때 생기는 힘 때문입니다. 운줍 01 “아, 맞다! 텀블러!” 텀블러를 깜빡하지 않으려고 현관문 앞에 포스트잇을 붙여 두었죠. 이 한 문장이 저 를 다시 돌아보게 하죠. 환경 실천은 결국 습관이니까요. 02 중요한 일정에 같은 옷 = 퍼스널 브랜딩 브랜딩은 기업뿐 아니라 개인에게도 해당되잖아요. 특히 요즘은 ‘퍼스널 브랜딩’의 시대이고, 그럴 때 컬러로 자신을 표현하는 방 법이 가장 효과적이라고 생각합니다. 블랙 목폴라 하면 스티브 잡 스가 떠오르듯, 저에게는 연두색 셔츠가 저를 표현하는 상징이 되 었거든요. 독자 여러분은 어떤 컬러로 자신을 표현하시겠어요? 깅에 다녀간 분들이 “마음이 가벼워졌다”, “이런 대화를 하고 싶었다”, “희 망을 느꼈다”고 할 때 저 역시 에너지를 얻습니다. 기후 위기라는 거대한 문제도 사람과 사람을 잇는 연결 속에서 버틸 힘이 생긴다고 믿습니다. Q. 앞으로 준비 중인 목표나 프로젝트는 무엇인가요? 8월 10일, 정주는 운줍깅 여름방학 실내 프로그램으로 ‘기후프레스크’ 워 크숍을 열며 퍼실리테이터로 데뷔했어요. ‘기후프레스크’는 기후변화의 원인과 결과를 카드로 배열하는 게임형 워크숍으로, 참여자들이 지루하 지 않게 기후 지식을 익힐 수 있어 “유익했다”는 피드백을 받았습니다. 퍼 실리테이터로 첫걸음을 뗀 만큼 앞으로도 시간과 기회가 닿는 대로 활동 03 쓰레기는 다른 사람이 무심코 버린 ‘운’이다 혼자서 쓰레기를 줍는 것도 좋지만, 함께라면 더 유쾌해요. 매달 한 번, 함께 모여 쓰레기를 주우며 환경을 지키고 동시에 행운을 나누는 모임 ‘정주는 운줍깅’을 운영 중이에요. 쓰레기를 줍는 작 은 실천이 가져다줄 ‘행운’을 경험해 보세요. 을 이어갈 계획입니다. 콘텐츠 측면에서는 ‘기후변화가 어려운 이유’ 시리즈를 준비 중인데, 용어 편과 행동 편 등으로 나눠 제작할 예정입니다. 더불어 환경 실천을 하며 느낀 점을 담은 에세이도 집필 중입니다. 내년 하반기 출간을 목표로 하 고 있지만, 일정이 늦어지면 내후년이 될 수도 있습니다. Q. 정주희 기후캐스터가 그리고 있는 ‘미래의 지구’는 어떤 모습인가요? 카페에서 일회용컵을 달라고 하면 직원이 당황하고, 주변 사람들이 이상 하게 쳐다보는 사회였으면 좋겠어요. 일회용컵이 ‘예외’가 되는 세상! 누 구나 기후 이야기를 일상처럼 나누고, 지구를 위한 행동이 ‘특별함’이 아 니라 ‘당연함’이 되는 세상. 그게 제가 바라는 미래예요. Vol. 96 2025 가을호"}]}, {"id": "96-38", "no": 96, "label": "2025 가을호", "corner": "칭찬합시다", "title": "안산시 상하수도사업소 · 안양시 상하수도사업소", "author": "", "start": 38, "end": 39, "pages": [{"p": 38, "t": "WATCH ON | 칭찬합시다 안산시 상하수도사업소 ‘물 전문가’ 확보로 수돗물 안전을 지키다 글 편집실 | 사진 안산시/안양시 결론은 ‘사람’ 부여가 어렵다고 지적하며, “힘들게 취득해도 알아주지 않는다”는 인식 깨끗하고 안전한 수돗물의 안정적 공급은 모든 상수도 사업자의 최우선 대신 “자격 취득은 개인의 성장이며 조직의 경쟁력”이라는 공감대 확산 과제이며, 「수도법」이 ‘정수시설운영관리사’ 배치를 의무화한 이유이기도 이 필요하다고 제안했다. 또한 명확한 인센티브로 참여를 유도하면 법적 하다. 법은 정수시설 규모에 따라 자격을 갖춘 전문가를 배치하도록 규정 기준 충족은 물론, 장기적으로 정수장의 전문 인력 저변 확대라는 목표도 해 수돗물 생산의 전문성과 책임성을 높이고 있다. 달성할 수 있다고 덧붙였다. 안산시 상하수도사업소는 이를 단순한 규제 준수가 아닌 신뢰를 높일 기 이러한 노력은 가시적 성과로 이어졌다. 2021~2023년 총 7명의 자격 취 회로 받아들였다. 법적 최소 기준을 채우는 소극적 대응을 넘어 법의 취 득자를 배출했고, 2024년 한 해에만 1급 4명, 2급 3명 등 총 9명이 자격을 지인 ‘수돗물 신뢰도 향상’을 어떻게 현실화할지 깊이 고민했다. 취득했다. 이는 단순한 수치가 아니라, 안산시가 전문 인력 양성에 지속적 고민한 결론은 ‘사람에 대한 선제적이고 체계적인 투자’였다. 정수장의 최 이고 체계적으로 투자해 왔음을 보여준다. 신 설비를 운영하고 수질을 최종적으로 책임지는 주제는 고도의 전문성 시민이 언제나 안심하고 수돗물을 마실 수 있도록 보이지 않는 곳에서 전 을 갖춘 ‘사람’이라는 인식에서다. 최고의 물 전문가를 직접 양성하고 지 문가 양성에 힘쓰는 안산시 상하수도사업소. 최신 설비와 이를 운영하는 원하는 것이 시민 불안을 해소하고 수돗물에 대한 믿음을 높이는 가장 확 전문 인력이 함께할 때 비로소 완벽한 물 안전이 구현된다. 안산시의 선 실한 길이라고 판단했다. 진적 인재 관리 시스템은 타 지자체에도 좋은 본보기가 되고 있으며, 대한 민국 수돗물의 신뢰도를 높이는 중요한 계기가 될 것으로 기대된다. 전문가 확보를 위한 다각도의 노력 안산시는 이 같은 결론을 실행으로 옮겼다. 우선 외부 인력 확보를 위해 2019년과 2020년에 신규 자격자를 채용했고, 내부적으로는 기존 자격 보유자를 적재적소에 재배치했다. 정수과 전문 강사를 초빙해 상시 교육 안산시 상수도 관리 사례 POINT 을 실시하고, 자격 보유자를 잦은 순환보직에서 제외하는 ‘전문관 제도’를 01 수돗물 유충 제로화를 위한 큐브형 다중여과망 설치 도입해 현장 전문성을 강화했다. 02 정수시설운영관리사 자격 취득 활성화 특히 ‘자격증 취득 활성화 계획’은 한 직원의 경험과 문제의식에서 출발했 03 VR 체험 특성화 등 견학프로그램 고도화로 교육효과 제고 다. 제안자는 자격 취득이 개인의 몫으로만 여겨지는 분위기에서는 동기"}, {"p": 39, "t": "안양시 상하수도사업소 에너지 자립률 51%, 친환경 하수처리 선도 에너지 자립률 51%, 친환경 하수처리 선도 였다. 개선 제안에 대한 인센티브를 마련해 직원 참여를 촉진하여 설비 안정적 하수처리는 도시 위생의 최전선이자 막대한 에너지를 소모하는 개선과 운전 최적화가 지속 가능하도록 체계를 고도화했다. 공공 서비스다. 기후위기와 전력비 상승이 겹치면서 공공하수처리시설 성과는 분명했다. LNG 사용량을 기존 대비 약 80% 줄였고, 공공하수도 의 에너지 자립과 탄소중립 전환은 더 이상 선택이 아닌 과제가 되었다. 운영관리 실태평가 탄소중립 분야에서 에너지 자립률 51%를 달성해 만 안양시는 이 과제를 현장 혁신으로 풀어내며 지속가능 운영의 표준을 모 점을 받았다. 그 결과 공공하수처리시설 전국 최우수에 선정되는 등 모범 색했다. 안양시 광역공공하수처리시설은 수도권 서남부 5개 도시, 약 95 사례로 평가받았으며, 탄소중립 시대를 선도하는 지자체로서의 위상과 만 명이 배출하는 하루 55만 톤의 하수를 처리하는 국가 규모 기반시설이 책임을 한층 더 공고히 했다. 다. 1992년 가동을 시작해 수도권 생활환경을 지탱하는 버팀목 역할을 해 이 성과는 단발성 기술 도입의 결과가 아니다. 침수·안전사고 예방, 악취 왔지만, 방대한 기계·전기 설비의 상시 운전은 필연적으로 대규모 전력 저감, 시설 효율 향상 등에서 축적해 온 상시 개선 노력이 에너지 전환과 소비를 유발했다. 맞물려 나타난 결과다. 에너지 절감을 넘어 지속 가능한 도시환경 조성이 안양시는 해법을 ‘친환경·자립형 운영’에서 찾았다. 외부 에너지 의존을 라는 상위 목표에도 한 걸음 다가섰다. 줄이고, 공정에서 스스로 발생하는 자원을 다시 에너지로 돌려 쓰는 자원 앞으로 안양시는 친환경 하수처리와 에너지 자립 기반을 더욱 강화하고, 순환 체계를 현장에 정착시키겠다는 판단이었다. 결론은 분명했다. 공정 현장 노하우를 공유해 공공하수처리시설의 새로운 표준을 제시하겠다고 에서 나오는 바이오가스를 핵심 동력으로 삼는 것이다. 밝혔다. 이는 타 지자체의 벤치마킹 모델이자 국가 탄소중립 정책의 현장 확산에도 기여할 것으로 기대된다. 에너지 자립을 위한 다각도의 전환 우선 기존 LNG 전용 보일러 체계를 개선해 하수처리 과정에서 발생하는 바이오가스를 연료 병용으로 활용할 수 있도록 설비를 정비했다. 동시에 안양시 하수도 관리 사례 POINT 소화조 가스 회수·저장·정제 공정을 손봐 손실을 줄이고, 열원과 공정 부 01 바이오가스 병용 보일러 도입으로 LNG 사용량 80% 절감 하를 연동하는 운전 최적화를 진행해 효율을 끌어올렸다. 02 공공하수도 운영관리 평가 탄소중립 분야 만점 획득 현장 운영 역량도 함께 강화했다. 에너지 사용량과 자립률을 상시 모니터 03 전국 최우수 공공하수처리시설 선정으로 에너지 자립률 51% 달성 링 지표로 관리하고, 운전 매뉴얼을 업데이트해 계절·부하별 대응력을 높 Vol. 96 2025 가을호"}]}, {"id": "96-40", "no": 96, "label": "2025 가을호", "corner": "지구별 수(水)다", "title": "물 스트레스 시대, 메가시티의 지속가능한 해법은 무엇인가?", "author": "", "start": 40, "end": 43, "pages": [{"p": 40, "t": "WATCH ON | 지구별 수(水)다 W a t e r S t r e s s 기후변화와 도시집중, 노후화된 인프라가 겹치면서 세계 곳곳의 메가시티가 ‘물 스트레스’라는 거대한 도전에 직면하고 있다. 문제는 단순한 물 부족이 아니다. 수요·공급 불균형, 장기 가뭄, 수질 악화, 노후 상수도망 누수가 복합적으로 얽혀 있다. 이제 도시는 단순한 위기 대응을 넘어 정책·기술·사회가 함께 작동하는 통합적 해법을 모색해야 지속가능성을 확보할 수 있다. 메가시티의 물 스트레스 원인과 대응 전략을 살펴보고, 우리에게 필요한 시사점을 짚어본다. 글 강두선(경희대학교 사회기반시스템공학과 교수) 물 스트레스 시대, 메가시티의 지속가능한 해법은 무엇인가? 물 스트레스의 원인 물 스트레스(Water Stress)는 수자원의 가용량이 사회·경제적 수요를 충 분히 충족하지 못하는 상태로, 시기·공간적 불균형까지 포함한다. 메가시 티에서의 물 스트레스는 다음 요인들이 복합적으로 작용하여 발생한다. 첫째, 수요 폭증과 공급 한계가 문제다. 인구와 산업이 밀집된 대도시는 생활·산업·공공용수 수요가 지속적으로 늘어난다. 신규 취수원 확보는 환 경·사회적 제약이 크고, 기존 광역 상수도망 확충에도 한계가 있다. 둘째, 기후변화로 인한 장기 가뭄이 심화되고 있다. 강수 패턴 변화로 특정 계절 에 강수가 집중되고, 건기에는 장기 가뭄이 발생한다. 하천 유량과 댐 저수 율이 급격히 줄어 취수원 안정성이 떨어지며, 일부 도시는 제한급수와 대 체 수원 가동이 불가피해진다. 셋째, 노후 인프라로 인한 누수가 문제다. 오래된 상수도관과 취·정수 시설은 누수율을 높여 공급 효율을 떨어뜨린 다. 국내 일부 지자체의 누수율은 여전히 20%를 웃돌아 확보한 수자원을 제대로 활용하지 못하게 만든다."}, {"p": 42, "t": "나이로비에서 테헤란까지, 수돗물 공급의 경고 정책적 대응방안 아프리카, 아시아, 남미, 중동의 메가시티들은 공통적으로 “물은 있으나 메가시티의 물 스트레스 해소를 위해서는 단기적 위기관리와 함께 장기 시민에게 닿지 않는” 모순을 겪고 있다. 케냐의 수도 나이로비는 파이프 적인 구조 개선이 병행돼야 한다. 2022~2023년 영산강·섬진강 유역의 급수망에 연결된 가구 가운데 약 40%만 24시간 안정적으로 물을 공급 장기 가뭄 사례는 실질적인 대응 방향을 보여준다. 받는다. 저소득층은 사설 급수차에 의존하며, 가계 소득의 큰 비중을 물 광역권 통합물관리 강화: 다목적댐, 발전용댐, 농업용 저수지 등 수자원 값으로 지출한다. 자카르타(인도네시아)는 지하수 남용으로 지반이 매년 을 연계 운영해 급수 안정성을 높였던 사례처럼 메가시티 전역에서도 10cm 이상 침하한다. 침하로 인한 관로 파손과 수질 악화가 반복되고, 상 댐·정수장·관망을 유기적으로 연결해야 한다. 유역 단위 물 배분·조정 기 당수 시민은 여전히 지하수와 민간 급수에 의존한다. ‘누수의 도시’로 불 구를 통해 비상 시 권역 간 물 전환이 가능하도록 네트워크를 구축하는 리는 멕시코시티(멕시코)는 전체 수돗물의 약 40%가 노후 관망에서 사 것이 핵심이다. 라진다. 일부 지역은 하루 몇 시간만 물을 공급받는 ‘시간제 급수’가 일상 수요관리 중심 전환: 절수형 설비 보급, 누수 저감, 재이용수 확대로 물 사 화됐다. 2018년 남아공 케이프타운은 ‘Day Zero(물 공급 중단의 날)’ 위기 용량 자체를 줄여야 한다. 물 사용량에 따른 차등 요금제와 절수 인센티 로 도시 전체가 단수 직전까지 몰렸고, 시민들은 하루 50리터 제한 규정 브 등 경제적 유인책을 병행한다. 속에서 일상을 버텨야 했다. 대체 수원 다변화: 댐, 보, 지하수저류, 해수담수화, 대규모 빗물저류 등 복 최근에는 이란 수도 테헤란을 비롯한 주요 도시들이 심각한 물 부족으로 수 수원을 확보하고, 상황에 따라 신속히 전환한다. 이는 가뭄·수질 악화 단수 조치를 시행했다. 50℃에 육박하는 폭염과 장기 가뭄, 저수지 고갈, 시 대규모 급수 차질을 예방하는 안전판 역할을 한다. 지하수 남용에 따른 지반 침하가 동시에 발생하며, 응급 단수 외에는 뾰 상수원보호구역 해제와 취약성 연계: 상수원보호구역 해제가 지역 개발 족한 해법을 찾지 못하고 있다. 이란 사례는 단일 국가의 위기를 넘어 국 과 수요 증가를 유발해 기존 수원 압박을 키울 수 있다. 외곽 유역 취수원 제사회 전체에 경고음을 울린다. 농업 생산 감소와 산업 차질로 식량·에 이 많은 메가시티는 해당 유역의 수질·수량 변화가 도시 물 스트레스와 너지 안보가 위협받고, 물 자원을 둘러싼 국가 간 분쟁 가능성도 높아진 직결되므로, 상수원보호구역 해제와 같은 개발 정책은 물 스트레스 관리 다. 전문가들은 2025년 전 세계 인구 절반 이상이 물 부족을 겪 을 것으로 전망하는데, 테헤란의 단수는 그 전조로 읽힌다. 계획과 반드시 연계해 검토해야 한다."}, {"p": 43, "t": "정책적 방향, 기술적 실행력, 사회적 참여가 유기적으로 맞물릴 때 대도시는 기후변화와 인구집중이라는 이중 압박 속에서도 안정적인 물 공급망을 유지할 수 있다. 장기계획과 제도 개선: 기후변화 시나리오와 인구 변동을 반영한 20~30 가 많아 해당 유역 주민들과의 이해관계 충돌 가능성이 높다. 유역 간 물 년 단위 물 수급 계획을 수립하고, 「물관리기본법」과 「수도법」을 보완해 이송 조건과 우선순위를 사전에 합의해 분쟁을 최소화해야 한다. 물 스트레스 평가를 정책 결정 절차에 포함시켜야 한다. 시민 참여형 절수 문화: 구체적 절감 목표와 절수형 기기 보급으로 참여를 높인다. ‘하루 1인 10리터 절감’ 같은 캠페인은 간단하면서 효과적일 수 있다. 기술적 대응방안 물 효율 인증제도 도입: 물 사용이 많은 세탁기, 식기세척기와 같은 가전 정책이 방향을 제시한다면, 기술은 실행력을 높인다. 메가시티의 물 스트레 제품에 물 효율 인증 라벨 부착을 의무화한다(에너지 효율 등급제와 유사 스 대응 기술은 공급 효율·위기 대응 속도·회복력 강화에 집중해야 한다. 한 형태다). 가뭄이 심각한 호주의 경우, 물 효율 인증제도 시행 이후 실제 스마트 상수도망 구축: 구역계량(DMA)과 스마트 계량기(AMI)로 유량·수 소비자의 80% 이상이 라벨을 인지하고 제품 구매 시 고려했으며, 가정 압을 실시간 모니터링해 누수와 이상 사용량을 조기에 발견한다. 압력 조 의 연간 물 사용량이 6% 감소하는 등 효과를 확인했다. 절을 병행하면 관 파손과 누수를 줄이고 송수 비용까지 절감할 수 있다. 물 사용량의 가시화: 가정·건물별 실시간 사용량을 스마트폰 앱이나 공용 위기 대응형 가상 수자원 관리 시스템: ‘디지털 트윈’ 기술로 실제 상수도 전광판에 표시하면 사용자는 자신의 패턴을 쉽게 파악하고 낭비 요인을 망과 수원 운영을 가상공간에 재현해 가뭄·사고 시 최적 취수·송수·우회 확인해 절약으로 이어질 수 있다. 경로를 빠르게 결정할 수 있다. 일부 광역도시는 시간 단위로 공급 계획 기업의 물 발자국 관리: 생산과정의 물 사용량과 재이용 비율을 공개하고 을 조정할 수 있게 되었다. 감축 목표를 설정하면 신뢰와 경쟁력을 동시에 확보할 수 있다. 수원 다변화·연계 운영: 메가시티는 하천, 댐, 재이용수, 해수담수화 등 다 교육과 공감대 형성: 학교, 커뮤니티, 미디어를 통한 물 스트레스 교육은 양한 수원을 준비하고 상황에 맞춰 전환하는 능력이 필요하다. 2023년 장기적으로 도시 물 관리의 인적 기반을 강화한다. 영산강·섬진강 유역에서는 댐·보·지하수를 연계해 하루 수십만 톤의 물 을 확보한 사례가 있다. 통합적 해법의 필요성 상시 비상공급망: 주요 관로와 배수지를 이중화하고, 사고나 수원 고갈 물 스트레스 시대의 메가시티는 ‘더 많은 물의 확보’만으로는 지속가능성 시 공급 경로를 전환하는 시스템을 구축한다. 정기적인 비상훈련과 실시 을 보장할 수 없다. 정책적 방향, 기술적 실행력, 사회적 참여가 유기적으 간 모니터링이 뒷받침돼야 한다. 로 맞물릴 때 대도시는 기후변화와 인구집중이라는 이중 압박 속에서도 안정적인 물 공급망을 유지할 수 있다. 영산강·섬진강 유역의 장기 가뭄 사회적 대응방안 경험은 이러한 통합 해법이 단순한 이상이 아니라 현실에서 작동 가능함 기술과 제도만으로는 충분하지 않다. 메가시티의 물 문제는 시민·기업·지 을 보여준다. 앞으로 메가시티가 직면할 물 스트레스는 더 빈번하고 복잡 역사회가 함께 해결해야 한다. 해질 것이다. 지금이야말로 정책·기술·사회가 함께 움직여 ‘물 스트레스 물 분쟁 및 갈등 조정: 메가시티의 경우 외부 유역에 취수원을 두는 경우 에 강한 도시’로의 전환을 서둘러야 할 시점이다. Vol. 96 2025 가을호"}]}, {"id": "96-44", "no": 96, "label": "2025 가을호", "corner": "물 리포트", "title": "맑은 물을 위한 국내외 산업 톺아보기", "author": "", "start": 44, "end": 47, "pages": [{"p": 44, "t": "WATCH ON | 물 리포트 맑은 물을 위한 국내외 산업 톺아보기 출처 워터저널 행안부, 집중호우 피해 복구 총력 지원 행정안전부는 최근 전국적인 집중호우로 발생한 피해 복구와 이 재민 구호를 위해 지방재정·세제 등 지방자치단체가 활용 가능한 모든 수단을 적극 지원하겠다고 밝혔다. 예비비와 재난관리기금 국내 동향 활용, 장비 임차와 임시구호시설 설치를 위한 계약 특례 적용 등 을 통해 신속한 현장 대응이 가능하도록 했다. 자동차 멸실·파손 시 자동차세 면제, 재산 재취득 시 취득세·등록 면허세 감면 등 지방세제 혜택도 지원된다. 특별재난지역으로 선 환경부, 녹조 수질검사·정보공개 전면 개편 포되면 생계 안정을 위해 도시가스·상하수도 요금 감면, 지방세 환경부는 기후위기로 심화되는 녹조 문제의 근본적 해결을 위해 납부기한 연장, 체납액 징수 유예 등 추가 지원도 가능하다. 연말까지 종합대책을 수립하고, 우선 조류경보제를 전면 개편한 아울러 민생회복 소비쿠폰 지급 등 민생 회복 지원, 금융기관과 다고 밝혔다. 기존에는 취수구 상류 수 km 지점에서 시료를 채취 연계한 긴급자금 대출, 지방공기업의 시설 복구 지원, 자원봉사단 하고 경보를 발령하기까지 3~4일이 소요돼 실제 상황과 차이가 체와 협력한 현장 봉사활동 등 종합적 지원 체계를 가동한다. 있다는 지적이 이어졌다. 이에 따라 채수 지점을 취수구 인근으로 조정하고, 이동형 수질분 석차량과 국립환경과학원 분석 인력을 투입해 채수 당일 바로 경 보를 발령할 수 있도록 체계를 개선했다. 분석 결과는 물환경정보 시스템에 실시간 공개해 국민 불안을 줄일 방침이다. 또한 조류독소 농도 기준을 반영한 경보체계 도입, 공기와 농산물 내 조류독소 모니터링 강화, 가축분뇨 등 오염원 차단 대책 또한 병행한다. 환경부는 낙동강 등 취수원 안전을 우선 확보하고, 시 민사회·전문가와 협력해 녹조 문제의 근원적 해결을 위한 안정적 인 기반을 마련하겠다고 밝혔다. #녹조대응 #수질안전 #집중호우복구 #이재민지원"}, {"p": 45, "t": "해외 동향 영국, 국가가뭄그룹 물부족 ‘국가 중대 사건’ 선포 영국 국가가뭄그룹(National Drought Group)은 8월 11일 회의를 열고 영국 내 물부족 상황을 ‘국가 중대 사건(Nationally Significant Incident)’으로 공식 선포했다. 현재 요크셔, 맨체스터, 미들랜즈 등 5개 지역이 가뭄 지역으로 지정됐으며, 템즈·이스트앵글리아 등 6 개 지역도 1976년 이후 가장 건조한 6개월을 기록하며 심각한 위 험 단계에 놓여 있는 것으로 보고됐다. 산업부, 탄소중립산업 마스터플랜 수립 착수 저수지 평균 저수율은 67.7%로, 강수량 감소와 네 번째 폭염으로 산업통상자원부는 7월 29일 한국무역협회에서 전문가 30여 명 수위가 지속적으로 낮아지고 있는 것으로 나타났다. 요크셔 워터 이 참석한 가운데 ‘탄소중립 기술·산업경쟁력 강화전략’ 수립을 위 는 정원 급수 금지령(Hosepipe Ban) 시행 이후 물 수요가 10% 감 한 킥오프 회의를 열었다. 소해 하루 최대 8만㎥의 물을 절약했다고 보고했다. 이는 강과 야 이번 회의는 기후위기 속에서 우리 경제·산업의 체질 개선과 글로 생 동물의 건강을 지키는 효과로 이어지고 있다. 벌 탄소중립 산업 선도 방안을 모색하기 위해 마련됐다. 영국 환경청은 수도기업의 누수 저감과 물 절약 조치 이행을 촉구 참석자들은 태양광, 해상풍력, 소형모듈원자로(SMR), 청정수소, 했으며, 농업계 역시 수확량 감소와 사료 부족 등으로 심각한 타 에너지저장장치, 탄소포집·활용·저장(CCUS) 등 10대 핵심 기술 격을 우려하고 있다. 정부는 9개 저수지 건설과 신규 관로 확충에 분야를 중심으로 경쟁력 강화 방안을 논의했다. 산업부는 전기화 1,040억 파운드 민간 투자를 유치해 중장기 물 인프라 개혁에 본 확대와 청정연료 도입을 두 축으로, 기술개발과 대규모 실증, 초 격적으로 나설 계획이다. 기 시장 조성까지 담은 산업육성 로드맵을 수립할 계획이다. 이호현 산업부 2차관은 “재생에너지 보급 확대와 에너지 고속도 로 건설 등 정부 정책 과제의 차질 없는 이행을 위해 탄소중립 산 업 경쟁력 강화가 시급하다”고 강조했다. 산업부는 앞으로 전문가 간담회와 논의를 거쳐 ‘탄소중립 기술·산업경쟁력 강화전략’을 신 속히 확정·발표할 예정이다. #탄소중립산업 #에너지전환 Vol. 96 2025 가을호 봄호"}, {"p": 46, "t": "브라질, 베올리아 세계 최초 대규모 하수 재이용 설비 착수 프랑스계 글로벌 물기업 베올리아(Veolia)는 브라질 비토리아에 서 기존 공공 하수처리장을 MBR(고성능 멤브레인 생물반응)과 RO(역삼투) 기술을 적용한 대규모 물 재이용 시설로 전환하는 프 로젝트에 착수했다. 하루 3만 8,880㎥를 처리해 산업계에 안정 적 용수를 공급하고 약 20만 명분의 식수 자원을 절약할 수 있을 것으로 전망된다. 이번 사업은 브라질 최초의 물 재이용 공공 입찰을 통해 추진됐 으며, GS Inima와 에스피리투 산토 주 수도공사(CESAN)가 참여 하는 아구아스 데 레우조 데 비토리아가 주관한다. 철강 기업 아 르셀로미탈과 광산 기업 발레 등 주요 산업체도 공급 대상에 포 함됐다. 브라질 수자원공사에 따르면 현재 물 재이용은 전체 소 비량의 1% 미만으로, 이번 프로젝트는 중남미 전역 확산의 신호 탄이 될 것으로 기대된다. 베올리아는 멤브레인 생물반응기(memDENSE™), 한외여과 멤 브레인(ZeeWeed™ 500-EV), 고회수 역삼투(PROflex™) 등의 첨단 기술을 통합해 인·질소 등 주요 오염물 제거와 자원순환을 실현할 계획이다. 베올리아와 GS Inima는 이를 통해 브라질 위 필리핀, 마닐라 워터 정화조 청소 강화로 홍수 피해 대응 생 분야 혁신과 중남미 지속 가능성 강화의 새로운 기준을 제시 필리핀 수도권 동부 지역 수도사업자 마닐라 워터(Manila Water)는 하겠다는 구상이다. 최근 태풍과 강한 남서계절풍으로 발생한 루손 지역 홍수 피해 이 후, 보건 위험 방지를 위해 정화조 청소 활동을 8월 집중 강화했다. 정화조가 가득 차거나 손상된 상태에서 홍수가 발생하면 처리되 지 않은 오수가 주택과 도로, 인근 수원지로 흘러들어 심각한 위생 문제를 일으킬 수 있다. 이에 정부는 무료 청소 서비스를 확대해 오수 넘침과 수인성 감염을 예방하고, 주민들의 생활환경과 공중 위생을 보다 안전하게 지키겠다는 방침이다. 청소 대상 지역은 안티폴로, 케손, 파식 등 주요 도시와 산호세, 산 후안 등 일부 구역이며, 구체적인 일정과 대상지는 마닐라 워터 고객센터 및 홈페이지를 통해 안내된다. 회사 측은 약 780만 명의 고객이 거주하는 수도권 동부 지역이 기후변화로 인한 극한 기후 에 취약하다고 지적하며, 정화조 관리 강화를 통해 홍수 피해 후 환경과 주민 건강을 지키겠다고 설명했다. 마닐라 워터는 정기 관리되지 않은 정화조가 홍수 이후 콜레라, A형 간염, 렙토스피라증 등 수인성 질병을 유발할 수 있다고 경고했다. 제릭 세비야 홍보국장은 “정화조 청소는 가족의 건강과 지역사회의 안전을 지키는 가장 단순하면서도 효과적인 방법”이라고 강조했다."}, {"p": 47, "t": "Avenue 물 정원이 되다 도심의 빗물받이와 유휴 공간, 푸른 정원으로 피어나다 제철 식탐 스산한 가을바람에 면역력 지켜주는 마늘버터 가리비찜 오늘부터 1일 욕실 청소, 쉽고 친환경적으로 부위별 관리법 & 실용 팁 좋아요 KWWA Vol. 96 2025 가을호"}]}, {"id": "96-48", "no": 96, "label": "2025 가을호", "corner": "물 정원이 되다", "title": "도심의 빗물받이와 유휴 공간, 푸른 정원으로 피어나다", "author": "", "start": 48, "end": 51, "pages": [{"p": 48, "t": "AVENUE | 물 정원이 되다 도심 빗물받이와 유휴 공간, 도시는 오랫동안 물을 통제와 관리의 대상으로만 여겨왔다. 홍수를 막기 위해 빗물을 곧장 배수관으로 푸른 정원으로 피어나다 있다. 송도 센트럴파크, 대청호 자연수변공원, 국동항 수변공원, 선유도공원, 광교호수공원, 청계천 흘려보내고, 댐과 저수지는 안전을 이유로 접근을 제한했다. 그러나 기후위기, 폭우, 열섬 현상이 심화되면서 물은 단순히 제어해야 할 위험이 아니라 도시 생태와 생활을 지키는 자원으로 다시 주목받고 수변공원은 각각 매립지, 댐 호수, 항만, 폐정수장, 인공호수, 도심 하천이라는 다른 배경에서 태어나 오늘날 물과 생태, 시민 생활이 공존하는 정원으로 변신했다. 글 편집실 | 사진 한국관광공사"}, {"p": 49, "t": "대 청 호 송 도 센 트 럴 파 크 자 연 수 변 공 원 빌딩 숲에 열린 수로, 댐 호수의 변신, 송도 센트럴파크 대청호 자연수변공원 송도국제도시는 바다를 매립해 조성된 신도 대청호는 1980년대에 건설된 대표적인 다목 시다. 매립지 특성상 홍수와 배수 문제가 뒤 적댐이다. 그러나 오랜 기간 상수원 보호를 이 따랐으며, 단순한 콘크리트 배수 시설만으로 유로 일반 시민의 접근이 제한되면서 호수는 는 한계가 뚜렷했다. 이에 도시 설계 단계부터 ‘닫힌 물 공간’으로 남아 있었다. 주민들은 멀 ‘물과 함께하는 공원 도시’라는 개념이 도입돼 리서 감상만 할 뿐 호수의 소중한 가치를 직접 물과 녹지가 조화를 이루는 지속 가능한 도시 체험하고 즐길 기회가 없었다. 환경을 조성하도록 방향이 마련됐다. 2010년대에 들어 대전시는 호수를 ‘열린 생태 2009년 개장한 송도 센트럴파크는 단순한 공원’으로 바꾸는 계획을 추진했다. 추동 일대 인공 수로가 아니라, 빗물과 바닷물이 만나는 에는 빗물이 모여드는 지천을 따라 습지를 조 친수형 정원으로 설계되었다. 주변 도로의 빗 성하고, 기존 콘크리트 호안을 점차 자연형 호 물은 레인가든과 저류지를 거쳐 자연적으로 안으로 교체했다. 부들, 창포, 수련 등 수생식 정화된 후 중앙 수로로 흘러든다. 투수성 포장 물이 자생하도록 유도해 수질 정화와 생물 다 재가 도입돼 빗물이 땅속으로 스며들고, 수로 양성을 높였다. 동시에 데크길과 전망대, 철새 가장자리는 얕은 습지로 조성해 갈대와 부들 관찰대가 설치돼 시민이 안전하게 호수를 체 이 자연스럽게 뿌리내리도록 했다. 이러한 시 험할 수 있게 되었다. 설은 배수와 치수 기능뿐 아니라, 빗물의 자연 지금의 대청호 자연수변공원은 저수지 이상 침투와 정화를 통해 수질 개선과 홍수 완화라 의 의미를 지닌다. 이곳은 새와 곤충의 서식처 는 물관리 효과도 거두고 있다. 이며, 가족과 학생들이 생태를 배우는 학습장 현재 공원은 산책로와 데크길, 카약 체험장, 이자 시민의 휴식처다. 닫힌 호수가 열린 정원 잔디광장으로 구성돼 있다. 직장인과 주민은 으로 바뀌면서 물은 다시금 공동체의 자산이 출퇴근길에 잠시 들러 바람을 쐬고, 가족 단위 자 지역의 문화가 되었다. 무엇보다 상수원이 방문객은 수변을 따라 걷거나 수상 레포츠를 라는 본래 기능을 유지하면서 시민 친수 공간 즐긴다. 빌딩 숲속에서 바람과 물결이 어우러 으로 개방되어 수질 관리와 생태 복원, 물환경 지는 풍경은 도시가 물을 어떻게 품을 수 있는 보전을 동시에 이뤄내고 있다. 지를 보여주는 대표적인 사례다. 송도의 수로 는 단순한 치수 시설이 아니라 시민과 자연이 바다와 만나는 정원, 함께 어울리는 도심 속 생태정원으로 기능하 국동항 수변공원 고 있으며, 도시 물순환 관리의 새로운 모델로 여수 국동항은 오랫동안 상업 어항으로 기능했 자리매김하고 있다. 으나, 항만 시설과 방파제 때문에 주민들에게 Vol. 96 2025 가을호"}, {"p": 50, "t": "는 닫힌 공간으로 남아 있었다. 여수지방해양 32억 원을 들여 야간관광 콘텐츠를 강화하는 수산청은 2018년 1월부터 수변 친화형 공간 조 2단계 사업을 추진 중으로, 앞으로는 단순한 성 사업을 추진해 2019년 1월 약 1만 2,000㎡ 항만 공간을 넘어 시민 생활과 해양 문화가 어 규모의 국동항 수변공원을 완공했다. 우러지는 수변 정원으로 발전시킬 예정이다. 공원 조성 과정에서 기존 콘크리트 호안 일부 를 친수형 데크와 산책로로 바꾸고, 그늘 쉼터 폐정수장의 부활, 와 화단형 벤치, 바다 조망형 의자 등을 설치 선유도공원 해 시민 누구나 바다를 가까이 즐길 수 있도록 서울 영등포구 양화동에 있는 선유도는 1978 했다. 항만 특성상 단절돼 있던 바다 접근성이 년에 완공된 서울시 정수장이었다. 그러나 크게 개선됐으며, 주변 갯벌과 해양 생태계 복 1990년대 후반 정수 기능이 중단되면서 도심 원을 위한 수생식물 식재도 병행되었다. 이는 속 버려진 산업시설로 남았다. 서울시는 철거 수질 관리와 해양 생태 순환을 강화하는 기반 대신 ‘생태적 재생’을 택했고, 기존 콘크리트 이 되었으며, 지속 가능한 해양 환경 조성에도 구조물을 최대한 보존하면서 새로운 공원으 기여하고 있다. 로 전환하는 작업에 착수했다. 지금의 국동항 수변공원은 낮에는 주민들의 그 결과 2002년 4월, 국내 최초의 환경생태 산책과 여가 공간이 되고, 밤에는 경관 조명과 공원인 선유도공원이 개장했다. 옛 침전지는 수변 산책로가 어우러져 여수의 새로운 야경 습지와 연못으로, 정수지는 빗물정원으로 다 명소로 자리 잡았다. 여수시는 2027년까지 약 시 태어났다. 회색 벽과 기둥은 덩굴식물로 뒤 국 동 항 수 변 공 원 지금의 국동항 수변공원은 낮에는 주민들의 산책과 여가 공간이 되고, 밤에는 경관 조명과 수변 산책로가 어우러져 여수의 선 유 도 공 원 새로운 야경 명소로 자리 잡았다."}, {"p": 51, "t": "광 교 호 수 공 원 덮이며 과거의 흔적과 현재의 생태가 공존하 공원이 조성됐으며, 2013년 4월 시민에게 개 로써 주민에게는 휴식과 공동체의 장을, 도시 는 독특한 경관을 이룬다. 방돼 지역의 대표 친수 명소로 자리 잡았다. 는 지속가능한 미래의 모델을 제공하고 있다. 시민들은 산책로를 걸으며 옛 정수장 구조물 광교호수공원은 약 200만㎡ 규모로, 국내 최 송도, 대청호, 선유도, 광교의 이야기는 도시 을 직접 체험할 수 있고, 아이들은 물놀이장에 대의 도심 수변공원 가운데 하나다. 인공호수 와 물의 관계가 어떻게 달라졌는지를 잘 보여 서 물순환의 원리를 배운다. 또한 환경교육관 주변에는 레인가든과 습지섬을 두어 빗물이 준다. 한때 물은 위험과 통제의 대상이었으나, 과 전시 공간이 마련돼 단순한 휴식 공간을 넘 곧장 호수로 유입되지 않고 자연 정화 과정을 이제는 도시에 생명을 불어넣는 정원이 되었 어 생태문화교육의 장으로 기능한다. 버려진 거치도록 했다. 수련·부들·억새 등이 자생하 다. 이 정원들은 단순한 경관 공간이 아니다. 정수장이 다시 물 재이용과 순환의 가치를 알 며 작은 생태계를 이루고, 계절마다 다양한 수 빗물을 머금어 홍수를 완화하고, 수질을 정화 리는 교육 공간으로 부활한 것이다. 변 경관을 선사한다. 이러한 설계는 도시 물순 하며, 생태를 회복시키고, 시민에게는 여가와 환을 촉진하고, 폭우 시 빗물을 저류해 홍수를 학습, 문화를 제공한다. 신도시의 물순환 거점, 완화하며, 여름철 열섬 현상까지 줄이는 기후 물은 이제 치수 시설을 넘어 도시의 미래를 지 광교호수공원 적응 효과를 거두고 있다. 탱하는 기반이자, 기후위기에 대응하는 생활 경기도 수원시와 용인시에 걸쳐 있는 광교신 현재 광교호수공원은 산책로와 전망대, 공연 속 해법이다. 회색빛 도시를 적시는 푸른 숨 도시는 2000년대 후반부터 본격적으로 개발 장, 잔디광장 등이 어우러져 시민들의 생활문 결, 그것이 바로 ‘물 정원이 되다’가 지닌 현재 이 진행된 신도시다. 이 과정에서 물순환과 친 화 공간으로 자리 잡았다. 신도시의 획일적인 적 가치이며, 미래 세대에게 물려줄 소중하고 환경 설계를 반영한 핵심 공간으로 광교호수 풍경 속에서 물을 매개로 한 공원이 들어섬으 지속 가능한 자산이다. Vol. 96 2025 가을호"}]}, {"id": "96-52", "no": 96, "label": "2025 가을호", "corner": "제철 식탐", "title": "스산한 가을바람에 면역력 지켜주는 마늘버터 가리비찜", "author": "", "start": 52, "end": 55, "pages": [{"p": 52, "t": "AVENUE | 제철 식탐 환절기에는 몸이 쉽게 지치고 면역력이 떨어지기 마련이다. 이럴 때일수록 제철 식재료를 활용한 건강한 한 끼가 필요하다. 담백하고 영양이 풍부한 가리비에 면역력 강화에 좋은 마늘을 더한 ‘마늘버터 가리비찜’으로 간단하지만 든든한 건강 별미를 차려보자. 글·사진 이주현 푸드 칼럼니스트 스산한 가을바람에 면역력 지켜주는 마늘버터 가리비찜 가리비의 풍부한 영양효능 예로부터 가리비는 ‘조개류의 스타’라고 불릴 만큼 고급 식재료로 여겨졌다. 담백하고 독특한 풍미 덕분에 호불호 없이 여러 요리에 사용하곤 한다. 가리비에는 맛뿐만 아니 라 몸에 좋은 영양성분도 풍부하게 들어 있다. 먼저 필수 아미노산, 칼슘, 인이 함유되 어 있어 성장기 어린이들의 성장을 돕는다. 또한 가리비 속 칼륨 성분은 체내 나트륨, 노폐물 등을 배출해 혈액 순환을 촉진한다. 마지막으로 가리비는 저지방, 저칼로리 음 식이기 때문에 체중 조절이 필요한 다이어터나 환자에게도 적절한 식재료다. 다른 해 산물에 비하여 콜레스테롤 함량도 비교적 적기 때문에 부담 없이 먹을 수 있는 것도 가 리비가 지닌 장점 중 하나다. 싱싱한 가리비 구매 & 조리법 가리비는 껍데기에 자연스러운 광택이 나고 무게감이 있으며 입이 단단히 닫혀 있는 것이 신선하다. 구입할 때부터 껍질이 닫혀있지 않은 것은 죽어서 상한 것이니 주의한 다. 가리비를 조리할 때에는 소금물에 한 시간 정도 해감을 하는 것이 좋다. 또한 냄비 에 쪄서 국물까지 함께 먹으려면 솔로 껍질에 묻은 이물질, 물때 등을 꼼꼼하게 닦아내 야 한다. 가리비를 찔 때는 되도록 세워서 찌는 것이 좋으며, 청주나 미림 몇 숟갈과 레 몬을 넣으면 비린내를 제거하는 데 도움을 준다."}, {"p": 54, "t": "면역력 지켜주는 가리비 요리 일교차가 커지고 기온이 뚝 떨어짐과 동시에 우리 몸은 체온 조절에 많은 에너지를 소 비하게 된다. 이에 따라 상대적으로 면역 세포 기능이 저하되면서 몸이 약해지게 된다. 이럴 땐 면역력을 상승시키는 음식을 챙겨 먹는 것이 좋다. <마늘버터 가리비찜> 요리에 들어간 ‘마늘’은 요즘같이 추워지는 계절에 꼭 필요한 음 식이다. 마늘은 면역력을 증진시키는 대표적인 음식으로 알리신, 셀레늄, 알릴 디설파 이드 등 항염, 항암 작용을 하는 성분이 풍부하게 함유되어 있다. 또한 마늘의 유익한 성분이 장내 박테리아의 성장을 도와 면역력을 증진시켜 준다. 제철을 맞아 맛과 영양 이 풍부한 가리비에 면역력을 지켜주는 마늘을 함께 즐기며, 환절기를 맛있고 건강하 게 보내시길 바란다."}, {"p": 55, "t": "Recipe ‘마늘버터 가리비찜’ 난이도에 비하여 근사한 외관을 자랑하기 때문에 손님용 요리로도 그만이다. 이 가리비찜은 바게트나 샐러드와 함께 곁들여도 좋으며, 좀 더 응용하면 파스타로도 만들 수 있다. 가리비를 찔 때 껍질이 벌어지면 1~2분 뒤 불을 끄고, 여열로 2분가량 더 익히면 살이 질기지 않고 맛있게 먹을 수 있다. 준비 재료 과정 1 과정 2 과정 3 과정 4 가리비, 미림 또는 청주 1큰술, 레몬 슬라이스 2조각 *‌\u0007마늘버터 소스 : ‌\u0007버터 160g, 다진 마늘 40g, 꿀 또는 설탕(올리고당) 취향에 따라 1작은술, 후추, 페페론치노 소량, 허브(파슬리) 소량 만드는 과정 ① 버터와 다진 마늘을 내열 용기에 담는다. 취향에 따라 꿀, 설탕, 후추 등을 추가한다. ② 허브와 페페론치노를 다져서 준비한다. ③ ‌\u0007①을 전자레인지에 3분가량 버터가 녹을 때까지 돌려준다. ②의 허브와 페페론치노를 취향에 따라 양을 조절하여 넣는다. ④ ‌\u0007깨끗이 손질한 가리비를 찜기에 넣어 찐다. 이때 찜기 물에 레몬 슬라이스나 미림·청주 1큰술을 넣으면 비린 맛을 제거할 수 있다. ⑤ 가리비를 그릇에 담고 따뜻하게 보관한 마늘버터 소스를 먹기 직전에 끼얹는다. Vol. 96 *‌\u0007저자 이주현은 요리 연구가이자 푸드 칼럼니스트로 다양한 매체에 음식과 관련한 칼럼을 연재 중이다. 초보자도 따라 하기 쉬운 레시피 안내와 일상생활과 밀접한 요리 칼럼을 주로 연재 중이다. 2025 가을호"}]}, {"id": "96-56", "no": 96, "label": "2025 가을호", "corner": "오늘부터 1일", "title": "욕실 청소, 쉽고 친환경적으로 – 부위별 관리법 & 실용 팁", "author": "", "start": 56, "end": 57, "pages": [{"p": 56, "t": "AVENUE | 오늘부터 1일 욕 실 청 소 쉽고 친환경적으로 부위별 관리법 & 실용 팁 화장실은 집안 위생의 중심 공간이지만, 곰팡이·물때·악취가 쉽게 발생해 관리가 까다로운 곳이다. 특히 변기, 세면대, 욕조, 샤워부스, 거울, 바닥 타일, 실리콘 틈새 등은 각각 다른 오염 원인과 관리법이 필요하다. 올바른 청소 방법과 친환경 재료를 활용한다면 화학세제를 최소화하면서도 깨끗하고 쾌적한 욕실을 유지할 수 있다. 이번 가을, 화장실을 상쾌하게 가꾸는 청소법을 알아본다. 정리 편집실 에코 청소 쉽게 따라 하기 ❶ ❷ ❸ ❹ 적절한 청소 도구 사용 친환경 세제 활용 주기적 관리 자연 환기· 건조 습관"}, {"p": 57, "t": "부위별 청소법 & 친환경 팁 ① 변기 ② 세면대 세척 방법: 변기 안쪽은 전용 솔에 중성세제를 묻 혀 원형을 그리며 꼼꼼히 닦는다. 얼룩이 심한 부 분은 베이킹소다를 뿌린 뒤 식초를 분사하면 거 품 반응으로 때가 쉽게 분해된다. 소독 팁: 좌변기 뚜껑·손잡이는 세균 번식이 쉬 운 곳이다. 구연산수를 분사 후 마른 천으로 닦아 내면 소독 효과와 함께 악취 제거에도 좋다. 주의점: 염소계 화학세제를 과도하게 사용하면 악취와 피부 자극이 발생할 수 있어 친환경 세제 를 활용하는 것이 안전하다. 세척 방법: 치약이나 베이킹소다를 부드러운 천 이나 스펀지에 묻혀 수도꼭지, 세면대 표면을 문 지르면 물때와 얼룩이 쉽게 제거된다. 배수구 관리: 배수구는 세균과 냄새가 모이는 곳. 베이킹소다 1컵(약 200ml)을 뿌린 뒤 식초를 부 어 10분 정도 두면 거품이 발생하며 냄새와 기름 때를 분해한다. 이후 뜨거운 물로 충분히 헹구어 깨끗하게 마무리한다. 관리 팁: 주 1회 정도 정기적으로 청소하면 막힘 과 냄새를 예방할 수 있다. ③ 욕조 ④ 샤워부스·거울 세척 방법: 욕조 표면에 구연산수를 골고루 분사 하고 10분간 두었다가 부드러운 스펀지로 닦아 내면 물때가 쉽게 제거된다. 찌든 때 제거: 심한 얼룩은 과탄산소다를 뜨거운 물에 녹여 욕조에 담근 뒤 30분 정도 불리면 표 면이 훨씬 깨끗해진다. 주의점: 금속 수전 주변은 산성 세제 를 오래 두면 부식 우려가 있으므로 세척 후에는 반드시 충분한 양의 물 로 깨끗이 헹군다. 세척 방법: 물때가 낀 유리에는 식초수를 분사하 고 신문지나 마른 천으로 원을 그리며 닦아낸다. 유리 표면 코팅제나 발수제를 미리 발라 두면 물 방울이 쉽게 흘러내려 물때가 덜 생긴다. 습기 관리: 샤워 후 스퀴지(유리 물기 제거 도구) 로 물기를 닦아내는 습관을 들이면 곰팡이와 물 때 발생을 크게 줄일 수 있다. 추가 팁: 거울 김서림 방지에는 중성세제를 묻힌 수건으로 닦고 마른 천으로 꼼꼼히 마무리하는 것이 더욱 효과적이다. ⑤ 바닥 타일 ⑥ 실리콘 틈새 세척 방법: 타일 틈새 곰팡이는 베이킹소다와 과 탄산소다를 1:1로 섞어 솔에 물을 묻혀 문지르면 깨끗이 제거된다. 물때 제거: 타일 표면의 하얀 물때는 구연산수를 뿌린 뒤 솔질하면 사라진다. 위생 관리: 청소 후에는 반드시 물로 헹군 뒤 건 조해야 하며, 환기를 통해 습기를 제거하면 곰팡 이 재발을 막을 수 있다. 추가 팁: 실리콘 틈이나 배수구 주변은 곰팡이가 번식하기 쉬우므로 집중 관리가 필요하다. 욕실 청소, 이런 상식은 NO! OX퀴즈 정답 Q1. Q2. Q3. 세척 방법: 물에 과탄산소다를 개어 반죽처럼 만 든 뒤 곰팡이가 핀 부분에 두껍게 바른다. 그 위 를 랩으로 단단히 덮어 1~2시간 두면 곰팡이가 부드럽게 녹아 제거된다. 마무리 관리: 솔로 문질러 깨끗하게 닦아낸 후 마 른 수건으로 물기를 완전히 제거한다. 예방 팁: 실리콘 틈은 습기에 취약하므로, 샤워 후 환기를 하고 틈새 물기를 닦아내는 습관을 들 이면 곰팡이 발생을 줄일 수 있다. Q1 Q2 Q3 표백제만 쓰면 곰팡이가 완벽 제거된다? 뜨거운 물만 부으면 세균과 냄새가 사라진다? 세제를 많이 쓸수록 깨끗하다? → ‌\u0007락스 같은 염소계 표백제는 표면 곰팡이를 → ‌\u0007순간적으로 냄새가 줄 수는 있지만, 배수구 → ‌\u0007세제 잔여물이 오히려 곰팡이와 악취의 원인이 일시적으로 없애지만, 실리콘 틈 속 뿌리까지는 안 기름때와 세균은 그대로 남는다. 된다. 소량의 세제를 사용하고, 마지막 헹굼을 닿지 못한다. 곰팡이는 과탄산소다나 구연산을 베이킹소다+식초로 화학 반응을 일으킨 후 꼼꼼히 하는 것이 중요하다. 활용해 ‘불림→ 문지르기→ 건조’ 과정을 거쳐야 뜨거운 물로 헹궈야 효과가 크다. 완전히 제거된다. Vol. 96 2025 가을호"}]}, {"id": "96-58", "no": 96, "label": "2025 가을호", "corner": "좋아요 KWWA", "title": "좋아요 KWWA", "author": "", "start": 58, "end": 59, "pages": [{"p": 58, "t": "AVENUE | 좋아요 KWWA <맑은 물 세상> 2025년 여름호 후기에 참여해 주신 모든 분에게 감사 인사드립니다. 그중 다섯 분의 후기를 공유합니다. <맑은 물 세상>은 여러분의 관심과 응원으로 함께 만들어집니다. 앞으로도 소중한 의견 부탁드립니다. 2025년 여름호 이벤트 당첨자 발표 어떻게 읽으셨나요? 독자 이벤트 한국상하수도협회의 ‘국제협력 네트워크 강화’ 기사를 통해 우리 물산업의 우수한 기술력과 경험을 확인할 수 있어 뜻깊었습니다. 나아가 헝가리를 비롯해 유럽, 동남아, 북아프리카까지 협력과 판로를 넓혀야 한다는 필요성에도 크게 공감했습니다. ‘공공하수도의 현재를 돌아보고 미래를 준비하다’를 읽고, 기후변화와 인구 감소, AI 확산 등 급변하는 시대 속에서 공공하수도 역시 전환기를 맞고 있음을 느꼈습니다. 환경과 도시 회복력을 지탱하는 자산임을 일깨워 주어 의미 있었습니다. 권지향 학회장 인터뷰를 통해 물산업 경쟁력 강화를 위한 우수 인재 양성과 산학협력의 중요성을 공감할 수 있었습니다. 교육 현장의 과제를 정책과 어떻게 연계하고 소통할지에 대한 방향도 잘 짚어주셔서 인상 깊었습니다. 여름철 땀에 젖은 옷으로 세탁이 잦아 물 절약과 친환경 세제를 고민해 왔는데, 사보에 실린 ‘친환경 세탁법’이 많은 도움이 되었습니다. 앞으로 세탁할 때 참고해 생활에서 더 실천해야겠다는 생각이 들어 유익했습니다. 전경욱 님 송나영 님 여진호 님 최명연 님 2025년 <맑은 물 세상> 가을호 독자 리뷰 이벤트 <맑은 물 세상> 가을호 기사 중 가장 기억에 남는 내용은 무엇이었나요? 여러분의 소중한 생각과 따뜻한 관심이 담긴 리뷰를 남겨주세요. 추첨을 통해 선물을 드립니다. 참여 방법 <맑은 물 세상> 가을호를 정독한 후 QR코드를 스캔해 기억에 남는 내용과 이유를 구글폼에 작성해 주세요. ※ 개인정보 동의 필수 참여 기간 12월 5일(금)까지 이벤트 상품 커피 기프티콘(5명) 국민의 건강과 안전을 지키기 위해 헌신한 물관리 유공자들의 이야기가 깊은 울림을 주었습니다. 특히 국내 최초로 레이저 기술을 적용한 정수 탁도계 개발 소식은 보이지 않는 곳에서 이어지는 혁신과 노력을 잘 보여주어 인상적이었습니다. 이지은 님"}]}, {"id": "97-6", "no": 97, "label": "2026 신년호", "corner": "Letter", "title": "유정복 한국상하수도협회장 신년사", "author": "", "start": 6, "end": 7, "pages": [{"p": 6, "t": "Water Mark _ Letter 혁신의 물결, 역동적인 붉은 말의 해를 열며 존경하는 한국상하수도협회 회원 여러분, 그리고 국민 여러분! 희망과 기대가 함께하는 2026년 병오년(丙午年) 새해가 밝았습니다. 새해에는 여러분의 가정마다 건강과 행복이 가득하고, 뜻하시는 모든 일이 결실을 이루시길 진심으로 기원합니다. 지난 한 해 우리는 기후 위기, 디지털 대전환이라는 거대한 변화 속에서 국민의 안전한 물 복지를 지키기 위 해 쉼 없이 달려왔습니다. 저는 협회장 취임 시 강조했던 ‘깨끗한 물은 국민의 기본권’이라는 가치를 되새기며, 상하수도 시스템의 효율적 관리와 첨단화를 위해 협회 역량을 집중해 왔습니다. 일선 현장에서 묵묵히 헌신 해 주신 모든 회원사와 관계자 여러분께 깊이 감사드립니다. 사랑하는 회원 여러분! 2026년은 협회가 물산업의 새로운 비전을 제시하고 미래로 도약하는 중요한 해입니다. 협회는 올해를 ‘시대 변화를 앞서 달리는 첨단 기술 기반의 국민 중심 물 복지 혁신 원년’으로 삼고, 다음 세 가지 목표를 중심으로 힘 있게 전진하고자 합니다."}, {"p": 7, "t": "신년호 첫째, AI 기반 ‘스마트 물관리 체계’ 구축을 앞당겨 물 복지 속도를 높이겠습니다. 빅데이터와 인공지능 기술을 상하수도 시스템 전반에 도입해 수질·수량 실시간 관리, 누수 감지, 시설물 예측 보전 등 과학적 관리 시스템을 완성해 나가겠습니다. 이를 통해 기후 변화에도 흔들림 없이, 국민이 안심 하고 마실 수 있는 고도화된 수돗물 안전망을 구축하겠습니다. 둘째, 대한민국의 물산업 생태계를 혁신하고 글로벌 경쟁력을 확보해 미래를 향한 도약을 주도하겠습니다. 물산업은 지속가능한 국가 경쟁력의 핵심입니다. 국내 물 기업이 세계 시장으로 뻗어나갈 수 있도록 기술 개발 지원을 확대하고, ‘WATER KOREA’를 포함한 국제 교류 사업을 더욱 내실 있게 다져나가겠습니다. 우수 기술의 상용화와 테스트베드 구축을 적극 지원하여, 물산업이 대한민국의 미래 먹거리 산업으로 자리매김하 도록 협회가 중심 역할을 하겠습니다. 셋째, 현장 중심 전문 인재를 양성하고, 국민과의 신뢰 거리를 좁히겠습니다. 아무리 훌륭한 시스템도 결국 사람이 운영합니다. 상하수도 시설의 안전과 운영을 책임질 전문 인력 육성을 위한 교육·훈련을 강화해 현장의 전문성을 높이겠습니다. 또한 국민이 수돗물을 안심하고 마실 수 있는 문화가 정착되도록 홍보와 소통을 강화하고 수돗물에 대한 국민 신뢰를 회복해 물 복지 체감도를 높이겠습니다. 물은 언제나 위에서 아래로 흐르며, 필요한 곳을 적셔줍니다. 우리 협회 역시 물의 본질을 잊지 않고, 항상 국민 곁에서 흐르고 연결되며, 대한민국 상하수도 분야의 지속가능한 발전과 국민 삶의 질 향상에 더욱 힘쓰 겠습니다. 새로운 해, 우리 모두의 지혜와 역량을 하나로 모아 거침없는 혁신과 도약의 물결을 만들어 나갑시다. 다시 한번, 여러분의 건강과 행복을 기원합니다. 새해 복 많이 받으십시오. 2026년 1월 1일 한국상하수도협회장"}]}, {"id": "97-8", "no": 97, "label": "2026 신년호", "corner": "KWWA와 함께", "title": "안전한 물, 국민을 위한 물 – 유명수 상근부회장", "author": "", "start": 8, "end": 9, "pages": [{"p": 8, "t": "Write. 채청비 Photo. 황지현 Water Mark _ KWWA와 함께 유명수 상근부회장은 지난 2025년 3월 취임한 이후, 여러 핵심 가치를 바 탕으로 한국상하수도협회를 이끌어 왔다. 변화하는 상하수도 산업 환경 속에서 그는 다양한 이해관계자와 소 통하며 협회의 역할과 방향을 재정립 하는 데 주력해 왔다. 다가오는 2026년을 앞두고 유명수 상근부회장은 어떤 계획을 세우고 있 을까. 그를 만나 지난 1년간의 소회와 함께, 2026년 한국상하수도협회가 중장기적으로 수행해야 할 역할과 비 전에 관해 이야기를 들어봤다. “\u0007안전한 물, 국민을 위한 물” 한국 물산업, 새로운 100년을 향해 한국상하수도협회 유명수 상근부회장 Q. \u0007취임 1년을 돌아보며 느끼신 소회와 함께, 상하수도 분야의 변화 속에서 한국상하수도협회 운영의 핵심 방향은 무엇이었는지 말씀 부탁드립니다. A 지난 기간은 감사의 마음과 함께 막중한 책임감을 느끼며 보낸 시간이었 습니다. 대한민국 상하수도가 새로운 도약을 준비해야 하는 변곡점에 서 있는 만큼, 기후변화 위기에 대한 기술적 대응과 노후화된 시설 안전, 그리고 디지털 전환이라는 도전 과제에 선제적으로 대응하고자 노력했습니다. 취임 당시부터 저는 ‘안전, 지속가능, 상생협력, 혁신’이라는 핵심 가치들을 경영 중심에 두었습니다. 특히 실질적으로 우리나라의 정수장과 하수처리장, 하수 관망 등에 대한 운영 효율성 등의 평가를 통해 안전한 물을 확보할 수 있도록 집행력을 높이는 데 집중했습니다."}, {"p": 9, "t": "신년호 첫째, 기후위기로 인해 먹는 물 수질관리에 어려움이 초래되고 있 Q. A \u0007 I와 글로벌화라는 큰 흐름 속에서, 협회의 가장 중요한 습니다. 이에 협회는 정수장 위생안전 인증 활성화, 수질사고 취약 존재 이유인 회원사 및 회원들을 위한 중장기적 역할과 정수장 점검과 기술지원, 물산업 우수제품 확대 등을 수행했으며 비전은 무엇입니까? 공공하수도 관리대행 성과평가를 통해 공공폐수·가축분뇨까지 성과 평가의 대상을 넓혔습니다. 중수도 품질등급제도 도입의 발판을 마 A 협회는 앞으로 세 가지 핵심 역할을 통해 회원들의 성장을 돕 련한 것도 주요한 변화입니다. 고, 상하수도 분야의 지속가능한 발전을 도모할 것입니다. 우선 정책 둘째, 세계 물산업 시장은 지속적으로 성장하고 있습니다. 국내 물 과 현장을 잇는 ‘가교(Bridge)’ 역할 강화입니다. 특히 상하수도 인력 기업들도 해외 진출의 필요성을 느끼고 있기에, 우리나라 물기업 양성 정책의 적정 시행과, 종사자들의 처우 개선에 필요한 법적·제 해외진출 플랫폼인 WATER KOREA(대한민국 국제물산업박람회, 도적 기반을 마련하는 데 앞장서겠습니다. 다음으로는 미래 기술을 이하 WATER KOREA)에도 많은 변화를 주었습니다. 2025년에는 선도하는 ‘혁신 허브(Innovation Hub)’ 역할 수행입니다. 인력의 전 수출상담회와 해외 바이어 초청으로 물기업의 수출성과를 구체적 문성을 위해 기존 교육 프로그램을 재편하고 AI, IoT, 빅데이터를 접 인 숫자로 만들었다면, 2026년에는 기업들이 해외바이어 사전 조사 목한 ‘미래형 물 전문 인력 양성 시스템’을 구축하겠습니다. 를 통해 적절한 기업을 초청하고 기존 오프라인 상담뿐 아니라 사전 마지막으로 상하수도인의 ‘자부심과 안정성’을 높이는 데 노력할 것 온라인 미팅으로 실계약 건수를 확대하는 데 노력할 것입니다. 입니다. 국민에게 깨끗하고 안전한 물을 공급하는 핵심적인 역할을 하는 상하수도 종사자들의 자부심을 높이도록, 대국민 홍보를 강화 하고 안전한 근무 환경 조성을 위한 지원 사업을 확대하겠습니다. Q. \u0007AI 기반 업무 도입과 해외 진출 지원 사업을 강력하게 추진하고 계십니다. 이 두 가지 신사업의 구체적인 준비 현황과 협회의 비전은 무엇입니까? Q. \u0007끝으로 한국상하수도협회의 비전과 함께 회원, 그리고 국민에게 전하고 싶으신 메시지가 있다면 말씀 부탁 A 첫째로 AI 기반 상하수도 업무 혁신 및 디지털 전환 가속화를 드립니다. 추진하려고 합니다. 우선 기후부는 정수장에 AI 자율운영, 최적 에 너지관리, 설비 예지보전, 지능형 영상감시 등 4대 핵심 기능을 도 A 입하는 지방상수도 AI정수장 도입을 검토하고 있습니다. 협회도 이 물은 생명의 근원이자 모든 산업의 기반이며, 지속가능한 미래를 러한 정부 정책을 적극 지원하고자 합니다. 위한 핵심 자원입니다. 우리 상하수도인들은 보이지 않는 곳에서 또한 지능형 하수관로 CCTV 조사 판독시스템 기반을 마련하겠 묵묵히, 그러나 가장 중요한 임무를 수행하고 있다는 사실에 큰 자 습니다. 현재 조사자의 숙련도에 따라 노후 하수관로 진단 정확성 부심을 가져야 합니다. 협회가 추구하는 가장 큰 가치는 바로 ‘안전 이 달라지는 문제를 해결하기 위해, 2026년에 AI 도입을 위한 정보 한 물, 국민을 위한 물’입니다. 이는 변화하는 시대에 물 서비스의 화전략계획을 수립하고 협회 운영 시스템인 PIPEASSET과 연계해 안정성과 효율성을 한 단계 끌어올려 국민의 삶의 질을 향상시키고, CCTV 영상의 결함 위치와 유형 등을 정확하게 판독하는 시스템 우리 기술력으로 대한민국의 국익을 창출하겠다는 강력한 의지의 기반을 마련할 계획입니다. 마지막으로 상수도 인력양성분야에 AI 표현입니다. 고도화를 진행하겠습니다. 국가전문자격 시험 문제 출제 과정에 AI 미래는 협회 혼자 만들어갈 수 없습니다. 정부와 지자체, 물기업, 를 도입해 문제의 객관성과 신뢰성을 획기적으로 높일 것입니다. 그리고 현장의 전문가들이 함께 지혜를 모아야 합니다. 저는 상근 둘째로 국내 물기업의 해외 진출을 위한 국제협력 네트워크를 강화 상근부회장으로서 이 모든 이해관계자를 유기적으로 연결하고 시 하겠습니다. 2025년 3월 WATER KOREA를 통한 해외 진출 기반을 너지를 창출하는 구심점 역할을 수행하겠습니다. 마련했고, 6월에는 세계 물산업 전시 ‘ACE25’에서 AWWA와, 9월에는 대한민국 국민들께서 언제, 어디서든 깨끗하고 안전한 물을 믿고 WEFTEC25에서 미국 물환경연합과 업무협약을 맺었습니다. 2026 마실 수 있도록, 그리고 우리 물산업이 세계적인 강국으로 우뚝 설 년에는 베트남수도협회(VWSA)와의 협력을 재정비하고, WATER 수 있도록, 한국상하수도협회는 혁신을 멈추지 않고 최선을 다하겠 KOREA를 글로벌 협력의 중심 플랫폼으로 발전시킬 것입니다. 습니다. 우리 상하수도 산업에 대한 국민 여러분의 지속적인 관심 존경하는 회원 여러분, 그리고 국민 여러분! 과 격려를 부탁드립니다."}]}, {"id": "97-10", "no": 97, "label": "2026 신년호", "corner": "맑은 물을 닮은 사람", "title": "신임 대한상하수도학회장 단국대학교 김두일 교수", "author": "", "start": 10, "end": 13, "pages": [{"p": 11, "t": "신년호 깨끗한 물은 인류 생존의 가장 기본적인 요건이다. 그러나 생명과 같은 물을 공급하고 처리하는 상하수도 시스템은 눈에 잘 띄지 않는다는 이유로 종종 그 중요성이 간과된다. 대한상하수도학회 제20대 회장으로 선임된 단국대학교 토목환경공학과 김두일 교수는 바로 이 ‘보이지 않는 인프 라’의 가치를 다시금 세상에 알리고자 한다. 상하수도, 보이지 않는 혈관 과거의 산업에서 미래의 과학으로 대한상하수도학회 제20대 회장 김두일 단국대학교 토목환경공학과 교수 대한상하수도학회, 기후의 마음을 잡다 상하수도가 당면한 과제의 해결사 “깨끗하고 안전한 물은 국민의 삶과 직결된 가치이다. 학회의 모 김두일 학회장은 “오늘날 상하수도 분야가 직면한 문제는 기후 든 역량을 모아 지속가능한 상하수도 발전에 앞장서겠다”라고 위기, 인구구조 변화, 노후 인프라, 스마트 기술의 부상, 탄소중립” 김두일 학회장은 선출 소감을 전했다. 대한상하수도학회는 지난 으로 요약했다. 전국적으로 수명을 초과한 관로가 늘어나면서 수십 년간 상하수도 분야의 학술 발전을 선도하고, 국가 상수도· 누수와 싱크홀 위험이 증가하고 있으며, 가뭄·폭우와 미세플라 하수도 정책과 기술 발전에 중추적인 역할을 수행해왔다. 이러 스틱·PFAS 같은 복합적 수질 문제도 심각해지고 있다. 한 무거운 전통과 책임을 이어받게 되어 영광인 동시에 막중한 이러한 복합적 수질 문제에 대응하기 위해 고도정수처리, 막여 사명감을 밝혔다. 과, 실시간 수질 예측 기술이 필요하다고 말했다. 그는 “사후 대 더불어 김두일 학회장은 상하수도 분야가 직면한 환경 변화와 응에서 예방 중심으로 전환해야 한다”라며 DT와 AI 기반 관리체계 기술적 도전에 대응하기 위해, 연구·산업·정책이 조화를 이루는 구축을 강조했다. 또한, “상하수도 분야의 도전은 단순한 기술 문 협력의 장을 만들고, 현장의 문제를 해결하는 실용적 연구를 강화 제가 아니라 ‘전환’의 문제다. 사고 대응형에서 예측·사전예방형 하며, 미래 인재를 육성하고 국제 교류를 확대해 세계적 수준의 으로, 단기예산 투입에서 성과·가치 기반 투자체계로 바뀌어야 학회로 도약시키겠다는 포부를 전했다. 한다”라고 말했다. 더불어 인력 고령화와 신규 인력 부족 문제를 김두일 학회장은 학술·정책·산업을 연결하는 가교 역할, AI·DT 지적하며, 학회가 보유한 인적 자원을 적극 투입해 산업 생태계 등 첨단 기술 도입, 국제 교류 확대와 글로벌 위상 제고, 회원 중 회복에 기여하겠다고 밝혔다. 심의 운영 생태계 구축 등을 학회의 발전 방향으로 제시했다. 더 불어 그는 대한민국 상하수도 분야의 미래를 설계하고, 더 나아 가 세계적 수준의 전문 학회로 도약할 수 있도록 최선을 다할 것 을 약속했다."}, {"p": 12, "t": "Water Mark _ 맑은 물을 닮은 사람 기후위기와 물안보, 학회의 미래 전략 연결된 물, 확장되는 한국의 물 기술 기후위기와 물 부족은 특정 국가의 문제가 아니라 지구 생태계 김두일 학회장은 한국상하수도협회와의 관계를 “학회는 방향을 전체의 지속가능성을 위협하는 글로벌 아젠다다. 김두일 학회장 만들고, 협회는 길을 닦는다”고 표현했다. 학회가 연구와 정책을 은 지속가능한 관망관리, 자산관리, 탄소중립, 고도정수, AI 기반 제시하면 협회가 현장에서 실증·확산을 담당하는 상호보완적 협 운영을 연구해 왔으며, 이를 학회 활동과 연계해 센서·AI·DT 기반 력 구조를 강화하겠다는 것이다. 관리체계 구축, 데이터 품질 고도화, 국제 공동연구 확대를 추진할 그는 국제학회와의 협력을 통해 “한국 물 기술을 세계 시장으 계획이다. 로 확장시키겠다”는 목표를 내세웠다. 미국과 유럽 등 선진국의 그는 “물의 확보와 저장, 정수, 재이용, 재난 대응까지 국가 전략 관심을 기회로 삼아 AWWA, IWA, CESE와 공동 콘퍼런스 및 차원의 접근이 필요하다”며 학회가 국가 싱크탱크 역할을 수행 국제 공동연구를 추진하고, 이를 실제 사업으로 연결하겠다는 해야 한다고 강조했다. 또한 저탄소 정수·하수처리 공법, 고효율 계획이다. 관망 운영, 재생에너지 연계 연구를 통해 상하수도 시스템을 탄 김두일 학회장은 기후위기 시대에 상하수도가 국가 생존과 직결 소중립과 회복탄력성을 갖춘 인프라로 전환해야 한다는 비전을 된 전략 자산임을 강조하며, 학회가 기술·정책·글로벌 협력을 잇 제시했다. 는 국가 물안보 사령탑으로 자리매김해야 한다고 말했다. 아울러 또한 그는 대한상하수도학회가 지자체·공기업·기업과의 협력 해수담수화, 하수 재이용, 빗물 자원화, 비상용수 네트워크 등 다 창구 역할을 맡아 AI 기반 누수·싱크홀 예측, THM 실시간 예측, 원적 수자원 시스템 구축을 핵심 과제로 함께 논의해야 한다고 하수관 결함 자동판독을 위한 고품질 데이터 확보와 표준화를 제시했다. 추진하겠다고 전했다. 동시에 국제 물기술 표준화에도 적극 참여 해 국내 성과를 ISO·IWA·AWWA 등 국제 기준에 반영, 한국이 글로벌 룰 메이커로 자리매김하도록 하겠다는 목표를 밝혔다."}, {"p": 13, "t": "신년호 “\u0007물은 단순한 자원이 아니라 생명의 시작점입니다. 인체 대부분을 구성하고, 생태계의 흐름을 유지하며, 문명과 도시를 발전할 수 있게 하는 가장 기본적인 요소가 바로 물입니다. 상하수도는 이러한 물이 인류의 삶을 위해 \u0007 활용되고 정화되어, 흐르고 다시 자연으로 돌아가는 생명의 순환 시스템이라 할 수 있습니다.” 맑은 물, 미래로 흐르다 김두일 학회장은 학회의 학술 기능 강화와 국제 교류 확대를 약속하고, 다가올 창 립 40주년 행사를 철저히 준비하고 있다. 그는 상하수도를 “우리 삶을 지탱하는 가장 중요한 생명줄(Life Line)”이라 표현하며, 학회를 사람이 모이는 공간, 국가 물 관리의 새로운 기준을 제시하는 전략적 브레인으로 만들겠다는 포부를 밝혔다. 더불어 후배 연구자들에게는 세 가지 메시지를 전했다. 첫째, 물 문제를 단순한 기술 이 아닌 사람과 생명의 관점에서 바라볼 것. 둘째, 익숙한 길이 아닌 새로운 길을 개척할 것. 셋째, 한국에 머물지 않고 세계 무대를 향해 도전할 것. 그는 상하수도를 “과거의 산업이 아니라 미래를 설계하는 과학이자 생명을 지키 는 공공기술”이라 정의했다. 물 연구는 곧 도시의 안전을 보장하고 국민의 삶을 지 탱하며, 미래 세대의 생명을 이어가는 일이라는 점을 강조했다. 또한 전임 김건하 학회장을 시작으로 권지향 학회장에 더욱 성숙해진 AWWA와의 교류를 이어가, 국내 기업의 미국 시장 진출에 이바지하도록 하겠다는 포부를 드러냈다."}]}, {"id": "97-14", "no": 97, "label": "2026 신년호", "corner": "FOCUS KWWA 1", "title": "2025년 한국상하수도협회 회원 워크숍", "author": "", "start": 14, "end": 15, "pages": [{"p": 14, "t": "Write. 편집실 Water Mark _ FOCUS KWWA 1 겨울의 초입, 인천에 모인 한국상하수도협회 회원들의 열기는 차가운 위기를 기회로! 리더들이 던진 화두 바닷바람을 무색하게 만들었다. 기후위기와 디지털 전환이라는 큰 변화 속에서 정책의 방향을 공유하고, 현장의 목소리를 나누는 ‘2025년 한국 워크숍의 포문은 한국상하수도협회 유명수 상근부회장의 개회 상하수도협회 회원 워크숍’이 열렸다. 대한민국 상하수도의 현재와 미 사로 열렸다. 유 부회장은 현재 물산업이 처한 현실을 “AI를 통한 래에 대해 함께 치열하게 고민했던 현장을 소개한다. 기술 혁신, 글로벌 물산업과 물시장의 경쟁심화, 기후위기 시대 안전한 물 공급을 위한 혁신이라는 거대한 변화의 물결”로 정의 했다. 그는 이번 워크숍이 단순한 휴식과 교류를 넘어 “미래를 향 2025년 한국상하수도협회 회원 워크숍 한 방향을 함께 모색하는 논의의 장”이 되어야 함을 강조하며, 협 회가 앞으로도 정책·기술 지원과 국제협력을 통해 회원의 질적 도약을 이끄는 ‘든든한 축’이 되겠다는 비전을 제시했다. 이어 축사에 나선 기후에너지환경부 조희송 물환경정책관은 현 장의 노고에 깊은 감사를 표하며, 2026년을 앞둔 물 관리 정책의 3대 방향을 명확히 제시했다. 조 정책관은 “홍수와 가뭄의 반복, 미량오염물질 증가 등 복합적인 도전에 직면했다”라고 진단하며, ① 기후위기에 대응하는 회복력 있는 물환경 관리 체계 구축 ② 현 장 부담을 줄이는 과학·기술 기반의 스마트화 ③ 지속 가능한 상 기후위기와 디지털 전환의 파고를 넘어, 물산업의 새로운 이정표를 세우다 하수도 재정·운영 구조 마련을 약속했다. 특히 “현장의 전문성과 업계의 의견을 정책에 더욱 적극적으로 반영하겠다”라는 그의 발 언은 참석한 회원들에게 정부의 강력한 지원 의지를 확인시켰다."}, {"p": 15, "t": "신년호 뒤이어 한국물환경학회 이재우 부회장과 2026년도부터 임기를 시작 하는 대한상하수도학회 신임 학회장인 김두일 교수(단국대) 또한 축사 에서 “한국상하수도협회와 두 학회가 협력하여 좋은 성과를 내어 대한 민국 물산업 발전에 이바지할 수 있도록 노력하겠다”라며 포부를 밝혔다. 헌신과 열정의 주인공들: 우수회원 포상 개회식의 열기는 우수 회원 포상으로 이어지며 더욱 뜨거워졌다. 협회 발전과 회원 간 화합을 위해 헌신한 공로를 인정받은 6명의 수상자가 단상에 오르자, 장내는 존경과 축하의 박수로 가득 찼다. 협회의 미래비전과 현장과의 소통 유명수 상근부회장은 △진천군 상하수도사업소 정동근 수도관리팀장 △한국환경공단 최동진 대리 △㈜티엘티 박상봉 대표이사 △주식회 발표 이후에는 협회의 미래를 논의하는 중요한 시간이 마련되었다. 사 현대워터텍 박세웅 대표이사 △주식회사 수도씨앤지 엄필성 대표 먼저 국내 최대 규모의 물산업 전문 전시회인 ‘WATER KOREA(대한 이사 △㈜서용엔지니어링 김현식 팀장에게 협회장 표창을 수여했다. 민국 국제물산업박람회)’에 대한 소개와 발전 방향이 논의되었다. 묵묵히 현장을 지키며 혁신을 이끌어온 이들의 수상은, 기술과 정책 2026년 행사는 3월 18일부터 20일까지 부산 BEXCO에서 개최될 못지않게 중요한 것이 바로 물산업을 지탱하는 ‘사람’임을 다시금 일 예정이며, 물산업 분야 200여 개 기업이 출품하고 30여 건의 연계 깨워 준 순간이었다. 행사가 동시 개최되는 등 물산업의 국제적 위상을 높이기 위한 핵심 전략 창구임을 확인했다. 이어 마련된 ‘회원과의 소통’ 세션은 협회의 현장 소통 의지를 보여주는 기술과 경험의 공유: AI 혁신과 글로벌 성공 방정식 하이라이트였다. 윤여천 기획경영처장, 이상철 회원지원처장, 위미경 상수도처장,
