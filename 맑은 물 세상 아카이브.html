년을 축하하는 아리수 축 [디 0 토데다 원한 아리수름, 바리스타가 아리수로 제조한 커파-차 음료를 시민에게 제공하는가 하면 물맛 블라인드 테스트 아리수 페인팅 아리수 인생네컷포토존 등 아리수를 먹고 즐길 수 있는 다양 %. _ 인천시 상수도사업본부가 지난 8월4일 인천 펜타포트 록 페스티벌 개막일에참 [티 보[뢰 쳤다. 고도정수처리를 거쳐 친환경 페트병에 담긴 인천하 늘수는 냉동 처리돼 행사 당일 가장 시원하고 맛있는 상태로 관람객들에게 제공됐다. 행사 내내 인천하 늘수를 맛보기 위한 관람 ㅣ[크 객 들의 긴 줄이이어졌으며 음용 외에 장시간 햇빛 노출로 달아오른 몸의온도를 낮춰주는 얼 음팩으로 활용하는 이들도 있었다 아울러 이날 행사에는 수듯물 품질관리의 객관성 확보를 위해 다양한 계층의 인천 시민으로 구성한 '인천하 늘수 시민평가단 및 서포터즈가 직접 참여, 안심 수못물인천하 늘수라는 메시지를 전하며 인천 수 돌 음용 실천에 대한 시민 공감대를 \"개_ _ 대구광역시, 물절약사업 위한기초 조사실시 % _ 대구광역시가 물절약 사업 추진을 위한 기초작업으로 9월 한 딜간 관내 공공기관 [티천보[퇴 공중화장실 702개 소의 절수기 설치 현황 및 절수설비 설치 여건 등을 조사했다. 절수 설비는 별도 부속이나 기기를 추가로 장착하지 않아도 물을 적게 사용하도록 생산된 변기 및 수도곡 |[5 늦 지를, 절수 기기는 물 사용량을 줄이기 위해 변기나 수도꼭지에 추가로 장착하는 부속 이 나기 |브6 쫓수 기를 말한다 이번 조사는 관내 민간 시설의 절수기 설치를 권장하고 시민들에게 물 절약 문 하를 확산시키기 위한 사전작업으로, 공공기관 시설물을 대상으로 절수기 설치 상황과 절수 효과 등을살펴보는 데 목적을 뒷다 조사는 조사원이해당 시설 화장실 내 세면기 소변기 세 척밸브 수도 등을 확인해 수 돌이 적절한 수압을 유지하는지 또는 절수기 설치를위한 수압 에 큰 문제가 없는지를 살피는 방법으로 진행했다. 서울시, 수 듯 물 통수 115주년 기념식 개최"}, {"p": 44, "t": "국내 산업용 로봇 제조 기업인 탑전자산업이 수중 드론 로봇을 이용한 상수도관내부 탐사로[[털]봇 푸 ;[로 봇 기술을 개발했다 탑전자산업이 자체 개발한 로봇 수중 드론 은 최대 106809의 고수 압여 |탈당털4 프로펠러 추진력으로 물고기처럼 자유자제로 관 내부를 카메라로 탐사할수 있도 록 제작된 |르5했 모와 것이 특징이다. 이번 기술 개빌은 국내뿐 아니라 전 세계적으로 개빌 기술 사례가 없는 자체 추진력을 보유한 물고기형 수중 드론의 최초 상수관 탐사 기술 사례로서, 향후 한국수자 원공 사가 주도하는 헌대화 사업 및 지자체들이 정기적으로 시행하는 노후관 기술 진단사업, 유수 율 재고 및 누수 진단 사업 등에 매우 유용하게 활용될 것으로 기다감을 모으고 있다 적합성 검사를 위한 투자가 이미 진행 중이며 조만간 사업추진 계획이 확정될 예정이다 시노 ~ 과 방식의 정수 시스템 400다와 교체 필터 등 소도품을 공급한다고 밝혔다 현지 수질검사 및 펙스가자체 개발한정수 시스템은 냐 멤브레인 필터가 적용됐으며 태양광으로 동 작 할 수있 |[리뿐35 어 전기공급이 어려운 지역에서도 사용이 가능한 것이 장점이다. 또 화석연료를 사용해 물을 끝이는 에너지를 절감할 수 있어 탄소 배출량을 줄이는 데도 효과적이다. 한편, 시노펙스는 국 내에 소규모 정수 시스템 약 30기를 지방자치단체와 실증 사업을 통해 성공적으로 운영하고 천경제청)과 하수 재이용수 활성화를 위한 업무협약을 체결했다고 밝혔다. 이번 협약에 따라 (8 약 50만 톤의송도 하수처리수 재이용수를 공급받게 됐다 또 친환경 지속 가능 도시 조성을 |[릴 위한 하수 재이용수의 신규 활용 방안 모색에 상호 협력하기로 했다. 포스코와이드는 이번 업 무협약을 통해 상수도 사용량 절감과 탄소 배출량 감량 등 친환경 기업경영 추구에 도움이될 것으로 기 대하고 있다 한편, 인천경제청은 송도하수처리수 재이용 시설(규모 2 만0/일)을통 해 처리수를 도시 용수로 재이용할 수 있도록 해 송도국제도시 내 공원, 대규모 건물 등에 청 소용 물로 공급하고 있다."}, {"p": 45, "t": "끊임없이 발전하고 있는 물산업의 깊이 들여다보는 시간을 갖습니다. 오늘과 내일에 대해 글로벌 이슈 50 맑은 물세상"}]}, {"id": "88-46", "no": 88, "label": "2023 가을호", "corner": "핫 이슈", "title": "친환경 수변도시 조성사업 추진방향", "author": "김태식(한국하천협회 정책개발위원회 부위원장·(주)도화엔지니어링 이사)", "start": 46, "end": 49, "pages": [{"p": 46, "t": "글 김태식(한국하천협회 정책개발위원회 부 위원장-(주)도 화엔지니어링 이사) 최근 우리나라에서도 도시의 경쟁력을 높이고, 삶의 환경을 개선하기 위해 지역맞춤형 통합 하천 사업(환경부); 스마트 물순환도시 조성 사업(서울시); \"부산 에 코 델타시티0<-\\362()' 등이 추진되고 있다. 이와 연계해 친환경 수변도시 조성사업의 대표적 사례로서 하천의 가치를 향 상시키고 지역이 공감하는 홍수안전 기반의 자 연 친화 적-창의적 하천모델, 지 역맞춤형 통합 하천사업 추진방향 에 대해 살펴보자."}, {"p": 47, "t": "도시라는 틀을 갖추기 위한 기장 기본적이고 본질직인 조건은'물이다. 과거 인류문명의 발전 과정에서도 정주 환경에서는 함상 물이 존재해 왔으며 농경문화 를 중심으로 문명이 시작되는 단계에서 하천은 도시의 경제적 기반과 공간적 토대를 제공하는 중요한 역할을 해왔다. 이처럼 하천과 하천 주변의 수변공간은 도시의 발전과 문화의 형성에 중요한 역할을 담당해 온 중요한 도시 공간이었으며 시민들의 일상에 많은 영 향을미치고 있다 지역맞춤형 통합하천사업이란 우리나라의 경우 수변공간은 치 수(87)와 이 수(70) 등 기능적인 목적 을 위주로 관리되고 사용됐으며, 시민들의 이용을 위한 친수 기능으로 의 활용이 부족했고, 집근성도 결여되면서 도시공간과는 단절돼왔다. 지역맞춤형 통합하천 사업은 이러한 하천 본래의 기능 회복 중심의하 천 정비사업에서 벗어나 하천이 홈수-재난에 안전하면서도 공간의다 목적 활용, 수질.생태 환경 개선, 하천과 지역발전 연계 역사-문화-레 저- 관광 인프라 확충, 지역 거버넌스 구축 등 지역의 다양한 요구 및 발전 전략을 반영할 수 있는 새로운 사업추진 체계이다 이를 위해 하천 이용 수요자(지방자치단체)가 직점 디자인에 참여하는 공모 형식의 지역 참 여제도를 통해 하천뿐만 아니라 하천 공간과 지역 인프라를 함께 가꾸 는 통합적인 사업이 될 수 있도록국가와 지역이 협력해 추진하고 있다. 지역맞춤형 통합하천사업의 특징 @ 도시계획과의 연계융합 도시재생과 하천 사업의 융합, 하천의 통합적인 환경개선 및 주변 지역 과의 연계성 확보, 전략적인 도시계획 등을 통해 하천 가치 항상과 도시 발전을 동시에 추구한다. 울산 여천천, 창원 회원천, 전주 노송천 등은 도시와 연계한 하천 사업을 통해 주변 상권 활성화, 생활 인프라 향상 등 다양한파급효과 를 창출했다. @ 지역의 역사-문화-관광 자원화 도시하천과 지역(자연 자원, 문화-역사 자원 등)을 연계한 맞춤형 하천 정비 및 생태:문화시설 조성으로 하천과 주변 지역을 관광 자 원화한다. 원을 조성, 다양한 문화행사 등이 수시로 개 최되는 등 연간 700만 명의"}, {"p": 48, "t": "임 미술관 등을 활용한 문화 벨트 조성, 수변공간과 주변 지역 통합디 자인 추구를 통해 관광도시로 발전했다. 양 구서천 및 함평천의 경우 구하도 및 하천변 브라운필드를 하천 공간으로 편 입하고 지 역축제, 레 포츠 공간으로 활용하여 지역 경 제발전에 이 바지하고 있다. @ 물관리 사업의 통합화 치수, 이수, 수질, 수생태계, 친 수사업 등 다양하고 복합적인 하천 사 업을 특성에 맞게 패키시형 사업으로 추진한다. 제 방-하도정비 등 치 수 사업, 하천 유시유량 확보 등 이수 사업, 오니 토 준설' 하수시설 개 선 등 수질개선 사업, 친수 및 생 태 공 간- 도시 연결 등 생활 하천 사업, 능 회복 사업 등을 통합적으로 실시하고 도시계획 및 지 역발전 전략 과 연계해 통합적인 시너지 효과를누린다. 지역의 특성 을 살려 하천을 브랜 드화해 지 역 의 이미지 향상과 경제 출처: 새로운 하전가치 창조를 위한 하천사업 제안공모(한국하전협회) 활성화에 이바지할 수 있다. 영국 게이 츠헤드는 유령 도 시에서 '컬쳐 직 센터 등이 들어 서 면서 문화관광 도시로 탈바꿈했다. 미국의 샌안 토니오는 리 버 워 크를 통해 하천이 단지 자연 환경과 녹색 네 트 워 크에 그치는 것이 아니라 도시의 상 업- 문화 공간과 연결되어 ' 보행자의 도 지 역맞춤형 통합하천사업 추진방향제안 및 결론 합, 친 수' 문화 공간을 통한 지역발전 등 시너지 효과 를 기대할 수 있 다. 이러한 긍적 적인 효과 를 위해서는 홍수 안전이 우선돼야 하며 이 를 기 반으로 친환경 수변 문화 공간 조성, 지 역 발전 과 연계한 패키지 형 사업, 지 역발전을 위한 창의적인 사업 등이 추진돼야 할 것이다. 이를 위해서는 무엇보다도 관계 기관의 역 할이 중요하다. 마지 막으 로 지역맞춤형 통합하천 사업의 바람직한 추진 방향에 대해 몇 가지 세이지 뮤 직 센터"}, {"p": 49, "t": "환경부 등 중앙정 부는 수량' 수질' 수생태 등이 어우러진 하 천 관리 사 _ 은 많지 않다 하전을 홍수에 안선함과 동시에 그 주변 도시발전 등과 업을 시행하기 위한 제도적 기 반과 시방하전 정 비 사업 의 국 고 보 소를 _ 조화되고 자연, 레서, 문화 등을 즐길 수 있는 복합공간으로 개 선 하는 위한 관계 법령 개정이 시급하다. 그간 하천 사업은치수, 이수, 생태， _ 기본방향은 정부와 지방자치단체가 마찬가지다. 지방자치단체는 하 수질, 친수 등의 분절된 사업추진으로 사업 중복, 예산 낭비 등의 문 _ 천과 주변 도시공간의 연계성 확보를 위해 중앙부처와 지속적으로 제가 지속적으로 제기되어 왔다. 통합물관리 시 대 에 하천 유역 중심 __ 협업하고 도시의 발전 전략을 사업계획에 포함하는 것이 무엇보다도 의 통합적인 관리를 위해서는 치 수를 중심으로 수질, 수 생태,친 수문 _ 중요하다. 하천을 지역의 브랜드화에 활용하기 위해서는 시너지 효 화 뿐만 아니라 도시의 다양한 기능과 연계할수 있는 새 로 운체계의 _ 과가 높은 사업을 발굴하고 지역의 발선 전략과 연 계해야할 것이다. 도입이 필요하다. 최근의 서울 도림천, 포항 냉천 등의 홍수 피해에서 알 수 있듯이 국가의 책무는 국가하천의 홍수 방어가아니고 국 민의 _ 하천이 지역과 주민을 위한 생활공간으로 재탄생하기 위해서는 하천 안전에 있다. 모든 지방하천에 대해서 국고보 조가 어 렵 다면 지방자_ 의 본질적인 기능 회복도 중요하지만 접근이 쉽고 도시공간과의 생 치 단제에서 요구하는 특정 하천에 대해서는 가 능하도록 제도를보완 _ 태적-공유적 연결성 확보가 필요하다. 도시공간의 맥락 속에서 하천 @ 지방정부 지 방자치 단체는 지역 특성과 지역주민 수요에맞는 대상 하전 선정 _ 회복에만 집중하는 하천 사업을 보완-발전시 켜 시역맞춤형 통합하천 과 선정 이후의 협업- 참여가 무엇보다 중요하다. 도시 하 천 의 친수공_ 사업이 안전하고 깨끗하며 유역주민들이 쉽게 접근할 수 있는 어메 간 및 생태공간으로 조성하는 하천 사 업이 2000년대 이 후부터 활발 _ 니티 공간으로, 생태- 문화적 공간으로, 창조적 공간으로 국민이 공감 하게 진행되고는 있으나 이제까지 하천별 차별화가이루어진 하천 _ 하고 다가 갈 수 있는 사업으로 추진되기를 기대한다. 의 가 치를 향상시킬 수 있는 통합적인 사업 아이템의 발굴과 다양한 사업을 연계해 추신할 수 있는 사업 수행 체계 마런이 필요하다. 이러 한 측면에서 단지 치수, 이수, 수질, 수생태, 친수 등 하전 본래의 기능"}]}, {"id": "88-50", "no": 88, "label": "2023 가을호", "corner": "글로벌 이슈", "title": "기후 변화 대응 및 통합물관리를 위한 자연기반해법(NbS)", "author": "김이형(공주대학교 스마트인프라공학과 교수·(사)한국습지학회 회장)", "start": 50, "end": 53, "pages": [{"p": 50, "t": "국제사회가2050년 탄소중립 을 목표로 내걸고저탄소 사회로의 전환을 모색하고 있는가운데, , 세 자연 그 본래의 기능을 재평가하며 기후위기의 솔루션을 자연에서 찾는 사 연기 반해 법(469)이 ^\" 중요한 대안으로 떠오르고 있다. 자연기반해법의 정확한정의는 무엇이며, 이를 활용한 물관리 방안에는 어떤 것이 있는지 알아보 자."}, {"p": 51, "t": "시난 1992년 6월 3일 부터 14일까시 브라질 리 우데 자 네 이 루에서는 세계 각국 정상들과 민 간단체들이 참가 해 지구 환경보전 문제에 대해 논의하는 리우회 의(정부 대표 중심의 유엔환경개발회의와 민간단체 중심의 지구 환경 회의)가 열렸다. 시구를 건강하게, 미래를 풍요롭게'라는 슬로건 아래 개최된 당시 리우회의에서 이후 유엔은 기후 변화, 생물 다양성, 시속 가능한 목표 달성을 위해 사연 기 반해 법(3나62-63560 5044005, 465)을 중요한 이행수단으로 평가하면서 국제 사회모의 보급을 추진하고 있다. 자연기반해법은 자연이 가 진 원 리(볼질순환, 물순환, 에너지 흐름)를 사회, 경제, 문화 전반에 활용함으로써 복 원 력@5116006)을 가진 기후 변화,생물 다양성,통합 물관리 이행을 위한 자연기반 해법 활용 경제 선 진국에 해당하는 우리나라의 물관리 현황은 아래와 같다. ㅎ *2021년 기준 우리 나라의 하수도 보 급 률은95%, 상수도 보 급 률은99%로 세계 최고시만 통합물관리 미흡 으로 홍 수- 가붐, 수질 오 염- 녹조, 하천 건천화 등이 지속적으로 발생 생태계), 15(육상 생태계)는 다소 정체 또는 악화 * 환경부 제3차 비 점 오염 관리 종합대 책' 에 서는 국내 하천 유입 부 하의 약 70%가 비점오염 원 에서 유입 된다 고 보 고하고 있으나 유역 물순환에 대한 명확한 법적 근거가 미약해 효율적 비점 오염관리 미흡 * 우리나라 하천의건기 시 유 량의 약 50% 이상은 시하수에서 배 출되며 나머시는 하수처 리시 설에서 기인하 는 유량이나 유역의 자연계 및 인공계 물순환 연계 미흡으로 하천의 수질개 선은 한계 *최근100년간 우리 나라의 평균 대기 온도, 지표 몬도 및 호우일 수는 증가하고 있으나 평균 상대 습도는 지 속적으로 감소하면서 홍수와 감의 극한 기후, 녹조 발생, 비점 오염 배출량, 열섬현상, 토시로부터 의 탄소 발생량 등 다양한 환경 관련 문제 발생 빈도 증가 세계 경제 포 럼이 2022년에 발행한\"글로벌 위기보 고서」에 의하면, 향후 10년 이내 발생할 수 있는 10가지 위 기 요인 중에서 상위 5위가 기후 대응 실파, 극한 기후, 생물 다양성 훼손, 자연 자원 위기, 사람에 의한 환경 훼손 등 환경적요인이다. 물 은 대기, 토양, 하천과 바다를 순환하면서 시 구생태계가 회복탄력성 을 가지게 한 다. 건전한 물순환 체계구축은 지구생태계에서 사람과 자연이 지속 가 능성을 준다는 것을 의미한다. 그동안 정부는 물관리 일원화, 물관리 기본법 시행, 하천 관련 사업 지방이양을 통해 물순환 건전성을 확보함으로써 통합물관리를 가 능하게 했다. 그러나 자연계 및 인공계 물순환을 연계하는 자연 기반해법 적용 미흡으로 통 합물관리 효과는 낮은 상황이다."}, {"p": 52, "t": "소규모 하 수처리시설 소규모 하 수처리시설 자유수면인공 습지 홍수터 복원"}, {"p": 53, "t": "자연 기 반해 법 은 건전한 물 순환 체 계구축을 위한 중요한 기술적 접근에 해당한다. 개 별 법(하수도법, 물재이 용법, 지 하수법, 하천 법, 물환경보전법, 수계 법, 가 축분뇨법 등)에 의해 수행되는 물관리 사업에 연계될 경우 수질 정화, 탄소 흡수 및 저상, 통합 물관리, 홍수 및 침수 관리, 기후 대응 능력 향상, 주민 친화 기능 강화 등 의 생태계 서비스 기 능을 가지도록 한다. 또한 자연기반해법은 물관리 기본법 시행에 따른 통합물 관리 사업, 즉 하천-유역 연계 물순환 기반통합 집 중형 물관리사업, 지 하수-지표수 연계 물관리 사업, 자연기반해법 기 반 탄소흡수 연계 물순환 사업, 도시 인 공계 및 자연계 연계 물순환 구축 사업 등에 적 용됨으로써 다양한 효 과를 기대할 수 있다. \" 탄소저장기능이 향상된 주거 및 공공시설 인공녹지 주거 및 공공시설 \"기 후변화 적응 도 시공원 및 유수지 녹지 습지조성 물관리에 적 용되는 자연기 반 해법 물관리에 적 용되는 자연 기 반해 법 은 생태수로, 인 공습지, 수변 생태벨트, 그린인프라, 저 영 향개발기 법, 옥상 녹화, 그린 월, 홍수터 복원, 천변 저류시, 제방 재배치 등 다양하다. 자연기반해법은 농업 및 축산단지 오염원 관리, 마을 및 도시 오염원 관리, 생태하천 복원사업 등에 다양한 형태로적용될 수 있다. 현재 국가에서는 자연 기반해 법을 활용하는 다양한 정책 및 기 술개발 연구가수행 중이다. 아울러, 국가물관 리 위 원회는 사연기반해법을 하수도 관리, 비점오염원 및 유역 관리, 하천 관리 등에 적용하기 위해 자연기반 해법을 활용한 통합물관리 제도개선' 연구를 진행하고 있다. 또 환경부는 자연기반해법 중에서 수질 정화, 생 물 다양성 향상, 탄소 흡수 및 저장 기능 강화 등의 기 능을 가진 다양한 유형의 습지(도심 습시, 하천 습시, 호 소 습시, 기수 습지, 묵논 습지 등)를 개발하기 위해 '습시 가치 증진 기술 개발'에 박차 를 가하고 있다. 기술 개발” 환경 부의 도심지 내 자연 기 반 해 법(465) 7|반의 습지 조성 방안 \"생태계서비스 기능 향상 광장형 습지조성 기술 개발”"}]}, {"id": "88-54", "no": 88, "label": "2023 가을호", "corner": "물산업은 지금", "title": "한 눈에 보는 국내외 물시장 동향", "author": "", "start": 54, "end": 57, "pages": [{"p": 54, "t": "국내외 물시장 동 헝 내년도 신규 탬 건설 및 리모델링 추진 계획 환경부는 지난 9월 6일 한깅홈수통제소에서 전문가 간담회를열고， _ 간 사절단으로 참여하고 환경부, 외교부, 한국수자원공사, 한국환경 이날 간담회에 나온 의견을 종합적으로 반영해 내년부터 전국 10곳 공단 및 한국물산업협의회가 참여했다. 의 신규 덤 건설 및 기존 대 리모델링을 위한 기본 구상 및 타당성 _ 물산업 협력회의는 우리나라와 카자흐스탄 양국의 물 협력 분야를 조사를 추진할계획이라고 밝혔다 이날 간담회에는 한국수자 원 공사 _ 모색하고, 국내 물 분야 기업을 카자흐스탄 발주처에 소개하는 등 국 한국건설기술연구원 국토연구원 학계 등 관련 전문가 10 명 이참_ 내 기업의 수출.-수주를 지원하기 위해 마련됐다 석했으며 한화진 환경부 장관이 회의를주재했다 환경부는 지난 8월29일 발표한 내년도 예산안에서 신규 댄설 및 억 원을 책정했다. 이들은 신규 덤 건설 및 기존 대 활용성을 높이는 방안 에 대 해 다양 하고 구체적인 방안을 논의했다 특히 2010년 이후 기물 발 생 이 급 _ 드코즈 및 카자흐 투자청이 참여했다 증하고, 극한 호우 발생으로2019년 이후 홈수로 인한 사망 및 피해 _ 한편 외교부는 이번 협력회의 전에 카자흐스탄 물 기관 담당자 들과 가 과거에 비해 증가하는 등 일상화된 기후 위기 상황에서 국 민 의안 _ 사전 면담을 진행행으며 현지 요청을 반영하여 수처리 기자재, 원격 전을 최우선으로 하는 물관리를 위한 효과적인 물그릇 확보 방 안에 _ 제어 및 자동화 스마트물관리 기술, 수자원 기반 시설 건설 분야 등 대해 논의했다. 전문가들은 중소규모 신규 탬뿐만 아니라 기존 농업용 저 수 지를 활 _ 손옥주 환경부 수자 원정책관은 \"카자흐스탄은 수자원 기반 시설의 용하여 이치수 용량을 적극 활용해야한다는 의견을 내났다. 또 한내_ 발주 수요가 늘어나는 유망 국가 중 하나\"라며, \"양국 기관 간 협력을 년부터 덤 건설 등을 위한 기본 구상 및 타당성조사 를 추진할 때 지역 _ 통해 국내 물산업 분야 수출이 확대될 것으로 기 대된다\"라고 밝혔다. 의 수용성이 매우 중요하며, 지역 의견 수렴을 위해 지자체와 협의하 고, 덤 주변 지역의 정주 여건을 개선해 관광을 활성화하는 방안 등을 다각적으로 모색해야한다고 의견을 모았다. 환경부는 이날 전문가 간담회에서 나온 의견을 종합적으로 검토하 여 신규 덤 건설 및 기존 덤 리모델링에 대한 구체적인 방안에 반영 할 계획이다 묶 시장 동향 # 수 사원 기 반 시설 발주 수요 #물산업 수출 확ㄷ 환경부와 외교부가 우리나라 물산업의 해외 수출 활성화 를 위해 '한 협력회의는 양국의 물 분야 담당자들이 자 국의 물 관리 정책 및 수자 원 기반 시설 현황을 소개하고, 협력사절단에 참여하는 8개 국내 기 원부 수자원위원회, 산업인프라개발부와 물 관리 국영기업인 카즈보 현지 맞춤형 협력회의를 준비했다"}, {"p": 55, "t": "사업 및 수질 개선 사업 등에 편성했다. 금강수계관리기금 지원 계획을 보면 상수원 및 수질 개선을위해 환 _ 증진시켜 싱가포르의 물 지속 가 능성에 한 발 더 다가서게 됐다. 경 기초시설 설치비 264억 원과 재정 여건이 열악한 상수원 상 류지 _ 1990년대에 싱가포르에서 사용된 물관리 시스템을 변화시키기 위해 역 지자체에운영비 355억 원 등 환경기 초 시 설 에 총 619억,상 수 원관 _ 고안된 ㅁ55(대심도 터널 하수도 시스템)는 사용된 물의 집수,처리, 리지역 지정으로 인해 행위 규제를 받고 있는 지 역 주 민 들의 소득 증 대와 복지 증진 등 주민 지 원 사 업에 235억 원을 투입할 계획이다. 또 상수원 보호구역, 수변구역 등의 토시매입 및 수변 생태 벨트조성 _ 055 2단계는길이 9807의 대심도 터널과 연결 하수관망 네트워크 억 원, 수질오염총량제 시행 지자체의 오염총량관 리 사 업에 53억원， ㅁ300 건설이 포함돼 있다. 새로운 인프라 구 성 요 소는0155 네트워 환경기초조사와 비점오염 저감사업 등 기타 수실개선 사 업에 101억_ 크를 확장하여 도심 지역과 텐가타 운(16783! 1007) 및 주몽 호수지 원을 투자할 계획이다. 2024년도 금강수계관리기금 운용계획안은 국회의 심 의의결을 거 쳐 올해 12월 2일 확정될 예정 이다. #물 재이용 증진 싱가포 르의 국립 수 자원청ㅁ0!8가 '대심도 터널 하수도 시 스 템0(0660 했다. 이로써 ㅁ08는 물 재이용을 기반 시설을 마련하고, 물 재이용을 매립과 배출에 대한 장기적인 요구를 충족시키기 위해 설계된 대규 모 지하 프로젝 트이다 구() 사08 132 미50100)와 같은 향후 개발 지역을 포함해 싱가포르 서부지역의 절반까지 서 비스를 제 공 한다 0155의 건설은 그 규모와 복잡성 때문에 두 단계로 나누어 수행됐 다. 1 단계는 싱가포르의 동부지역 절반을 대 상 으로 하며, 2008년에 완료되었다. 2019년에 시작된 2단계 터널링 공사는 깊은 전문 지식 과 상당한 사전 준비 작업이 필요한 고도로 조성된 지역을 통과하는 어려운 과정이었다. 0155 2단계 시스템과 투아스 물재생 시 설이 2026년에 완공이 되 면 국 립 수 자 원 청0462) 통합 폐기물 관리 시설과 함께 싱가포르 최초 6×%459)를 구성하여 에너지를 완전히 자 급자족할 수 있게 된다. * 자료 출처 : 워 터저널"}, {"p": 56, "t": "상 동안 안전하고 지속 가능한 수 물 공급을 제공하는 데 필요한 조 범위한 공개 협의를 거쳐 고객, 지역 사회, 이 해관계자 그룹의 의 견 을 주의 깊게 검토하고 경청하여 계획을 수립한 결과가 반영 됐다. 템즈워터는 기후변화, 인구 증가에 대응하고 환경을 보호하고, 강과 물)에서 취수하는 물의 양을줄이기 위해 2075년까지 고객이 올림픽 만0)의 물이 추가로 필요할 것으로 예측하고 있다. 템 즈워 터 는 영국 남동부 지역에 수듯물을 공급하는 6개 물 회사들의 와 협 력하여 이 문제에 대한 지역적 대응을 조정해왔다. 템즈워터의 수정된 수자원 관리 계획 초 안에는오는 2050년까지 를 절반 이상 줄이는 누수 발견 및 복구, 현재 이 지역 1인당 물 사용 __ 미국의 새로운 물재이용 프로그램은 프로젝트 규모에 제한을 두지 량 약 140리터를2050년까지 110리터로 술이는 물 사용량 소설, 그 __ 않고, 대규모 프로젝트에 인센티 브를 제공한다고 밝혔다. 이는 사용 리고 가 물에 대응하기 위해 물 재 활 용을 통해 지 원 되는 테 딩턴 보 __ 할 수 없는 수원을 깨끗하고 신뢰할 수 있도록 만들어 지역사회가 가 저 수 시(수원지) 2040년 완공등의 내용이포함돼 있다. 미국이 새로운 대규모 물 재이용 프로 그램 에 착수했다고 밝혔다. 지 억 8천만 달러의 초기 자금을 가 뭉과 기후변화에 도 취 약 하지 않은 새로운 물 공급을 목표로 하는 프 로젝 트에 사용할 수 있도록 했다. 미 물에 대비할 수 있는 물을 공급하는데 중요한 역할을 할 것이라고 밝 이번 발표는 미국 서부 지역의 계속되는 가물을 포함해 콜로라도 강 유역과 이에 의존하는 모든 지 역사회 를 기 후변 화에 더욱 탄력 적으로 대처하기 위한 전 정부적 노력의 일환으로 바이 는 행정 부가 시행하 고 있는 많은 역사적 투자 중 하나이다. 의제의 투자를 통해 매립국은 서부 전역의 다양한 물 재활용 프로젝 트에 대한 작업을 지원하고 있다. 이 새로운 프로그램으로 우리는 지 역 상수도를 재배하고 더 많은 사람들에게 봉사하기 위한 더 큰 프로 젝트에 자 금을 지원할수 있을 것 이 다”라고 말했다 억 달러 를 투자했다."}]}, {"id": "88-58", "no": 88, "label": "2023 가을호", "corner": "협회정보", "title": "2023년 4분기 물산업인재교육원 교육 일정", "author": "", "start": 58, "end": 59, "pages": [{"p": 58, "t": "물산업인재교육원 교육 일정 하수도 . 하 수도행 정과정 . 스마트 하수도 이해광 ㆍ. 고도정수처리운영과정. 、~~. . 배급수관리기본과정 정수장 수질사고 사례 및 대응과정 . 하수도 우수사례 탐방과정 _ ㅎㅎ 하수관로 정비 및 관리과정 수질오염 및 오염 관리 과정 .상하수도 안전관리과덩 _~ ."}, {"p": 59, "t": "한국상하수 도협회 교육 담당자 연락 사업주 위탁교육 컨소시엄 재직자 교육 ! 하수 협회 상수관망 이해 및 관망 유지 시스템 운영 상수도관망 블 록시스템 구축 및 유지 관리 _ㅣ일 7시간 상수도 관망해석 옥내급수관 세 척 갱생 하 수 처 리시설 대행성 과평가 하수처리시설 대행성과평가( 온라 인。^1일 6시간_ 무료 하수도공사 안전 관리 하수관로 설계 및 관 리 역량 강화 탄소중립 실현 이 해(온라인) 상 하수 도제품 품질 인증 교육운영팀 박희 아 연구원 교육 기획팀 박지윤 연구원 교육 기획팀 박지윤 연구원 1일6 시간_ 무료 ※10인 이상 신청 시 신청기업으로 출장교육 가 능(일정협의 가능) * 대규모 기업의 경 우는20% 자부담 발생"}]}, {"id": "88-60", "no": 88, "label": "2023 가을호", "corner": "협회소식", "title": "한국상하수도협회 제8기 신임직 이사 35인 위촉 외", "author": "", "start": 60, "end": 65, "pages": [{"p": 60, "t": "뼈 ㅣ 한국상하수도협회 점기총회 완료됐다. 현재 의 협회가 있기까지 물 심 양면으로 지원해 온 1~7기 이사진의 뒤를 이어 활동하게 될 8기 이사진은세계적으로 당면한 기후 위기 시대 속 기몸 -수질 등 물 문제 대한민국 상하수도관련 이슈 해결 및 개선을 위해 협 회에 힘을 보탤 예정이다. 제8기 선임직이사 35인 위족"}, {"p": 61, "t": "사업자회원 겠 : 한국상하수 도 험희 … 서물 특별시 _ : _ 부산 광역시 신진정공_ 、 _ 에코비 트워터 _、 도화엔지니어링 ㅣ (5서용엔지니어링 〉 : 대한상하수도 학회 : 한국물환경학 회:한국싱하수도기술시회:"}, {"p": 62, "t": "물산업인재교육원서울역 분소 개소식 한국상하수도협회(이하 협회)는 지난 7월 , 협회 이용자 편 리 성 및더 _ 한국상하수도협회 는 8월18일「2023년 물산업 수출지원 사업 설명 나은 회 원서비스를 제공하기 위해 교통의 요충지 서울역 인근 교육 __ 회」를 개최했다. 이번 설명회에는 협회, 기업회원 등 국내 물산업수 장을 새로이 구축했다. 교 육장(청 파 홀) 은 최대 66명 수용 가 능하고_ 출기업 및 관련 기관의 임직원 약 90여 명이 참석했다. 특히 @에코 홀) 은 최대 20명 수용 가 능하며 전자칠판, 스피커 등이 구 비돼있다 __ 업 13개사의 대표이사가 참석해 수출에 대한 관심과 물산업 수출지 이번 서울역 분소는 상하수도 및 물산입분야 인재 양성을위한 교육 _ 원단에 대한 기대를 나타냈다 협회 물산입 수출지원단은 타 수출지 과 회의 등에 사용될 예정이다 또한 협회는 회원 및 관련 이 용 객 들에 _ 원기관과의 사업 간 중복을 지양하고 기존 수출지원 사업들이 포괄 게 더 나은 서비스 제공을 위해 교육환경을 지 속 적으로 개선할예정 _ 하지 못한 사각지대 해소를 위한 물류비 절감사업 등 특화사업을 제 ※ 물산업인재교육원 서울역 분소 상세 주소:서울시 용산구 첨파로345, 6) 한국 싱하수도협회 서울역 교육장 개소 ㅇ 한국상하수도협회 시했다. 협회는 설명회에서 나온 현장 목소리를 적극 반영해 수출지 원 사업 을 보완하고4분기 본격 추 진 함으 정체에놓인 국내 물기업들이 새로운 성장 동력을 확보할 수 있도록 다각적인 수출지원사업을 펼칠 예정이다 ※104/0/4뉴스의자세한 내용은협회 홈페이지에서 확인하실 수 있습니다. 사업 설명회 개최"}, {"p": 63, "t": "수 듯 물 카페 차량'부산&대구 현장 홍보 실시 로 있는 수듯물홍보협의회의 '수 9월 3일까지 부산 광 역시에서 일 린 '2023 국제환경 에너 지산업전 했다. 수 듯물홍 보협 의 회 는 환경 부,7개 특- 광역시, 제주특별자치 수듯물에 대한 올바른 정보와 긍정적 가치를 알리고 국 민과 소 통하_ 출 선도기업 의 전문가 총 28명으로 구성됐으며, 임 기 는 2년 이다. 는 수듯물 통합홍보 활동을 전 개하고 있다. 이번 현상 홍보는 우수한 수365' 와 대구광역시의 수듯물 '청 라수' 홍보가 진행됐다. 행사 를 찾 대비 탄소 배출량이 적은 숫물에 대한 친환경 가지 확산 및 우리집 수듯물 안심확인제\" 등 다양한 정보를 제 공했다. 수듯물홍보협의회 00668 제는는 쳐 전문가 들의 종합적이고 체계적인 자문의 필요성에 따라, 협회 물산 6 북 --사문단)은 협회가 새롭게 추진하는 물산업 수출지원 업무 전반에 걸 한국 상하수도 협 회 는 9월4일 협회 비상홀에서 「물산업 수출시원 자 문위원 위촉식 및 간담회」를 개최했다. 물산업 수출지원 자문단(이하 업- 해외협력 특 별 위 원회(23.7.14)에서 자문단 구성의 건을 의 결함으 로써 마련된 기구이다 자둔단은 수출현황 및 애로 파악을 위해 지난 6월 실시한 '기업회원 수출현황 조시' 결과를 반영해 중소기업 특화 분과, 해외건설 연계 분과, 전시-마케팅 분과, 인증'물류 분과, 녹색- 환 경 및 물산업 분과 등 5개 분과로 구성됐다. 자문위원은 대한무역투자 진흥공사, 중소벤처 기 업진흥공단, 한국수출입은행, 한국환경산업 기 ※16070/ㅅ뉴스의 자세한 내용은 협회 홈페이지에서 확인하실 수 있습니다. 간담회 개최"}, {"p": 64, "t": "기 후위기 시대 물관리-물산업 발전을 한국상하수도협회는 지난 9월 6일,7일 양일간 광주 김대중컨 벤 션센ㆍ 지난 7원 진행된 '2023 상반기 한국상하수도협회 우수식원 투표에서 터 에서 '기 후위 기 시대 물관리- 물산업 발전 을 혁신 워크숍 및 2023년 수도사업본부장 협의회' 를 개 최 했다. 이번 행사는'2023 대한민국 기 후환경 에 너 지 대 전, '대한상하수도학회 학술행 사'와 연계해 올해 처음 개최한 행사로 정부 지방자치단체 학회, 물기업,유관기관 등 약150 여 명이 참석했다. 행사 첫날은 전국 수도사업본부장 협의회의 현안 사항 논의, 공 공 기 관의 물산업 관련 주제 발표, 혁신 물기업의 기 술- 제 품 발표와 함께 행사장 내 전시 대를 마련해 물기 업 기 술-제 품 을 전시 소개하는 시간으로 꾸며졌다. 다음 날은 물산업 수출을 위한 지원제 혁신 워크숍 개최 경 영 관리 팀 정 춘훈 대리, 교육기획팀 박강주 우수직원으로 선정됐다. 등 자산업무, 안전 업무, 보안 업무 등)의 공로를 인정 받았으며, 박강 주 연구원은 환경부 물산업 전문인력 양성사업(교육생 모집 .선발, 학 사관리 총괄, 대학교 업 무 협약 \\10ㄴ4 인재개발위원회 운영 등)의 공로 ※ 10/0뉴스의 자세한 내 용은 협회 홈페 이지 에 서 확인하실 수 있습니다. 교 육기획팀 우수직원 소개"}, {"p": 65, "t": "상수도설계 기준해설편 관련해 최신 상수도설계 기준 등을 반영한 「상수도설 계기준 해설편 개 정 판)」 에 는 지난 2020년 해설편 최초 발간 이후 개정된 상수도 설 계 기 준(2022.2.17 개정)을 비롯해 유충 발생 등 위 생문제, 기 후변화 와 같은 기 초연 구들의 결과가 반영 돼 있습니다. 이번에 발간된 「상수 도설계기준 해 설 편(2023 개성 판)」은 협회 홈페이지 [ 알 림/성 보제공 - 련 업무에 유용하게 사용하시기 바랍니다. 2023년 4분기 상수도관망시 설운영 관리사 양 성과정 일정 안내 제2조에 따라 협회 가 운영 하는 상수도관망시 설운영관리사 양성과정 의 2023년도 상반기 일정을 다음과 같이 공 시합니다. ※ 상기 일정은 변동이 가능합니다. ※ 각 회차별 본 공고를 반드시 확인 바라며, 이를 확인하지 않아 발생하는 등을통해 구입하실 수 있습니다. 하수 도설계 기준 해 설 편(2020)이 최 신 자 료이며, 2020년 이후 하수도설계기준 개정 내용은 아식 반영 되 어 있지 않지만, 관련 업 무에 유용하게 사용하시기 바랍니다 지방상수도 현대화사업 성 과판정 진하고 있는 성과판정위원회 운영 업 무와 관련해 수도사업 자가 제출 하는 성과판정 계 획 서(보완) 및 성과보증보고서(신설) 표준 양식 을 마 련 했습니다. 지 방상수도 현대화사업 을 추진 중인 지 방자치 단체 와 사 업 관리 수탁기 관( 공공 전 문기관, 건 설사업관리 용역 사, 시공사 등)에 서 심 의 요청자료 작성 시 참고하시기 바랍니다 는 심 의 요청 자료 작성 시 참고하시기 바랍니다. 나. 관련근거: 지방상수도 현대화사업 업 무편람 운영규정* 제11 조 ( 성과판정계획서 제출) 및 제13조(성과판정을 위한 평가) 1) 성과판정계획서: 2023년 7월 심의 요청(지방자치단체 공문 발송 2) 성과보증 보고서:2023년 5월 심의 요청(지방자치단체 공문 발 경부)」 에 따라 추"}]}, {"id": "88-66", "no": 88, "label": "2023 가을호", "corner": "맛있는 물", "title": "휴양지 부럽지 않은 나만의 홈 카페 즐기기", "author": "", "start": 66, "end": 67, "pages": [{"p": 66, "t": "와 다과를 즐기는 문화로 팬데믹 장기화로 유행이 확산했다. 최근 들 어 848를통해 자신의 소소한 경험을 공유하는 이들이 늘고, 비 용이 저 렴 하며, 취 향에 따라 즐길 수 있다는 장점이 드러나면서 수요 가 꾸준히 증가하는 추세다. 홈 카페는 어떻게 즐겨야 한다는 정답은 없다. 무한대 로 커스터마이징이 가능한만큼 각자 취향대로 즐기면 그만이다."}, {"p": 67, "t": "지난해 2월, 한 식 품커 머 스 업체는2021년 자사 홈카페관련 상품 판 매량이 팬데믹 이 전인2019년 대비 6배 정도 증가했다는 조사 결과를 내놓았다. 가장 두드러진 성장세를 보인 상품은 커피였다. 스틱커피 를 비롯해 드립백 커피 제품, 캡슬 머신 등에 대한 수요가 폭발적으로 증 가한 것. 또 자신만의 특별한 음료 만들기를 원하는 이들이 늘면서 바 파우더 제품), 우유 등 여러 재료의 인기도 높아지고 있다. 홈 카페에서 커피를 즐길 때 가장 신경 써야 할요소는 바로 물의 미 네랄 함량' 과 “온도'이다. 수질과 온도에 따라 커피 맛이 크게 달라질 수 있기 때문이다. 미네랄 함량이 높은 물은 지나치게 쓰고 불쾌한 맛 을 유발할 수 있고, 낮은 물은 신맛이 날 수 있다. 또 드립커피를 주로 즐긴다면 커피 추출에 사용되는 물의 온도도 중요하다. 높은 온도의 물을 사용하면 커피의 쓴맛을 빠르게 우려낼 수 있고, 낮은 온도의 물 은 농도가 열고 부드러운 맛을 내는 데 도움을 준다. 개인의 커피 취향 에 따라 선택하면 되지만, 일반적으로 전문가들이 추천하는 드립 커피 에 가장 적합한 물의 온 도는90~96“이니 참고할 것. 하나 더, 커피에 진다. 따라서 진한 커피를 선호한다면, 천천히 물을 봇는 것이 좋다. 팬데믹의 장기화로 건강, 힐링이 주요 트렌드로 부상하면서 종류별로 골라 마실 수 있는 '차(#)' 제품에 관한 관심도 높아지고 있다. 과거에 는 간편하게 티백 차를 마시는 게 전부였다면, 최근에는 향신료나 과 일을 추가해 새로운 차를 만들어 즐기는 이들도 늘었다. 홈 카페에서 차를 즐길 때 가장 중요한 것은 물의 온도와 차 종류를 선 택하는 것이다. 자신이 좋아하는 맛과 향의 차를 선택하고 차를 담은 후, 물 온도를 맞춰 차를 우려 내면 되는데 차의 종류에 따라 적절한 물 의 온도가 조금씩 다르다. 일 반적으로 녹차와 홍차는80~900 사이의 사용하면 차의 본연의 맛을 더 잘 느낄 수 있다. 더불어 한 가지 주의 해야 할 점은 차 종류에 상관없이 너무 오랫동안 우리면 쓴맛이 강해 질 수 있으므로 적절한 시간을 지키는 것이 좋다. 양에 따라 다르겠지 @ 에스프레소 한잔 정도 양의 커피 준비하기(커피믹 0 만들어진 크림을커피 위에 부기 @ 커피 또는 물을 더 넣어 취향에 맞게 농도를 맞추면 만들 수 있다. @ 좋아하는 과일이 담긴 과일청 준비하기 @ 탄산수를 조금씩 넣으며 천천히 저어 주기 @ 취향에 따라 설탕이나 시럽 을 더하면 끝! * 레시피 더하기 긴 뒤 사용하는 것이 졸다, 탄산수 대신 과얼청에 따뜻 한 물을 부어 따뜻한 차로도 마실 수 있다."}]}, {"id": "88-68", "no": 88, "label": "2023 가을호", "corner": "물 따라 길 따라", "title": "파도처럼 밀려오는 다채로운 매력 브라질 리우데자네이루", "author": "", "start": 68, "end": 71, "pages": [{"p": 69, "t": "20 아름다운 해변이 곳곳에 펼쳐지고 화가 녹아든 개성 있는 건축물 까지 더해 . 안에 자리한 이 도시는 과나바라 만이 육 | 와 나무 로 형성된 산이 우뚝 숫아있어 어느 3 화무쌍한 매 지 갖추고 있다. 를 제대로 알고 수도는 브라질 ㅇㅇ 따뜻한 햇살 기할 때 '열정'축구' 축제' 같 에 브리질 특유의 문화가 녹아든 햇살아래 반짝이는 백사장이 아름다운 ! 들 | 질리아, 브라질에서 가장 큰 도시는 상 채 롭고 아름다운 언관어들을떠올 3대 기후에 속해 이 아름다운 열린 대 회여서 더욱 파고든 독특한지형을 치한 도시 이기도 ㅎ 득한 사람들. 들을 떠올리게 될 것이다. 남동부 특 한 지형 을 가지고 있다. 바다를 름다운 도시를 만찍하기에 완벽한 !은 건축물, 다. 바다를 면한 덕에 완벽한 날씨까"}, {"p": 70, "t": "세계적 휴양지로 유명한 코파카바나((00330803) 해 변 이 바로 리우 _ 가되었다. 에 있다. 4<00가 넘는 백사장이 펼쳐진 아름다운 해안선 이 빚어내 는 풍경 덕에 리우는 이탈리 아의 나폴리, 호주의 시 드 니와 함께 세계 _ 축제, 그 뜨거운 열기 3대 미항으로 손꼽힌다. 그리고 코파카바나 해변과함께 리 우의 대 _ 열정과 활기로 가득한 브라질은 축제와 스포츠의 나라이기도 하다. 크이자 리우를 감상할 수 있는 최고의 전망대 이기도 하다. 두 개의 봉 _ 펼치면서 지금과 같은 큰 규모의 축제로 발전했다. 축제 중 펼쳐 지 는 블카를 타고 이동할 수 있다. 16~17세기 브라질에서는 사 탕 수 수를 글 _ 라고 하는 거리를 따라 퍼레이드를 이어가는데, 삼바 퍼레이드에 서 산 정상에 있는 ' 구원의 예수상' 이 다. 리 우가 한눈에 내려다보이는산 정상에서 마치 리우를 지켜주는 듯한 모습의 이 예수상은브랄이 、 빼 할(는 포르투갈로부터 독립한지 100주년 되는 해를 기념해세웠다. 높이 대표 문화유산으로 자리해연간 약 180만 명의 관광객이 찾는 명소"}, {"p": 71, "t": "브라실의 상하수도 이야기 사 각지대 없는 물복지를 위해 중요한것은상하수도 인프라 브라실의 상하수도 인프라는 지역 차가 큰 특싱 을 보 인다. 남동부 지역은 인 구 의 거의 100%가 상수도 시설 을 보유하고 있고, 78.6% 하수도가 설치되어 있는 반면 북동부 지역은 하수도 시설 보 유 율이 10.5% 밖에 되지 않는다. 북부 지 역에서 발생 하는 오 수는18.3% 정도만 위생 처리가 되고 있는 것으로 알려져 있다. 또 코트라 0<018// 보고에 따르면 브라질에서는 하수도 부족 으로 인한 환경오염으로2018년23만 명의 브라질 사람이 때문에 브라질 정부는 상하수도 인프라 문제를 해결하 기 위해 노력하고 있다. 지난 2013년 브라실 연방 정부 질은2033년까지 국가 전체의 99%가 상수도 시설 보 유,92%는 하수도 시설 보유, 하 수처리율 43%, 누수율 31%의 목표를 달성한다는 방침이다. 이후 2017년 브라질 연방 정부가 공개한 자료에따르면, 율은 약 30% 증가한 것으로 나타났다. 또 같은 기간 총 78/7억 헤알 상당의 재원이 상하수도 시설 보급에 사용 상하수도 신규 법령 정부의 계속되는노력과 은 2033년 말까시 브라질 인 구의 99%가 상수 서비스 를 90%가 하수도 서비스를 받아야 한다는 목표를제시 하고 있다. 브라질 민간 수처리 양허 사업 협회(4600) 라 건설에 투 입되고,2550억 헤알은 기존 시설의 유지 보수에사용될 것으로 보인다 2022년도 상하수도 인프라 관련 예 산 을 전년도 45억 주 정부, 지방 자치 단체의 자체 예산 외에 추가 자금 조 달까 지 감 안하면2022년 상하수도 인프라 관련 투자 날 것으로 예 상된다. 는 브라실 국민이 적절한 하수 처리 시설이 없는 환경에 서 생활하고 있으며, 3500만 명은 정화된 상수도 시설 을 이용하지 못하고 있다며 2033년까지 브라질 인구의 99% 이상이 깨끗한 상수도를,90% 이상은 적합한 하 수도를 갖춘 환경에서 살 수 있도록 인프라를 강화할 계 획이라고 강소했다. 역의 상하수도 보급률을 높이는데 큰 변화 를 줄 것으로 보인다 만약 연방 정부의 상하수도 인프라 개 선안이 계 획 대로 신 행 된다면 2033년까지 대부분의 브라질 사람 들이 상하수도 서비스를누릴 수 있게 될 것이다 ：』<브라질 상하수도 신규법령이 브라질 인프라시장에 미칠 영 \" “브라질, 창하수도 인프라투자 |000% 증가\" 보강계속>"}]}, {"id": "88-72", "no": 88, "label": "2023 가을호", "corner": "물은 리듬을 타고", "title": "물 위의 윤슬처럼 건반 위에서 춤추는 음악", "author": "", "start": 72, "end": 73, "pages": [{"p": 72, "t": "라흐마 니 노프(8810001801008는 러시아의 대표적인 피아니스트 , $ 인지 그가 만든 곡 중에는 평범한 사람의 손으로는 도저히 연주 시에도 그의 어머니는 피아노 연습을 게을리하지 않았다고 한다. 、 라는 별명을 얻은 것도 무리는 아닐 것이다. 결국 당시에 이 곡은 고 연 주하는 능력인 초 견(보)이 좋았다고 한다. 불과 열 살 무 _ 럼 여겨질 정도다. 렵 에도 어떤 악보 는 1시간이면 훌륭하게 연 주를 해냈다고 하니 으로 여 겨 지는데, 바로 놀라울 정도로 큰 그의 손 크기 때 분이다. 도 시련이 있었다. 그는 <교향곡 제1 번> 발표를 앞두고 이번에도 ' 도\"에서 한 옥타브 위의“솔'까지 한 손에 았다고 한 다. 그런탓 _ 을 받은 그는 이 일로 신경 쇠약이 오고 창작활동이 어려워질 정 인간의 마음을 극적으로 담아내기 때문일 것이다."}, {"p": 73, "t": "했다. 그가 이 힘겨운 시간을 이겨내는데는 약 3년의 시 간 이걸 _ 미국에서 자리를 잡은 뒤에도 러시아에 대한 애정과 자신의 견 <피아노 협주곡 2번>을 발표했다. 이 곡은 지금까지 그의 대표작 _ 공식적으로 내보인 탓에 자국으로의 귀국 금지령이 내려지는 등 화려하게 명예를 회복했다. 그는 자신의 재기에 큰 도움 을 준니_ 내에서 그의 작품을 연주할 수 없게 하는 조치도 내려졌다. 결국 콜라이 달 박사에게 이 곡을 헌정하기도 했다. 노 협주곡 3번>이 탄생하게 되었다. 했다. 그리고 그는 미국에서 잠들었다. 미국으로 이민한 즈 음에 _ 느낄 수 있다. 에서도 주제곡으로 쓰여 큰 반향을 일으키고는 하는데, 조금 더"}]}, {"id": "88-74", "no": 88, "label": "2023 가을호", "corner": "물사랑 카툰", "title": "오늘도 맑은물세상 – 다목적 댐의 시초, 후버 댐이 바꾼 미래", "author": "", "start": 74, "end": 75, "pages": [{"p": 74, "t": "서부 지역에부족한물을 공급하기 위해 건설됐대. 뿔@3 인구가 대폭 유입되면서 생활용수 등 물이 크게 부족했거든. 0000> 나중에 볼더 덤 착공 내 발 당시의 미국 대통령이었던 촬영지로도 유 명하거든. 마을과도시에 물이나 전기 등을 공급할 방법을찾다가 콜로라도 강물을 끌어오기로 한 거지."}, {"p": 75, "t": "일대의 관개 ㆍ 식수ㆍ산업용수 공급과 함께 경제를 일으키는데 큰도움을받았어.기납 에29/ / 홍수 방지는 물론, 미국 서부 성공한 다목적 으로 평? 사진으로 보니 1 할 정말 대단하다. 정말 크더라고! 콜로라도강과 미드호를 내려다보는 경치가정말 예술 이라구! 다양한 경제적 효 과도 얻었고. 열 배가 넘는다고들었어."}]}, {"id": "88-76", "no": 88, "label": "2023 가을호", "corner": "독자 마당", "title": "독자 마당", "author": "", "start": 76, "end": 79, "pages": [{"p": 76, "t": "더위도 식힐 겸 찾은도서관에서 만난 <맑은 물 세상>.특히상하 _ㅣ， 、 글로벌 이슈에 실린 \"기후 위기 시대의 스마트 물관리 기술 방향' 다. 지금 제가 하는 일과 관련이 있기도 하고, 상하수도 분야 에이 _ㅣ 、 도 유익했고요. 여름철 장마로 발생할 수 있는 수질 문제나 국지 런 기술과 아이디어가 있다는 사실이 놀랍더군요. 벌써 가 을 호가_ ｌ， _ 성 호우, 폭염처럼 여러 기후 위기가 발생하는 원인과 이와 관련 기 다려지네요. 기회가 된다면, 우리나라가 몰 부족 국가가 되지 _ ｌ， 、。 된 물관리 대책 등도 심도 있게 다뤄지면좋을 것 같아요. 않기 위해서는 어떤 대비를 해야 하는지에대한 정보도 소개해주_ ㅣ 적수, 유충 사태로위기에 몰렸던 인천광역시가 시민들의 신 뢰를_ ， 、 된다는 사실도배웠고요, 생활 속 탄산수 활용법까지 알려주셔서 다시 얻기까지 시설 개선과 직원들의 역량 강화에 매진해인천 _ㅣ 、 더 유익했습니다. 각 지역에서 생산하는 수듯물 브랜드명도 궁금 러,다음 호에는 깨끗한 물관리를 위한 다양한 정화 시스템 과노_ ㅣ 하우를 알수 있는 기사가 담겼으며 합니다. 재미있게 보고 있어요. 물과 관련된 여행지에 대한다양한 정 보를_ ㅣ 알 수 있는 것도 좋고, 그 지역의 상하수도 관련 현황이나 최 신정_ ㅣ 어나면서 생소한 용어도 많이 등장하던데, 저처럼 물 관련 직 업을_ ㅣ 한국상 하수도협회에서 발행하는소식지 <맑은 물세상>은독자여러분의 관심과 참여로 만들어집니다. 2023년 여름호에도풍성한사랑보내주서서 감사합니다. 이벤트에참여해주신 모든분들께 감사드리며, “독자 리뷰 당첨자를 발표합니다. 당첨자여러분, 축하드립니다. | 。 \\톡 쏘는 물,탄산수' 기사가 가장 기억에 남네요. 덕분에 몰랐던 | _ 탄산수의 효능도 알게 됐고, 많이 마시면 오히려 부작용의 원인이"}, {"p": 77, "t": "<맑은 물 세상> 가을호 기사중 가장기억에 남는 내용은 무엇이었나요? 여러분의 소중한생각과 따뜻한 관심이 담긴 멋진 리뷰를 남겨주세요. 참여해주신 분들 중 추첨을 통해 소정의 선물을 드립니다. 이벤트 당첨자는<맑은 물세상>2024년 신년호에서 확인할수 있습니다. <맑은 물 세상> 가을호 기사중 가장 기억에 남는 내용은 무엇이었나요? 여러분의 소중한생각과 따뜻한관심이 담긴 멋진 리뷰를 남겨주세요. @ <맑은 물 세상> 가을호정독하기 @기억에 남는 내용과 이유생각해보기 @ 코드 스캔 후 네이버폼에서 질문지 작성하기 * 개인정보동의는 필수! *가지고계신 물사진을 함께 올려주시면 당첨 확률이냐! 총 이벤트상품 가을호 이벤트! 맑은 물 세상"}, {"p": 78, "t": "주최 한국상하수도협회, 대전광역시 주요행사 물산업 전시회, 해 외바이어 초청 수출상담회, 국내 물 분야 구매상담회, 물 분야 세미나 및 포럼 등 온라인 신청 후 참가비를100% 납입 해야 신 청 이 완료되고 부스배 정 이 확정됩니다. 신청기간: 8월 21일부터 일반접수 시작(온라인 신청, 선착순 모집) 홈페이지 접속 사회적기업 10% 부스배치도 확인 부스 배치도 주최자가 조립 식으로 된 부스 장치물을 일 괄적 으 로 시 공하여 제 공 하는 부스 전시자가 전 시 면 적 만 제공받아 자체 적으로 부스 디자인 및 설 치 하는 부스"}, {"p": 79, "t": "세상 모두가깨끗한 물을 마시는 상상 수처리 필터"}]}, {"id": "89-4", "no": 89, "label": "2024 신년호", "corner": "essay", "title": "한국상하수도협회장 신년사", "author": "", "start": 4, "end": 5, "pages": [{"p": 4, "t": "SPECIAL essay 협회의 역할과 기능을 강화하고 대한민국 물의 가치를 높이는 일에 최선을 다하겠습니다"}, {"p": 5, "t": "존경하는 회원 여러분! 2024년 갑진년 청룡의 해가 밝았습니다. 여의주를 물고 날아오르는 청룡의 기운으로 힘차게 비상하는 한 해가 되기를 두 손 모아 기원합니다. 무엇보다 지난 한 해 협회 발전과 상하수도 선진화를 위해 큰 힘이 되 어주셔서 참 감사합니다. 이제 우리 협회의 나이가 22살이 되었습니다. 제가 취임하던 때만 해도 이제 막 성인이 된 20살 청년이었 는데, 더 어엿한 청년이 되었고 성숙해졌습니다. 회원 여러분과 물 분야 종사자 등 함께해 주신 모든 분들 의 뜨거운 열정 덕분입니다. 이제 새로운 해를 맞아 더욱 힘을 냈으면 합니다. 깨끗한 물은 우리 국민에게 생명이고 믿음입니다. 국가 차원에서 보면 지속가능한 미래를 담보할 수 있는 가장 강력한 경쟁력입니다. 국민 누구나 안심하고 마실 수 있는 수돗물을 확보하고 물산업의 경쟁력을 높여가는 일이 중요합니다. 더욱이 전 세계적인 기후 위기 속에 많은 전문가들은 물이 석유보다 귀한 자원이 될 것으로 전망합니다. 그 전망이 점점 현실이 되어가는 것 또한 우리는 목도하고 있습니다. 자연의 근본을 살리고 탄소중립으로 나아가는 것만이 위기를 기회로 전환할 수 있는 유일한 길입니다. 우리 협회는 대한민국을 대표하는 최고의 물산업 전문기관입니다. 가장 앞장서서 탄소중립의 문을 열어야 할 중차대한 과제 또한 안고 있습니다. 더디 가더라도 그 일을 여러분과 함께 지속적으로 해 나가겠습니다. 우리나라는 발길 닿는 곳마다 물이 있고, 물을 중심으로 성장해 온 나라입니다. 그 역사와 힘을 바탕으로 대한민국 물의 가치를 높이는 일에 최선을 다하겠습니다. 더불어 협회가 그간 축적한 경험과 전문성을 바탕으로 협회의 역할과 기능을 강화하며 위상을 더욱 높여 나가겠습니다. 회원 여러분이 곁에 계셔서 든든합니다. 올해도 변함없는 관심과 열정으로 함께해 주십시오. 저도 열심히 뛰고 또 뛰겠습니다. 회원 여러분의 가정에 건강과 행복이 가득하기를 기원합니다. 새해 복 많이 받으십시오. 감사합니다. 2024년 1월 1일 한국상하수도협회장 강 기 정"}]}, {"id": "89-6", "no": 89, "label": "2024 신년호", "corner": "포커스", "title": "협회의 2023년 성과 및 2024년 계획", "author": "", "start": 6, "end": 11, "pages": [{"p": 6, "t": "SPECIAL 포커스 한국상하수도협회 2023년의 성과와 발자취 그리고 2024년의 준비 지난 2023년은 코로나19 팬데믹 진정에 따른 일상 회복으로 대외적인 사업들이 조금씩 정상화된 한해였다. 3월 국제물산업박람회 (WATER KOREA)에 과거보다 많은 인원이 참석해 큰 성과를 거뒀고 상하수도, 교육, 회원 지원 등 분야별 사업의 확대와 개선도 두드 러졌다. 더불어 공익을 목적으로 하는 다양한 분야의 사업이 활발히 진행됐으며, 8기 이사회가 새롭게 구성돼 변화와 도약의 계기를 마련했다. 이러한 변화 속에서 이뤄낸 한국상하수도협회(이하 협회)의 2023년의 성과와 2024년의 계획을 살펴본다. 2023년의 성과 ① 대국민 수돗물 불신해소를 위한 정책지원 및 연구 안전인증 적수·유충 발생 등 정수장 사고로 야기된 수돗물 불신 해소를 위해 정수장 위생 및 정수 안전 관리 강화의 필요에 따라 ‘정수장 위생 안전 인증제도’ 도입을 위한 법제화 및 제도 도입 후 활성화를 위한 정부 정책을 지원했다. 옥내급수관 교체 12개 지자체를 대상으로 노후 옥내급수관 교체 국고 지원사업을 추진했 다. 대상 지자체의 지원 대상 발굴, 상태진단 및 공사비 적정성 검토·공사 완료 확인 등 전문 대행 기관으로 사업을 운영했다. 상수도 연구 상수도 경영, 운영·관리, 기술적 현안 등 지자체 공통 이슈에 관한 해결 방안 모색을 위해 신규 과제 3건의 상수도 공동연구를 추진했다. 2013년부터 2023년까지 연구과제 46건, 가이드라인 등 매뉴얼 35건이 수행됐다. 기자재 인증 국가표준(KS), 단체표준 인증을 통해 인증 전문기관으로서 위상 제고와 다양한 단체표준 제·개정을 통한 제도 활성화를 도 모했다. 국가표준 65개 사 103개 제품, 단체표준 77개 사 103개 제품이 인증을 유지하고 있고, ‘단체표준 중장기 발전 방향 마련 및 표준개발 로드맵 수립 연구’를 수행했다. 물산업 우수제품 지정제도는 2022년 밸브, 펌프 등 11개 품목에서 2023 년 관점검 세척구, 습식 다회선 초음파유량계 등 13개 품목으로 확대했다."}, {"p": 7, "t": "기술진단 결과평가 수도시설 기술진단 결과평가 전문기관으로 2023년도는 환경부 유역(지방)환경청에서 의뢰하는 105개 시설(2023년 11 월 기준)에 대해 평가를 수행했다. 또한 평가 업무의 효율적 운영 및 평가제도 개선을 위해 환경부 평가 지침(정수장 운영관 리 업무 지침) 개정도 지원했다. <수도시설 기술진단 선진화를 위한 워크숍> 지방상수도 현대화 사업 노후 상수관망 정비사업의 성과 검증을 위해 2023년은 총 13개 사업의 성과판정을 실시했고, 지자체당 평균 유수율 38.3%P가 향상되는 성과를 보였다. 또한 지방상수도 현대화 사업 후속 「사후관리 실적점검」을 협회가 수행할 수 있도록 환경부 업무처리 지침 개정을 지원해 신규사업 추진의 발판을 마련했다. <지방상수도 현대화사업 성과판정>"}, {"p": 8, "t": "② 공공하수도 운영관리 지원을 위한 평가 및 연구 하수도 연구 공공하수도 운영 효율화와 경영 합리화 등 하수도 분야에 대한 지자체 현안 이슈 해결을 위해 신규 과제 3건에 하수도 공동 연구를 추진했다. 2015년부터 2022년까지 연구과제 25건, 가이드라인 등 매뉴얼 17건이 수행됐다. 공공하수도 관리대행 성과평가 ‘공공하수도시설 운영관리 업무지침’ 개정(’22.2)에 따라 기존의 평가시설 외에 지자체 직영 시설에 대한 평가를 새롭게 도입 했으며, 지자체 요청에 따라 공공폐수·가축분뇨 처리시설에 대한 평가 기준을 협회가 자체적으로 수립해 평가 시범 운영 및 사업영역을 확장했다. 또한 ‘공공하수도 관리대행업자 선정 및 대행성과 평가’(환경부 고시)와 ‘공공하수도시설 관리업무 대 행 지침’(환경부 지침) 개정을 위한 정부 정책지원을 시행, 중대재해처벌법 제정(’21.1)에 따라 산업안전 관련 규정 신설과 안 정적인 하수처리시설의 운영을 위해 성과 평가지표 조정 및 일부 규정 등을 신설하는 등 ‘공공하수도 관리대행 성과평가’ 제 도의 개선과 관련 업종이 활성화될 수 있도록 노력했다. ③ 물 분야 전문인력 양성을 위한 교육, 자격제도 운영 청년교육 지원 청년 구직자를 대상으로 양질의 일 경험 프로그램 제공과 취업 지원 시스템 구축을 통해 맞춤형 취업 지원을 실시했으며, 35개 대학과 학점인정에 대한 MOU를 체결할 예정으로 재학생의 교육 프로그램 참여를 통해 일 경험 기회를 제공했다. 자격제도 개선 상수도 분야 ‘정수 시설 운영 관리사’, ‘상수도 관망 시설 운영 관리사’, 2개 자격제도 중 상수도 관망 시설 운영 관리사 과정 이 수형 자격제도 도입(3급 한정)을 위한 수도법 개정(’23.8.16)을 통해 제도개선을 추진했다. 또한 하수도 분야 운영·관리 직무 역량 강화를 위해 신규 자격제도 도입을 위한 기반을 마련 중이다. 교육 확대 교육 사각지대 해소, 회원기관의 교육여건과 애로사항 등을 해결해 주기 위한 찾아가는 맞춤형 교육을 확대해 교육 인원 전 년 대비 80%(327명→590명), 참여기관 60%(5개→13개 지자체)가 상승했다. 협력 확대 대면 교육 정상화에 따른 실무교육 재개를 위해 전문 강사 공개모집, 외부 협력 기관 모집을 통해 현장 실무 교육을 확대했다. (2022년 0회→2023년 26회) 환경개선 교육생 만족도 향상과 편리성 개선을 위한 서울역 인근에 ‘한국상하수 도협회 서울역 분소’ 교육장과 회의실을 새롭게 마련해 2023년 7월 개소했다."}, {"p": 9, "t": "해외 초청 연수 활성화 해외 물 분야 초청 연수 진행(3회)으로 우리나라의 물관리 우수성을 알리고 전파하는 계기를 제공했다. <물 역사탐방 체험과정> <부산시 찾아가는 맞춤형 실무자 교육> <인천시 찾아가는 상수도 전문교육> ④ 회원지원 교류확대 판로지원 2023년 3월 일산 킨텍스에서 개최한 국제물산업박람회(WATER KOREA)를 통해 21억여 원의 해외 수출계약과 116억 원 상당의 MOU가 체결됐다. 또한 물기업 172개 사가 참여했고, 정부·지자체·유관 종사자 등 1만 6천여 명이 참관해 공급자와 수요자를 연결했다. 온라인 전시관을 통해 국내 물기업 107개 사의 510개 제품(’23년 10월 기준)에 대한 등록 기업 홍보를 상시 지원 중이며, 2022~2023년 151개 사의 홍보영상을 제작해 무상으로 제공했다. 회원 소통강화 기존에 지자체, 기업 등으로 구분해 진행했던 회원 워크숍을 통합 운영해 민관 교류를 새롭게 시도했으며, 코로나19 종식에 따라 수도사업본부장협의회 3회, 수도사업본부장협의회 워크숍 1회(신규), 도 물정책포럼 2회, 정책 세미나 2회 등 회원 교 류를 대폭 확대했다. 해외진출 미국 시카고 수질환경기술전시회(WEFTEC 2023) 한국관 운영을 통해 국내 물기업 8개 사가 참가하며 해외 진출 기회를 제 공했다. 밸브, 로봇 장비, 폐수 재이용설비 등 자사의 제품과 기술을 홍보하도록 지원했다. <해외바이어 초청 수출 상담회> <회원 워크숍> <도(道) 물정책 포럼>"}, {"p": 10, "t": "2024년의 준비 한국상하수도협회는 우리나라 물 분야를 대표하는 기관으로 국가적 거버넌스를 구축해 상하수도의 발전에 기 여하고 대국민 물복지 향상과 상하수도 전문성을 개선하는 등 협회의 역할과 소임을 다하기 위해 2024년에도 쉼 없는 경주를 계속할 계획이다. 특히 2024년에는 기존 사업의 내실을 다지는 한편, 신규 사업을 진취적으로 추진, 사업의 고도화와 확대를 통해 협회의 역할을 강화해 나갈 예정이다. ① 기존사업 추진 지원사업 지자체, 상하수도 분야 기업, 종사자의 현장 고충과 현안 사항 해소를 위한 지원사업 수행 연구사업 정부·지자체의 상하수도 분야 현안 사항 관련 기술·정책연구 수행과 물산업 육성을 위한 국제물산업박람회(WATER KOREA) 개최 교육사업 물산업 분야 종사자의 직무능력 향상과 인재 육성을 위한 상하수도 법정·전문교육과 산업계 주도 인적자원개발 거버넌스인 환경산업 인적자원개발위원회(ISC) 운영 평가사업 \u0007깨끗하고 안전한 상하수도 시설의 운영 기반 구축 지원을 위해 상하수도 시설의 평가 업무 수행(수도시설 기술 진단 결과평가, 지방상수도 현대화 사업 성과판정위원회, 공공하수도 관리대행 성과평가) 인증사업 바이러스, 원생동물 등으로부터 정수장 안전성을 위해 정수처리 기준 인증과 상하수도 기자재에 대한 인증제도 운영(KS 인증, 단체표준 표시 인증, 물산업 우수제품 지정제도) 홍보사업 \u0007수돗물 불신 해소와 신뢰 제고를 위해 수돗물 인식개선 을 위한 지자체 공동 홍보 추진"}, {"p": 11, "t": "② 사업 확장, 내실화를 위한 신규 추진 수출지원 ・ \u0007수출 확대 정책과 수출상담회 성과 제고를 위해 물산업수출지원단 신설(’23.5)로 국내 물산업 기업의 해외 수출지원 추진 ・ \u0007물기업 수출 애로 지원을 위한 헬프데스크 운영, 수출기업 컨설팅, 물류비 절감 사업, 해외 마케팅 사업 등 회원확대 ・ \u0007민간 회원 확대 관련 제도(업종, 회원 종류·대상 등) 개선과 신규회원 유치를 위한 기반 마련 연구 수행 ・ \u0007민간 회원의 서비스 확대·강화, 장기 미납 회원 정리·조치, 비활동 회원 참여 활성화 등 회원 내실화 방안 마련 등 녹색채권 ・ \u0007탄소국경세(2023년), ESG 공시 의무(2026년) 등에 따라 물산업 녹색채권 활성화를 위해 평가기관 등록·운영으로 사업 확대 ・ \u0007「녹색분류체계 가이드라인」에 따라 친환경 사업을 추진하는 물기업의 물산업 분야의 ‘녹색위장행위(그린워싱)’ 방지와 채권 적합성 판단 실시 위생안전 ・ \u0007수돗물 유충 발생, 적수 등 수돗물 사고 발생 예방을 위한 선제적 대응을 위해 ‘정수장 위생안전 인증제’ 도입 추진 ・ \u0007국민에게 안전하고 질 높은 물을 공급하기 위한 위생관리 중요성 강화로 정수장 운영 능력과 수돗물 품질 향상에 기여 경력관리 ・ \u0007\u0007공공하수도 관리대행업 종사자의 경력관리를 위한 시스템의 단계적 운영과 관련법 개정 추진(2024년)으로 사업화(2025년) 방안 모색 - 1단계 : 업종 등록 관리와 관리대행 실적관리 - 2단계 : 사업수행능력평가 정보 제공(행정제재, 확인서 발급) - 3단계 : 기술인 경력·보유 증명서 발급 등 자격관리 ・ \u0007과정 이수형 자격제도 신규 운영(정수 시설 운영 관리사 3급 과정 이수형)으로 자격 취득률 확대와 정수 시설 운영 인력 전문성 향상 ・ \u0007「수도법」 제24조의 개정(’23.8)에 따라 정수시설 운영 관리사 3급에 한 해 과정 이수형 도입으로 교육과정 개발과 자격·학습 통합관리시스템 구축 추진 직무변화 ・ \u0007탄소중립, 디지털전환 가속화 등 환경·기술 발전에 따른 직무 및 훈련 수요 변화를 파악하는 ‘환경사업 직무변화 모니터링’ 을 본격 실행하고 직무 지도에 반영 추진"}]}, {"id": "89-12", "no": 89, "label": "2024 신년호", "corner": "오피니언", "title": "2023년 하수도공동연구협의회 해외 선진지 연수 보고", "author": "", "start": 12, "end": 15, "pages": [{"p": 12, "t": "SPECIAL 오피니언 2023년 하수도공동연구협의회 해외 선진지 연수 기후 변화와 탄소중립에 대응하는 미국의 하수도 현장 속으로"}, {"p": 13, "t": "한국상하수도협회에서는 특·광역시, 제주특별자치도, 세종특별자치시, 한국환경공단 등 총 11개 기관을 중심으로 하수도 분야 이슈 및 현안 사항을 해소하고 국내 하수도의 발전 전략 수립을 위해 하수도공동연구협의회를 운영하고 있다. 지난해엔 해외 선진 사례 조사·학습을 위해 미국 시카고와 밀워키를 방문했다. 초기 우수배제, 홍수통제 등 미국의 기후 변화 대응을 살피는 것은 물론 대표적인 하수처리시설들에서 미국의 주요 하수처리 및 관리 정책 등 선진 기술의 국내 도입 방안을 확인했다. 글·사진_강준구 한국상하수도협회 하수도기획팀 팀장 시카고의 하수도 역사를 함께한 MWRD 시카고는 뉴욕, 로스앤젤레스에 이어 미국에서 세 번째 로 큰 도시이자 미국 중서부에서 가장 큰 도시이다. 총 인 구는 2020년 기준 약 274만 명 정도. 일찍이 오대호와 미시시피강을 중심으로 육로 수송지가 발전하면서 19 세기 중반부터 빠르게 성장했고, 오늘날 경제, 무역, 산업, 과학, 통신, 교통 등에서 국제적인 중심지로 자리 잡았다. 급속한 인구 성장과 함께 위생 시설의 수요를 감당하기 위해 시카고는 여러 사회 기반 시설을 정비하고 건축해 나갔다. 시카고의 물재생국 역할을 수행하는 MWRD(Metropolitan Water Reclamation District of Greater Chicago)는 1889 년 시카고 위생 지구로 출범한 이래로 시카고의 위생 환 경을 개선하고 공중보건을 보호해 왔다. MWRD는 시카 1 스티크니 처리장 시설견학 2 스티크니 처리장 슬러지 비료화 3 스티크니 처리장 펌프시설 고의 운하 건설 등 수로 네트워크 구축과 지역 내 하수 차 집 시스템은 물론 오수 처리를 위한 하수처리시설도 건 설했다. 1922년 칼류맷(Calumet) 공공하수처리시설을 최초로 건설한 뒤 6개의 공공하수처리시설을 추가로 건설했는데, 그중 하나가 세계 최대 규 모의 스티크니(Stickney) 공공하수처리시설이다. MWRD는 일 평균 약 492 만 1,000㎥의 하수를 처리하고 있으며, 총 처리 용량은 약 757만 1,000㎥가 넘는 수준이다. 오대호와 멕시코만을 연결하는 내륙 수로 시스템 관리도 하고 있으며, 홍수로부터 피해를 감소시키기 위한 34개의 우수 저류지를 소유·운영하고 있다. 시카고 시민의 식수원을 지키기 위한 노력, TARP 오대호 중 하나로 유일하게 호수 전체가 미국 영토에 포함되는 미시간호는 시카고 시민들의 중요 식수원이다. 미시간호의 넓이는 약 5만 7,757㎢로, 대한민국의 절반쯤 된다. 앞서 설명한 대로 MWRD는 운하 및 내륙 수로 시 스템을 건설·관리하고 있다."}, {"p": 14, "t": "MWRD는 시카고의 주 식수원인 미시간호가 오염되지 않도록 보호하기 위해 1887년부터 약 35년간 시카고 운하를 건설했다. 하지만 날로 심해지는 미시간호 오염 의 근본적인 원인을 해결해야 했고, 이에 합류식 관로 에서 우천 시 월류되는 CSO(합류식 하수도 월류수) 처 리를 위한 대심도터널 프로젝트(Tunnel and Reservoir Plan·TARP)를 채택했다. TARP의 주목적은 하수 유입으 로부터 미시간호의 수질을 보호하고, 홍수 저감 및 저지 대의 침수를 예방하는 데 있다. 1975년부터 2006년까 지 1단계 사업을 준공했으며, 2007년부터 2029년 준 공을 목표로 2단계 사업을 진행 중이다. 1단계 사업으로 펌프시설을 이용해 대심도터널에 저장 된 우수를 하수처리시설로 이송해 처리 후 방류 목적으 4 대심도터널 내 펌프시설 5 TARP 2단계 사업 시공현장 로 총연장 약 176km, 총 4개의 터널을 건설했다. 터널 직경은 2.4~10.1m이며, 지하 약 110m에 매설했다. 총 약 1조 6,800억 원)이다. 대심도터널 건설로 CSO발생 빈도가 연간 100일 사업비 23억 3,300만 달러(한화 약 2조 6,270억 원)에 에서 50일로 크게 감소했고, 2단계 사업 과정에서 건설한 손턴(Thornton) 달하는 대규모 프로젝트였다. 현재 진행 중인 2단계 사 저류지를 건설한 2015년부터는 CSO 발생이 전무했다. 또한 연간 약 2천 업은 홍수 조절을 목적으로 대심도터널에 연결된 저수 억 원의 홍수 피해 감소 효과가 나타났고, 시카고강 및 주변 지천들의 수질 지를 건설하고 있다. 총사업비 14억 9,300만 달러(한화 이 향상되어 친수 공간으로 변모했다."}, {"p": 15, "t": "대심도터널의 사례 및 국내 적용 공공하수도 관리대행을 활용한 시설 운영 효율화 모색 이웃 나라 일본은 일찍이 대도시의 지하 이용을 확대하 노스쇼어 지역을 비롯한 시카고는 공기업 체계로 공공하수도를 운영하고 고 공간 개발의 한계를 해결하기 위해 2001년 ‘대심도 있으나, 밀워키는 민간기업(Veolia 社)을 활용해 공공하수도 관리를 대행에 지하의 공공적 사용에 관한 특별조치법’을 제정했으며, 맡긴다. 여기에 연간 약 5천만 달러(한화 약 660억 원)의 운영 비용이 든 이로써 지하 토지의 이용 및 보상 문제를 해결하고자 했 다. 우리나라와 달리 관리 대행에 별도의 평가 체계는 갖춰져 있지 않으나, 다. 특히 GIS(지리 정보 시스템)를 활용한 대심도 지하정 지자체에서 구성한 의사결정기구의 논의를 통해 관리 대행 지속여부를 결 보 시스템을 도입해 대심도터널, 빗물터널 등 관련 시설 정한다. 을 관리한다. 도쿄 인근 사이타마현에 설치된 6.3km 길 관리 대행사와 지자체 간의 계약서를 포함한 운영 방법에 대한 세부 내용 이의 ‘수도권외곽방수로’는 주변 중소 하천 등의 범람을 이 약 900페이지에 달해 관리 대행의 명확한 방향성 및 목적을 제시하는 방지해 홍수피해를 줄이는 데 있어, 시카고의 대심도터 부분은 국내와 차이가 있다. 앞서 설명한 바와 같이, 비료 판매 등으로 발생 널과 설치 목적이 같다. 한 수익은 다시 연구 개발과 운영비 등으로 보전하여 처리시설 운영 효율 최근 국내에서도 도심지에서의 수해·지진 등에 대한 화에 적극 노력하고 있다. 안전 대책은 물론 국민의 안전하고 쾌적한 생활 공간 의 재생을 위해 지하 공간의 활용이 활발히 추진되고 있다. 지난 2010년 서울 양천구 신월동과 강서구 화 곡동 일대에는 시간당 100mm에 가까운 폭우(500년 빈도 이상)가 내렸다. 향후 피해를 예방하고자 서울시 6 존스아일랜드 처리장 시설견학 7 존스아일랜드 처리장 슬러지 비료화 시설 는 신월동 일대에 신월 빗물배수저류시설을 설치했다. 2013년에 착공해 2020년에 준공한 국내 최초 대심도 빗물터널이다. 도심지 내 반복적으로 발생하는 수해 피해를 방지하기 위해서는 시카고 대심도터널과 신월 빗물 배수저류시 설과 같은 침수 피해 방지시설이 필요하다. 하수처리시설의 탄소발생 저감 실천 연수단이 방문한 시카고의 스티크니(Stickney) 공공하 수처리시설과 밀워키의 존스 아일랜드(Jones island) 공 공하수처리시설은 모두 바이오가스 및 슬러지 재활용 을 통해 탄소발생 저감을 적극 실천하고 있다. 미국은 약 2,200개의 혐기성 소화조를 설치해 매년 977MW의 전력을 생산하고 있다. 우리나라는 탄소중립과 순환경 제 활성화를 목표로 유기성폐자원을 활용한 에너지 생 산에 관한 ‘바이오가스법’을 제정해 2023년 말부터 시 행했다. 앞서 언급한 두 공공하수처리시설은 보일러기 온수 공급, 소화조 열 공급 등에 전량 재활용하고 있다. 하수 슬러지를 활용한 비료 생산 및 판매도 효자 노릇 을 톡톡히 한다. 존스 아일랜드(Jones island) 공공하수 처리시설은 생산된 비료를 ‘밀로가나이트’라는 이름으 로 브랜드화해 연간 5만 톤을 생산, 약 132억 원의 이 익을 창출하고 있다."}]}, {"id": "89-16", "no": 89, "label": "2024 신년호", "corner": "기획특집", "title": "미리 보는 2024 WATER KOREA", "author": "", "start": 16, "end": 21, "pages": [{"p": 16, "t": "SPECIAL 기획특집 한국상하수도협회 회원과 함께하는 2024 국제물산업박람회 (WATER KOREA) 미리 보는 2024 WATER KOREA"}, {"p": 17, "t": "국내 물산업 분야 기업들이 제품, 기술, 서비스를 홍보하는 국내 대표 전시회 국제물산업박람회(이하 WATER KOREA)가 오는 3월 20(수) 부터 22일(금)까지 대전컨벤션센터 1·2전시장에서 개최된다. 국내외 물산업 관련 기업들이 자사의 제품과 기술을 선보일 수 있는 마케팅 기회를 제공하는 동시에 약 1만㎡ 전시 면적에 국내외 물산업 분야 기업 150개 사가 참여해 약 500개 부스 규모로 다양한 기업 지원 프로그램을 운영한다. 참관객의 흥미를 유발할 수 있는 세미나, 교류회의, 이벤트 등이 동시에 진행되어 물산업 종사자들의 축제의 장이 될 예정이다. 한국을 대표하는 물분야 전문 전시회 2024 국제물산업박람회 개요 WATER KOREA는 국내 최대 규모의 물산업 분야 전문 박람회로 2002년 시작하여 기간. 3월 20일(수)~22일(금), 3일간 장소. 대전컨벤션센터(DCC) 21년째(2020~2021년은 코로나19로 미개최) 개최되는 국내 최대 물산업 박람회 이다. 관류, 펌프, 밸브 등 기자재와 수처리제, 수처리설비, 측정기기 등 상하수도 분 주최. 대전광역시, 한국상하수도협회 주요행사. 국제물산업박람회, 야의 제품과 기술을 총망라하고 있으며 매년 국내외 물분야 기업 약 150개 사가 참 가, 500여개 부스 규모로 운영되고 있다. 해외바이어 초청 수출상담회, 또한 환경부, 특·광역시, 한국수자원공사, 한국환경공단 등 물분야 정부 및 유관기 구매상담회, 세미나, 정례회의 등 관이 참여하여 20여 건의 다양한 연계행사를 동시에 개최한다. G2B 박람회로 국 내 상하수도분야 정부기관, 공무원, 업체 종사자 등 1만여 명 이상이 참관하며 전체 참관객 중 상하수도 분야 관련 공무원이 약 40%로 높은 비중을 차지한다. 특히 UN 이 지정한 ‘세계 물의 날(3월 22일)’ 기념일이 있는 주에 동시 개최하여, 물의 산업적 가치를 부각하고 관심을 제고하는 등 국내 물정책과 물산업을 아우르는 국내 유일 무이한 물분야 전문 박람회다. 부스 배치도 K-WATER 홍보관 개막식 수출상담회 라운지 K-ECO 홍보관 K-WATER 공동 기업관 K-ECO 국가물산업 클러스터관 공동관 물산업 수출 기업관 대전광역시 기업관 경기도 기업관 출입구(1홀) 출입구 (4홀)"}, {"p": 18, "t": "회원과 함께하는 물산업 축제 한마당 올해 21회를 맞는 박람회의 핵심가치는 ‘국내 물기업의 국제화 및 상하수도인의 교류를 통한 물산업 활성화’이다. 특히 2019년 이후 5년 만에 대전광역시와 공동으로 개최하는 박 람회로 지방정부와의 동반성장과 상생협력 체계를 구축하는 계기 가 됐다. 대전광역시와의 공동 주최를 기념하고 대전광역시에 소 재한 기업과 제품·기술을 소개하기 위해 ‘대전광역시 기업관’을 42개 부스 규모로 조성하여 운영한다. 여기에 회원을 초청한 ‘상하수도 인의 밤’ 만찬 행사를 통해 상하수도인의 만남의 장을 마련하여 교 류도 촉진한다. 이 외에도 물분야 유관기관들이 기업을 지원하여 참가하는 ‘K-WATER 공동관’, ‘K-ECO 국가물산업클러스터 공동관’, ‘경기도 기업관’을 약 60개 부스 규모로 조성하여 상하수도 미래기술과 관 련한 성과를 공유하고 참여 기업의 참가비도 지원하는 프로그램을 운영한다. 또한 수출 경험이 있는 기업을 16개 부스 규모의 ‘물산 업 수출 기업관’으로 구성하여 경쟁력 있는 우리나라의 우수한 물 산업 제품을 홍보한다. 협회와 교류 중인 미국, 베트남 등 11개국 16개 유관기관의 담당 자를 초청하여 국제세미나를 300여 명 규모로 확대 운영하고, ‘해 외바이어 초청 수출상담회’에 해외바이어 50개 사를 초청해 현장 계약 및 MOU 체결 등 수출 실적 300억 원 달성을 목표로 해외시 장 개척을 위해 다각도로 노력할 계획이다. 오직, 참여 기업만을 위한 특별 프로그램 지난해 WATER KOREA에서는 총 19건, 137억 원 규모의 현장 계 약 및 MOU 체결이 이루어졌다. 올해는 보다 많은 상담 및 계약 체 결을 성사시키기 위해 참가 기업만을 위한 프로그램을 확대 운영 기업지원 프로그램 할 계획이다. 일정 지난해 박람회를 계기로 협회에 신설된 ‘물산업 수출지원단’을 통 해 해외바이어 초청 수출상담회 규모를 대폭 확대하고, 국내외 유 3/20(수) ~ 22(금) 관기관과 협력해 실제 구매력을 가진 50개 사의 해외바이어를 초 청한다. 여기에 국내 참여사 100개를 발굴해 매칭 상담회를 개최 3/20(수) ~ 22(금) 하여 약 300억 원의 현장계약, MOU 체결 등을 목표로 가시적 성 과를 도출할 예정이다. 3/20(수) 국내 물산업 내수시장을 활성화하기 위해 물산업 구매상담회도 개 3/21(목) ~ 22(금) 최한다. 지난해 구매상담회에서는 38개 기업과 9개 발주처가 참 가하여 51건의 매칭상담을 진행했으며, 올해는 20개 이상의 발주 프로그램 비고 국내 발주처 구매상담회 전시장 내 상담장 (전국 지자체, 공공기관 등) 또는 참여 기업 부스 전시회 참가 기업 홍보영상 제작 지원 상하수도인의 밤 행사 해외바이어 초청 상담회 (50개 사 초청 예정) 참여 기업 부스 내 제1전시장 전시장 내 상담장 참관객 최다 방문 : 처 바이어 참여를 목표로 참가 기업과 품목의 비즈니스 매칭을 통 3/22(금) 해 기업의 현장 계약 체결을 적극 지원한다. 이 외에도 기업 홍보영 2025년 1부스 제공 회원 선정 최우수 부스 : 2025년 1부스 제공 상 제작, 포상 프로그램 등을 추진한다. 폐막식"}, {"p": 19, "t": "참관객과 사업자 회원을 위한 프로그램 참관객 참여 프로그램 올해는 전시회 참가 기업뿐만 아니라 참관객 및 회원들의 만남의 일정 장 마련과 교류 촉진을 위해 회원을 초청해 ‘상하수도인의 밤’ 만찬 3/20(수) 프로그램 상하수도인의 밤 행사 행사를 진행하고, 다양한 정보 교환과 교류 기회를 제공하기 위해 수돗물 차(tea) 라운지 약 10여 건의 세미나도 동시에 개최한다. 또한 상하수도 시설 또 전시장 투어 프로그램 는 물분야 기업 견학 같은 부대행사가 동시에 진행될 예정이며, 수 3/20(수) ~ 22(금) 상하수도 시설 및 기업 견학 돗물 음용의 긍정적 인식 확산과 관심 제고를 위해 ‘차(tea) 라운지’, 수돗물 블라인드 테스트 ‘수돗물 블라인드 테스트’ 등 현장 이벤트도 운영한다. 세미나(상하수도 업무개선 사례 발표회 등) 온라인 전시관을 통한 상시 전시 운영 온라인 전시관 홈페이지 한국상하수도협회(이하 협회)는 기존의 시간적·공간적 제약을 없 애고, 제품에 대한 일회성 홍보가 아닌 꾸준히 정보를 제공하고 홍 보할 수 있는 온라인 전시관을 리뉴얼하여 기업 홍보와 지원을 강 화해나가고 있다. 온라인 전시관은 기업의 홍보 활동을 상시 지원하기 위해 협회에 서 기업에게 무상으로 제공하는 온라인 플랫폼으로 현재 박람회 참가 신청 기업 포함 약 100개 사, 511개 제품이 등록돼 있다. 협 회는 박람회 참가 기업의 제품 정보를 박람회 기간뿐 아니라 행사 홈페이지 바로가기 (waterkorea.kr) 종료 후에도 게시하여 기업의 홍보 활동을 돕고, 기업 홍보 영상 제 작도 지원한다. 박람회 기간 중 부스에서 영상 촬영을 진행하는데, 완성된 영상을 기업에게 제공하는 것뿐만 아니라 온라인 전시관에 도 등록되어 기업 홍보에 도움이 될 것으로 기대된다."}, {"p": 20, "t": "2024 WATER KOREA 참여 방법 2024 WATER KOREA 주요 부대행사 기업 회원은 WATER KOREA 홈페이지(waterkorea.kr)에 접속해 부스 일정 배치도 확인 후 위치를 지정하여 참가신청을 할 수 있다. 참관객 사전 행사명 등록, 견학 사전등록 등은 2월부터 가능하다. 3/20 (수) 3/21 (목) 3/22 (금) 기타 행사 진행에 대한 자세한 내용은 홈페이지와 스마트폰 앱을 통 개막식 ○ 해 확인할 수 있다. 국내 물 분야 구매상담회 ○ ○ ○ 전시장 투어 ○ ○ ○ 해외바이어 초청 수출상담회 ○ ○ ○ 상하수도 시설/기업견학 ○ ○ ○ 상하수도인의 밤 행사 ○ 신청방법 행사 폐막식 2024 WATER KOREA 국제세미나 ○ ○ 상수도 업무개선사례 발표회 물산업 우수제품 등 지정제도 설명회 홈페이지 (waterkorea.kr) ○ ○ 특별세미나 ○ 하수도공동연구협의회 워크숍 ○ 하수도 업무개선사례 발표회 ○ 세미나 환경산업 인적자원개발 세미나 ○ 한국물환경학회·대한상하수도학회 ○ 공동학술발표회 한국지방자치학회 기후위기와 탄소중립 시대 물관리 정책 세미나 상수도연구기관협의회 연구 발표회 ○ ○ 먹는물검사기관협의회 수질개선 발표회 ○ 스마트폰 앱 회의 구글 플레이스토어 또는 애플 앱스토어에서 ‘워터코리아’ 검색 홈페이지 사전등록 바로가기 아이폰 앱 바로가기 안드로이드 앱 바로가기 2024년 한국상하수도협회 정기총회 ○ ○"}, {"p": 21, "t": "TOGETHER 오늘도 물산업의 발전을 위해 힘차게 노력하는 이들의 이야기를 전합니다. 회원탐방 1 김해시 상하수도사업소 회원탐방 2 (주)현대워터텍 (주)수도씨앤지 에코비트 워터(주) KWWA 초대석 박정 환경노동위원회 위원 회원소식"}]}, {"id": "89-22", "no": 89, "label": "2024 신년호", "corner": "회원탐방 1", "title": "김해시 상하수도사업소", "author": "", "start": 22, "end": 25, "pages": [{"p": 22, "t": "TOGETHER 회원탐방 1 차원이 다른 물관리의 대명사로 우뚝 서다 김해시 상하수도사업소"}, {"p": 23, "t": "김해시 상하수도사업소가 2022년 물관리 최우수기관으로 선정됐다. 시민의 일상을 유지하고 생활을 지탱하는 가장 기본이 물이라 는 원칙을 통합적이고 체계적인 물관리 시스템으로 구현하고 그 위에 직원의 모든 역량을 집중한 덕이다. 한 치의 실수조차 용납하 지 않는 깐깐한 관리로 신뢰받는 수돗물의 표상으로 떠오른 김해시 상하수도사업소의 이야기를 들어본다. 글_이은정 사진_박재우 \u0007김해시 상하수도사업소의 주요 업무를 소개해 주세요. 김해시 상하수도사업소는 4과(수도과, 하수과, 삼계정수과, 명동 정수과) 19개 팀으로 이루어져 있습니다. 106명의 직원이 깨끗 하고 안전한 수돗물 ‘찬새미’를 생산해 시민들이 믿고 마실 수 있 도록 모든 역량을 집중해 노력하고 있죠. 찬새미는 국제적 기준 의 품질과 안전성을 확보한 것은 물론 NSF(미국위생재단) 국제 인증을 취득해 뛰어난 수질 기준과 위생 수준을 인정받았습니 다. 이뿐만 아니라 스마트 물 통합 관리 시스템 구축, 상수도 현 대화, 노후 상수도 정비, 정수장과 배수지 증설, 비상 공급망 구 축 등 상수도 인프라를 확대함으로써 기후 변화 및 도시 확장 등 에 선제적으로 대응하는 데 주력하고 있습니다. 이 같은 노력에 힘입어 2022년 물관리 최우수기관에 선정됐습니다. \u00072022년 물관리 최우수기관으로 선정될 수 있었던 이유 는 무엇이라고 생각하시나요. 깨끗하고 안전한 수돗물을 안정적으로 공급해 시민의 삶의 질을 향상시키고 일상을 지키기 위해 노력한 것이 수상의 동력이 됐 다고 생각합니다. 스마트 정보통신기술(ICT)을 기반으로 한 물 통합관리시스템 구축, 정수장 증설 등 인프라 확대, 정수장 위생 관리, 수돗물의 객관적 신뢰도 확보를 위한 국제 인증 취득, 지속 적인 물 복지 지원, 시민과 함께하는 수도 행정 구현, 수도 요금 현실화를 통한 공기업 재정 건전화 등 꾸준한 노력을 지속해 왔 습니다. \u0007지속적인 노력을 통해 앞으로 개선해나가고자 하는 것 은 무엇인가요. 최근 들어 자연환경의 불확실성이 커졌습니다. 불확실한 자연환 경은 급격한 기후 변화를 동반하며, 예측하기가 어렵고 대응력 이 떨어질 수밖에 없습니다. 물은 시민들의 일상을 유지하고 생 활을 지탱하는 데 가장 기본이 됩니다. 안전하고 품질이 우수한 수돗물을 생산·공급해야 하는 이유죠. 작은 사고나 사소한 실수 도 시민들에게는 치명적일 수 있으므로 완벽한 대응 방안을 마 련해야 합니다."}, {"p": 24, "t": "저희는 비상 상황, 위기 상황에 대비해 올해 ‘삼계~덕산정수장 권 또한, 낙동강 페놀 오염 사건 이후 낙동강 원수에서 발생할 수 있 역 간 비상 공급망 구축 사업’을 시작했습니다. 내년에는 김해시 는 수질사고에 대비해 전후 오존 공정 및 입상활성탄 여과지를 도 서부권 안전망 구축 사업을 추진할 계획입니다. 이를 통해 수돗물 입했습니다. 2017년에는 김해시 생림면 딴섬에 하루 18만 톤의 의 안정적인 공급은 물론 비상시 유연한 대처도 가능하리라고 예 강변여과수 취수시설을 설치해 시민들의 불안을 해소시켰습니다. 상합니다. 또한 중대시민재해 중 제조물인 수돗물의 안전한 공급 과 사고 발생 시 신속한 대응 및 피해 최소화를 위해 ‘상수도 분야 \u0007김해시 수돗물 브랜드 ‘찬새미’가 인상적입니다. 찬새미는 안전 계획 및 위기 대응 체계’를 수립했습니다. 어떻게 탄생했으며, 실제 생산은 어떤 과정을 통해 이루 어지나요. \u0007김해시 상하수도사업소만의 ‘지역 특화 사업’이 있다면. 찬새미는 2012년 전국 공모로 탄생한 브랜드로, 2016년부터 병 현재 비상 공급망 구축 사업을 진행하고 있습니다. 김해시는 삼 입수돗물 브랜드로 사용하고 있습니다. 낙동강 표류수가 하천 바 계·명동·덕산(부산) 등 3개의 정수장을 운영하고 있는데요. 평소 닥 토양의 자정작용을 거쳐 강변여과수로 태어나는 과정을 ‘뼛속 각 정수장은 해당 급수 구역에만 수돗물을 공급합니다. 만일 상수 까지 시리도록 차갑고 맑은 우물’이라는 뜻의 ‘찬새미’로 표현했습 도 사고가 발생하면 단수로 인해 시민들이 불편을 겪게 되는데, 이 니다. 2019년 수돗물 범국민운동기구인 ‘수돗물시민네트워크’에 를 최소화하기 위해 2013년부터 각 급수 구역 간 공급망을 구축 서 주최한 수돗물시민대상에서 전국 지방자치단체 중 처음으로 해 최종 계획인 삼계~덕산정수장 권역 간 비상 공급망 및 서부권 대상을 받으며 품질을 인정받았습니다. (장유) 안전망 구축 사업을 추진하고 있습니다. 2027년 비상 공급 생산도 다양한 공정을 거쳐 깐깐하게 이루어집니다. 강변여과수 망 구축 사업을 완료하면 김해시는 365일 단수 없이 안정적으로 와 표류수를 원수로 삼아 취수원을 다변화했는데, 특히 강변여과 수돗물을 공급할 수 있을 것입니다. 수를 사용해 녹조나 유기물 증가 시 염소소독 정수 과정에서 발생"}, {"p": 25, "t": "하는 총트리할로메탄(THMs)을 표류수만 사용하는 낙동강 인근 지방자치단체 정수장보다 3~5배 낮게 운영·관리하고 있습니다. 취수장에서 취수한 원수는 생림가압장을 통해 삼계정수장과 명동 정수장으로 보내고, 각 정수장에서는 착수정, 전오존, 혼화지, 침전 지, 모래여과지, 후오존, 활성탄 여과지, 염소 투입 등의 정수 공정 을 거쳐 찬새미를 생산합니다. 이렇게 생산한 찬새미는 각 가정으 로 공급됩니다. \u0007맑고 깨끗한 품질의 찬새미를 알리기 위해 어떤 노력을 하고 있나요. 찬새미를 홍보하고 시민들과 적극적으로 소통하기 위해 2019년 김해시수도박물관을 설립했습니다. VR 전시관을 구축해 정수 현 장을 실감 나게 보여드리고 있으며, SNS를 통해서도 꾸준히 소통 하고 있습니다. 해마다 수돗물 품질보고서, 민원 사례집 등을 발간 해 찬새미의 안정성을 지속해서 알리고, 수돗물 시민평가단을 운 영해 시책 홍보 및 의견 수렴도 진행합니다. \u0007김해시가 도내 지방자치단체 최초로 상수도 분야 안전관 리계획과 주요 위기 대응 체계를 수립했다고 들었습니다. \u0007시민들의 물 복지 증진을 위한 김해시 상하수도사업소의 중대재해 처벌 등에 관한 법률이 시행됨에 따라 김해시에서는 수 앞으로의 계획이 궁금합니다. 도시설 전 과정에서 발생할 수 있는 유해·위험 요인을 파악하고, 취약계층의 수도 요금 감면에 힘쓰고 있습니다. 또한 직결급수 공 위기 상황 발생 시 신속하고 정확한 대응 및 복구를 통해 피해를 사비, 노후 옥내급수관 개량, 옥내누수 탐지 비용을 지원하고 수돗 최소화하도록 비상 상황의 유형별 임무, 대응 방법 등을 수립하고 물 누수 신고 포상 제도를 시행하는 등 상수도 공기업으로서 사회 교육·훈련을 진행하고 있습니다. 또한 관로의 복선화, 비상 공급망 적 가치 향상에 최선을 다하고 있습니다. 2023년 8월 기준 12억 등 위기 대응을 위한 시설을 구축하는 등 시설을 확충하고 관리 3,000만 원 규모의 예산을 취약계층 지원에 투입했으며, 올해에 체계를 고도화해 단 한 건의 재해도 발생하지 않도록 안전관리계 는 수도급수조례를 개정해 누수 감면 확대를 추진함으로써 물 복 획에 의거해 점검하고 시행할 계획입니다. 지 증진에 더욱 힘쓸 계획입니다."}]}, {"id": "89-26", "no": 89, "label": "2024 신년호", "corner": "회원탐방 2", "title": "(주)현대워터텍 · (주)수도씨앤지 · 에코비트 워터(주)", "author": "", "start": 26, "end": 37, "pages": [{"p": 26, "t": "TOGETHER 회원탐방 2 ㈜현대워터텍 성장과 도약을 넘어 세계로의 비상을 시작하다 현대워터텍은 박세웅 대표가 ‘저마다 다른 환경을 고려한 맞춤 형 제품, 차별화된 제품을 만들고 싶다’는 마음으로 키워낸 종합 수처리 전문 기업이다. 오랜 시간 연구 개발에 집중한 결과, 다 짐은 현실이 됐다. 남다른 기술력을 인정받으며 매년 국내 시장 에서 괄목할 만한 성과를 거두고 있을 뿐 아니라 세계 속에서 한 국 기술의 자부심을 드높이고 있는 것. 정수, 하수, 폐수 등 수처 리 전반에 걸쳐 무한한 가능성을 뽐내는 현대워터텍의 성장세 가 심상치 않다. 글_김미현 사진_김도형 꾸준한 연구 개발이 폭풍 성장의 원동력 박세웅 대표가 현대워터텍을 설립한 2008년은 국내 물시장에서 국 산 수처리 제품들이 하나, 둘 자리를 잡아나간 시기다. 1980년대 후 반부터 수처리 제품 수입 의존도를 줄이기 위해 다년간 지속해 온 기 업들의 연구 개발이 긍정적인 결과를 내기 시작한 것. 하지만 당시 국 내 밸브 제조 회사에서 10년 넘게 근무하며 다방면으로 경험을 쌓아 온 박세웅 대표는 국산화를 넘어 그다음, 현장에 최적화된 제품 개발 의 필요성을 느꼈고, 여러 연구 끝에 성공적인 결과를 얻어냈다. 기술 (주)현대워터텍 박세웅 대표 의 차별화를 이뤄낸 것이다. “우리 회사의 가장 큰 장점은 제품을 규격화하지 않는다는 점이에요. 현장 상황을 고려해 100% 맞춤 제작을 고집하죠. 어떤 제품이든 최 상의 효율을 얻기 위해서는 누가, 어떻게, 왜 사용하는지를 정확히 알 고 그것에 맞게 설계하는 것이 가장 중요해요. 제가 회사를 설립한 지 15년이 지난 지금까지도 계속해 신제품 개발 및 성능 개선을 위한 연 구 개발을 강조하는 이유가 여기에 있죠. 직원들의 역량 강화를 위해 최소 1인 1자격증은 취득할 수 있도록 독려하고, 수강료나 근무시간 조정 등 지원도 적극적으로 하고 있습니다.” 이러한 노력 덕분일까. 현대워터텍은 회사 설립 이후 거의 매년 특허 를 출원하고 있다. 2023년 10월 기준, 보유한 특허만 18종에 이르며 디자인 특허(1종), 직접생산증명 28개 품목에 대한 품질, 안전, 보건 인증(ISO9001, ISO14001, ISO45001), 경영혁신중소기업·기술혁신 형중소기업 등 경영, 기술 관련 인증도 보유 중이다. 여기서 끝이 아니 다. 기술 개발 과정에서 수처리 기계의 기반 조성 사업인 토목과 상하 수도 분야에 대한 전문 지식이 필요하다고 판단, 지난 2019년에 토공 사업, 상하수도설비공 사업과 관련한 전문 건설 면허도 취득했다."}, {"p": 28, "t": "김정곤 부대표는 “보통 토공, 상하수도, 기계설비 중 하나의 전문 면허 로써 최상의 수질 조건을 유지할 수 있도록 도와주죠.” 만 가지고 있어 여러 개의 업체가 함께 공사를 진행하다 보면 일정 조 ‘모터 구동에 의한 랙 방식의 수문’은 하천, 호수, 농수로 등에서 홍수 율이 잘 안되거나 공사 방향에 대한 의견이 맞지 않아 애를 먹는 경우 발생 및 취수 관리에 사용하는 수문이다. 마치 톱니바퀴가 맞물리듯 가 종종 있다”며 “수처리 시설 공사 진행 시 필요한 모든 면허를 갖추 전동기에 의해 기어를 회전시켜 게이트와 결합해 있는 랙 유닛을 가 고 있어 원스톱으로 진행이 가능해 시간 및 비용을 크게 줄일 수 있는 이드에 따라 상하로 동작해 수문을 개폐하는 방식으로 작동한다. 구 것도 현대워터텍의 강점”이라고 자랑했다. 조가 간단하며 모듈 구조로 만들어져 쉽게 설치하고 유지 관리할 수 있다는 것이 장점이다. 또 상부 구조물이 필요 없어 핀잭 권양방식(상 최고의 기술력으로 글로벌 강자로 발돋움하다 부 구조물에 설치된 권양기에 의해 수문을 개・폐함) 대비 토목 공사비 제품의 기술력은 두말하면 입 아프다. 특히 시시때때로 변화하는 환 도 40% 이상 절감할 수 있다. 김정곤 부대표는 “일률적인 개폐 동작 경에 필요한 기술을 제공하고, 주기적으로 보완해 효율을 끌어올려 이 가능해 복수의 게이트를 동시에 활용할 수 있다는 점, 이물질 끼임 줘 이미 시장에서는 ‘현장 맞춤형 기술’이라는 호평을 얻고 있다. 이러 발생 시 닫히는 힘이 커 이물질을 파쇄해 개폐 시 기능에 큰 지장이 없 한 장점을 앞세워 지난 2022년, 3년여의 준비 끝에 중소벤처기업부 는 것도 랙 방식 수문의 강점”이라며 “안정적으로 승하강이 이뤄져 비 로부터 국내 기술 개발 국가인증 중 높은 난도로 손꼽히는 ‘성능인증’ 틀림 현상이 발생할 확률이 낮고, 핀잭 권양방식 대비 개폐 속도도 19 도 받았다. 그것도 멀티형 수중교반기, 모터 구동에 의한 랙 방식 수 배 정도 빠르다”고 강조했다. 문, 롤러 접촉 방식을 적용한 비금속 수문, 세 개 제품이나 말이다. 마지막으로 ‘롤러 접촉 방식을 적용한 비금속 수문’은 오염지역 및 환경 “‘멀티형 수중교반기’는 단방향 교반기의 단점을 보완하는 데 초점을 관리 수처리 장소, 집수지, 저수지 및 정수·하수 처리시설에 주로 설치하 맞춤 제품이에요. 다축을 가진 멀티형 교반으로 사각지대 발생을 최 는 수문으로 내구성이 뛰어나고 가공성이 좋아 다양한 규격과 용도의 소화하고, 이로 인해 굳어진 슬러지(찌꺼기)의 유동성을 증가시킴으 수문에 적용이 가능하다는 것이 장점이다. 또 중량이 가벼워 동력 소요"}, {"p": 29, "t": "가 적으며 제작, 설치 및 유지 보수가 쉽고, 고밀도의 폴리에틸렌(HDPE) 으로 이뤄져 잘 부식되지 않으며, 미세한 간격 조정도 가능하다. “세 가지 제품 모두 ‘성능인증’에 이어 ‘기술개발 우선 구매제품’으로 선정돼 현재 국내 판매와 수출을 병행하고 있어요. 지난 2022년에 이 어 2023년까지 동남아 수출에 성공했죠. 더욱 폭 넓은 해외 시장 진 출을 위해 한국수자원공사, 한국농어촌공사, 한국환경공단 등 국내 관계기관과 협업 관계를 유지하면서 제품의 우수성을 꾸준히 홍보함 은 물론 현지 여건에 맞게 기능을 개선하기 위해 노력하고 있습니다. 또 올해는 신제품 개발과 동시에 지금의 기술을 현행화하고, 유지 보 수하는 데 집중할 계획입니다.” 다음 목표는 수처리 분야 선두기업이 되는 것 현대워터텍은 올해 매출액 150억을 목표로 수처리 기계 분야, 상하 술 공유 등에 관심을 두고 무인 자동화 시스템 개발에 대한 연구를 진 수도 시설 분야, 하수관로 공사 분야, 플랜트 설비 분야 등에 회사의 행 중이다. 또 지구온난화에 따른 기후 변화로 발생하는 폭우와 폭설 역량을 집중시킬 계획이다. 우선 1차 목표는 현재 보유한 기술을 업 등에 신속하게 대응할 수 있는 방제 예방 제품에 대한 연구 개발도 시 그레이드해 ‘조달청 우수제품’ 인증을 받는 것이다. 조달청 우수제품 작했다. 제도란, 조달물자의 품질향상을 위해 지난 1996년에 도입된 제도다. “올해는 현재 운영 중인 지사(인천지사, 영남지사, 강원지사)의 경쟁력 중소기업 및 초기 중견기업이 생산한 제품 중 기술 및 품질이 우수한 을 강화해 각각의 지역 특색에 적합한 맞춤형 제품 개발도 강화할 계 제품을 대상으로 엄정한 평가를 통해 우수제품으로 지정, 지정된 제 획이에요. 깔따구 유충을 자동화 방식으로 원천 차단할 수 있는 제품 품에 대해서는 국가계약법령에 따라 계약을 체결해 각급 수요기관에 을 개발, 특허 출원을 준비 중이고요.” 조달할 수 있다. 다시 말해, 조달청 우수제품으로 선정된다는 것은 국 국가물산업클러스트에 입주해 운영 중인 개발 분야의 역량을 강화해 가로부터 품질을 인정받는 것이다. 국가의 물산업 계획에 발맞춘 선두기업으로 나아갈 목표도 수립하고 신제품 개발에도 박차를 가할 계획이다. 이미 IoT(사물인터넷)와의 기 있는 현대워터텍. 자신들만의 차별화된 경쟁력을 키우기 위해 현장에 대한 분석, 품질을 향한 연구를 계속해나가는 그들이 앞으로 국내외 수처리 시장에서 얼마나 존재감을 키워갈지 기대된다. 우리 회사의 가장 큰 장점은 제품을 규격화하지 않는다는 점이에요. 현장 상황을 고려해 100% 맞춤 제작을 고집하죠."}, {"p": 31, "t": "수도씨앤지는 최초로 자외선 현장경화공법 국산화에 성공한 기업이다. 꾸준한 연구개발이 원천기술 확보로 이어지고, 현실에 안주 하지 않은 도전정신이 상하수도 관로의 효율적인 유지관리를 가능케 했다. 국내 상하수도 관로 유지관리 기술을 한 단계 끌어올리며 업계 퍼스트 펭귄으로 부상한 수도씨앤지의 다음 스텝은 어디일까. 글_이은경 사진_김도형 ㈜수도씨앤지 첨단기술로 무장한 상하수도 관로 유지관리의 선두 주자 (주)수도씨앤지 엄필성 대표 상하수도 관망은 용수의 이송, 우수·오수의 배제를 담당하는 사회기 최초로 자외선 현장경화공법·장치 국산화 초시설이다. 특히 하수관로는 하수처리장과 더불어 도시민들의 공중 수도씨앤지는 지하 매설물 상태를 진단하고 유지관리에 필요한 맞춤 위생과 쾌적한 생활환경을 좌우하며, 도시의 혈관이자 심장으로 기 솔루션을 제공하는 기술 벤처기업이다. 2017년 설립 이후 CCTV 촬 능한다. 하수관로에 쓰레기나 흙이 들어와 쌓여 하수가 제대로 흐르 영·조사, 하수관로 준설, 비굴착 보수공사 등을 꾸준히 전개하며 경험 지 못하면 악취가 발생하고 이상 강우 시 홍수 방재에도 영향을 미치 과 기술력을 축적했다. 수도씨앤지가 제대로 주목받기 시작한 건 국 게 된다. 내 최초로 자외선 광중합반응 기반 하수관로 비굴착 부분 보수 공법, 환경부에서 발간한 2020년 하수도 통계에 따르면 우리나라는 전 즉 자외선 현장경화공법(SDUV-CIPP)을 개발하면서부터다. 국에 16만 3,099km에 달하는 하수관로가 설치돼 있다. 이 중에서 하수관로에 문제가 발생하면 교체하거나 보수해야 하는데, 하수관 1996년 이전에 매설돼 25년이 지난 노후 관로가 전체의 40.2%로 1km를 교체하는 데 약 10억 원이 소요된다. 게다가 굴착을 해야 한 나타났다. 기존 시설의 노후화가 잇따르면서 하수도 운영 및 유지 관 다면 시민들의 생활 불편이나 교통 혼잡은 불가피해진다. 현장경화공 리 비용은 지속해서 증가하는 추세다. 수도씨앤지 엄필성 대표이사 법은 매설된 하수관을 파내지 않고, 열경화성 수지를 함침한 보수재 가 첨단기술과 공법을 개발하고 상하수도 관로 분야에 자산관리 개 를 하수관 내부에 삽입한 후 압축공기를 이용해 손상 부위에 밀착시 념을 적극적으로 도입해야 한다고 강조하는 이유다. 키고 이를 열풍이나 증기를 조사해 경화시킴으로써 일정 구간을 부 “우리나라 하수도 시설 대부분이 1992년부터 20년에 걸쳐 설치돼 분적으로 보수하는 방법이다. 하지만 기존 현장경화공법은 보수재 경 앞으로 내구연한이 지난 하수도 시설이 한꺼번에 쏟아질 겁니다. 첨 화시간이 1~2시간씩 걸린다는 단점이 있다. 이를 보완하도록 개발된 단기술을 적용해 하수관로 분야의 선진화를 이끌어야 효율적으로 유 기술이 자외선을 이용한 현장경화공법이다. 보수재에 함침한 화학제 지관리하고 비용을 줄일 수 있습니다.” 를 자외선에 반응시켜 10분 이내로 경화시키는 기술로, 미국과 유럽,"}, {"p": 32, "t": "일본 등에서는 이미 보편화된 기술이지만 국내는 기술 장벽이 높아 하수관로 자산관리 체계 구축에 앞장 대부분 수입에 의존하고 있다. 그마저도 저가 장비를 수입해 상대적 엄필성 대표이사는 2017년 수도씨앤지를 창업하고 상하수도 관로 으로 낙후한 현장경화공법을 적용하는 게 현실이다. 분야에 뛰어들었다. 오랜 기간 국내외 건설 현장에서 현장 기술사로, 수도씨앤지의 자외선 현장경화공법 국산화가 주목받은 이유가 여기 소장으로 경험을 쌓다 2006년 우리나라 최초로 이루어진 하수관거 에 있다. 엄필성 대표이사는 3년여에 걸친 연구개발 끝에 원천기술을 정비 BTL 사업에 참여하면서 하수관로 분야를 눈여겨보게 된 것. 확보했다. 자외선 광중합 보수 장치는 제어부, UV LED 보수패커, UV “하수관로 분야를 꺼리는 이들도 많지만 저는 무한한 가능성이 보였 화학제로 구성되어 있으며 이를 이용하면 8~10분 내 급속 경화로 비 어요. 그간 환경 관련 신기술 대부분이 상하수도 분야에서 나왔다는 굴착 부분 보수·보강이 가능하다. 해외 유사 장비보다 30~50% 수준 것은 발전 가능성이 크다는 방증 아닐까요.” 으로 가격경쟁력을 확보했으며 기존의 에폭시 계열이 아닌 나일론 계 블루오션을 개척하고 경쟁력을 확보하기 위해 2019년 기업부설 연구 열의 경화제를 사용해 강도를 높였다는 점도 주목할 만하다. 내부 통 소를 개소하고 꾸준히 R&D에 투자해온 수도씨앤지는 특히 세계적으 수 구조로 비굴착 보수 시공 중 기존 하수관로 내 하수의 흐름을 방해 로 부상하고 있는 상하수도 자산관리 개념과 시스템 구축에 주목했다. 하지 않고 시공할 수 있으며, 태양광 충전이 가능해 탄소중립에 이바 “우리나라는 노후 기반 시설 관리체계를 지속하기 위해 ‘지속가능한 지할 수 있다. 또 내외부 분리형 구조로 A/S 편의성을 높였으며 고장 기반 시설 관리 기본법’을 제정해 2020년부터 시행하고 있어요. 예전 이 발생하더라도 일주일 내에 A/S 받을 수 있다. 에는 상하수관에 이상이 생겨야 보수하거나 대응하는 개념이었다면 수도씨앤지는 2022년 기술 개발을 완료하고 관련 특허도 확보했다. 이제는 예방 차원에서 계획적이고 계통적인 유지관리 개념이 필요합 엄필성 대표이사는 “지난해 세 차례에 걸친 고도화 작업으로 휨강도, 니다. 무작정 파내거나 매설하는 개념이 아니라 기존 관로를 어떻게 탄성계수, 인장강도 등의 기능뿐만 아니라 경량화 측면에서도 경쟁력 하면 최소의 비용으로 최적의 효과를 내게 할 것인가에 집중해야죠. 을 확보했다”고 강조했다. 하수관로 노후화로 인해 발생하는 사회경제적 비용이 일상 유지관리"}, {"p": 33, "t": "비용이나 갱생 비용보다 훨씬 더 큽니다.” 엄필성 대표이사는 상하수도 관로 분야에 자산관리 개념을 도입하 고 시스템을 마련하려면 하수관로 내부 상황을 정확히 파악하고 판단 할 수 있는 데이터베이스 수집과 모니터링이 선행돼야 한다고 강조했 다. 자외선 현장경화공법 외에 한국전자기술연구원과 협력해 레이저 를 이용한 관로 내부 퇴적량 측정 모듈을 개발하고, 한국광기술원·호 남대학교와 산학협력으로 ‘3D Depth 카메라 기반 하수관로 모니터링 시스템’ 개발을 진행한 것도 이런 이유에서다. “하수관로 내 쌓여 있는 퇴적량을 정량적으로 산출하는 게 중요하다 고 생각했어요. 처음에 레이저 센서를 이용해 측정하려고 해봤으나 하수관로 내 물 때문에 난반사가 일어나 정확한 측정이 어렵더라고 요. 그래서 타 분야에서 활용하는 3D Depth 카메라를 하수관로 분야 에 적용해 봤죠. 계측 센서를 설치한 자주차를 하수관로 내부로 주행 상 점검해야 한다. 또, 풍수해 등 기상에 따라 특별점검을 진행해야 한 시켜 관로 내부 상태를 조사하고 계측 데이터를 분석해 퇴적량을 정 다. 엄필성 대표이사는 이 같은 비즈니스 환경이 상하수도 관로 유지관 량화하는 장비인데요. 성능은 이미 인정 받았습니다.” 리 시장을 확대하고 성장시킬 것으로 기대했다. 수도씨앤지의 이 기술은 기존 방식의 하수관로 내부 상태 조사와 퇴 “앞으로 상하수도 관로 유지관리 시장은 더 커질 수밖에 없습니다. 기 적량 정량적 측정이 동시에 가능하며, 특히 관로 내부의 파손 여부를 술도 발전할 테죠. 그런데 시장이 상대적으로 보수적입니다. 도시 생활 분별하는 딥러닝 시스템 구현의 초기 단계로 주목받고 있다. 이처럼 환경이나 홍수 방재 등과 직결되는 만큼 검증된 기술이나 공법을 선호 현실에 안주하지 않고 끊임없이 기술 개발에 매진해 온 수도씨앤지는 하고 신기술이나 신공법을 적용하는 데 오래 걸리죠. 그래도 현장에서 지난 ‘2021년 4IR Awards’에서 수자원기술로 그린뉴딜부문 대상을 적극적으로 새로운 공법을 적용해야 더 나은 기술, 더 나은 미래가 있 받기도 했다. 엄필성 대표이사는 “4차 산업혁명 시대를 이끌어갈 기 다고 생각합니다.” 업에 주는 상이라 의미가 남다르다”며 뿌듯함을 감추지 않았다. 그는 지난해 전남 함평군 노후 농공단지 하수관로 개보수 사업에 자사의 공법을 반영한 결과, 현장 반응이 뜨거웠다고 전했다. 이를 토대로 국내 깨끗하고 안전한 물길을 위해 최초로 원천기술을 확보한 만큼 자부심을 느끼며 업계 관행의 장벽을 넘 지난해 6월, 지방자치단체의 하수관로 유지관리 강화를 주요 골자를 어보겠다는 각오다. 꾸준한 연구개발로 국산화에 성공하고 꺾이지 않은 하는 하수도법 시행령 및 시행규칙 개정안이 시행됐다. 이에 도시 침 열정으로 더 나은 기술 개발에 앞장서는 수도씨앤지. 이처럼 용기를 내 수 예방을 위해 침수 위험이 큰 지역은 하수관로 유지관리계획을 해마 어 도전하는 퍼스트 펭귄으로서 수도씨앤지의 비전과 행보가 우리나라 다 11월 말까지 수립해야 하고 모든 하수관로를 대상으로 연 1회 이 상하수도 관로 유지관리 분야의 미래를 환하게 밝히고 있다. 현장에서 적극적으로 새로운 공법을 적용해야 더 나은 기술, 더 나은 미래가 있다고 생각합니다."}, {"p": 34, "t": "TOGETHER 회원탐방 2 공공 하수처리 민간 위탁시장 1위, 자발적 에너지효율 목표제 우수사업장 선정 등 높은 성과를 기록하고 있는 수처리 전문 기업 에코 비트 워터는 하폐수 처리장을 비롯한 환경 기초시설 설계·시공·운영 관리, 그리고 해외시장의 방글라데시 반달주리 정수장 시운전 사업까지 도맡은 기업이다. 국내뿐만 아니라 대한민국 수처리 기술의 우수성을 세계로 알리고 있는 에코비트 워터의 다음 행보가 궁 금하다. 글_이은경 사진_김도형 에코비트 워터㈜ 철학을 담은 노하우로 수처리 업계의 강자가 되다 인구 증가와 기후 변화에 따른 물부족 및 수질오염 등의 문제로 인해, 물관리에 대한 관심이 높아지면서 수처리 기업의 역할은 더욱 중요 해졌다. 에코비트 워터는 환경에 공헌하고자 하는 일념 하나로, 어느 덧 20여년의 업력을 자랑하는 우리나라 대표 수처리 전문 기업으로 우뚝 섰다. “근무자들과 함께 환경업 종사자로서 환경에 기여하고 있 는 것에 대한 큰 자부심을 갖고 있다”고 자신 있게 말하는 김인석 대 표는 “하폐수를 비롯한 오염물질을 최대한 안전하고 합법적인 방법 으로 처리하고, 그 과정에서 발생하는 에너지 사용량과 탄소 발생량 을 줄이는 것 또한 중요하게 생각한다”며 기업의 철학에 대해서도 명 확하게 이야기했다. 지속적인 성장, 스마트한 환경사업 에코비트 워터는 국내 대표 종합환경기업 에코비트의 수처리 전문 자회사로 하폐수 처리 시장이 민간 기업에 개방된 2004년부터 수처 리 사업을 수행했다. 김천, 안산, 전주의 공공하수처리시설과 경산 국 가산단 폐수처리시설 등이 대표적 운영 시설이다. 현재 전국 750여 개의 공공환경 기초시설을 운영 및 관리하며 처리용량 기준으로 ‘민 간 위탁 하수처리 시장 1위’를 달성하는 기염을 토했다. 또한 하폐수 처리 운영이 어려운 지자체나 환경 공기업의 환경 기초시설을 위탁 운영하며 깨끗한 수질과 환경 유지에 공헌해왔다. 진건 하수, 수원 슬 러지사업 등 다양한 환경 기초시설 SOC사업장에도 적극적으로 투자 하며 지자체의 예산만으로 시공 및 운영이 어려운 지역에 하수 처리 시설을 공급·운영함으로써 깨끗한 환경과 주민들의 편리한 생활을 돕고 있는 것이다. “지난 4월 하수처리 민간 위탁시장에서 두 번째로 큰 안산 하수 처리 장을 신규 수주한데 이어 최근 성남 하수처리장 운영 입찰에도 성공 했습니다. 이를 통해 전국 750여 개의 환경 기초시설 운영과 민간 위 탁시장 최대 처리용량 점유율을 기록했지요. 그동안 에코비트 워터 가 급격하게 성장하면서, 기술 축적과 함께 지자체가 원하는 시설 운 영의 효율성을 경험했어요. 그것을 기반으로 사업을 좀 더 견고히 다 질 수 있었죠.” 에코비트 워터(주) 김인석 대표"}, {"p": 36, "t": "에코비트 AIBROs 공정도 최근 에코비트 워터는 AI(인공지능)와 IoT(사물인터넷) 기술 기반 계·시공·운영관리 기술을 보유하고 있는 에코비트 워터는 독보적이 AIBROs(하수처리시설 자동제어 솔루션)에 관련된 세부 기술 중 1건 고 차별화된 기술로 꾸준히 성장 중이다. 의 특허 등록을 완료하고, 해당 솔루션의 상품화를 위한 사업적 검토 “세계적인 환경공학 학술지인 ‘Water Research’에 관련 논문을 게재 를 진행하고 있다. AIBROs는 IoT 수질분석 센서를 이용해 하폐수 처 하고, 지속적인 연구 활동을 통해 새로운 기술 개발에 매진하고 있어 리장의 유입수 및 방류 수질의 변화를 실시간으로 수집하고, 수질 변 요. 일정 하수 용량을 반응조에 모은 뒤 처리하는 ‘SBR 공법’에 스마 화에 따른 최적의 운전 조건을 도출하는 AI 기반 자동제어 기술이다. 트 기술을 적용한 ‘에코비트 Smart-SBR’ 기술을 개발하여 2건의 특 수질분석 센서를 통해 감지된 수질에 따라 생물 반응조의 송풍량, 활 허를 등록했고요. 이 외에도 모회사 에코비트에서 수처리 관련 데이 성 미생물 운영 조건 및 질소를 포함한 수처리 조건 등 최적의 하수처 터, 회사 실적 관련 내용을 직관적으로 검토할 수 있는 데이터 시각화 리장 운전 조건과 관련 정보를 제공하여 하수처리 공정의 효율성을 시스템 ‘태블로(Tableau)’를 도입하고, 전사 ERP 시스템 및 구매 시스 높였다. 기존에는 주관적인 요소인 개인의 경험을 기반으로 판단할 템을 고도화하여 에코비트 워터의 경영 인프라를 한층 강화하고 있 수밖에 없었지만, 인공지능 도입 이후 누적된 수질 빅데이터를 활용 습니다.” 해 환경 기초시설이 안고 있던 어려움을 해소하여 스마트 기술의 효 과를 톡톡히 보고 있다. 사회적·환경적 가치 경영을 실천하다 이뿐만이 아니다. 수처리 기술 ‘ECORBIT DAF(용존공기부상법)’를 하 에코비트는 대표를 비롯한 회사 최고위 임원들이 참가하는 ESG 경영 수처리 공정의 효율성을 높이는 기술로 활발하게 사용 중이다. 하수 위원회를 출범하고, 자회사들의 ESG 데이터를 효율적으로 관리하기 오염물질 중 하나인 총인을 약품으로 응집시키고, 미세 거품을 이용 위한 사내 플랫폼을 구축하고 있다. 해 수면으로 띄워서 제거하는 기술이다. 기존 공정은 미세 거품을 만 “에코비트 워터는 연간 9억 톤의 하폐수를 정화하며 환경에 기여하 들기 위해 펌프, 압축기, 기체 용해 장치 등 복잡한 장치와 넓은 부지 고, 사업소별로 각종 환경 법적 기준 및 오염 총량 기준을 상회하는 기 가 필요했지만, 에코비트의 DAF는 이러한 장치를 기체-액체 혼합 펌 준을 설정하여 준수하고 있습니다. 단순히 환경 오염물질을 줄이는 프 하나로 대체해 설치 면적을 줄이고, 전력 사용량도 기존 대비 최대 것뿐만 아니라 에너지 사용량과 탄소 발생량을 줄이는 것 또한 중요 40%까지 줄였다. 또한 미세 거품의 공급 및 확산 거리를 조절할 수 하게 생각합니다. 최근에 국가산단 폐수사업소를 운영하며 한국에너 있는 ‘Two-way’ 노즐을 적용해 각 하수처리장의 반응조 규격에 맞춰 지 공단이 선정하는 ‘자발적 에너지효율 목표제 우수사업장’으로 선정 처리 효율을 유지할 수 있었다. 이처럼 최고 수준의 환경 기초시설 설 되는 기쁨을 맛보았습니다.”"}, {"p": 37, "t": "사회공헌과 윤리경영도 남다르다. 기존의 컴플라이언스 경영과 안전 보건 경영에 더해 사내 인권정책을 강화하는 방향으로 총력을 다하고 있다. 또 사내 다양성과 평등성, 포용성을 측정하기 위한 다양한 지표 를 도입하고, 고용 및 인사 관리에 있어 해당 지표들을 적극적으로 반 영하기 위한 제도도 마련하고 있다. 대표적으로 고령자 일자리 창출 지원 사업에 참여해 11명의 시니어 인턴을 채용한 사례를 들 수 있다. “임직원들은 에코비트가 운영하는 ‘환경 사랑 봉사단’의 일원으로서 조깅과 환경 정화를 함께하는 ‘줍깅 캠페인’, 재활용품으로 화분을 만 드는 ‘재활용 가드닝’ 등 다양한 사회공헌 활동에 적극적으로 참여합 니다. 고성사업소와 강릉사업소에서 ‘동해안 석호 살리기 캠페인’ 활 동에 매년 참여해 인근 석호 일대의 생태계 교란종 제거에 힘을 보태 고, 김천사업소에서는 생활 폐기물을 처리하는 소각장에서 발생하는 열에너지를 이용해 목욕탕을 저렴하게 운영하고 있죠.” 점유율 방어와 신사업 추진을 목표로 스마트 기술과 ESG 경영까지 훌륭하게 실천하고, 공공 하폐수처리 민 간 위탁시장에서 처리용량 기준 1위의 시장 지위를 달성한 에코비트 1 반달주리 정수장 조감도_에코비트 워터 해외진출 사례 워터의 다음 목표는 무엇일까. 2 에코비트 워터_김천사업소 “에코비트 워터의 중장기적 목표는 그동안 쌓아온 역량과 노하우를 바탕으로 신규 입찰을 통해 시장 점유율을 확대하고, 기존 사업장 재 계약을 통해 점유율 방어를 해나가는 것입니다”라는 말에서 김인석 대표의 자신감이 엿보인다. 또한 그는 위탁 운영뿐만 아니라 지역 환경 기초시설에 직접 투자해 그 수익을 공유하는 SOC사업과 환경 시설 을 설계 및 건설하는 EPC사업의 신규 시장 진출에 대한 포부도 드러 냈다. “수도권 도시에 노후 하수 처리장이 늘어나면서 관련 설비의 증 설·신설 시장이 늘어날 것으로 기대하고 있습니다. SOC및 EPC사업도 중장기적 목표는 그동안 쌓아온 역량과 적극적인 수주 활동에 나설 예정입니다.” 노하우를 바탕으로 신규 입찰을 통해 이 외에도 환경 소재 판매를 담당하는 계열사 에코비트 M&S에서도 시장 점유율을 확대하고, 기존 사업장 재계약을 통해 기존 수처리 시장에서의 점유율을 확대하고, 폐배터리 재활용 약품 점유율 방어를 해나가는 것입니다. 시장 진출을 노리는 등 적극적인 신사업 추진 방안을 모색하고 있다. 사업이 확장될수록 소통의 중요성을 실감했던 김인석 대표는 앞으로 의 계획을 전하며 내부 결속을 다질 것을 강조했다. “다가오는 2024년 새해에는 사업의 양적, 질적 성장은 물론이고 본사 와 사업소, 경영진과 직원, 각 부서 및 직원 간의 사내소통을 강화하여 경영 현장의 목소리가 반영될 수 있도록 다양한 방안을 검토할 것입니 다. 더불어 현장과의 적극적인 소통을 통해 발주처의 니즈를 정확히 예 측하여 사업 경쟁력을 강화하고, 직원 만족도도 높여나갈 예정입니다.” 깨끗한 물이 우리에게 도달하기까지, 보이지 않는 곳에서 구슬땀을 흘려온 에코비트 워터. 그들의 끊임없는 노력 덕분에 우리나라 물 산 업의 미래가 든든하다."}]}, {"id": "89-38", "no": 89, "label": "2024 신년호", "corner": "KWWA 초대석", "title": "박정 환경노동위원회 위원장", "author": "", "start": 38, "end": 41, "pages": [{"p": 38, "t": "TOGETHER KWWA 초대석 환경노동위원회(이하 환노위)는 환경부 및 고용노동부의 소관에 속하는 의안과 청원 등의 심사 등의 직무를 수행하고 있다. 환노위가 ‘환경 문제’와 ‘노동 문제’를 살피는 데 총력을 기울이는 이유는 단 하나. 이 모든 것이 국민의 삶과 맞닿아 있기 때문이다. 기후 위기와 노동자의 안전 문제 등 다양한 현안을 다루고 있는데, 더 나은 대안을 찾기 위해 최선의 노력을 다하고 있는 환노위의 박정 위원장을 만나 그의 의정 철학과 목표를 들었다. 글_임산하 사진_환경노동위원회 삶의 바탕이 되는 환경을 지켜 사람을 향해 나아가겠습니다 \u0007지난해 의정 활동으로 바쁜 한 해를 보내셨습니다. 많은 성과를 이루셨는데, 자세한 이야기가 궁금합니다. 2023년은 특히 바쁜 시간을 보냈습니다. 상반기에는 국회 외교 통일위원회 소속 위원으로서 의원 외교 활동에 큰 노력을 기울였 고, 베트남, 케냐, 탄자니아 등을 시작으로 대한민국의 외교 지평 을 넓히는 데 힘을 보탰습니다. 아쉽게도 부산에서의 2030 세계 박람회 개최는 불발되었지만, 투표국들을 설득하기 위해 진심을 다했습니다. 지난해 6월 14일, 국회 환노위 위원장으로 선출된 이후에는 더 바 쁜 시간을 보냈습니다. 노사정 대화가 단절된 상황에서 업무를 시작 박정 환경노동위원회 위원장 했고, 기후 위기 대응, 후쿠시마 원전 오염수 해양 방류 문제 등 환경 관련 현안도 시급하게 다뤄야 했습니다. 10월 국정감사 기간에도 긴장의 끈을 놓지 않으며, 국회가 국민의 목소리를 대변하는 본래 역할을 다할 수 있도록 상임위원회를 원활히 운영해 왔습니다. 취임 당시 저는 환노위가 ‘사람’을 향하도록 하겠다고 약속했습니 다. 갈등을 피할 수는 없었지만, 이를 지키기 위해 최선을 다하고 있기에 환노위가 큰 위기 없이 운영되고 있다고 자부합니다. \u00072024년 새해가 밝았습니다. 갑진년을 맞이해 의원님의 각오를 여쭙고 싶습니다. 2024년 초 선거가 예정되어 있어 구체적인 활동 방향을 말씀드 리는 건 조심스럽습니다. 그러나 민생이 어렵고, 경제 전망이 나 아지지 않는 현 상황을 탈피하기 위해 국회의원으로서 할 수 있는 모든 노력을 계속해 나가고자 합니다. 초선 의원 시절 국회 산업통상자원중소벤처기업위원회에서 활동 했고, 재선 의원 때는 국회 문화체육관광위원회와 예산결산특별 위원회 간사로 활동했습니다. 그동안 쌓아온 경험이 각 분야에 보 탬이 되는 방향을 계속 찾겠습니다. 정치는 국민의 눈물을 닦아 주는 것이 아니라, 국민이 눈물을 흘리 지 않도록 해야 한다는 신념을 갖고 있습니다. 이 신념을 지키기 위해 2024년에도 최선을 다하겠습니다."}, {"p": 39, "t": "PROFILE 박정 환경노동위원회 위원장은? 제20대 국회위원을 지냈으며, 제21대 국회위원으로 활동 중이다. 국회 문화체육관광위원회와 예산결산특별위원회 간사 등을 역임했으며, 환경노동위원회 위원장을 맡고 있다."}, {"p": 40, "t": "법 시행에 맞춰 관련 제도가 안정적으로 운영되고, 참여율을 높일 방안을 찾기 위해 환노위 차원에서도 전력을 다하겠습니다. 나아가 법 시행 과정에서 보완해야 할 부분을 지속적으로 살피고, 신속히 개선할 수 있도록 노력하겠습니다."}, {"p": 41, "t": "\u0007환노위 위원장으로서 환노위가 다뤄야 할 최대 현안과 앞 이번에 발표한 기본계획에 대해 일각에서는 ‘과거에 비해 상당 으로 나가야 할 방향은 무엇이라고 생각하시나요. 히 후퇴했다’, ‘산업계의 민원 해결 계획이다’라는 비판을 하고 있 환노위가 다뤄야 할 현안이 너무나 많습니다. 대소경중을 가리기 는 것이 사실입니다. 예를 들어 ‘국가 온실가스 감축목표(NDC)’ 보다 가능한 한 많은 현안을 다루고, 더 나은 대안을 찾도록 위원장 의 산업 부문 감축률을 14.5%에서 11.4%로 낮추고, 국외 감축을 으로서의 역할을 해 나갈 생각입니다. 1.5%(400만 톤)로 늘린 것이 과연 실효성이 있을지 의문입니다. 환경 문제에서는 특히 기후 위기 대응 문제에 큰 관심을 두고 있습 특히 2030년까지 감축 목표량은 그대로 40%로 두면서 매년 감 니다. 국제연합(UN) 산하 ‘기후 변화에 관한 정부간 협의체(IPCC)’ 축량을 늘려 마지막 해에 감축해야 할 배출량을 2023년의 10배 는 제6차 평가보고서를 통해 “기후 위기엔 더 이상 선택지가 없으 인 9,000만 톤으로 설정했습니다. 며, 앞으로 10년 안에 지구의 존폐가 달렸다”라며 위기를 강력히 이렇게 되면 다음 정부가 떠맡아야 할 책임이 너무 무거울 뿐만 경고했습니다. 우리에게 주어진 시간은 얼마 남지 않았습니다. 산 아니라 불가능에 가깝습니다. 목표부터 이러한 문제를 안고 있는 업계의 부담을 이유로 온실가스 감축목표를 낮추는 등의 조치를 데, 기본계획이 현실적으로 배출량 감축에 도움이 될 수 있을지 의 정상화할 수 있도록 계속 노력하겠습니다. 문입니다. 국정감사에서도 이와 관련된 문제에 대해 지적한 바 있 더불어 노동 문제에 대해서는 노동자의 안전을 지킬 방안을 지속 습니다. 앞으로 환경부가 기후 위기 대응에 더 적극적인 역할을 할 해서 고민했습니다. 반복적으로 발생하는 노동자 사망 문제에 관 수 있도록 환노위 위원장으로서 지속적인 관심을 갖고, 현실적인 한 대책을 마련하기 위해, 지난해 12월 1일 SPC그룹과 DL이앤씨 대응 방안을 마련할 수 있도록 하겠습니다. 의 산재 관련 환노위 청문회를 열었습니다. 노동자가 안전한 환경 에서 보호받고, 충분한 권리를 보장받을 수 있도록 끊임없이 힘쓰 \u0007마지막으로 <맑은 물 세상> 독자분들께 한 말씀 부탁드립 겠습니다. 니다. 국가 경제가 굉장히 어렵습니다. 물산업 관련 종사자분들도 지금 \u0007올해부터 ‘순환경제사회 전환 촉진법’이 시행됩니다. 시행 의 위기가 빨리 지나갔으면 하는 소망이 있으리라 생각합니다. 정 이후의 상황을 어떻게 전망하며, 해당 법이 지닌 과제는 부가 부족하다면, 국민을 대표하는 국회가 제 역할을 해야 합니다. 무엇인지 궁금합니다. 새해에는 독자 여러분이 더 큰 행복을 누리실 수 있도록 다양한 ‘순환경제사회 전환 촉진법’이 시행되면 순환체계 구축을 위한 생 노력을 이어가겠습니다. 산-유통-소비-재활용 전 주기의 단계별 제도적 기반이 마련될 것 무엇보다 국민과 가까이에서 소통하는 환노위로 거듭날 수 있도 입니다. 특히 해당 법에는 국가와 지방자치단체, 사업자와 국민 등 록 하겠습니다. 환경은 사람이 살아가는 토양의 문제이고, 노동은 의 책무가 상세히 담겨 있는 등 순환경제사회로의 전환에 필요한 그 토양 위에서 사람이 흘리는 땀과 노력의 문제입니다. 그래서 환 조항도 나열되어 있습니다. 노위는 궁극적으로 사람을 향해 있다고 생각합니다. 사람을 향한 법적 기반을 넘어 순환경제사회로의 이행에 필요한 것은 모든 사 상임위원회를 향해 남은 임기도 멈추지 않고 나아가겠습니다. 회 구성원의 참여입니다. 법 시행에 맞춰 관련 제도가 안정적으로 2024년 새해 기쁘게 맞이하시고, 모두 건강하시기를 바랍니다. 운영되고, 참여율을 높일 방안을 찾기 위해 환노위 차원에서도 전 고맙습니다. 력을 다하겠습니다. 나아가 법 시행 과정에서 보완해야 할 부분을 지속적으로 살피고, 신속히 개선할 수 있도록 노력하겠습니다. \u0007기후 변화로 인해 홍수, 가뭄 등의 자연재해가 동시다발적 으로 일어나고 있습니다. 국가와 정부 차원의 대응에 대해 어떻게 평가하는지요. 안타깝게도 정부의 정책이 부족하다고 생각합니다. 지난해 ‘기후 변화에 관한 정부간 협의체(IPCC)’의 보고서 승인 다음 날 정부가 발표한 ‘제1차 국가 탄소중립·녹색성장 기본계획’은 현재 위기 상 황을 너무 안이하게 바라본 측면이 있습니다."}]}, {"id": "89-42", "no": 89, "label": "2024 신년호", "corner": "회원소식", "title": "회원소식", "author": "", "start": 42, "end": 45, "pages": [{"p": 42, "t": "TOGETHER 회원소식 정부・공공기관 환경부 ‘도시침수방지법’ 3월 중 시행 지난해 9월 국무회의에서 의결된 ‘도시하천유역 침수피해방지 대책법(이하 도시침수방지법)’이 오는 3월 중 시행된다. 이번 도시침수방지법은 기존의 통상적인 홍수 대책만으로는 피해 예방이 어려워 침수 피해 가 발생했거나 피해가 우려되는 지역을 대상으로 국가가 직접 10년 주기의 ‘특정도시하천 침수피해방지 기본계획(이하 기본계획)’을 수립하도록 하고 있다. 아울러 환경부 장관이 유역별 도시 침수예보를 할 수 있는 근거와 홍수예보 전담 조직인 ‘도시 침수예보센터’를 설치할 수 있는 근거도 마련돼 정부의 홍수예보 기능이 대폭 확대될 예정이다. 환경부-한국수자원공사 수력 기반 그린수소 생산시설 준공 환경부와 한국수자원공사가 지난해 9월 성남 광역정수장에서 정수장의 소수력(小水力)을 이용해 친환 경 수소를 만드는 ‘수전해 기반 그린수소 생산시설’ 준공식을 열었다. 이번에 준공한 그린수소 생산시설 은 국내에서 처음으로 재생에너지인 수력을 이용했으며, 44억 원(국고 31억 원, 한국수자원공사 13억 원 분담)의 사업비가 투입됐다. 성남정수장 소수력 발전기에서는 18톤의 물을 전기 분해(수전해)해 하루에 188kg(수소차 40대분)의 수소를 생산할 수 있으며, 이곳에서 생산된 수소는 2024년까지 성남 중원구 갈 현동 수소충전소에 육상 운송(튜브트레일러) 방식으로 공급될 예정이다. 지자체 대구시 상수도사업본부, 먹는 물 분석 ‘최우수 기관’ 수상 대구광역시 상수도사업본부 수질연구소(이하 수질연구소)가 ‘제39회 2023년 하반기 물종합기술연찬회’ 에서 환경부 국립환경과학원장이 수여하는 ‘먹는 물 분석 최우수 기관상’을 수상했다. 수질연구소는 1992 년부터 먹는 물 수질 검사기관을 인정받아 대구 수돗물의 안전성을 검사해 왔다. 2020년에는 국가기술표 준원 한국인정기구(KOALS)로부터 국제 공인 시험기관으로 인정받았으며, 미국 ERA가 주관하는 국제숙련 도 먹는 물 분야 시험에서 4년 연속 최우수 분석기관으로 선정되기도 했다."}, {"p": 43, "t": "회원소식 동두천 수돗물 정수장 ‘ISO 22000’ 국제 인증 획득 한국수자원공사가 운영 중인 동두천시 수돗물 정수장이 지난해 11월, 지방 상수도 최초로 ‘ISO 22000 (식품 안전 경영시스템)’ 국제표준규격 인증을 받았다. ISO 22000은 식품 생산 및 제조의 모든 과정에서 발생할 수 있는 위해 요소를 효과적으로 관리하기 위한 국제표준규격으로, 한국수자원공사 동두천 수도 지사는 이번 국제 인증을 위해 지난 2021년부터 2023년까지 다양한 위생 안전설비를 도입해 왔다. 아울 러 오는 2025년까지 100억여 원의 예산을 투입, 추가 설비를 도입하는 등 철저한 수돗물 관리에 집중할 계획이다. 한국수자원공사는 이번 국제 인증 획득으로 수돗물에 대한 공신력이 확대되고, 시민 만족도가 높아질 것으로 기대하고 있다.. 의령군 2023년 ‘물관리 최우수 기관’으로 선정 의령군이 지난해 대구광역시 국가물산업클러스터 글로벌비즈니스센터에서 개최된 ‘2023년 하반기 물종 합기술 연찬회 기념식’에서 물관리 최우수 기관으로 선정됐다. 물종합기술 연찬회는 국내 물 관련 정책 및 물산업의 방향 등에 대해 논의하고 교류하는 자리로, 지난 2005년부터 매년 반기별로 맑은 물 공급에 앞 장서 온 자치단체를 선정해 표창을 수여하고 있다. 의령군은 지방 상수도 수돗물 ‘부자水’를 365일 깨끗하 고 안전하게 공급하기 위해 노후 상수도 정비사업, 스마트 관망 인프라 구축사업, 지방 상수도 급수구역 확 대 및 유수율 제고 사업 등을 추진, 지속 가능한 상수도 시설 안전망 구축에 최선을 다하고 있다. 또 공공하 수 처리시설 확충 및 하수처리구역 저류시설 비점오염 저감사업 등을 통해 수질오염 예방과 주거환경 개 선에 힘써왔다. 김포시 2023년 일반수도사업 운영·관리 실태평가 ‘최우수 등급(A등급)’ 달성 김포시 맑은물사업소가 환경부가 주관하는 ‘2023년 일반수도사업 운영·관리 실태평가’에서 최우수 등급 (A등급)을 달성했다. 일반수도사업 운영·관리 실태평가는 경쟁력이 높은 상수도 시스템 구축과 운영관리 효율성을 높이고자 매년 환경부에서 진행하는 평가다. 이번 평가에서는 한국수자원공사가 자체 개발한 ‘산 소 관 세척’ 기술 무상 이전을 통한 전국 최초의 노후 상수관 세척 시행, 수용가를 찾아 수돗물 품질을 검사 해 주는 안심 확인제 사업 확대, 카카오톡을 통한 수도 요금 알림톡 서비스 시행 등 깨끗한 물 공급과 시민 중심의 편의 향상을 위한 정책들이 높은 평가를 받았다. 한편, 김포시 상수도는 지난해 ‘2023년 지방공기 업 경영평가’에서도 우수 등급을 받은 바 있다."}, {"p": 44, "t": "기업 (주)제이텍워터 우수조달물품 신규 지정업체로 지정 제이텍워터가 지난해 11월, 서울에서 열린 ‘2023년도 제3회 우수조달물품 신규 지정기업 수여·간담회’ 자리에 참석, 우수조달물품 지정서를 받았다고 밝혔다. 제이텍워터는 상하수도 살균·소독 분야와 폐수 처 리장치를 제조하는 수처리 기계장치 제조기업이다. 주요 생산 제품으로는 현장 발생형 차아염소산나트륨 발생장치, 저온 수중 플라즈마 수처리 장치, 일체형 폐수 처리장치와 이번에 우수조달물품으로 지정된 실 시간 차염 농도 측정장치 등이 있다. 이번 우수조달물품 신규 지정으로 제이텍워터는 우수조달물품인증 2개 품목과 조달혁신제품인증 2개 품목을 보유하게 됐다. 현대엔지니어링 보령 ‘수전해 기반 수소 생산기지’ 구축 현대엔지니어링이 지난해 12월 13일 충남도청, 보령시청, 한국중부발전, 테크로스 워터앤에너지, 아이에 스티어와 ‘수전해 기반 수소 생산기지 구축사업’ 협약서를 체결했다. ‘수전해 기반 수소 생산기지 구축사 업’ 충남 보령시에 하루 1톤 이상의 수소 생산 용량을 갖추고, 수소의 저장과 운송이 모두 가능한 인프라 를 구축하는 사업이다. 현대엔지니어링은 이번 사업에서 총괄설계, 수전해 설비 구매, 인허가 및 시공 등 을 담당할 예정이며, 본격적인 사업은 올해 기본 설계 진행 후 2025년 상반기에 착공, 2026년부터 본격 적으로 청정수소 생산에 돌입할 계획이다. 한편, 해당 기지에서 생산된 수소는 인근 수소충전소에 공급돼 수소 모빌리티 생태계 활성화에 기여할 것으로 기대되고 있다. PPI PIPE 창립 47주년 행사 개최 국내 최대 PVC 파이프 제조기업인 PPI PIPE가 지난해 6월, 창립 47주년을 맞아 기념식을 개최했다. PPI PIPE는 오·배수관, 상수도관, 하수도관, 각종 이음관 등 배관산업 6개 전 분야의 제품을 생산·판매하는 국 내 유일의 종합 PVC 전문회사로 국내시장의 60% 이상을 점유하고 있으며 미국을 비롯해 세계 각국에 제 품을 수출하면서 글로벌 물기업으로 성장하고 있다. 대표적인 제품으로는 ▲원터치 및 시공성을 12배 향 상시킨 ‘원터치 모듈화’ ▲원터치 및 세계 최초 점검창 확인 가능한 ‘원터치 GLS 이음관’ ▲대한민국 최초 KS 인증제품으로 두께·중량·수구부 길이 15% 이상 향상시킨 ‘C-PVC’ ▲iPVC 소재 영구 배수배관인 ‘집수 정 배관’ ▲iPVC 소재인 ‘iPVC 급수 배관’ 및 사용 온도 90℃인 ‘C-PVC 급탕 배관’ 등이 있다."}, {"p": 45, "t": "WATERPEDIA 핫 이슈 국가물관리기본계획 변경안 확정, 그후 글로벌 이슈 다각화되고 있는 국내외 물 재이용 사례와 시사점 물 산업은 지금 한눈에 보는 국내외 물시장 동향"}]}, {"id": "89-46", "no": 89, "label": "2024 신년호", "corner": "핫 이슈", "title": "국가물관리기본계획 변경안 확정, 그 후", "author": "", "start": 46, "end": 49, "pages": [{"p": 46, "t": "WATERPEDIA 핫 이슈 지난해 9월, 금강·영산강 보 해체 취소 결정에 따른 ‘제1차 국가물관리기본계획 변경안’이 확정됐다. 이번 변경안을 통해 무엇이 어떻게 바뀌었고, 주목해야 할 내용은 무엇인지 알아보자. 글_맹승진 충북대학교 지역건설공학과 교수 국가물관리기본계획 변경안 확정, 그 후 2018년 5월 28일 국회를 통과한 물관리 일원화 관련 3가지 법령이 지만 국가물관리위원회에서는 합의의 과정을 거쳐 2021년 6월 국 그해 6월 공포·시행됐다. 물관리 일원화 3법은 ‘정부조직법 및 직제’ 가물관리기본계획을 수립, 발표했다. 국가물관리기본계획이 수립된 와 ‘물관리기본법’, ‘물관리 기술 발전 및 물산업 진흥에 관한 법’을 말 후 4개 유역은 유역물관리위원회를 통해 유역물관리종합계획을 수 한다. 이 중 물관리기본법은 우리나라 물관리와 관련한 최상위법으로 립해야 한다. 그러나 2022년 8월, 1기 유역물관리위원회 위원들의 동법 제27조에 10년마다 국가물관리기본계획을 수립하도록 명기하 임기가 끝날 때까지 국가물관리기본계획을 반영한 유역물관리종합 고 있다. 이에 따라 2019년 7월 국가물관리위원회가 구성됐고, 8월 계획은 수립되지 못했다. 이로 인해 관련 계획들에 대한 부합성 검토 4개 유역 물관리 위원회가 구성돼 각각 3년의 임기가 시작됐다. 가 자연히 미뤄짐에 따라 국가적 행정력이 낭비되는 현상은 부인할 수 없는 상황이 됐다. 국가물관리기본계획 변경안 확정 배경 2022년 5월 현 정부가 출범하면서 2기 국가물관리위원회와 유역물 이후 국가물관리위원회에서는 국가물관리기본계획을 수립하는 절 관리위원회가 구성됐다. 2기 국가물관리위원회에서는 국가물관리기 차에 들어갔다. 국가물관리기본계획의 비전, 목표, 핵심 및 추진 과제 본계획 내 자리 잡은 자연성이 전술한 바와 같은 합의의 과정은 거쳤 의 도출과 비전 설정의 철학을 담기 위한 근거로 우리 강 자연성 회복 으나 명확성 등이 낮다는 근거를 들며 ‘자연성 회복’을 ‘지속가능성 제 구상을 최우선으로 완성했다. 당시 자연성 회복 구성 보고서에 대한 고’로 수정하면서 ‘우리 강 자연성 회복 구상’을 삭제하는 안을 제시했 여러 의견이 있었다. 의견은 크게 2가지로 나뉘었다. 하나는 4대강 다. 그리고 2023년 8월, 국가물관리위원회에서는 ‘금강·영산강 5개 보 처리 방안에 대한 고뇌를 자연성 회복으로 정의했으며, 다른 하나 보 처리 방안 취소’ 수정(안)을 비롯해 다수의 수정(안)을 다음과 같이 는 자연성 회복에 있어서 어느 수준의 회복, 즉 태고적 자연성인지 아 제시했다. 니면 인간과 자연이 공존하는 자연성인지에 대한 논란이 있었다. 하"}, {"p": 47, "t": "국가물관리기본계획 현행 VS 수정안 현행 수정(안) <목차> <목차> 1. 물환경의 자연성 회복 1. 물환경의 지속가능성 제고 <중 략> 부록3. 우리 강 자연성 회복 구상 <중 략> 153 <삭 제> ■ 4대강 자연성 회복을 위한 조사·평가 및 보 처리방안 마련 추진 ■ 4대강 자연성 회복을 위한 조사·평가 및 보 처리방안 마련  물환경의 자연성 회복 물환경의 지속가능성 제고 Ⅰ. 유역물관리종합계획 기본 원칙 Ⅰ. 유역물관리종합계획 기본 원칙 5수 \u0007 생태계 개선 및 복원 등을 위해 종횡적 연결성, 수질 및 유량관리 등 5수 \u0007 생태계 건강성 회복을 위한 물환경의 개선·복원, 수질 및 유량관리 의 방안을 제시하여야 한다. 등의 방안을 제시하여야 한다. 참고1 유역물관리종합계획 수립 목차(예시) 참고1 유역물관리종합계획 수립 목차(예시) 제5편 ㅇㅇ유역 추진전략 및 주요과제 제5편 ㅇㅇ유역 추진전략 및 주요과제 ※해 \u0007 당 유역의 비전 및 목표에 맞게 구성(자연성 회복, 오염원 관 ※해 \u0007 당 유역의 비전 및 목표에 맞게 구성(지속가능성 제고, 오염 리방안, 지속가능한 물 이용, 홍수·가뭄 대비, 새로운 물가치 창 원 관리방안, 지속가능한 물 이용, 홍수·가뭄 대비, 새로운 물가 출, 물거버넌스 및 물문화 창달 등) 치 창출, 물거버넌스 및 물문화 창달 등) 부록 3 <삭 제> 우리 강 자연성 회복 구상 2023년 9월, 국가물관리위원회는 위와 같이 수정(안)에 대한 공정회 다섯째, 자연이란 절대적 긍정의 용어이나, 인간과 공존하는 최선의 를 실시한 후 국가물관리기본계획을 변경, 확정했다. 이 과정에서 4대 방법은 어떤 것인가? 강 보 처리 방안과 밀접한 연관이 있는 금강과 영산강유역에 속한 지 역의 환경단체 등이 수정(안)에 반대해 공청회장을 점거하는 일도 벌 물론 위에 다섯 가지에 대한 해답은 쉽지 않고, 당장 해결할 수 있는 어졌지만, 공청회는 진행됐고 수정(안)은 받아들여졌다. 이러한 과정 것도 아니다. 그럼에도 불구하고 언젠가는 매듭을 지어야 하는 문제 에서 아쉬웠던 점을 나열하면 다음과 같다. 라고 생각한다. 개인의 계획이든, 국가의 계획이든 사용하는 용어가 첫째, 우리는 4대강 보 처리 방안에 대해 언제까지 논하여야 하는가? 명확했으면 하는 바이며, 무엇이든 성급한 판단 및 시행은 추후 많은 둘째, 우리는 자연성 회복이란 용어를 최대한 이해하려고 하였는가? 논란을 야기한다는 것을 우리 스스로 명심해야 할 것이다. 셋째, 우리는 사회의 다양한 의견을 반영하는데 미숙하지 않았는가? 마지막으로 통합물관리를 수량과 수질의 통합인가? 수량, 수질, 수생 넷째, 우리는 같은 사안이라도 왜 극단적으로 다르게 생각하며 판단 태, 재난 등의 통합인가? 아니다. 통합물관리는 기(起)-승(承)-전(轉)- 하고 실행하는가? 거버넌스다. 이는 우리가 사회를 이루고 살고 있기 때문이다."}]}, {"id": "89-50", "no": 89, "label": "2024 신년호", "corner": "글로벌 이슈", "title": "다각화되고 있는 국내외 물 재이용 사례와 시사점", "author": "주진철 한밭대학교 건설환경공학과 교수", "start": 50, "end": 53, "pages": [{"p": 50, "t": "WATERPEDIA 글로벌 이슈 다각화되고 있는 국내외 물 재이용 사례와 시사점 기후변화로 인한 물 부족 현상이 가속화되면서 세계적으로 물 재이용에 대한 관심이 날로 높아지고 있다. 점점 더 다각화되고 있는 국내외 물 재이용 정책 및 사례를 살펴보자. 글_주진철 한밭대학교 건설환경공학과 교수"}, {"p": 51, "t": "수자원 이용과 물 이용 여건 최근 신규 댐 건설 및 수자원 개발 등을 통한 기존의 물 공급 확대 위주의 정책이 개발 적지 축소, 환경문제 유발, 주민 민원 등으로 한계에 직면하면서 하·폐수 처리수 재이용, 중수도, 빗물 등의 대체 수자원 통합 관 리를 통해 물 사용량 증가 및 지역적 물 수급 불균형 문제 대비 지속 가능한 수자원 확보 방안이 요구되고 있다. 특히 하수처리수와 중수도를 각종 용수로 재이용하기 위한 친환경적인 수자원 확보를 통한 생활용 수, 공업용수, 농업용수 이용에 따른 하천 취수량을 감소시키고, 기존의 하천 물 의존도를 경감시키기 위한 물 재이용 활성화가 요구되는 상황이다. 한편, 연간 물 재이용량은 2018년 기준 1,518백만㎥으로 총 이용량 372억㎥의 4.1%에 해당하며, 하수처 리수 총 재이용량 중 하천유지용수가 전체의 43.2%를 구성하고, 공업용수 6.8%, 농업용수 1.1%, 기타 도 시용수가 2.2%를 구성하고 있다. 이러한 낮은 물 재이용 비율은 제한된 가용수자원으로 자연 취수량 대비 재이용률 비율이 매우 높은 이스라엘, 쿠웨이트, 이집트 등의 중동 및 북아프리카 지역 대비 매우 낮은 수치 이며, 뉴워터(NEWater·재이용) 프로젝트를 통해 취수량 대비 재이용량이 14% 이상을 차지하는 높은 하수 처리수 재이용 비율을 구성하는 싱가포르에 비해서도 매우 낮은 수치이다. 수자원 총량과 물 재이용 현황 수자원 총량 1,323 억m3/year (100%) 이용가능한 수자원량 증발 등 손실량 760 억m3 (57%) 563 억m3 (43%) 빗물 이용 홍수기유출 Normal flow 0.08 억m3 548 억m3 (41%) 212 억m3 (16%) 바다로 유실 하천수 이용 댐용수 공급 지하수 이용 388 억m3 (29%) 122 억m3 (9%) 209 억m3 (16%) 41 억m3 (3%) 물 재이용 총량 15.2 억m3 (총 이용량의 4.1%) 총 이용량 : 372 억m3/year (28%) 중수도 생활용수 공업용수 농업용수 하천유지용수 3.6 억m3 76 억m3 (7.5%) 23 억m3 (1.7%) 152 억m3 (11.5%) 121 억m3 (9.1%) 하수 재이용 하수발생량 폐수발생량* 11.1 억m3 (재이용률 15.5%) 71.6 억m3 4.1 억m3 *공공폐수처리시설 유입량 폐수 재이용 0.37억m3 자료 : 제4차 수자원장기종합계획(2001~2020) 제 3차 수정계획. 2018 하수도통계(환경부) 주요 국가들의 물 재이용 정책 및 기술 동향 미국 연방 정부는 하수처리수 재이용에 대해 특별한 규정을 제시하지 않고 있으나, 미국환경보호청 (US EPA)에서는 하수처리수 재이용에 대한 지침을 세우고 주별로 관리하기를 권고하고 있다. 유럽에서 는 2012년 유럽공동체 회원국 내 수자원의 지속 가능한 관리를 위한 ‘물 청사진(A Water Blueprint for Europe, 2012)’ 내 물 재이용 정책에 대한 비전이 제시돼 있다. 또 일본은 중앙정부에서 물 재이용 관련 법, 계획 등을 책정하고 있으며, 지방자치단체별로 각자의 상황과 여건을 고려해 자체적인 조례, 지침 등을 마 련해 물 재이용 정책을 추진 중이다. 반면, 싱가포르에서는 증가하는 물 수요에 맞는 자급 체제를 확립하는 것을 국가의 안전보장과 관련된 중요한 과제로 인식하고, 이미 물 재이용과 관련된 명확한 법과 체계를 갖 추고 있다. 이 밖에 기타 다수의 국가에서도 도시에서 중수 및 우수 재이용 시설과 같은 분산형 해결 방안들 의 이용을 허용하는 방향으로 관련 규제를 개정해 나가는 추세다."}, {"p": 52, "t": "또한 하·폐수 재이용 적용 기술 현황은 기존 단순 중력여과와 응집 공정에서 진화해 정밀 여과(MF) 또는 한 외 여과(UF)의 전처리 공정 이후 분리막(RO), 오존산화, 자외선소독(UV) 등의 본처리 공정을 통해 목표 수 질에 해당하는 수처리 공정을 탄력적으로 운영하고 있다. RO 공정은 1nm(나노미터)의 초미립자까지 제거 가 가능한 공정으로 음용수 수준의 처리가 가능하나, 분리막을 통한 농축 폐액 발생으로 별도의 농축 폐액 처리 공정이 필요하며, 국내 대부분의 재이용 시설은 발생한 농축수를 하수처리시설에 연계해 처리하는 방 식을 사용하고 있다. 국내외 물 재이용 수처리 적용기술 현황 스크린 미국 응집 생물막 중력 혼화 여과 필터 MF ○ 활성탄 ◎ 싱가포르 ○ ○ ○ 한국 ◎ ○ UV ○ ○ ○ ○ ○ ○ ○ ○ ◎ ○ ◎ CL2 ○ ○ ○ ○ H2O2 ○ ○ 일본 오존 ○ ○ ○ 중국 RO ○ ○ 스웨덴 벨기에 UF ○ ◎ ○ ○ ◎ ※ (도시 기준) ◎ : 50% 이상 사용되는 공정, ○ : 50% 미만 사용되는 공정 주요 국가들의 물 재이용 사례 미국 국가안보국(NSA) 데이터 센터 호주 시드니 하수처리수를 데이터센터 냉각 용수로 활용 하수처리수를 스포츠 센터 관개 용수로 활용 일본 후쿠오카 ‘워터 플라자 기타큐슈’ 스페인 바르셀로나 하수처리수의 다양한 재이용 공정 제시 하수처리수의 하천유지용수, 농 업관개용수, 해수침투 방지용수 로 활용 중국 베이징 경제개발 지구 싱가포르 베독 ‘NEWater factory’ 하수처리수를 공업용수로 활용 하수처리수를 음용수로 활용 브라질 상 곤살루 하수처리장 한국 인천 가좌 하수처리장 하수처리수를 공업용수로 활용 하수처리수의 현대제철 공업용 수로 활용"}, {"p": 53, "t": "물 재이용의 문제점 및 개선 방안 그동안 물 재이용 확대를 위해 국제적으로 다양한 노력을 했음에도 해 물 재이용률을 확대할 필요가 있다. 불구하고 이용 비율이 크게 늘지 않았다. 또 물 재이용과 관련한 물 아울러 체계적인 물 재이용 정책 추진을 위해서는 유역 내 물 수지 분 공급과 물 이용에 관한 법-계획 간 연계성 부족으로 수자원의 효율적 석과 수요관리 기반 유역 규모에 적합한 물 재이용 계획의 추진이 필 인 배분 및 건전한 물순환과 하수처리수 재이용 촉진의 한계도 여전 요하다. 즉, 유역 자연 유출량과 용수 수급 현황 및 향후 계획은 종합 히 존재했다. 이와 같은 문제점을 개선하기 위해서는 물 사용 단계에 적으로 검토해 소유역별 장래 용수 과부족을 예측하고, 합리적 절차 서 세균바이러스, 병원성 미생물, 미량 신규오염물질 등의 효과적인 를 통한 물 재이용 계획을 수립해 반영하는 것이 중요하다. 또한 재이 제거로 위생상의 문제 해결과 더불어 색과 냄새 등으로 인한 심미적 용수의 생산과 수송, 사용한 물의 처리 및 이용 등 재이용 분야 전반 거부감을 줄여야 한다. 하수처리수 재이용 시 추가로 공급 및 관로 시 에 걸쳐 정보화와 지능화를 구현해 하수처리수 재이용의 관리시스템 설 등을 설치하게 되는 경우 시설 설치 및 운영에 드는 비용이 편익보 이 기존 통합물관리시스템에 편입될 필요가 있다. 마지막으로 기후 다 높을 때 물 재이용률이 감소할 수 있으므로, 물 재이용시설 확대· 변화로 혹독한 가뭄과 물 부족이 발생해도 하수처리수 재이용을 통 보급을 위해 행정적, 경제적 지원 강화도 필요하다. 또 대부분 하수처 한 물 재이용은 농업용수, 공업용수, 생활용수, 하천유지용수로 공급 리장이 도심 외곽 지역과 하류 말단에 대규모로 설치돼 인근에서 수 할 수 있는 안정적인 수자원임을 인식하고 하수처리수 재이용의 활 요처를 쉽게 확보할 수 없어 압송 등을 통해 필요한 수요처를 찾아야 성화를 위해 환경부 주도의 물 재이용 사업계획과 재원 조달계획을 하는 어려움이 있으므로 분산형 모듈 물 재이용 시스템 개발을 신설 충실히 이행해야 할 것이다."}]}, {"id": "89-54", "no": 89, "label": "2024 신년호", "corner": "물 산업은 지금", "title": "한눈에 보는 국내외 물시장 동향", "author": "", "start": 54, "end": 57, "pages": [{"p": 54, "t": "WATERPEDIA 물 산업은 지금 한눈에 보는 국내외 물시장 동향 국내 동향 기록적인 폭우와 홍수로 대규모 치수(治水) 사업 추진 환경부가 지난해 12월 7일, 미래 극한 홍수에 대비해 ‘국가 주도’, ‘지 역 건의’ 투 트랙으로 물그릇을 확대하겠다고 밝혔다. ‘4대강 사업’이 마무리된 2013년 이후 10년 만에 진행하는 치수 사업이다. 현재 댐 건설을 요청한 지자체는 13곳이며, 리모델링을 원하는 댐은 7개이 다. 최종 후보지는 올 상반기에 발표할 ‘하천 유역 수자원 관리계획’에 낙동강 녹조의 원인, 유해 남조류 정보 최초 확보 서 공개할 예정이다. 지난해 11월 20일 환경부 소속 국립환경과학원은 낙동강에서 녹조 환경부는 이번 사업에서 지역 건의를 통한 소규모 댐뿐만 아니라 국 를 유발하는 유해 남조류의 전장유전체 유전정보 분석에 국내 최초로 가 주도의 대규모 댐 건설도 추진할 계획이다. 또 과거에 환경단체의 성공했다고 밝혔다. 유해 남조류는 환경부에서 상수원수의 안전성(조 반발 등으로 중단한 사업 중 다목적 및 홍수 조절 댐 후보지 6곳에 대 류경보제 대상)을 확보하기 위해 지정한 남조류 4속을 의미한다. 국 한 사업 재진행을 고려할 예정이다. 아울러 국가가 직접 관리하는 하 립환경과학원 낙동강물환경연구소는 2015년부터 최근까지 낙동강 천의 길이도 늘이기로 했다. 지난해 여름에는 4대강 사업으로 정비된 전역에서 유해 남조류 29종을 확보해 이들 중 낙동강에서 가장 빈번 본류에서 홍수 피해가 거의 발생하지 않았지만, 지방에서 관리하는 하게 출현하는 6종의 전장유전체 정보를 밝혀냈다. 지류 및 지방하천에서는 제방이 붕괴하는 등 피해가 크게 나타났기 이번 연구를 통해 국립환경과학원은 녹조를 일으키는 유전자 전체 종 때문이다. 이에 환경부는 우선 오는 2027년까지 하천의 길이를 현재 류와 기능을 밝힘으로써 생리 생태적 형질 발현의 조절에 대한 전 과 (3,602㎞)보다 19% 증가한 4,300㎞로 늘리고, 국가하천 수위에 영 정을 파악할 수 있는 기반을 마련했다. 덕분에 앞으로 전장유전체 정 향을 주는 지방하천 400곳을 직접 관리한다는 계획이다. 보를 활용해 낙동강에서 녹조로 인한 독소, 냄새 물질 발생 가능성을 예측하거나 전장유전체 변이를 통한 녹조 발생 기원 추적 등을 통해 녹조 발생 메커니즘(mechanism)에 대한 유전자 수준의 규명이 가능 #극한 홍수 대응 #대규모 치수 사업 추진 할 것으로 보인다. 아울러, 남조류가 생산하는 유용 물질(색소 등)의 탐색 등 다양한 기술 개발에도 활용될 것으로 기대된다. 6종의 전장 유전체에 대한 정보는 미국 국립생물공학정보센터(NCBI)에서 확인할 수 있다. #유해 남조류 #녹조 발생 매커니즘"}, {"p": 55, "t": "한국물기술인증원, 미국수도협회와 업무협약 체결 #미국수도협회 MOU 체결 한국물기술인증원이 지난해 12월 미국수도협회와 국내 물기업의 미 국 시장 진출 지원 및 물산업 분야 교류 강화를 위한 업무협약을 체결 #해외 시장 진출 했다. 이번 협약으로 두 기관은 향후 물산업 분야 지식 공유 및 기술 지원, 국내외 전시회 공동 홍보관 및 세미나 운영, 협력사업 발굴을 위 한 정기회의 개최 등 다양한 분야에서 협력을 약속했다. 특히 물 산업 정책 동향과 혁신 기술의 정보 공유를 통해 미국 시장에서의 프로젝 트 수주와 수출에 도움을 받을 수 있을 것으로 기대된다. 한국물기술 인증원은 우선 물기업에 대한 정보 제공과 현지 발주 정보 공유를 통 해 시범 사업 참여 등 구체적인 협력 방안을 모색한다는 계획이다. 지난 1881년 설립된 미국수도협회(AWWA)는 물 분야 세계 최대 규 모의 조직으로 수자원 발전과 상수도 및 하수도 선진 처리 기술의 발 전, 물의 저장 및 관련 기관의 원활한 운영·관리 등의 사업을 진행하고 있다. 김영훈 한국물기술인증원 원장은 “이번 협약이 국내 물 기업들 이 글로벌 시장에서 경쟁력을 키우는 데 실질적인 도움이 되길 기대 한다”며 “미국수도협회와 의미 있는 협력을 유지하고 앞으로 해외 네 트워크를 확장해 국내 물 기업들의 해외 진출을 위한 마중물이 되도 록 노력할 것”이라고 밝혔다. 국외 동향 * 출처 : 워터 저널 미국 정부, 상하수도 시스템 지원을 위한 보조금 발표 미국 환경보호청(EPA)이 지방을 포함한 소규모 상하수도 시스템 지 원을 위한 기술 및 교육에 최대 3,070만 달러의 보조금을 지원한다고 밝혔다. EPA는 지난 2012년부터 지금까지 수질을 개선하고 소규모 공공수도시스템의 안전한 식수 제공을 위한 기술 및 교육 지원에 1억 7천만 달러 이상의 보조금을 지원해 왔다. 이번 보조금은 물 시스템 및 기관에 지역사회가 안전한 식수와 효과 적인 하·폐수 처리 시스템을 갖추는 데 필요한 기술과 교육 제공에 목 적을 두고 있다. 현재 미국의 소규모 상하수도 시스템은 노후화된 인 프라, 인력 부족, 증가하는 비용, 감소하는 요금을 포함해 고유한 재정 및 운영 문제에 직면해 있다. 또 많은 소규모 시스템이 환경 정의 문제 로 혜택을 받지 못하고 있기 때문이다. 아울러 이번 보조금 지원이 역 량 구축부터 연방 자금 신청 과정을 탐색하는 데 도움을 주고, 신뢰할 #효과적인 하폐수 처리 #소규모 상하수도 시스템 지원 #미국 수 있는 인프라 솔루션에 전략적으로 투자하는 등 물 문제에 대한 해 결책을 지역 사회가 식별할 수 있도록 다양한 지원을 제공하는 것을 목표로 하는 EPA의 ‘물기술 지원(Water TA)’ 공약을 확장하는 데 도움 이 될 것으로 기대되고 있다."}, {"p": 56, "t": "싱가포르, 획기적인 물기술 개발 위한 공개 제안요청 시작 싱가포르 국립 수자원청(이하 PUB)이 에너지 및 폐기물 감소, 탈탄소 화 및 수질 분야의 혁신적인 기술과 솔류션 개발을 위해 공개 제안요 청을 시작했다. 이번 요청은 국립연구재단(NRF)이 자금을 지원하는 CWR(Competitive Funding for Water Research, 물 연구를 위한 경쟁 력 있는 자금) 계획의 일환이다. 현재 싱가포르의 물 수요는 경제 및 인구 증가로 인해 오는 2065년 까지 거의 두 배로 증가할 것으로 예상한다. 이에 따라 물을 생산하고 공급하는 데 필요한 에너지 소비량과 수처리 공정의 부산물인 슬러지 발생량도 증가할 것으로 분석되며, 기후 변화로 인해 장기간의 가뭄 위험은 물 공급에도 영향을 미칠 것으로 보인다. 이에 PUB는 이번 연 중동 및 북아프리카 지역 수처리 프로젝트 동향 구개발 목표를 에너지 및 화학물질 소비 감소와 함께 싱가포르의 수 세계자원연구소(WRI)에 따르면, 세계적으로 심각한 물 부족 문제 자원을 확대하고 수질을 향상하는 데 두고 있다. 아울러, 이번 제안요 를 겪는 25개국 중 16개국이 중동 및 북아프리카(이하 MENA) 지역 청을 통해 새로운 아이디어와 기존 아이디어를 발전시키고, 다음 연 에 해당한다. 이에 MENA 지역 대부분의 정부가 물 부족 문제를 해소 구개발 영역에서 획기적인 기술을 개발하는 데 집중한다는 계획이다. 하고자 국가적 수자원 전략을 수립하며 노력을 기울이고 있다. 지난 PUB의 최고 엔지니어링 및 기술 책임자인 팡치멍(Pang Chee Meng) 2013년부터 2023년까지 MENA 지역 내에서 추진된 수자원 부문 박사는 “기후변화와 물 수요 증가라는 과제에 대비하면서 싱가포르 프로젝트 규모는 총 1,150억 달러 수준이었으며, 세부 분야별로는 급 물 시스템의 지속 가능성을 유지하기 위한 R&D 노력을 계속해서 추 수 관련 프로젝트 비중이 가장 컸고 담수화, 수처리, 저장, 쿨링 등이 진하는 것이 중요하다”면서 “최신 물과 디지털 기술을 활용하여 우리 뒤를 이었다. 는 현재와 미래의 물 수요를 충족하면서 지속 가능하고 탄력적인 물 국가별 주요 추진 계획을 살펴보면, 두바이수전력청(DEWA)은 2,230㎥ 시스템을 구축하는 데 도움이 될 새롭고 확장할 수 있는 솔루션에 대 (2023년 기준)인 담수화 일일 용량을 2030년까지 3,400㎥로 늘리 한 제안을 받기를 기대한다”고 말했다. 제안서 제출 마감일은 2024 는 것을 목표하고 있다. 대표적인 프로젝트는 하산 민자 1단계로, 현 년 2월 2일 오후 4시(싱가포르 시각)이다. 재 두바이수전력청과 사우디아라비아 아쿠아파워(ACWA)가 공동 으로 추진 중이다. 아부다비수전력청(EWEC)의 2023년 담수화 용 량은 일일 480만㎥이며, 현재 건설 혹은 입찰 중인 담수화 프로젝 #수질 분야 혁신 #공개 제안요청 #싱가포르 트 규모는 일일 132만㎥으로 미르파 2단계(Mirfa 2), 슈웨이하트 4 단계(Shuweihat 4) 프로젝트 등이 있다. 아울러, 이집트는 담수화 용 량을 2025년까지 일일 3,500㎥, 2050년까지 일일 8,850㎥ 달성을 목표로 하고 있다. 요르단은 20억 달러 규모의 아카바 암만(AqabaAmman) 담수화 및 물 수송 플랜트 프로젝트를 진행 중이다. 모로코 또한 지난해 담수화 프로젝트에 많은 관심을 보이며 국가 수자원 계획 을 통해 수자원 인프라 확충에 110억 달러를 투자하기로 예산을 기획 했다. 그 일환으로 ‘카사블랑카 해수 담수화 플랜트’를 추진 중이다. #수처리 프로젝트 #담수화 일일 용량 #중동"}, {"p": 57, "t": "INFORMA INFORMATION & CULTURE 협회소식 미국물환경연합 물산업전시회 (WEFTEC) 한국관 운영 한국상하수도협회(이하 협회)가 국내 강소 물기업의 글로벌 판로개척을 지원하기 위해 지난 10월 2~4 일 3일간 미국 시카고에서 열린 ‘WEFTEC 2023’에 참가했다. 미국물환경연합(WEF) 물산업전시회는 매 년 개최되는 하수도 전문 전시회로 기술 발표회, 기능 경진대회, 워크숍 등 다양한 프로그램이 펼쳐진다. 이번 전시회에서 협회는 대한무역투자진흥공사(이하 KOTRA)의 해외전시회 지원사업의 수행기관으로 서 WEFTEC 한국관을 운영, 150여 명의 해외바이어에게 우리 기업의 최신 제품과 기술에 대해 적극적 으로 홍보했다. 한국메타버스 산업협회(K-META) 업무협약 체결 협회가 디지털 전환을 통한 상하수도 인재 양성을 위해 한국메타버스산업협회(이하 K-META)와 업무협 약을 체결했다. K-META는 메타버스 산업의 국제 경쟁력 강화를 주도하고, 회원사의 활동과 정부의 정책 적 지원을 연결하는 가교역할을 수행하기 위해 출범한 대한민국 메타버스 사업 분야의 대표기관이다. 이 번 업무협약을 통해 협회는 상하수도 전문인력 양성을 위한 교육 협력, 상하수도 분야 디지털 전환을 위 한 산·학·연·관 협력 및 정책 조율 활동을 수행하며 비즈니스 협업을 확대해 나갈 예정이다."}, {"p": 61, "t": "NEWS 물산업 전문인력 양성사업 15주년 기념 홈커밍데이 개최 협회가 환경부로부터 위탁받아 지난 2009년부터 운영 중인 ‘물산업 전문인력 양성사업’ 15주년을 맞아 홈커밍데이를 개최했다. 물산업 정보를 공유하고 네트워킹을 구축하기 위해 마련한 이날 행사에는 교육 수료생, 현장 교육 참여기업, 대학 등 그간 사업 운영에 협력해 온 관계자 110여 명이 참석했다. 환경부 물산업협력과의 ‘물산업 정책 추진현황 및 육성방향’ 특강을 비롯해 다양한 분야에서 활동 중인 수료생 들의 토크콘서트 등이 열렸으며, 우수 현장 교육기업(한국종합기술, 도화엔지니어링), 우수 협력 대학(경 기대학교, 명지대학교), 우수 협력 기관(서부여성새일센터, 권미라 상담사)에게 공로패가 수여됐다. 에너지 취약계층 한파 대비 물품 지원 협회가 지난 11월 서울특별시사회복지협의회에 기부금 400만 원을 전달했다. 기부금은 서울시에서 기 초생활수급자, 차상위 계층에게 난방기 등 월동기 한파 대비 물품 지원 시 활용할 예정이다. 기부금 전달 식에는 협회 진광현 상근부회장, 송승종 사무총장과 서울특별시사회복지협의회 전명수 사무총장 등이 참석했다. 강기정 협회장은 “에너지 취약계층들이 따뜻한 겨울을 보내는 데 도움을 줄 수 있어 기쁘다”며 “기부 문화가 활성화되어 함께하는 공동체를 만들어갔으면 좋겠다”고 말했다."}, {"p": 62, "t": "한국화장실협회(KTA) 업무협약 체결 협회가 지난 12월 한국화장실협회와 사회적 가치를 증진하고 상호 발전을 위한 업무협약을 체결했다. 한국화장실협회는 화장실 이용문화 및 관리시스템 선진화, 화장실 문화 관련 국제교류 및 협력 등을 통 해 우리나라 화장실 문화 발전을 선도하는 기관이다. 양 기관은 이번 협약을 통해 절수설비 의무 설치 및 절수설비 등급 표시 홍보, 하수처리 관련 공공문제 해결, 공중화장실 실태조사 및 위생교육 강화, 기타 양 기관의 상호 발전적 교류 등에 협력하기로 했다. 협회가 2016년 이후 7년 만에 기업회원 간 정보제 공과 소통강화를 위한 기업회원명부를 발간·배포 했다. 협회는 광역·기초자치단체를 포함해 상하수 도 사업체, 물산업 관련 단체와 개인 등 총 1,500개 회원(2023년 10월 기준)으로 구성돼 있다. 이번 에 발간한 기업회원명부에는 450여 개 상하수도 업체의 업종, 세부 업종, 주력 제품과 기술, 연 매출 등 상호 기업활동에 유익한 정보가 담겨 있으며, 중앙부처(환경부), 지방자치단체, 관련 기업체, 상 하수도 관련 전문가 및 환경 관련 언론사 등에 배 포됐다. 협회 송승종 사무총장은 “기업회원명부가 회원과 유관기관이 다양한 정보와 기술을 공유하 고 교류하는 데 큰 도움이 될 것”이라며 “기업회원 의 사업 활동에 보탬이 되길 바란다”고 말했다. 기업회원명부 기업회원명부 발간으로 물산업 활성화 도모 2 23 기업회원명부"}, {"p": 63, "t": "NEWS 수도시설 운영관리 워크숍 개최 협회가 지난 12월 14, 15일 이틀간 제주에서 ‘수도시설 운영관리 워크숍’을 개최했다. 이번 워크숍은 상 수도 분야 정부정책과 발전 방향에 대한 정보교류를 위해 마련한 행사로 환경부, 한국수자원공사, 지자 체 수도시설 운영관리자 등 관련 공무원 약 500인이 참석했다. 워크숍은 총 3부에 걸쳐 진행됐고 2023 년 일반수도사업 운영·관리 우수기관과 유공자에게 환경부 장관 표창이 수여됐다. 1부에서는 공통 주제 인 환경부 ‘국가 수도정책 추진 방향’, 진안군 ‘2단계 노후 지방상수도 정비사업 우수사례’, 물기술인증원 ‘수도용 자재와 제품의 인증제도’ 3건에 대한 발표가 이뤄졌다. 2부에서는 인문학적 소양을 함양할 수 있는 강의를 통해 업무 스트레스를 해소하는 시간이 마련됐으며, 3부에서는 ‘유충 및 조류대응’, ‘상수도 스마트 전환’, ‘기후변화 대응’ 3개 분과로 나뉘어 발표와 함께 심 도 있는 토론이 진행됐다. 그동안 협회는 전국 수도사업자를 대상으로 수도시설의 안전과 효율성을 확보 하기 위한 기술지원을 해왔으며, 앞으로도 국민에게 안전하고 깨끗한 수돗물을 제공하기 위해 정수장의 철저한 관리를 위한 컨설팅을 지속적으로 실시할 계획이다. 2023 수도시설 운영관리 워크숍 수상자 명단 일반수도사업 운영관리 실태점검 최우수상 서울특별시, 경기도 안산시, 경기도 동두천시, 경상남도 함양군, 경기도 시흥시 우수상 경기도 안양시, 충청북도 단양군 장려상 경기도 광주시, 충청북도 진천군 발전상 강원특별자치도 동해시, 전라남도 보성군, 경상남도 양산시 수도시설 유공자 표창 1) 경기도 시흥시 지방시설주사보 정재근 8) 한국수자원공사 대리 한태균 2) 경기도 안산시 지방공업주사보 탁경래 9) 한국수자원공사 차장 이영일 3) 경상남도 함양군 지방환경서기 강영모 10) ㈜삼안 이사 이웅기 4) 한국수자원공사 대리 문성연 11) ㈜한국종합기술 상무 이장원 5) 제주특별자치도 지방환경주사 백동명 12) 한국수자원공사 과장 전필문 6) 한국상하수도협회 사원 최재현 13) ㈜성지산업 대표이사 조정남 7) 한국상하수도협회 대리 양동혁"}, {"p": 64, "t": "INFORMATION & CULTURE 협회소식 물산업 육성·수출 활성화를 위한 회원 워크숍 개최 한국상하수도협회가 지난해 12월 7일부터 8일, 양일간 ‘녹색 물산업 육성·지원과 수출 활성화 회원 워크숍’을 개최했다. 대구에서 시작해 경주에서 일정을 마무리 한 이번 워크숍에는 상하수도 사업자, 지자체 공무원, 기업 관계자 등 200여 명이 참가했으며, 우수단체 포상과 기술 발표, 주제 발표 등이 진행됐다."}, {"p": 65, "t": "NEWS 기술 발표 시간에는 ‘SIIS(SAR 위성 기반 누수탐지 솔루션)’, ‘테크윈(고농도 현장제조차염 설비)’, ‘부강테크(부지집약·에너지 자립의 시작 그리고 미처리하수 Zero)’, ‘HSCMT(지능형 수자원 관리 시스템)’, ‘세진지엔이(바이오가스 포집 및 활용기술)’ 5개 기업이 자사의 제품 과 우수 기술에 대해 소개했다. 주제 발표 시간에는 ‘김건하 대한상하수도학회 회장(커넥 티드 워터벨트 물관리 방안)’, ‘안영진 한국상하수도협회 팀장(2024년 물산업 수출지원 사 업)’, ‘조동식 마엇 대표(중대재해처벌법이 한국상하수도협회 회원사에 미치는 영향)’ 3명의 전문가가 발표자로 나서 참가자들에게 유익한 정보를 전달했다. 한편, 물산업 발전의 공적이 있는 사업자나 기업을 격려하기 위해 협회에서 선정해 시상하 는 우수단체 포상 시상식에서는 ‘함양군 상하수도사업소’, ‘영남메탈’, ‘대양환경기술’, ‘케이 워터기술’ 4개의 회원이 수상했다. 진광현 한국상하수도협회 상근부회장은 이날 개회사에서 “이 자리가 국내 물산업의 미래 성장 가치를 회원들과 함께 고민하는 시간이 되길 기대한다”며 “이번 통합 회원 워크숍을 계
